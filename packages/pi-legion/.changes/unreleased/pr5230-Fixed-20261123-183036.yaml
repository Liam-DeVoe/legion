kind: Fixed
body: |-
    The claim boot reads a 408 and a 429 from the Legion daemon as it reads a 5xx: `claims/ready`
    is sent again, at boot and after a role regain, and a `claims/register` answered either is
    logged and rejects without stopping the agent, which the daemon's registration deadline then
    covers. The daemon writes neither, so only a proxy between the session and the daemon sends
    one. An Envoy listener call answered 408 is sent once more, and a send answered 408 on every
    408 again too. A daemon call that waits out a restart (`handoff_complete`, `sign_off`,
    `register_gate`, `claims/turn-outcome`) now waits out every outage, a 408, a 429 or any 5xx,
    whose body is not the daemon's refusal shape, such as a proxy's page; it waited out only a 502
    or a 503 that carried no code. A refusal in the daemon's own shape is its answer at any status,
    with a code or without one, and is handed back at once, a 502 or a 503 among them.
