kind: Changed
body: |-
  The Legion skills `legion-architect`, `legion-oracle`, `legion-retro` and `legion-worker` are
  written in the style of writing-agent-skills, with the same rules.
  `legion-retro` no longer forbids a rebase, and `legion-worker` no longer forbids `jj rebase` when
  an agent merges the base forward.
  `legion-retro` again says why a learning must carry what the skill librarian needs.
  `legion-worker` again routes a result against a check to the reference that holds the result rules.
  `legion-controller` says why an `admission.held` issue stands in neither list, and that the
  parked-root walk does not find a `carried-gate-opened` decision.
