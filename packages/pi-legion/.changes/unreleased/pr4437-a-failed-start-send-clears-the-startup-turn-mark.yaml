kind: Fixed
body: |-
  The plugin interface's `startupTurn` mark is cleared on every fact that says the controller's
  start is not coming, since `@sjawhar/pi-envoy` now holds the session's startup cards for as long
  as the mark stands, with no 30 s cap. A start message whose send Oh My Pi fails clears the mark it
  set, and so does a `/legion-claim-controller` claim (or a re-claim after a session change)
  refused before the send, as a refused `/legion-controller-start` claim already did.
