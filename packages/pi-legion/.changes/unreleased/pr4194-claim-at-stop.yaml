kind: Fixed
body: |-
  A pane's claim boot stops with the session. Once the session's stop has begun, the deferred
  Envoy role claim is not made, a failed `claims/ready` is neither said nor sent again, and a claim
  that fails says nothing and does not exit the process, so the stop's role release and DELETE run
  to their end. The stop begins at `session_shutdown`, and also when Envoy refuses the claim
  because the session is stopping, as it does in RPC mode, where a SIGTERM emits no
  `session_shutdown`.
