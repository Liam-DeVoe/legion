kind: Changed
body: |-
  The `plan-reviewer` and `plan-gap-analyst` agents ask for no plan task and no check in the
  issue's own documents for a requirement whose text starts `Delivered by` and names a root, since
  that root's checks serve it. They read a view's requirements as the parts of its ancestor's
  requirements that its `Delivers:` line names.
custom:
