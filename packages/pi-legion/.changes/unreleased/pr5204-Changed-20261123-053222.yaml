kind: Changed
body: |-
  The `legion` tool's `register_plan` hands the architect each running task's step and the role
  whose agent works it, and says that a later version can change the text of a running task
  alone. The plugin speaks daemon API contract 235. The architect skill puts a decision for an
  agent into its task's text. On an issue that started on the project's default steps it goes
  into the owner's own `owner-plan.md`, whose one block is the task `default`, and the planner's
  `plan.md` stays as it is. A phase worker's first step reads the issue, its task and the earlier
  handoffs, and takes no work from any other document.
