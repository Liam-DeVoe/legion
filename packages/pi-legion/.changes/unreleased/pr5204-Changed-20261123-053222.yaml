kind: Changed
body: |-
  The `legion` tool's `register_plan` hands the architect each running task's step and the role
  whose agent works it, and says that a later version can change the text of a running task
  alone. The plugin speaks daemon API contract 235. The architect skill puts a decision for an
  agent into its task's text, on the default steps in a version whose one block is the task
  `default`, and a phase worker's first step reads the issue, its task and the earlier handoffs,
  and no other document for decisions.
