kind: Added
body: |-
  The controller's `legion` tool gets four claim operations beside `compact` and `fresh_session`:
  `stop`, `retry`, `suspend` and `resume_claim`, each naming the claim by `issue` and `role`. Each
  answers the claim's state and who holds a suspension over it. The claim's resume is
  `resume_claim` because `resume` is the project's resume, which ends a pause and names no claim.
  While the operator's own suspension holds a claim, five of the six (`stop`, `retry`, `suspend`,
  `resume_claim` and `fresh_session`) are refused with `SUSPENDED_BY_OPERATOR`, which names the
  `legion claims resume` command the operator runs. `compact` is refused there as for any claim
  that runs no agent or that a suspension is held over: `CLAIM_NOT_RUNNING`, `CLAIM_IN_A_TURN` or
  `CLAIM_UNSETTLED`. While the project is paused, `retry`, `resume_claim`, `fresh_session` and
  `compact` are refused with `PROJECT_PAUSED`, whose sentence names the controller's `resume` as
  what lifts the pause; `stop` and `suspend` still run.
