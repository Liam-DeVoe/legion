kind: Changed
body: |-
  A Legion worker on Oh My Pi takes its task from the daemon when its session is idle, rather than
  being sent it as a prompt, and claims its Envoy role right after `claims/ready` and a read of its
  task, so a task the ready itself wrote starts ahead of the messages kept for the role. A task
  accepted while a run is going waits for that run's end and starts a turn of its own. Each turn's
  end is reported to the daemon until the daemon answers, and the daemon-launched controller's
  reports name its start task's number. The `LEGION_CLAIM_FIRST_TURN_BOUND_MS` setting is gone.
