kind: Fixed
body: |-
  The Legion daemon client, and the skill-scenario scripts' requests that carry a credential
  (`label-comments.ts`'s model call, the production Dispatch reader and `seed.ts`'s agent-bearer
  requests), follow no redirect. A 3xx is a refusal that names its status, the origin it points at
  and the setting to correct, and it is not tried again.
