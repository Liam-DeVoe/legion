kind: Changed
body: |-
  The worker, architect and retro skills say that a run of a check's CI job on a push of the change's branch records its own result of a check carrying `ci_check`, and that a pass from CI is the derived result or one the job recorded. `ci-checks.md` shows how `dispatch results` prints each result the job recorded, that an issue with no pull request prints no `Pull request line:`, and that such a check is a failure where no pass stands at the head: a result from CI there is a fail, CI holds a pass and a fail at that commit, or its run proved nothing. The worker and retro skills read the line of the head under each check in `dispatch results`, and the architect skill reads the answer of the whole check. A pass and a fail at one head, whoever recorded them, leave it not known, which is a refusal with no wait for a later result: the reviewer requests changes naming the check, the architect sends the issue back with `request_backward_move`, and retro sends the check back.
