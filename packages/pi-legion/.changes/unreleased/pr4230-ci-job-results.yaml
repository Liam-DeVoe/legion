kind: Changed
body: |-
  The worker, architect and retro skills say that a run of a check's CI job on a push of the change's branch records its own result of a check carrying `ci_check`, and that a pass from CI is the derived result or one the job recorded. `ci-checks.md` shows how `dispatch results` prints each result the job recorded, that an issue with no pull request prints no `Pull request line:`, and that such a check is a failure where no pass stands at the head: a result from CI there is a fail, CI holds a pass and a fail at that commit, or its run proved nothing. The worker and retro skills read the line of the head under each check in `dispatch results`, and the architect skill reads the answer of the whole check. A pass and a fail at one head, whoever recorded them, leave it not known, which is a refusal with no wait for a later result: the reviewer requests changes naming the check, the architect sends the issue back with `request_backward_move`, and retro sends the check back.
  The skill scenarios gain three: `reviewer-own-head` (four cases: a sibling pull request's fail, a pass from CI alone, no pass of the implementer, no pass of the tester), `reviewer-pass-and-fail` and `architect-pass-and-fail`. Each run has a NATS and a GitHub stand-in of its own beside its Dispatch, which learns its two pull requests from their `opened` events through the real intake, and the run starts no agent until `dispatch results` prints the line of #702 (`SKILL_SCENARIOS_FIXTURE_ONLY=1` stops there). `rule-search.ts` lists every sentence of an ablate label's rule in the texts the role reads, to the closure of their links, each cut or kept with a reason, so a label's cuts come from one classified search.
  No skill-scenario agent can read its scenario, its case or its label any more: a run's directory and a label's profile directory have random names, and the names live in `<work>/maps` (a link per run and per label), which `rig.sh score` reads and no agent sees. Every label's Oh My Pi profile is `skills`, a run's Legion project, Dispatch database and tmux session take the run directory's name, and no `case.txt` or `built-from` is in a run's directory. Each agent runs under bubblewrap in a PID namespace of its own, with `<work>` empty but for its run, its label's plugins and the batch's services, its run's own `tmp` at `/tmp`, empty `/var/tmp` and `/dev/shm`, and every label's checkout empty. `visible-world.ts <run dir> [--live]` lists each place in a run's world that still names one. The gh stand-in answers a `gh api --input` body that is not JSON as GitHub does, `Problems parsing JSON (HTTP 400)`.
