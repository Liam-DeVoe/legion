kind: Changed
body: |-
  The worker, architect and retro skills say that a run of a check's CI job on a push of the change's branch records its own result of a check carrying `ci_check`, and that a pass from CI is the derived result or one the job recorded. `ci-checks.md` shows how `dispatch results` prints each result the job recorded, that an issue with no pull request prints no `Pull request line:`, and that such a check is a failure where no pass stands at the head: a result from CI there is a fail, CI holds a pass and a fail at that commit, or its run proved nothing. The architect skill and the merge-gate reference say that a fail recorded after a pass leaves that pass standing until someone retracts it only on a check with no `ci_check`, and that on a check carrying `ci_check` a pass and a fail from CI at one head leave no pass standing there. Retro reads a `ci_check` check's pass from its `A pass stands:` line, so a pass and a fail from CI at the head send the check back.
