kind: Changed
body: |-
  The worker, architect and retro skills say that a run of a check's CI job on a push of the change's branch records its own result of a check carrying `ci_check`, and that a pass from CI is the derived result or one the job recorded. `ci-checks.md` shows how `dispatch results` prints each result the job recorded, and that an issue with no pull request prints no `Pull request line:`.
