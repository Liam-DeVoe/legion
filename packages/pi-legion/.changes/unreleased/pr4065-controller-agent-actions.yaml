kind: Added
body: |-
  Of the actions on an agent, each naming one agent by its `issue` and `role`, the controller's
  `legion` tool gets four beside `compact` and `fresh_session`: `stop`, `retry`, `suspend` and
  `resume_agent`. A tree's architect gets all six for the agents of the issues it owns. Each
  answers the claim's state and who holds a suspension over it. The agent's resume is
  `resume_agent` because `resume` is the project's resume, which ends a pause and names no issue.
  While the operator's own suspension holds an agent, five of the six (`stop`, `retry`, `suspend`,
  `resume_agent` and `fresh_session`) are refused to the controller with `SUSPENDED_BY_OPERATOR`,
  which names the `legion claims resume` command the operator runs. `compact` refuses such an agent
  as it refuses any agent that does not run or that a suspension is held over: `CLAIM_NOT_RUNNING`,
  `CLAIM_IN_A_TURN` or `CLAIM_UNSETTLED`.
  An architect's suspension is recorded under a new source, `architect`: its own `resume_agent`
  lifts it, and so do the controller's `resume_agent` and the operator's resume. The daemon refuses
  an architect an agent of another tree (`ISSUE_OUTSIDE_TREE`), an agent of an issue of its tree
  that it does not own (`ISSUE_NOT_OWNED`) and its own agent (`OWN_AGENT`). It refuses each of the
  six to an architect for an agent the operator's suspension holds (`SUSPENDED_BY_OPERATOR`) or the
  controller's holds (`SUSPENDED_BY_CONTROLLER`), and its `resume_agent`, `suspend`, `stop` and
  `fresh_session` for an agent the daemon suspended (`SUSPENDED_BY_DAEMON`). It refuses an
  architect's `retry` and `fresh_session` for an agent that failed or that a stop retired while
  its issue or its tree's root is out of the workflow (`ISSUE_OUT_OF_WORKFLOW`).
  While the project is paused, `retry`, `resume_agent`, `fresh_session` and `compact` are refused
  to the controller and to an architect with `PROJECT_PAUSED`, whose sentence names the
  controller's `resume` as what lifts the pause; `stop` and `suspend` still run.
