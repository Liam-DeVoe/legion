# What each model of candidates.yaml charges, in USD per million tokens: prompt tokens (input),
# reply tokens (output), a cache write and a cache read. The harness prices every call's tokens
# with this table, and refuses to start when a model of candidates.yaml has no row here. A model
# that --grader names needs a row too.
sources:
  claude:
    source: >-
      The operator's model gateway, GET /model/info: each model's input_cost_per_token,
      output_cost_per_token, cache_creation_input_token_cost and cache_read_input_token_cost,
      times one million. cache_creation_input_token_cost is the price of a five-minute cache
      write; the gateway prices a write of a mark that names no life, which lives one hour, at
      cache_creation_input_token_cost_above_1hr. The harness's own calls carry no cache mark.
      claude-fable-5-2, a grader that `--grader` may name, was read from the same source on
      2026-11-16.
    read: 2026-11-15
  foundry:
    source: >-
      The Azure retail prices API (https://prices.azure.com/api/retail/prices), region westus2,
      the Global meters of each model (the deployments are GlobalStandard): "Azure Grok Models"
      meters "4.7 Inp glbl 1M Tokens", "4.7 Outp glbl 1M Tokens" and "4.7 Cached glbl 1M Tokens"
      (effective 2026-10-01); "Azure Kimi" meters "Kimi 3.1 Pro Inp Glbl 1M Tokens", "Kimi 3.1 Pro
      Outp Glbl 1M Tokens" and "Kimi 3.1 Cached Inp Glbl 1M Tokens" (effective 2026-11-01). A
      Foundry chat deployment has no cache write price.
    read: 2026-11-15

prices:
  claude-opus-5: {family: claude, input: 5, output: 25, cache_write: 6.25, cache_read: 0.5}
  claude-opus-4-7: {family: claude, input: 5, output: 25, cache_write: 6.25, cache_read: 0.5}
  claude-opus-4-6: {family: claude, input: 5, output: 25, cache_write: 6.25, cache_read: 0.5}
  claude-sonnet-4-5: {family: claude, input: 3, output: 15, cache_write: 3.75, cache_read: 0.3}
  claude-opus-5-5: {family: claude, input: 4, output: 20, cache_write: 5, cache_read: 0.2}
  claude-sonnet-4-6: {family: claude, input: 3, output: 15, cache_write: 3.75, cache_read: 0.3}
  claude-haiku-4-5-20251001: {family: claude, input: 1, output: 5, cache_write: 1.25, cache_read: 0.1}
  claude-haiku-5-5: {family: claude, input: 0.1, output: 0.5, cache_write: 0.125, cache_read: 0.01}
  claude-sonnet-5-5: {family: claude, input: 2, output: 10, cache_write: 2.5, cache_read: 0.1}
  claude-opus-4-8: {family: claude, input: 5, output: 25, cache_write: 6.25, cache_read: 0.5}
  claude-fable-5-2: {family: claude, input: 8, output: 40, cache_write: 10, cache_read: 0.2}
