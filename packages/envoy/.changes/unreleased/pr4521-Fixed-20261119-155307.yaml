kind: Fixed
body: |-
  A grant the model judge decided now ends for good when any key it holds is tagged as an administrator's, a key its session got at once beside the judged ones included. The broker checks every matching live grant at a release and before a new request for those names can refuse for a missing or pending value, a different approver, a judge limit or a `max-grant`; an ending cause on any key wins. Such a grant used to be refused only on those early request paths, and released again once the tag was taken off.
  A grant now ends for good when any key is served from another source, its requesters list drops the session, or its lifetime exceeds a lowered `max-grant`, even while another key only pauses it. The broker uses the live grant's own lifetime for that check. Such a grant used to be refused only, and released again once both changes were taken back. A request for the grant's names finds and ends it before its own lifetime check can return.
  An edit to an airlock entry ends the grants it affects before an approval-chain refusal can leave them live. A judged grant whose key's entry lost its `judge`, had it lowered below the grant's lifetime, or was dropped used to be refused only, and released again once the old rules file was booted again. A broker booted on such a file now answers its release `403 GRANT_NOT_LIVE` where it answered `403 GRANT_CHAIN_INVALID`, and the airlock proxy answers such a connection `407 GRANT_NOT_LIVE` where it answered `403 GRANT_CHAIN_INVALID`; the chain's own log line is still written beside the end.
