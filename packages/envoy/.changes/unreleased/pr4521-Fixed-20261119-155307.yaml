kind: Fixed
body: |-
  A grant the model judge decided now ends for good when any key it holds is tagged as an administrator's, a key its session got at once beside the judged ones included, at the release and at the next request that would reuse it. Such a grant used to be refused only, and released again once the tag was taken off.
  A grant now ends for good on any of its keys that ends it, whatever its other keys answer: a key served from another source, a requesters list that dropped its session, a judged grant's administrator tag or a lowered `max-grant` ends it even while another key it holds only pauses it, because that key now wants an approval or the broker no longer serves it. Such a grant used to be refused only, and released again once both changes were taken back. A request that would reuse a grant one of whose keys is now served from another source ends that grant too, where it passed the grant over.
  An edit to an airlock entry now ends the grants it affects at the next request that would reuse one too, and before the grant's approval chain and policy are checked again. A judged grant whose key's entry lost its `judge`, had it lowered below the grant's lifetime, or was dropped used to be refused only, and released again once the old rules file was booted again. A broker booted on such a file now answers its release `403 GRANT_NOT_LIVE` where it answered `403 GRANT_CHAIN_INVALID`, and the airlock proxy answers such a connection `407 GRANT_NOT_LIVE` where it answered `403 GRANT_CHAIN_INVALID`; the chain's own log line is still written beside the end.
