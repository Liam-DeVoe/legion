kind: Fixed
body: 'A send to a session, or any other publish of a topic this build stores, is no longer answered success while the stream holds no copy of it. When a newer build''s stream had dropped such a topic''s subject, the listener published the message over core NATS and answered 200 with `state: stopped`, and no session''s consumer ever held it; the publish now waits for the stream''s acknowledgement, and without one the send answers the bus''s 503, so the sender keeps the message and sends it again. Role lanes, relay subjects and ad-hoc topics keep core NATS.'
