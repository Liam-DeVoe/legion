kind: Fixed
body: 'A send to a session, or any other publish of a topic this build stores, is no longer answered success while the stream holds no copy of it. When a newer build''s stream had dropped such a topic''s subject, the listener published the message over core NATS and answered 200 with `state: stopped`, and no session''s consumer ever held it; the publish now waits for the acknowledgement of the notifications stream, and another stream that captures the subject in its place no longer counts. Without that acknowledgement the send answers a 503 with `Retry-After: 1` that names the subject the stream leaves out and the stream''s generation, rather than saying that the bus did not answer, so the sender keeps the message and sends it again. Role lanes, relay subjects and ad-hoc topics keep core NATS.'
