kind: Fixed
custom:
  Issue: pr4369
body: |-
  Dispatch stores a loose list with one blank line between two of its items, and no blank line
  between items ends in a space. Before, it wrote two blank lines there, so `dispatch artifact`
  refused the usual spelling of a loose list. In a quote, an item that ends in a spread list keeps
  the two blank lines that the browser editor needs. The renderer version is now 2, so Dispatch
  renders a stored rendering of version 1 again when it reads it. A text that another renderer
  version stored and that reads as the same tree counts as unchanged: no version is written for
  the renderer change alone, the stored-order check reports no mismatch, an approval carries to a
  version that holds the approved text, a kept decision stays kept, and a top-level block keeps
  its changed version and time where its stored text reads alone. A block inside a list item, a
  quote, a footnote definition or a typed block takes a new changed version, because its text read
  alone loses its container's prefix. A kept decision is read alone only where it stood in no
  typed block then and stands in no container now. A block or a decision whose text holds `[^` is
  not read alone either, because whether that text is a footnote reference depends on the labels its
  document defines. A check result's words read as moved only when the check's sum and its
  changed version both moved. The decisions view cuts a document at the headings and typed blocks
  the parser places, so a paragraph that opens with a code span, or a list item that opens with
  fenced code, no longer hides the decisions after it from the stale-link check. Each decision is
  compared by the cut of its own heading, so a heading of the same name inside a quote or a list
  item no longer shifts it onto another decision's text, and a stored version the parser refuses
  leaves the links that name it as they are. The view reads a stored version's rows before it
  parses them, parses each version once, and keeps each cut in a memo of at most 32 MiB.
  Dispatch links an email address whole, or not at all. For a link that a reader made from a bare
  address, it takes the run of characters an RFC 5322 local part allows that ends at the `@`, as
  the text decodes: the link is that whole run where GFM links every character of it, and there is
  no link otherwise. So a resource path such as `projects/p/serviceAccounts/agent-hosts@example.com`
  is stored as written, and is no longer stored as
  `agent-[hosts@example.com](mailto:hosts@example.com)`, which `dispatch artifact` refused, and so
  is `a.b+c_d%e-f@example.com`. A link a reader made ends the run only where the next character
  would continue that link written bare, so `alice@example.com/bob-smith@example.com` links only
  the first address. Two cases keep the earlier reading, because no other spelling reads back:
  a web address (`www.`, `http://` or `https://`) in the joined text that reaches into the
  address keeps the reader's email link, and so does an earlier link a reader made next to an
  email link the writer wrote, or one whose text starts `_www.`. Where the renderer cannot write
  an address as the rule reads it so that the text reads back, Dispatch gives that address its
  earlier reading: in a write of a whole text, in every edit, in an accepted or a rejected
  suggestion, in a snapshot or a named version taken before the document's settlement, and in
  the settlement of a document edited in the browser editor. So none of those refuses a text the
  earlier release stores. Every reader keeps the rule's reading, so a text the browser
  editor reads before it is saved can hold one link fewer than the version stores. An address
  split by inline markup keeps its earlier reading, and a link the
  writer wrote is never changed. The browser editor reads by the same rule, and the display tree
  version is now 4, so every display tree stored before is read again. Where a write's text reads
  back the same and only a mark differs, its refusal names the run and the mark, such as
  `reads back without the link on "b@c.test"`, rather than quoting the same text twice.
