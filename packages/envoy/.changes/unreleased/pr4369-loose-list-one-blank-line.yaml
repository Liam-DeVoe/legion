kind: Fixed
custom:
  Issue: pr4369
body: |-
  Dispatch stores a loose list with one blank line between two of its items, and no blank line
  between items ends in a space. Before, it wrote two blank lines there, so `dispatch artifact`
  refused the usual spelling of a loose list. In a quote, an item that ends in a spread list keeps
  the two blank lines that the browser editor needs. The renderer version is now 2, so Dispatch
  renders a stored rendering of version 1 again when it reads it. A text that another renderer
  version stored and that reads as the same tree counts as unchanged: no version is written for
  the renderer change alone, the stored-order check reports no mismatch, an approval carries to a
  version that holds the approved text, a kept decision stays kept, and a top-level block keeps
  its changed version and time where its stored text reads alone. A block inside a list item, a
  quote, a footnote definition or a typed block takes a new changed version, because its text read
  alone loses its container's prefix. A kept decision is read alone only where it stood in no
  typed block then and stands in no container now. A block or a decision whose text holds `[^` is
  not read alone either, because whether that text is a footnote reference depends on the labels its
  document defines. A check result's words read as moved only when the check's sum and its
  changed version both moved. The decisions view reads a code fence's line as the parser does, so
  a paragraph that opens with a code span no longer hides the decisions after it from the
  stale-link check, and each decision is compared by the cut of its own heading, so a heading of
  the same name inside a quote or a list item no longer shifts it onto another decision's text.
  Dispatch links an email address whole, or not at all. For a link that a reader made from a bare
  address, it takes the run of characters an RFC 5322 local part allows that ends at the `@`, as
  the text decodes: the link is that whole run where GFM links every character of it, and there is
  no link otherwise. So a resource path such as `projects/p/serviceAccounts/agent-hosts@example.com`
  is stored as written, and is no longer stored as
  `agent-[hosts@example.com](mailto:hosts@example.com)`, which `dispatch artifact` refused, and so
  is `a.b+c_d%e-f@example.com`. An address split by inline markup keeps its earlier reading, and a
  link the writer wrote is never changed. The browser editor reads by the same rule,
  and the display tree version is now 4, so every display tree stored before is read again.
