kind: Added
body: 'While any Dispatch project is private, Dispatch records the GitHub id of each repository a person names, at the write that names it: an issue''s create or update that sets `repo`, and a project''s default repository (`PUT /api/v1/settings/repo-projects/{owner}/{repo}`), read from GitHub as Dispatch''s App for that name then. Nothing is stored for a write whose id the read does not give: a repository GitHub answers the App cannot read (not installed on it, or 403 or 404) is 403 REPOSITORY_NOT_AVAILABLE in the words a repository hidden from the writer is refused in, and a write GitHub gives no answer for is 503 REPOSITORY_ID_UNAVAILABLE ("GitHub did not answer; try again"), naming no project. A write that carries the stored name keeps the id it holds, or none, and asks GitHub nothing. With no project private no id is read, as before. Delivery records the repository id GitHub''s own answer about each pull request and run carries. The GitHub proxy, the App-installation read and Delivery''s pull requests that name no issue and runs that ship none now judge a repository by its id, so a private project''s repository GitHub renamed or moved stays hidden under its new name, and a name another repository took later shows that repository; the proxy follows GitHub''s redirect from an old name only to the location GitHub gave for the repository it judged. A switch to private waits, 409 PRIVATE_PROJECT_NOT_PROVISIONED with `unconfirmed_repositories`, until the owner confirms each repository name the project''s own issues or its default hold with no id, through the new `GET /api/v1/projects/{key}/repositories` and `POST /api/v1/projects/{key}/repositories/confirm` (409 REPOSITORY_CHANGED when GitHub''s answer moved, 503 REPOSITORY_ID_UNAVAILABLE when GitHub does not answer); a repository other projects the owner sees share stays shared and is reported (`shared_elsewhere`), and holds nothing. The migration adds `repo_id` to issues, repo_projects, delivery_pull_requests and delivery_runs and fills none.'
