kind: Added
body: |-
  The airlock fences a Slack bot token tagged `project-channels=slack` from private projects'
  channels when a session that names no private Dispatch project spends it. A broker with
  `BROKER_PROJECT_ACCESS_URL` reads Dispatch's list of private projects and their channels with its
  own token at every release of such a token, keeping it 30 seconds, so a pod that has just
  started fences a project Dispatch holds private from its first release, whether or not
  `BROKER_PRIVATE_PROJECTS` names it. While a private project lists a channel the proxy carries
  only the Slack methods Legion calls with the token, `chat.postMessage`,
  `conversations.replies` and `auth.test`. It refuses `PRIVATE_CHANNEL`, without calling Slack,
  every other method; any call that names a listed channel id under `channel`, `channel_id` or
  `channels` (in the query, a JSON body or a form, in any case, with white space or commas around
  it); any call that names a channel by anything but its id, such as `#general`; any call
  carrying a key with a character other than an ASCII letter, a digit or `_`, such as ` channel`
  or `channel[]`, which Slack may read as `channel`; and any body it cannot read as naming none:
  one that is neither JSON nor a form, a compressed one, or one over 1 MiB. While the broker
  cannot read the list, or the list names a private project with no channel list, every call on
  the token is refused `PRIVATE_CHANNELS_UNREAD`, and the broker reads it again within a minute.
  While a private project lists a channel, the broker gives such a token with no airlock entry to
  no session at all (`project-channels-need-airlock`), and a session holding a grant of it made
  before is denied the same way at its next request. Every value of a `project-channels` secret
  the airlock holds is read again within ten minutes, in every deployment, so a value released
  before the first private project learns of it. A private project's own credential posts to none
  of its project's channels for 16 minutes 30 seconds after Dispatch last changed the list or the
  project turned private, and `CHANNEL_NOT_ALLOWED` then ends with the time posting reopens.
  While no private project lists a channel the proxy reads no body; a broker with no
  `BROKER_PROJECT_ACCESS_URL` asks Dispatch nothing for the fence. A broker whose
  `BROKER_PRIVATE_PROJECTS` names a project now refuses to start without
  `BROKER_PROJECT_ACCESS_URL`, naming the keys.
