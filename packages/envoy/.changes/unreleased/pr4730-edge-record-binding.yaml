kind: Fixed
body: |-
  A session record and an interest row name the key they are stored under (`session_id`), and a
  record that names another key, or names its key with no `machine_id`, no positive `updated_at`
  or (a session record) no `projects`, reads as absent and is replaced by the next write at the
  sequence it is really stored at. A server-written copy of one session's record or row under
  another session's key therefore carries no scope. An edge listener also reads a session record
  of an earlier build, which names no key, as absent; every other listener reads it as before.
  The edge listener hands a session a frame only of a project its token lists, as the session's
  own message, or as a GitHub event of one of its projects' repositories (`edgeFrameVerdict`),
  in its relay and in its relay socket, reading the token and never a stored record; every other
  frame is acknowledged undelivered and counted in
  `envoy_edge_github_withheld_total{reason="project_not_held"}`. A relay replica that admitted no
  registration of a session since it started relays it nothing until the session registers
  through it again, and its messages wait in its consumer.
