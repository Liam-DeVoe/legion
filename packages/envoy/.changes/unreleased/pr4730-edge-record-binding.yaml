kind: Fixed
body: |-
  A session record and an interest row name the key they are stored under (`session_id`), and a
  record that names another key, or names its key with no `machine_id`, no positive `updated_at`
  or (a session record) no `projects`, reads as absent and is replaced by the next write at the
  sequence it is really stored at, a delete or purge marker the server copied from another key
  included. A server-written copy of one session's record or row under another session's key
  therefore carries no scope. `SessionRegistry.PutWithin` refuses an entry that names no machine.
  A session record of an earlier build, which names no key, is read as before on every listener,
  and the edge reads it as no project's: it lists such a session to no one and answers a send to
  it as to a missing session.
  The edge listener hands a session a frame only of a project its token lists, as the session's
  own message, or as a GitHub event of one of its projects' repositories (`edgeFrameVerdict`),
  in its relay and in its relay socket, reading the token and never a stored record; a frame
  whose relay header and envelope name different projects is withheld. Every other frame is
  acknowledged undelivered and counted in
  `envoy_edge_github_withheld_total{reason="project_not_held"}`, a metric that now counts frames
  that are not GitHub's too. A relay socket with no fresh repository answer sends a GitHub event
  back (`nak`) rather than away. A relay replica that admitted no registration of a session since
  it started relays it nothing until the session registers through it again, and its messages
  wait in its consumer; a replica forgets a session's admission once the session's record has
  left its cache.
