kind: Fixed
body: |-
    The NATS auth service refuses a `BROKER_NATS_URLS` entry that carries a query or a fragment,
    or an `@` after its host, which is how a token holding a `/` written as the user parses (its
    head becomes the host), by the entry's position alone, as it refuses one with a user name or
    password: the broker writes the hub URLs into its start line and the service's connect error,
    so a token there printed. Name the hub by its address alone. The service's connect error now
    names the hub URLs by their count (`1 BROKER_NATS_URLS entry`, `2 … entries`) and holds none
    of their text, where it quoted the list whole.

    A file setting's refusal names the setting and why it could not read the file (it does not
    exist, permission is denied, it is a directory, it is empty, it holds no seed), never the path,
    which can be a credential pasted where the path goes: the broker's secret files and NATS seed
    files, `dispatch`'s `_FILE` settings (`DISPATCH_AZURE_EMBED_KEY_FILE` among them), and the
    ServiceAccount token file the broker client reads for Dispatch and the listener, whose log
    line names `DISPATCH_AGENT_SECRETS_ACCOUNT_TOKEN_FILE`. The words come from the module's
    `fileerr` package, which the daemon reads its secret files by too.

    An `ENVOY_ALLOWED_HOSTS` entry that is no host is refused by its position in the list, and
    `BROKER_SIGNIN_ISSUER` that is no https URL by its name alone. The broker's start lines name
    the Google and sign-in issuers, `BROKER_MACHINE_LOGIN_URL` and `BROKER_JUDGE_DISPATCH_URL`, the
    listener's boot line `ENVOY_AGENT_SECRETS_URL` and its OIDC issuer, as `(not printed: …)` when
    the URL carries a credential, where each printed the value whole; the listener's boot line
    names its projected token by `ENVOY_AGENT_SECRETS_ACCOUNT_TOKEN_FILE`, never the file's path.
    The broker's wake notice to Envoy logs a `BROKER_ENVOY_URL` it cannot reach by the failure's
    class when the URL carries a credential, and the sign-in client check's line names a
    `BROKER_SIGNIN_ISSUER` that carries one, and the failure to reach it, the same way: the error
    quoted the issuer's URL with a token written as its user name.

    Every issuer setting refuses a value with a user name or a password, an `@` after its host, or
    a query or a fragment (an empty one included; no issuer identifier has either), naming the
    setting alone: `BROKER_SIGNIN_ISSUER`, `BROKER_GOOGLE_OIDC_ISSUER`, `BROKER_K8S_OIDC_ISSUER`,
    `BROKER_EXCHANGE_GITHUB_ISSUER`, `DISPATCH_SIGNIN_ISSUER`, `DISPATCH_OIDC_ISSUER`,
    `ENVOY_OIDC_ISSUER` and `AGENT_SECRETS_SIGNIN_ISSUER`. A token in `BROKER_SIGNIN_ISSUER`'s
    query loaded before, and the broker's sign-in page showed it to whoever started a sign-in. An
    issuer's discovery and client-check errors, the discovery's log lines, the broker's
    sign-in-unavailable page and its log line, and Dispatch's sign-in and service-token boot lines
    and its domain refusal name the issuer as `(not printed: …)` when it is no plain http(s) URL,
    and a discovery failure by its class then, where it quoted the discovery URL, the issuer's
    with a path appended.
