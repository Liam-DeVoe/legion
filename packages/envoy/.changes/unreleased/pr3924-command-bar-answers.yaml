kind: Added
body: |-
  The Dispatch command bar's server half now decides, answers with typed blocks, runs
  operations and undoes them. With a measured decision model configured
  (`DISPATCH_DECISION_MODEL`, `DISPATCH_DECISION_MODEL_ENDPOINT` and
  `DISPATCH_DECISION_MODEL_TOKEN_FILE`), each question first gets one decision call: which
  operation the words ask for, whether they are about the page's item, and chart or prose. The
  thresholds come from the committed measurement, `packages/envoy/going/decision_models.json`,
  and a model that record does not hold decides nothing. The answer stream carries four new
  frames: `decision`, `block` (one typed block filled from Dispatch's own reads), `roster` and
  `proposal` (the arguments of each offered operation). An answering model that refuses
  structured output answers in prose, with no block.
  `POST /api/v1/going/runs/{id}/writes` runs one offered write as the caller and records the
  value before and after it, and `POST /api/v1/going/runs/{id}/undo` undoes a turn.
  An offered write runs at once only where every item it names is the page's or named in the
  person's own words; any other is an offer the person picks (`409 GOING_NOT_AUTOMATIC` for
  `auto`). An upload under the name of a document its owner already holds is offered only with
  `force` where the answer wrote the name the document is stored under and the person's own
  words write that name; one that finds the document by its slug is always withheld, and so is
  every other: the proposal's offer says why in `withheld`. A write of an upload with `force`
  is held to that rule again when it runs, whoever approved it, so a document made between the
  proposal and the pick is never written over: `409 GOING_NOT_PROPOSED` in the offer's own
  words, with nothing written. A write of an upload without `force`
  under a name the store holds when it runs is refused, however it came to run:
  `400 GOING_ARGUMENTS` in the
  `dispatch artifact` command's words where its read before finds the document, and the route's
  `409 DOCUMENT_EXISTS` for one made after that read. Each write is
  claimed on the run once, so a second request while it runs answers
  `429 GOING_WRITE_IN_PROGRESS`.
  A write that sends a request before its own (a close with a reason posts the reason first)
  records how each request went; the next write of that invocation, a retry under its
  `Idempotency-Key` after a `5xx`, `408` or `429` or a new press under another key, resumes
  after the requests that landed, and a refusal names what landed before it. A request landed
  when its route's transaction committed, which it records there; a route's bookkeeping before it
  refuses (an architecture sync's failure record) is no landing.
  A turn's undo compares and puts back only what each write's own route answered its transaction
  found and left, and has the route it writes through decide that the item still holds what the
  turn left. The routes answer those values beside what they answered before:
  `PATCH /api/v1/issues/{key}` answers `previous` (each field it names as it found it,
  `advances_revision` beside `advances`, and a rank's place) and, for a rank, `rank_place`;
  `PATCH /api/v1/asks/{id}` and `POST /api/v1/comments/{id}/resolve` answer `previous`;
  `POST` and `DELETE /api/v1/issues/{key}/claim` answer `claim_changed` and `previous_claim`;
  `POST /api/v1/artifacts/{id}/approval-requests` answers `opened`; the document edit routes
  answer `previous_token` beside `token`; and the upload routes answer `previous_version`. A
  create naming an external issue Dispatch already holds answers that issue `200`, not the `201`
  of a create it made, as it did before: the bar records it as a write that made nothing, and its
  undo closes nothing. The conditions the undo writes back with are the bar's in-process
  conditions: its in-process caller carries each to the route on the request's context, never in
  a body, so no other client can send one and a body naming `expect`, `expect_sha256`,
  `expect_new`, `expect_holder`, `expect_unclaimed` or `expect_resolved_at` is answered as one
  naming nothing. Each route decides its condition under its own lock: the issue update
  (`409 ISSUE_CHANGED`), the ask edit (`409 ASK_CHANGED`), the release and the claim
  (`409 CLAIM_HOLDER_CHANGED`), the reopen (`409 COMMENT_CHANGED`) and an upload
  (`409 DOCUMENT_CHANGED`), and the bar's upload without `force` is a create alone
  (`409 DOCUMENT_EXISTS` where the owner holds the name when the upload takes its lock). A
  request of the undo is marked as a write back, and a route refuses one carrying no condition it
  decides `500 GOING_CONDITION_MISSING`, with nothing written. A request the bar sends in-process
  refuses a body member or multipart field its route does not declare, `400 INVALID_JSON`
  naming it.
  `GET` and `PUT /api/v1/me/going/settings` hold a person's `confirm_writes`,
  `GET /api/v1/me/going-runs` lists the person's runs of the last 30 days,
  `POST /api/v1/going/requests/{id}/cancel` stops a run, and
  `GET /api/v1/projects/{key}/activity` counts a project's events per ISO week.
