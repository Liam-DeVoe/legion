kind: Fixed
body: |-
  `scripts/dev-stack.sh` and `scripts/dev-broker.sh` register their pod at the broker without
  putting a token on curl's command line, which `/proc` shows every user of the machine. The
  registrar's bearer goes in a 0600 header file (`-H @file`) and the pod token in a 0600 body file
  that jq builds from the token file (`--data-binary @file`), both in a directory of their own
  under the run's, removed once the call returns. Before, both tokens were curl's arguments.
time: 2026-11-18T19:18:42Z
