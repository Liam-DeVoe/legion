kind: Fixed
body: |-
  `envoy-infra buckets create` stopped by an interrupt or SIGTERM no longer says `nothing more is created`: a `STREAM.CREATE` it had already sent still lands on the hub. It now exits 1 with `envoy-infra buckets create: stopped: <the signal>; it sends no create after this, but one it had sent may still land: run create again to see what the hub holds`. A connection that reports no server version, as one that is not connected does, refuses `create` with exit 1 before any read (`refused: the connection reports no server version`), where it refused every present bucket for its discard policy. The writer proof of `recreate` and `check` counts a container started through a launcher - a command whose first word is not `envoy-listener` or `envoy-dispatch`, such as a shell, `env`, `tini` or `dumb-init`, or the image's entrypoint when the container sets `args` alone - whose later words name `envoy-listener` as a writer of every copied bucket, and one whose later words name `envoy-dispatch` as a writer of `envoy_ci_state`, each blocker saying why; such a pod blocked nothing before. The Envoy image's, the worker image's and the held-port image's build contexts leave out `.env` and `.env.*` files anywhere (`**/.env`, `**/.env.*`), where they left them out at the context's root alone, so an untracked `.env` under `packages/envoy` or `packages/dispatch` never enters a local build.
