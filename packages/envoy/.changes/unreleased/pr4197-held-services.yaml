kind: Added
body: |-
  The broker's NATS auth service holds a service whose `BROKER_NATS_SERVICES` entry takes its
  exchange projects (`-`) to the projects the broker's exchange entry for its account lists and
  the repositories Dispatch maps them to (`natsgrant.WithinProjects`), where before it refused
  every such entry; the person that exchange entry acts for must see each project, as the token
  exchange requires of that account's token. It refuses, naming the reason and counting it under
  its own label, an account no exchange entry lists (`no_exchange_entry`), a project it holds no
  answer about yet (`project_not_known`, which the client retries), a project Dispatch does not
  hold (`project_not_found`), one the entry's person cannot see (`project_not_visible`), and an
  entry naming no project or a grant that cannot be held to projects (`not_held_to_projects`).
  A dispatch or listener entry with `-` is now refused at startup, as a measurement entry's is.
  No connection waits on Dispatch: the broker asks it about every such project at its start and
  every 20 seconds after, and keeps the last answer while Dispatch cannot be reached. Dispatch's
  grant there may also write the private-projects bucket, a listener's may read it, and a daemon
  entry with `*` is also granted its account's own reply prefix. List a Legion daemon with `*`
  until plan C's t-c-10 release gate opens: `-` names consumers today's daemon does not open.
