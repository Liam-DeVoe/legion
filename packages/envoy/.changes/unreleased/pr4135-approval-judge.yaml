kind: Added
body: |-
  The broker's approval page shows, for each requested secret of a Dispatch project, the project,
  whether it is private, and whether the credential that asked names it, and it shows the
  projects that credential names: a session's list, or the project a pod's or a machine's
  operator entry maps it to. A request of a private project (by its secrets, the projects its
  credential names, or an issue key its reason names) answers a person outside the project "No
  such request", as a request that does not exist; it is in none of their lists, and a decision's
  outcome line says nothing of it. The model judge makes a seventh check, `project`, after
  `withheld` and before `issue`: a request for a secret of a private project, or of a project
  Dispatch does not hold, or from a credential that names a private project, or whose signed
  reason names any issue of a private project, is left to a person, since the judge's own token
  names no person. The project check and the issue check share the judge's one 5-second bound on
  its Dispatch reads, so a slow Dispatch still leaves the run time to write its row, and the
  judge's approval checks the project rule again before it is written. A reason whose issue keys
  name more than 16 projects is read for none: its request is shown to nobody and the judge
  leaves it. A sign-in started from a private project's request sends the provider no
  `login_hint`. A broker with no `BROKER_PROJECT_ACCESS_URL` judges exactly as before and asks
  Dispatch nothing about projects.
