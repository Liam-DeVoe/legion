kind: Fixed
body: |-
  No output of the token client, `agent-secrets`, `agent-secrets-helper` or `legion controller
  start` can carry a credential the configured broker address holds. The address is held in one
  opaque type whose every printed form is the redacted one, every call to the broker that carries
  a token or a proof refuses redirects, so a 3xx answered for the broker hands none of them to
  another host, and the redactor prints an OAuth answer's own words only when it has an error code
  and no `error_uri`, printing the failure's class alone otherwise.
