kind: Fixed
body: |-
    During a roll from one listener build to the next, a message could be lost for good. When the
    newer build adds a stream subject, its pod puts that subject on the notification stream as it
    starts, but the older pod, still the machine's active pod, reads the stream's subjects only
    when it connects and once a minute after. Until that read, the older pod judged a topic under
    the new subject as one no stream captures: it left the topic out of the consumer filter of a
    session whose relay it ran, and out of a registration made through it, with a warning. A
    message on that topic published in that window was then never delivered to the session, and
    the older pod's later read did not bring it back. The older pod now reads the stream's
    subjects again before it judges a topic uncaptured, so such a topic stays in the session's
    filter and its registration, and the message is delivered. Topics no stream captures at all
    cost the NATS server at most one extra read of the stream every 250 ms from each listener pod,
    however many registrations and publishes through that pod name them. In the same window, a
    message published through the older pod on such a topic was refused as a topic no session
    receives; the older pod now reads the stream's subjects again first, so the publish is accepted
    and stored, and the session receives it. Any other publish on such a topic from an older build
    now goes through JetStream too: it went over core NATS, where the stream still stored it, but
    without the message id that keeps a repeat to one copy and without confirming the store. A
    publish does not wait for a read of the stream's subjects that is already under way, so a read
    the server leaves unanswered holds up no publish other than one that started it, for up to 2 s;
    a direct publish in the roll window during an unanswered read goes over core NATS, stored, with
    no MsgId and no acknowledgement. A delivery exception about a stored message on such a topic's
    exception lane is stored once however many listeners raise it, outside such a read, since each
    judges the lane as its publish does before it chooses the exception's message id; judged on the
    older list, it could be stored twice, under two ids. And a slow read of the stream's subjects
    that ends after a newer one no longer replaces the newer list with the older one, including a
    read that ends while the listener sets up the stream.
