kind: Changed
body: |-
    The spec files of .dispatch/spec are YAML files, one document for each node, that a JSON Schema in the repository checks. The printer double-quotes each text that a YAML 1.1 or YAML 1.2 reader would read as another type, such as `=`, `<<` or a date with a time, so each standard library reads the same strings.
    spec-check print takes --dir and writes each node's document into the files at its place. It writes nothing when spec-check tree would refuse the result, when the result would lose or change a node that the run does not name, or when a file of the directory is one whose documents the reader cannot say for certain. It changes all of its files or none, also when it is killed: it builds a new directory beside the spec directory and puts it in the place of the old one with one call, and the next run removes what a killed run left there. Where the system refuses a second name of a spec file that the run keeps, such as another user's file, print copies that file with its mode. A file system that cannot exchange two directories makes print refuse with nothing written, and the refusal says what to do: for a directory of a container image's layers, put a copy of the directory in its place or mount the checkout; for a directory that is a mount point, mount the directory above it. A second run on the same directory waits for the first. A refusal of a file where a node that the run does not name is not in its printed form names each node of that file, which a run must name to print the file whole.
    A not-printed refusal of spec-check tree shows the line of the file and the line that print writes, and names what differs, such as a carriage return or a space at the end of a line. Where a YAML reader can read a value of the file as another value than the file writes, such as a plain date, a tag, an anchor or the merge key, the line names that value, and spec-check compare makes no comparison of the files. A warning for a file that is not a spec file says that a spec file is a *.yaml file, which spec-check print writes.
    Each line of spec-check names a value of the input that is longer than 100 bytes, such as a node id, a line of a file or a key that the node does not take, by its first and its last 50 bytes, so a line stays short whatever the files hold. The JSON of spec-check checks and of spec-check state --json holds each value whole.
