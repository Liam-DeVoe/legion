kind: Changed
body: |-
    The spec files of .dispatch/spec are YAML files, one document for each node, that a JSON Schema in the repository checks.
    spec-check print takes --dir, writes each node's document into the files at its place, and writes nothing when spec-check tree would refuse the result.
