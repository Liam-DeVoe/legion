kind: Fixed
body: |-
  A registration refused `409 not_requested` is told to upgrade to `@sjawhar/pi-envoy` 17.8.0 or
  later, the first release that asks for a consumer on every registration, or to a build of its own
  that does, and the answer still names the plugin and version the registration carried. A
  pi-envoy from 14.1.0 was told instead only that it asks for a consumer while its relay subject is
  open and registers again, with one, at its next heartbeat, and every other client was told to
  upgrade to 14.1.0; but every release before 17.8.0 registers without a consumer while its relay
  subject is closed, which this listener refuses, and every release from 17.8.0 asks on every
  registration and sends none while it holds no relay subject, so each client that reaches this
  refusal predates 17.8.0.
