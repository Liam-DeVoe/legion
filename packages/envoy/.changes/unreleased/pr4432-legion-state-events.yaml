kind: Changed
body: |-
  Dispatch takes each Legion daemon's state events from the held durable `legion-state-events` on
  `notifications.legion.*.state` and writes its Legion observations from them, so a change is
  recorded when its message is applied, not at the next read. Dispatch no longer reads a daemon's
  state every minute. It reads a daemon's `GET /legion/v1/state` whole only for a project with no
  starting point, a boot that does not follow or that applied a migration, a gap the stream no
  longer holds, and a read owed since one failed, at most once a minute. It logs each whole read
  with its reason. When Dispatch has NATS, a `PUT` of a project's Legion setting, of the same URL
  too, makes one whole read. `legion_reads` records each message the intake applies as a row of
  kind `events` at the daemon's commit time, and `legion_event_cursors` records how far the
  observations of each project follow its daemon (migration `20261118212431_legion_events`). A
  call to a daemon waits up to 60 s, not 20 s. Dispatch's NATS grant names the new durable, and on
  a VM hub the changed grant replaces the hub's instance. The lease pool holds 24 connections, not
  22, and a server process opens at most 115 connections to Postgres, not 113.
