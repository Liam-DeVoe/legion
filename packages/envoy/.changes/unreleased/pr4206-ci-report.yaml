kind: Added
body: |-
  `ci-report` is the last step of a CI job: it reads the spec files at the commit that `git rev-parse HEAD` names, through git and never from the working tree, and the job's `go test -json` report, and runs `dispatch result --project` once for each check whose test part names the job and whose test ran, at that commit, with the test's output on standard input. A test that its time limit or the end of the job stopped could not run, and is never a failure. A skip, a test that did not run and a test that ran twice get no result. It prints one JSON line for each check, and of a stored result it prints only the row's id; a write that landed with its answer lost is a stored result whose id is unknown, and no failure. `ci-report -h` names each exit status. The composite action `.github/actions/dispatch-results` runs it under the job's own GitHub Actions identity and keeps each line in `$RUNNER_TEMP/dispatch-results.jsonl`.
