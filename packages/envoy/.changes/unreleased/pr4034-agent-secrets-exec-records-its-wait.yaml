kind: Changed
body: |-
  `agent-secrets exec`'s wait for a decision appends one line before each step it takes (`read
  wait=N` before each status read, `sleep D` before each backoff sleep) to the file
  `AGENT_SECRETS_WAIT_RECORD_FILE` names, a variable only tests set; unset, it writes nothing.
  The variable never reaches the child.
