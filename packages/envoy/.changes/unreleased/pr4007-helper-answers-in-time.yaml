kind: Fixed
body: |-
  `agent-secrets enroll --helper` prints the enrollment a slow broker made, instead of exiting 1
  having read nothing. `agent-secrets-helper` gave every connection 5 seconds, while the three
  calls it passes through to the broker — `login`, `enroll-session-key` and
  `unenroll-session-key` — ran with no bound at all, so a broker that took longer than those 5
  seconds left the helper holding an answer it could no longer write: the enrollment was made and
  the launcher that asked for it read an empty reply. Each of those calls now runs under a
  20-second bound, inside the 30 seconds the client waits for one call, and the connection stays
  writable until the bound has passed, so the answer always reaches the caller. A call that does
  run out of that time is answered with its own op's code (`LOGIN_FAILED`, `ENROLL_FAILED` or
  `UNENROLL_FAILED`) and an error saying it timed out, never with an empty reply.
