kind: Fixed
body: |-
  A projected service-account token's issuer that hangs, or rotates its key while its key set
  cannot be read, no longer makes the verifier call a live token refused. A key set past its
  15-minute life that holds the token's key answers at once and is read again behind the answer,
  the read going on under its 10-second timeout for the next caller; and a key id the cached set
  does not hold is answered "issuer unavailable", not "no such key", while a read is in flight or
  after one failed, until a read succeeds. `envoy-listener` waits at most 3 seconds on a key-set
  read (`listenerKeySetWait`, below Dispatch's 5-second call window) and answers such a token 503,
  on every call of the outage, not 401. The secrets broker and Dispatch's own verifier still wait
  a read out, up to that 10-second timeout.
