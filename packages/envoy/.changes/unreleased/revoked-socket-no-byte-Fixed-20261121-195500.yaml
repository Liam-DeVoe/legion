kind: Fixed
body: |-
  Dispatch's document socket, once a schema re-check revokes it or its IAP assertion expires, carries nothing more of the room but the rest of the message already going out and the `4412` close: the end of the socket's request context closes its connection to every other frame before the cancel returns. Before, ygo kept writing room updates to the socket until the goroutine that sends the close ran, so a page could get an edit made after its revoke.
