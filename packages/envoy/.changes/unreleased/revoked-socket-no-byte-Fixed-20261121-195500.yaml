kind: Fixed
body: |-
  Dispatch's document socket, once a schema re-check revokes it, its IAP assertion expires or its caller no longer resolves, carries nothing more of the room but the rest of the message already going out and the close, and the room takes nothing more from it: the end closes the socket's connection in both directions before the cancel returns. Before, ygo kept writing room updates to the socket and applying the page's edits until the goroutine that acts on the end ran, so a page could get an edit made after its revoke, and the room could take one the page sent after it.
