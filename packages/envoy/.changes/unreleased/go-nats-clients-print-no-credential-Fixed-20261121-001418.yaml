kind: Fixed
body: |-
    A NATS server URL the NATS client would read other than as written is refused before any dial,
    named by its position alone and with a reason of fixed words, never any of its text or the URL
    parser's, which quotes the part it could not read: `bus: NATS server URL 1 of 2 cannot be read:
    it does not parse as a URL; write a credential in it percent-encoded (a "/" as %2F, a comma as
    %2C)`. That covers a password or a token holding an unescaped `/`, `?`, `#` or space; a URL with
    an `@` after its host, which is how a token holding a `/` written as the URL's user parses (its
    head becomes the host); a URL after the first that carries a user name or password and names no
    scheme, or one the NATS client does not dial (`nats`, `tls`, `ws`, `wss`), which is what a comma
    in a credential leaves after it once the list is split; and a websocket URL whose path stops
    parsing once the client's handshake decodes it, whose error quoted the URL with its query. A run
    that may reach remote NATS (`ENVOY_ALLOW_REMOTE_NATS=1`, as the deployments set it) used to hand
    such a URL to the NATS client, which refused it after the connect's ten attempts with an error
    that quoted the whole URL, or dialled the credential's head as a host name and logged it.

    A list whose later URL carries a user name or password and names no scheme used to connect,
    the NATS client reading it as `nats://`; it is now refused. Name that URL's scheme. Write a
    comma in a credential as `%2C`, and a `%` in a websocket URL's path as `%2525`. The bus trims its
    list once and hands the NATS client that list, and every NATS server URL it logs is named
    without its query and fragment. Dispatch's refusal of `NATS_URLS` names an empty entry by its
    position, and its refusal of `DISPATCH_SERVER_URL` names the variable alone, where both quoted
    the value whole.
