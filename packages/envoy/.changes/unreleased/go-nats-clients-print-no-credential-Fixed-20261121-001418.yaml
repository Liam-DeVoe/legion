kind: Fixed
body: |-
    A NATS server URL whose user name or password the URL parser cannot read as one is refused
    before any dial, named by its position alone and with a reason of fixed words, never any of its
    text or the parser's, which quotes the part it could not read: `bus: NATS server URL 1 of 2
    cannot be read: it does not parse as a URL; write a credential in it percent-encoded`. That
    covers a password or a token holding an unescaped `/`, `?`, `#`, space or comma, and a URL with
    an `@` after its host, which is how a token holding a `/` written as the URL's user parses (its
    head becomes the host). A run that may reach remote NATS (`ENVOY_ALLOW_REMOTE_NATS=1`, as the
    deployments set it) used to hand such a URL to the NATS client, which refused it after the
    connect's ten attempts with an error that quoted the whole URL, or dialled the token's head as
    a host name and logged it. Every NATS server URL the bus logs is now named without its query
    and fragment too, where a token a person put in a query used to print.
time: 2026-11-21T00:14:18Z
custom:
