kind: Fixed
body: |-
    A NATS server URL that does not parse is refused before any dial, naming the URL without its
    user name and password, with the parser's reason alone: `bus: the NATS server URL <host:port>
    cannot be read: <reason>`. A run that may reach remote NATS (`ENVOY_ALLOW_REMOTE_NATS=1`, as
    the deployments set it) used to hand such a URL to the NATS client, which refused it after the
    connect's ten attempts with an error that quoted the whole URL, a token or a password written
    in it included.
time: 2026-11-21T00:14:18Z
custom:
    Issue: go-nats-clients-print-no-credential
