kind: Fixed
body: 'Envoy''s HTTP clients but the agent-secrets command read a 408, a 429 and every 5xx as an outage (RFC 9110). Dispatch''s delivery to a session asks the listener again inside the take-over window on any of them but the listener''s own 500; Dispatch''s GitHub client counts a 408 from GitHub as a failed read, as it counts a 5xx, while the delivery reconcile still asks GitHub again within the call only for its own 502 and 504 and leaves a 408, 500 or 503 to its next pass; the embedding queue still bisects a batch an Azure 408 or 5xx other than 503 (or a Bedrock ModelTimeoutException or InternalServerException) answered and confirms the row with its canary, so one text Azure fails on every time holds up no other text, and when the canary fails too the background pace backs off; that pace now recovers by adding to its rate, from its slowest (one call each 5 minutes) back to its fastest in 32 untroubled calls, where it took about 6,000; the embedding queue logs a WARN, with no text, once it has scheduled the retry of a throttled group, which it retries whole; an agent loop model call answered 408 is retried once; the secrets broker reads a 408 or a 429 from Dispatch as Dispatch not answering, so a grant''s named approver may still revoke it, and the grant.revoked audit row of a revoke that went ahead with the approver''s member kind unread now carries member_kind_unchecked: true; and the load test retries a 408.'
