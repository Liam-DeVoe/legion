kind: Changed
body: |-
  `dev-airlock-stands load` reads the proxy URL from `--proxy-file` and the bearer from
  `--header-file`, and refuses `--proxy` and `--header` with exit 2, without repeating the value:
  a command's arguments are in `/proc/<pid>/cmdline`, where every process of the pod reads them.
  `scripts/airlock-check.sh` gives both as `<(printf …)` paths, its curl calls read the proxy from
  a curl config (`-K`), and its clone reads it from `GIT_CONFIG_*`.
