kind: Added
custom:
  Issue: pr4392
body: |-
  The broker's test rig (`internal/broker/brokertest` and its public facade
  `packages/envoy/brokertest`) takes `WithAccessLifetime`, how long an access token its broker
  issues lasts, fifteen minutes unless a test sets another. Its token exchange also lists a Legion
  daemon's own pod (`DaemonExchangeAccount`, whose entry fixes the session `legion-daemon:EXAMPLE`
  and names the rig's person) and a pod of a second project (`OtherProjectAccount`, of the project
  `OTHER`). Its `BROKER_POD_REGISTRARS` lists the rig's daemon account as the registrar of its
  pods, and `ExchangeAudience` is exported.
