kind: Fixed
body: |-
    During a rolling deploy, a server of the previous release deleted the reference rows of the forms this release adds (an issue's tab addresses, such as `dispatch://KEY/plan`, and an issue document's dashboard URL) whenever it rewrote a text that held them, because it cannot read those forms. The text was never touched. Each such text is now owed a re-index in `refs_forms_owed`, a queue the previous release does not know. Triggers fill it on every write and on every delete from `refs` that this release does not settle itself, and its seed fills it from the texts already stored. Only this release drains it, in a duty with a lease of its own (`refs-forms`), and a document's row is settled only when this release has indexed that document itself. So a backlink of the new forms can be missing while an older process writes the text, and it comes back at the next pass of the duty, within about 30 s. The queue takes one more lease connection: a server opens up to 113 connections to Postgres rather than 112 (`store.ConnectionsPerProcess`), and envoy-infra's `dispatchConnectionsPerPod` is 113 to match.
    Both reference readers (`text.CodeRanges` and the dashboard's `codeRanges`) now stop nesting containers where the renderer stops, at 100 blocks. A line of thousands of list markers no longer costs time quadratic in the nesting: on a line of 15,999 markers the Go reader takes 1 ms, where it took 209 ms.
