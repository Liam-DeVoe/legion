kind: Fixed
body: |-
  A standby Dispatch process now takes over publishing within six seconds of what stopped the
  process that published. A kill or a freeze at the moment of a renewal of the publisher hold was
  followed by a take-over six seconds or more later before. A NATS connection that went silent
  while the publisher had nothing to send was taken over eight to nine seconds into the silence.
  The publisher hold `dispatch-outbox` lasts 5 s after each renewal instead of 6 s, and a holder
  reports itself lost 1 s before its row lapses instead of 2 s, so a renewal still has 4 s from
  the last confirmed one. A holder gives the hold up after 2 s without NATS instead of 3 s, and its
  reads of its NATS client's state no longer wait out a reconnect attempt, which holds the client
  for up to five seconds through a silent cut. Dispatch's `/healthz` no longer waits out that
  attempt either, so it answers through a silent cut of NATS, and nor does an envoy-listener's
  `/healthz` for its role lane's client. A standby that takes the hold over from a process that
  stopped renewing without releasing it now ends every database session of that process before it
  publishes, so a write a frozen process had begun no longer holds that issue's other writes until
  the freeze ends. Every connection a Dispatch process opens names the process's identity, minted
  at boot, at the end of its `application_name` (for example `dispatch <identity>` for the shared
  pool, or the `DATABASE_URL`'s own `application_name` followed by it), and a request whose session
  was ended answers `503 DATABASE_SESSION_ENDED` with `Retry-After: 1`; the first such answer has
  every pool of the process drop the connections it holds, so its later requests dial afresh. The
  cost: a holder whose renewal is late stops publishing 1 s, not 2 s, before a standby may take the
  hold, a NATS outage of 2 to 3 s now hands the hold to the other process, and a slow holder whose
  row lapses loses the requests its database sessions were serving and the first statement that
  meets one of its idle connections.
