kind: Fixed
body: |-
  The refill live proof, `scripts/e2e-refill.sh`, passes against the listener again. Its rig asks
  for the session's own consumer when it registers a session, since the listener refuses a
  registration that asks for none. The rig now writes a record's variant in its directory,
  `/refill/<set>/v<n>`, and the judge reads an interest row's variant from there. The listener
  keeps that directory on the row, but it drops the variant topic the rig sent before. A new CI
  job, `envoy-refill`, runs every scenario of the script when a change touches what it reads.
