kind: Changed
body: |-
    `envoy-listener` stays up when the NATS grant refuses its durable consumer or its spent-proof
    bucket, where it exited before. The pod is live (`/livez` 204) and not ready (`/healthz` 503),
    and it tries again with a wait that starts at 1 s and doubles to 30 s. Each refused try logs at
    ERROR with the refused subject and the server's text: `durable consumer refused by the NATS
    grant; retrying` or `spent-proof bucket refused by the NATS grant; retrying`. A spent-proof
    bucket that does not answer at the start is tried again every 2 s instead of ending the
    process. Until that bucket opens, `/v1` stays closed and a request that presents a broker access
    token is answered 503 `service starting` with `Retry-After: 1`, so no token is taken without
    its spent-proof check. With two pods an exit sent each pod into a crash loop, and its backoff
    delayed recovery by minutes after the grant was fixed. The start also stays up, the same way,
    when NATS answers from its cluster's state: too few members for the `ENVOY_NATS_REPLICAS`
    copies, no meta leader, or JetStream temporarily unavailable, as during a NATS rolling restart.
    It tries the stream or bucket again with the same wait and logs `start refused by the NATS
    cluster's state; retrying` at ERROR at each try, with the stream or buckets, the setting, the
    server's code and text, and `retry_in`. Before, a refusal such as `no suitable peers for
    placement` ended the start.
