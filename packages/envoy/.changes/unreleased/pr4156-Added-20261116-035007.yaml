kind: Added
body: 'Each Dispatch project now has one owner, an access list of people and groups, and a public or private setting, and each person is a full member or a restricted member (`internal/dispatch/access`, migration `20261116015736_project_access`). A person sees a project that owns them, that lists them, that lists a group they are a full member of, or that is public while they are a full member; a restricted member is admitted only by being named directly, never through a group. The owner reads and writes the access list at `GET`/`PATCH /api/v1/projects/{key}/access` and `PUT`/`DELETE /api/v1/projects/{key}/access/people/{email}` and `.../groups/{name}`, and gives the project to another full member at any time; everyone else is 403 PROJECT_OWNER_REQUIRED. Groups live at `GET /api/v1/access-groups` and `PUT`/`DELETE /api/v1/access-groups/{name}`: the person who makes one owns it, only that owner writes or deletes it, a restricted member makes none (403 RESTRICTED_MEMBER) and is refused as a member (400 GROUP_MEMBER_RESTRICTED), and deleting a group takes it off every access list that named it. Every project the migration can give an owner gets its default assignee; a project whose default never signed in is named at boot, and `DISPATCH_PROJECT_OWNER_FALLBACK` or `envoy-dispatch project-owner <KEY> <email>` repairs it. Nothing can make a project private yet (409 PRIVATE_PROJECTS_OFF) and no read is limited yet, so every caller reads what it read before: each new field is absent at its default, and a full member''s `/api/v1/whoami` and `/auth/whoami` are unchanged.'
