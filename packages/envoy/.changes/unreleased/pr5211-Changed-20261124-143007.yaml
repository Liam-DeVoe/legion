kind: Changed
body: |-
  `envoy-infra buckets recreate` refuses until INFRA-4219's writer hold ships it (cybermonklabs/legion#4698). Whatever its arguments, it exits 1 with a refusal naming that hold and that pull request before it reads any of them: it connects to nothing, runs no kubectl, ssh or sh, sends no HTTP request and deletes nothing. No reading of pods, processes or connections proves that no writer runs: a writer can connect, write and leave between two reads; the hub's `auth.conf` shows neither the grants each server has loaded nor the auth service's per-connection decisions; and a server-side writer (a stream source, a republish, a push consumer) needs no connection. `check` keeps its best-effort proof, whose warning now names the three ways a writer gets past it, and `create` is unchanged.
