kind: Fixed
body: |-
  `dispatch doc-edit`'s `insert` anchored on a block inside a typed block - a `requirement`, an
  `ask`, a `check`, a `plan_task` or a `callout` - writes its markdown inside that typed block,
  beside the block its anchor names, where it was written after the typed block, at the document's
  own level, and nothing said so: a requirement's words stood outside every requirement, where no
  check's `serves` reached them. An insert anchored on a typed block's own block, or on a block at
  the document's level, lands where it did. Markdown the typed block's content rule cannot hold
  there - a heading in a requirement, a paragraph after an ask's options - is refused with
  `400 INSERT_DOES_NOT_FIT` naming the typed block, its rule and what breaks it, and nothing in
  the batch is written: write what the rule holds there, or anchor the insert on the typed block
  itself to write the markdown beside it. An ask edit refused for an emptied question whose
  paragraph holds an image names that insert as the way to write the question beside the image.
time: 2026-11-17T03:40:00Z
