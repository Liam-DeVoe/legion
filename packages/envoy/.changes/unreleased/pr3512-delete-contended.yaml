kind: Changed
body: |-
  DELETE /api/v1/comments/{id} and DELETE /api/v1/messages/{id} answer `409 DELETE_CONTENDED` with
  `Retry-After: 1`, with nothing written, when a send of the post moves while the delete is being
  written, where they answered `500 INTERNAL`; the same delete sent again then lands. A delete's
  settled send attempts read `ended by the post's delete`, where they read `not sent: the post was
  deleted`, which claims nothing about a frame that had already reached its session.
