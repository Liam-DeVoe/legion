kind: Changed
body: |-
  The lease pool (`store.LeasePoolSize`) grows from 24 to 26 connections. The records job (lease
  `word-records`) and the reviewer's sweep of held texts (lease `reviewer-sweep`) each reserve one
  at boot, whether or not this configuration runs them. So one server process opens at most 117
  connections to Postgres, up from 115 (`store.ConnectionsPerProcess`), and two processes at
  their ceiling hold 234. `infra/gcp`'s `dispatchConnectionsPerPod` is 117 to match.
