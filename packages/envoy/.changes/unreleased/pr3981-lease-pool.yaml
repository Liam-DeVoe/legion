kind: Changed
body: |-
  The lease pool (`store.LeasePoolSize`) grows from 21 to 23 connections. The records job (lease
  `word-records`) and the reviewer's sweep of held texts (lease `reviewer-sweep`) each reserve one
  at boot, whether or not this configuration runs them. So one server process opens at most 114
  connections to Postgres, up from 112 (`store.ConnectionsPerProcess`), and two processes at
  their ceiling hold 228. `infra/gcp`'s `dispatchConnectionsPerPod` is 114 to match.
