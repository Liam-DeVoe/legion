kind: Changed
body: |-
  `infra/scripts/operator-token-minters.sh` credits the broker's pod fence: when
  `--broker-workload` is `dispatch/envoy-broker`, and the renders and the operator's cluster each
  hold its five `broker-*` ValidatingAdmissionPolicies and bindings bound `Deny` with
  `failurePolicy: Fail` to `dispatch` alone, their rules hashing to the reviewed fence's digest
  (`infra/scripts/operator-token-minters/broker-fence.json`), and every pod there that runs as
  `envoy-broker` or takes its Secrets is named `envoy-broker-*`, a grant of exec, attach or port
  forward, or of a pod's spec or ephemeral containers, in `dispatch` is a `CREDIT` line instead of a
  finding, declared or live, and in who can become `envoy-broker`. `--report` gains `credited`, each
  entry naming the principal, the right, the grant, the policy and its binding, and their declared
  and live versions. Every other right stays a finding, and so does whoever can write or delete the
  fence; a fence missing or held otherwise prints `NO CREDIT`, and one that cannot be read is
  UNKNOWN.
time: 2026-11-23T21:51:57Z
