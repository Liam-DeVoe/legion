kind: Added
body: |-
  The secrets broker mints no developer-box token of a private project. A trade that acts as its
  person and names a project Dispatch answers private, or closing on its way there (the membership
  answer's new `closing`), is refused `invalid_target` naming the project: a machine login's trade,
  its renewal and a person's sign-in on a machine alike. Such a token is stored only while the
  answer it rests on is younger than 30 s, else the trade is refused `temporarily_unavailable` and
  stores nothing. `GET /v1/admin/machine-tokens?project=<KEY>` answers Dispatch's caller alone
  (the new power of the caller name `dispatch`) how many live developer-box tokens list the
  project and when the last expires, `{project, live_tokens, last_expires_at}`; any other caller
  is `403 ACCOUNT_LACKS_POWER`, and a query naming no one project key `400 PROJECT_INPUT`.
