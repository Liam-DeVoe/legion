kind: Fixed
body: |-
  A write the listener was told had landed is no longer lost to a key-value bucket deleted and created again while the listener runs: no program of a deployment creates a bucket a listener copies (`envoy_interests`, `envoy_roles`, `envoy_sessions`, `envoy_known_sessions`, `envoy_ci_state`), and nothing configures one to. A start that finds one missing waits for it behind its starting gates, every route answering 503 and `/healthz` answering 503 `waiting` with `missing_buckets`, so a readiness probe, a container health check, the docker provider's wait and `docker compose up --wait` all read a listener that serves nothing as not ready (a read of any bucket that fails holds that turn and is made again on the next, so a read the hub did not answer in time never lets the start go with a bucket missing). A running listener answers 503 to each write that needs a missing bucket, and serves reads from its last copy for at most two minutes; `/healthz` answers 200 `degraded` with `missing_buckets`, naming only the buckets a read finds missing, even the moment a watcher ends because its bucket was deleted, while every other check passes, and 503 when one fails; the interest and role claim watchers are checked and rebuilt each on its own, so one missing bucket stops only the watcher that reads it; the self-health monitor neither rebuilds nor restarts over it; and the ERROR `listener KV bucket is missing`, logged every 30 seconds until a read confirms the bucket is back, pages the AWS listener's new `bucket-missing` alarm (`envoy_kv_buckets_missing` counts them). The one exception is `envoy_known_sessions`, which no delivery depends on: missing at the start or later, it holds no start and fails no request; `/healthz` answers 200 `degraded` naming it, the listener logs it once at WARN and never the ERROR, and the known-session store answers no 30-day record and writes none, so a registration is answered with its record not written; once a read finds the bucket there again, the self-health monitor has the store open it at once rather than at its retry's next attempt. `/healthz`, that line and the alarm name the repair: `envoy-infra buckets create`, with `--break-glass` until the auth service's cutover, by the runbook (`packages/envoy/infra/README.md#envoy-infra-buckets`). The new `envoy-infra buckets create|recreate|check` is the one command that creates them, with `--replicas` or `ENVOY_NATS_REPLICAS` copies, each 1 to 5 and refused with exit 2 outside it; it names a stray argument by its position and a flag value it cannot parse by its flag, never the text of either. Its check of the writers is best effort, and every normal run says so: before a normal `create`, `recreate` or `check`, stop every listener (and envoy-dispatch, for `envoy_ci_state`) and confirm it has ended on each host. `--this-machine` proves no writer runs on the machine the command runs on (in a container, one in the host's PID namespace), and a `create` that finds every named bucket there changes nothing, says so and takes no proof. The single-node compose file creates the buckets before its listener starts, with a one-shot `buckets` service built from the checkout that runs `envoy-infra buckets create --this-machine`, so a fresh volume serves. It reaches a hub on another machine and takes its replies under `_INBOX_envoy_buckets`; its NATS user is granted exactly the subjects it sends (`$JS.API.INFO`, `$JS.API.STREAM.INFO.ENVOY_NOTIFICATIONS`, and `$JS.API.STREAM.{INFO,CREATE,UPDATE,DELETE,RESTORE}.KV_<bucket>` and `$JS.SNAPSHOT.RESTORE.KV_<bucket>.*` for each copied bucket, the restore after `check` included) and subscribes `_INBOX_envoy_buckets.>` alone, a static user that the auth service's callout replaces at the cutover. Until that cutover no hub has that user's key, so `envoy-infra buckets create --break-glass --operator <name> --bucket <bucket>` creates a missing bucket as a listener's NATS user (the in-cluster `gke` listener's seed, `envoy-nats-seed-gke`, read for that run and never written to disk), on the default `_INBOX.` prefix and with no writer proof and no listener stopped: it creates only buckets the server reports missing, creates none when any named bucket exists, updates and deletes nothing, logs one line naming the operator, the hub (without the URL's user or token) and the bucket, and is refused with `recreate` or `check`; the pull request that removes the listener users' create grant at the cutover deletes it. **Upgrade order, per hub:** older listeners created `envoy_known_sessions` the first time they opened it once their NATS user held that bucket's grant, and a listener of this release never creates it. So, first, while the hub still runs an older listener, render and apply the hub's users with `envoy-infra` 10.33.0 or later, the first release whose listener grant carries `KV_envoy_known_sessions`: the older listener's known-session store retries its open (1 s doubling to 5 minutes, and at once after each NATS reconnect) and creates the bucket. Then read the hub's `KV_envoy_known_sessions` stream (`nats stream info KV_envoy_known_sessions`), and roll out the listeners of this release only once the server answers it. Where it does not, create it with the scripted break-glass create of the `envoy-infra` release that carries `buckets`: `nats --server <hub> stream info KV_envoy_known_sessions >/dev/null || envoy-infra buckets create --break-glass --operator <name> --bucket envoy_known_sessions --nats <hub>`, with `ENVOY_NATS_REPLICAS` set to the hub's count; it runs as a listener's user, so it needs the same grant, and without it the server refuses its read and it exits 1 having created nothing. A listener of this release starts and serves whether or not the hub holds `envoy_known_sessions` or its users hold that bucket's grant; its known-session store writes no 30-day record until both are there, and then opens the bucket with no restart. A hub whose buckets all exist sees no change at the upgrade, and a new deployment runs `envoy-infra buckets create` before its first listener starts. A test or dev rig provisions its own NATS server with `internal/bus/bustest` or the `fixturebuckets` command before it starts a listener.
