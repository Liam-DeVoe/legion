kind: Added
body: |-
  `ENVOY_CONSUMER_NAMES` also chooses how Dispatch's delivery intakes name the consumers of their two durables, `delivery-events` and `delivery-jobs`, read once at start. `fixed`, the default, keeps today's take-over and fixed names, writes nothing to the new `intake_consumers` table, and reads Dispatch's cutover row, `envoy.sentinel/dispatch`, alone: at start, where `done` refuses the start naming the setting; before each take-over, under its consumer lease, where `done` stops the take-over and the process exits; and after each database or NATS reconnect. A missing table or row is no marker; a read Postgres refuses, a database that does not answer, or a row that is no sentinel of Dispatch's (`consumernames.ErrMalformedSentinel`) is read again until it answers, so a fixed process never runs over a marker it has not read. `fresh` gives each take-over a new physical consumer, `<durable>~<generation>`, created once and never again, behind the durable's row `dispatch/<durable>` in `intake_consumers` (migration `20261121002206_intake_consumers`), and refuses every consumer call, at ERROR naming the durable, until the cutover has written `done`.
  Each generation's calls go on a connection named for it, `dispatch-intake/<durable>/<generation>[/<old generation>]` or `dispatch-cleanup/<durable>/<generation>`, and the listener beside Dispatch uses `listener-intake/<machine id>/<generation>` and `listener-cleanup/<machine id>/<generation>`. The NATS auth service grants each such connection that generation's consumer calls alone (`natsgrant.Dispatch(machineID, intake)`, the intake read from the connection's name by `natsgrant.ParseDispatchConnection`); every Dispatch connection also gets the selection bucket's stream info and message get and the write of its own listener's record key, and a hub's static Dispatch user gets those three entries and no generation. A Dispatch connection sends no consumer call it made while cut after the reconnect.
  `/healthz` reports the mode as `consumer_names`, the `dispatch: consumer names` line carries the mode and `ENVOY_STREAMS_OPERATOR_MADE` before the first NATS connect, and `envoy_dispatch_durable_names_total{durable,op,outcome}` counts each step of the fresh names.
