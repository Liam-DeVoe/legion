kind: Added
body: |-
  `envoy-broker profiles check <file>` runs the broker's start check of the results profile `DISPATCH_RESULTS_TOKEN` on the file, and exits 1, naming the profile and the fault, on each rule of that check that the file alone decides. The new argument `--private-upstream <host>=<url>` takes the value `BROKER_AIRLOCK_PRIVATE_UPSTREAM` gives the broker, reads it with the broker's own parser, and holds the file to the start's whole check with that destination: the results profile, where the file holds it, binds the destination's host, and a destination needs that profile. It holds the destination's address to the start's rule too: `localhost`, and an address no broker takes as the destination (loopback, link-local, a metadata server's, unspecified, multicast, broadcast, `0.0.0.0/8`, an IPv6 form that carries an IPv4 address), exit 1 naming `BROKER_AIRLOCK_PRIVATE_UPSTREAM`. The new argument `--cluster-ranges <CIDR prefixes>` takes the value `BROKER_AIRLOCK_CLUSTER_RANGES` gives the broker, reads it with the broker's own parser, and makes the address check the start's whole rule: an address outside the private ranges and outside every range given exits 1 naming both settings, and one inside a range given is valid. Without `--cluster-ranges`, such an address is valid with one line saying it was not judged against the cluster ranges; with it but without `--private-upstream`, the run is a usage error. A value either parser refuses exits 2, quoting no part of the URL a credential can sit in and no element of the ranges. Without `--private-upstream`, a file that holds the results profile prints one more line, naming the host the profile binds and saying that its tie to `BROKER_AIRLOCK_PRIVATE_UPSTREAM` was not checked.
