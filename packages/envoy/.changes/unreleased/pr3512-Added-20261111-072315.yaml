kind: Added
body: |-
  The author of a comment or of an issue message can replace its body or delete it: PATCH and DELETE
  on /api/v1/comments/{id} and on /api/v1/messages/{id}, and GET /api/v1/comments/{id}/history and
  GET /api/v1/messages/{id}/history give the bodies an edit or a delete replaced. A deleted post
  keeps its place in its thread and gives its body to no read, while the events written before the
  delete keep their payloads. The comment PATCH, which before took a person's edit alone and refused
  one on a closed issue, now takes its author's edit, an agent's included, on an open or a closed
  issue. Each route's own description, which GET /api/v1 serves, states its rules. A repeat under an
  Idempotency-Key whose first answer holds text a delete withdrew answers ANSWER_NOT_KEPT instead of
  that answer (IDEMPOTENCY_KEY_HEADER in @legion/contracts states when), and GET
  /api/v1/issues/{key}/references takes its ETag from a hash of its answer.
