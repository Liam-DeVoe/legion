kind: Added
body: |-
  The author of a comment or of an issue message can replace its body or delete it: PATCH and
  DELETE on /api/v1/comments/{id} and on /api/v1/messages/{id}. The comment PATCH, which before
  took a person's edit of an open issue's comment alone, now takes its author's edit, an agent's
  included, on an open or a closed issue. GET /api/v1/comments/{id}/history and GET
  /api/v1/messages/{id}/history give each body an edit replaced, newest first, with the actor and
  the time, at most 200 in one answer; of a deleted post they give the deleted mark and each
  entry's actor and time, with no body. A deleted post keeps its place in its thread, and no read
  of it gives any part of its body; a reply's own event keeps the preview it froze of the post it
  answered.
