kind: Fixed
body: |-
  A metrics scrape whose client stops reading no longer holds up the process it scrapes. The
  `/metrics` handler Dispatch and the listener serve held each metric's lock while it wrote that
  metric's lines to the client, as long as the client did not read, and every count or observation
  of that metric waited on it meanwhile, which held the request recording it. The handler now
  renders the whole text under the locks and writes it holding none.
