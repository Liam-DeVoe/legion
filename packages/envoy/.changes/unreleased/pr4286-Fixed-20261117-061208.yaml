kind: Fixed
body: |-
    A session whose NATS credential is its own, the one the NATS auth service gives it, can no longer acknowledge another session's relay frame. A frame's reply subject was the listener's reply inbox and a counter every session behind that listener shared, so a session that answered `done` on the next number acknowledged another session's message, which was then never delivered. The reply subject is now `<inbox>.<session id>.<token>`, the token 128 random bits, and the relay moves a frame only on a reply that names the session the frame was sent to; a reply naming another session is logged at WARN and changes nothing.
    This closes the hole only for sessions on per-session credentials, whose grant admits replies under their own id alone (`_INBOX.*.<session id>.>`, `bus.SessionReplies`). Any holder of the shared session user (`core.SessionPermissions`) or of a host user (`HostPermissions`) can still read a session's relay subject and publish `done` to the reply subject its frame carries, since the relay reads the session the subject names and not who published it. That stays open until hubs admit sessions only through the auth service and render neither user.
    The listener's connection probe and Dispatch's agent stream replay also ask on a reply subject that names the session, so a session on its own grant answers all three. Deploy listeners and Dispatch with this change before any session holds that grant: a session on it cannot answer a frame, a probe or a replay request from a release before this one.
