kind: Changed
body: |-
  A broker token carries a list of projects. Introspection answers `projects`, a list, in place of
  `project`: a `named` token's one project, its operator entry's, and a `person` token's projects,
  the ones its trade named in the new `projects` form parameter (keys separated by spaces, at most
  16). Before it mints, the exchange asks Dispatch, with `BROKER_PROJECT_ACCESS_URL` set, whether
  the token's person may see each project, and refuses one they may not see in the same words
  whether Dispatch holds it or not. A restricted member's trade must name at least one project. A
  request under an operator's entry may name only that entry's project, and a token naming no
  person may name none. With no project access configured, or while Dispatch cannot be reached, a
  trade naming no project and an entry's token mint as before, and a person's trade naming a
  project is refused. `brokertoken.Caller.Projects` replaces `Caller.Project`; Dispatch still holds
  only a `named` token's writes to its project. The TypeScript sign-in client sends the projects
  `AGENT_SECRETS_PROJECTS` lists, and the Go client sends `Config.Projects`.
  **Upgrade order:** a Dispatch or listener of this release refuses a `named` token minted by an
  older broker, whose introspection names `project` and no `projects`, until that token is renewed;
  no such token is minted where no exchange entry is configured.
