kind: Added
body: '`spec-check citations` names each program check of The Spec that CI must refuse at a commit (R48): its test is not in the code, its selector picks two tests, its job is not in the workflow or not awaited, or a file that its test reads changed and its job did not run the test. A result that go test replayed from its cache is no run, and a file that the change deleted, or moved out of the tie, counts by the tie at the base commit. `spec-check changed` lists the files that changed between two commits, both paths of a move, after a first line `base <commit>`: the commit where each carried result stands, which for a change''s branch is its merge base with the default branch. `citations --ties` takes ties by commit and may be given more than once. `spec-check tree` reads a runner, a selector or a job with no letter and no digit as missing, and refuses a procedure that names its own go test.'
