kind: Added
body: '`spec-check citations` names each program check of The Spec that CI must refuse at a commit (R48): its test is not in the code, its selector picks two tests, its job is not in the workflow or not awaited, or a file that its test reads changed and its job did not run the test. A result that go test replayed from its cache is no run, and neither is a run in a report that ends before its package''s own end event; the reader of go test reports reads a line that go test writes in two or more output events, as the summary line of a long import path, whole. A file that the change deleted, or moved out of the tie, counts by the tie at the base commit, and a tie that is not known at the commit or at the base counts as a change, also when no path changed. `spec-check changed` lists the files that changed between two commits, both paths of a move, after a first line `base <commit>`: the commit where each carried result stands, which for a change''s branch is its merge base with the default branch. `citations --ties` takes ties by commit and may be given more than once. `spec-check tree` reads a runner, a selector or a job with no letter and no digit as missing, and refuses a procedure that names its own go test.'
