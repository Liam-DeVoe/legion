kind: Added
body: 'spec-check compares a directory of spec files with an approved spec and prints the approved text. `spec-check compare --dir <dir> --approved <approved.json>` names each statement, check, component, interface or term whose text the approved spec never held, with its file and line, and each approved statement that the files do not hold at its current text. `spec-check print --approved <approved.json> --id <id>` writes the current approved block of a node, and of each check of a statement, for a change to copy into the files. No CI job compares the files: `compare` refuses to run when `GITHUB_ACTIONS` or `CI` is `true`, and `spec-check guard --root <dir>` fails on each line of a workflow, action or script that runs the comparison, reading each line as the shell reads it and each `run:` value as YAML reads it, and fails when it reads no workflow. CI runs the guard on each pull request that changes those files.'
