kind: Added
body: 'spec-check compares a directory of spec files with an approved spec and prints the approved text. `spec-check compare --dir <dir> --approved <approved.json>` names each statement, check, component, interface or term whose text the approved spec never held, with its file and line. When the approved spec held every text, it names each approved node of each kind that the files do not hold at its current text, and each node that the files hold and the approved spec removed. It makes no comparison, with exit 2, when the files hold a block or a line that the parser cannot read into its node; a problem of form, such as a heading that names code, does not stop it. With `--allow-empty`, it reads a directory that does not exist or holds no spec file as the empty tree, so after a revert of the last spec file each approved node reads as not in the files. `approved.json` has one definition, which its writer and the commands that read it share: `at` is an RFC 3339 time as `time.RFC3339Nano` writes it, with an upper-case `T` and `Z`, and a field written in other letters, a field given two times, a byte that is not UTF-8 or a file with no `nodes` list is refused. A value of another type than the form needs is refused with the form and the place of the value, in words that name no Go type. `spec-check print --approved <approved.json> --id <id>` writes the current approved block of a node, and of each check of a statement, for a change to copy into the files; its output must not reach a CI log, where a line that starts with `::` would be a workflow command. R2 of The Spec gives the comparison at each push to Dispatch. This release adds the comparison logic and the command, and two parts that keep the comparison out of CI jobs. `compare` refuses to run when `GITHUB_ACTIONS` is `true`, which covers a step that passes the runner''s environment on to it and not one that drops that environment, such as `sudo` or a container. `CI=true` alone, as an agent''s shell sets it, does not stop it. `spec-check guard --root <dir>` reads each workflow, action and script under `.github/workflows`, `.github/actions`, `.github/scripts` and `scripts` as text, and fails when it reads no workflow. The guard names each place of a CI file where the command''s name and then the word `compare` follow each other with only white space, commas, `(` or `[` between them, and with quote characters (also a `$` before one), backslashes, and line breaks with the indentation after them ignored, a `sudo` line and a list of arguments in a script included. So it also names a comment or a quoted text that no shell runs, and the author rewords that line, as the guard''s line for each place says. The name is `spec-check` as a word of its own, so a job, a key or a tool whose name only holds it is not named. `compare` is a word of its own too, so `compare-all`, `compare.sh` or a path such as `compare/**` is not named. A letter right after a backslash ends an escape, so `run: "set -e\nspec-check compare …"` is named, and so is `compare` before a `\n` or a `\t`. It does not find a command that an expansion, an escape or an alias builds, a name right after an escape such as `\x20`, or one with another word between the two, such as `docker run --entrypoint spec-check <image> compare`, and it is no defence against an author who hides the command: `compare` itself refuses to run in a CI job. CI runs the guard on each pull request that changes those files. Each subcommand of spec-check exits 2, with one line on standard error, when a file or a device on its standard output does not take all of its text, such as a full disk. A pipe whose reader has gone ends the command by SIGPIPE instead, with no line. A standard output that is closed at the start reads as `/dev/null`, since the Go runtime opens `/dev/null` on it before the program starts, so the text is lost as with `>/dev/null`.'
