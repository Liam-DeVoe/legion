kind: Added
body: 'spec-check compares a directory of spec files with an approved spec and prints the approved text. `spec-check compare --dir <dir> --approved <approved.json>` names each statement, check, component, interface or term whose text the approved spec never held, with its file and line. When the approved spec held every text, it names each approved statement that the files do not hold at its current text, and each node that the files hold and the approved spec removed. `spec-check print --approved <approved.json> --id <id>` writes the current approved block of a node, and of each check of a statement, for a change to copy into the files. Dispatch compares the files at each push, and two parts keep the comparison out of CI jobs for the common routes. `compare` refuses to run when `GITHUB_ACTIONS` or `CI` is `true`, which covers a step that passes the runner''s environment on to it and not one that drops that environment, such as `sudo` or a container. `spec-check guard --root <dir>` names each line of a workflow, action or script under `.github/workflows`, `.github/actions`, `.github/scripts` and `scripts` that runs the comparison, a `sudo` or container line included, reading each line as the shell reads it and each `run:` value as YAML reads it, and fails when it reads no workflow. CI runs the guard on each pull request that changes those files.'
