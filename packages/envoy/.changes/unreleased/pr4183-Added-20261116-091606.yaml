kind: Added
body: 'spec-check compares a directory of spec files with an approved spec and prints the approved text. `spec-check compare --dir <dir> --approved <approved.json>` names each statement, check, component, interface or term whose text the approved spec never held, with its file and line. When the approved spec held every text, it names each approved node of each kind that the files do not hold at its current text, and each node that the files hold and the approved spec removed. With `--allow-empty`, it reads a directory that does not exist or holds no spec file as the empty tree, so after a revert of the last spec file each approved node reads as not in the files. `spec-check print --approved <approved.json> --id <id>` writes the current approved block of a node, and of each check of a statement, for a change to copy into the files. R2 of The Spec gives the comparison at each push to Dispatch. This release adds the comparison logic and the command, and two parts that keep the comparison out of CI jobs. `compare` refuses to run when `GITHUB_ACTIONS` is `true`, which covers a step that passes the runner''s environment on to it and not one that drops that environment, such as `sudo` or a container. `CI=true` alone, as an agent''s shell sets it, does not stop it. `spec-check guard --root <dir>` names each line of a workflow, action or script under `.github/workflows`, `.github/actions`, `.github/scripts` and `scripts` that runs the comparison, a `sudo` or container line included, reading each literal word of a line, quoted or not (Bash''s `$''…''` and `$"…"` included), and each `run:` value as YAML reads it, and fails when it reads no workflow. It does not expand a brace, a glob, a variable or a command substitution, and the reviewer of a change to the CI files reads those. CI runs the guard on each pull request that changes those files. Each subcommand of spec-check exits 2, with one line on standard error, when its standard output does not take all of its text.'
