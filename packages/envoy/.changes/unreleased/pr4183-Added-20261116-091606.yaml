kind: Added
body: 'spec-check compares a directory of spec files with an approved spec and prints the approved text. `spec-check compare --dir <dir> --approved <approved.json>` names each statement, check, component, interface or term whose text the approved spec never held, with its file and line. When the approved spec held every text, it names each approved node of each kind that the files do not hold at its current text, and each node that the files hold and the approved spec removed. With `--allow-empty`, it reads a directory that does not exist or holds no spec file as the empty tree, so after a revert of the last spec file each approved node reads as not in the files. `spec-check print --approved <approved.json> --id <id>` writes the current approved block of a node, and of each check of a statement, for a change to copy into the files. R2 of The Spec gives the comparison at each push to Dispatch. This release adds the comparison logic and the command, and two parts that keep the comparison out of CI jobs. `compare` refuses to run when `GITHUB_ACTIONS` is `true`, which covers a step that passes the runner''s environment on to it and not one that drops that environment, such as `sudo` or a container. `CI=true` alone, as an agent''s shell sets it, does not stop it. `spec-check guard --root <dir>` reads each workflow, action and script under `.github/workflows`, `.github/actions`, `.github/scripts` and `scripts`, and fails when it reads no workflow. It names each line whose words run `spec-check`, under any path, with `compare` as its first argument, as Bash reads the words after quote removal and line continuation, a `sudo` or container line included, and it reads each `run:` value as YAML reads it. A comment, from a `#` that starts a word to the end of its line, holds no words and continues no line, also after a backslash. A here-document body, up to its delimiter line, holds no words, so a quote or a backslash in it changes nothing after it. The guard also reads each quoted word, each here-document body and each comment as a script of its own, since a nested shell can run it, so it names a comparison there that no shell runs too. It expands nothing: for a form that needs a brace, a glob, a variable or a command substitution, the refusal of `compare` itself stops the comparison in a step that keeps `GITHUB_ACTIONS`. Of the lines that the guard reads, only a line that both writes the word in such a form and drops that variable passes both, and no program finds it. In a folded or plain YAML value, the guard can name a line that Bash does not run, and it never misses one for that reason. CI runs the guard on each pull request that changes those files. Each subcommand of spec-check exits 2, with one line on standard error, when a file or a device on its standard output does not take all of its text, such as a full disk. A pipe whose reader has gone ends the command by SIGPIPE instead, with no line. A standard output that is closed at the start reads as `/dev/null`, since the Go runtime opens `/dev/null` on it before the program starts, so the text is lost as with `>/dev/null`.'
