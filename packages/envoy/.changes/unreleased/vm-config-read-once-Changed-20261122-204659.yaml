kind: Changed
body: |-
  `loadtest/vm/vm.sh` reads its deployment file once per subcommand, when the subcommand starts,
  and takes every value from that reading: one `jq` where an `up` ran 297 and a step 408, one per
  value. Each value is the one a `jq` of its own gives, its default and its refusal included. An
  edit of the file while a `series` or a `seed` runs now reaches the next subcommand, not the
  running one.
time: 2026-11-22T20:46:59Z
