kind: Changed
body: |-
    The Legion board's card shows no CI verdict. Since cybermonklabs/legion#2539 the Legion
    daemon's state carries neither a pull request's CI verdict nor its base branch's required-check
    mark, so the sampler records neither and a card of `GET /api/v1/projects/{key}/legion/board`
    has no `checks_verdict`. The verdict and required-check rows a database already holds stay, and
    nothing reads them.
