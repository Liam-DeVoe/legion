kind: Fixed
body: |-
  A request presenting a broker-issued token under DPoP is decided before admission, and its decision writes its proof's row on the request pool, so a burst of them all waited on that pool before admission could refuse any of them; those decisions, the sockets' heartbeat checks and a document socket's admission reads now share the 8 request-pool connections admission leaves, and a presentation that finds them all held is answered at once with admission's own `429 OVERLOADED` and `Retry-After: 1`, its proof not spent, a document socket is refused `503` with `Retry-After: 1`, and a heartbeat check is skipped until the next heartbeat.
  A heartbeat check that failed for any reason closed its socket, so under load a busy pool closed connected editors' sockets and sent them back into the load to reconnect; a check that fails because a pool was busy, because it ran out its own bound of one heartbeat, or because it was skipped for want of a place now keeps the socket, a refusal such as a sign-out still closes it at once, and only the third such failure in a row closes it.
  That ceiling is about 45 seconds at the 15-second heartbeat, and it is a cost to authorization: while the database is busy, a socket whose sign-in was revoked may stay open for up to those 45 seconds, where a free pool closes it within 15.
