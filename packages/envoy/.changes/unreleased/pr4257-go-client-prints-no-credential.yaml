kind: Fixed
body: |-
  No error or log line of `agent-secrets`, `agent-secrets-helper` or the token client prints a
  part of a setting other than the broker's address that can carry a credential, or the content of
  a file that holds one. A URL setting (the sign-in issuer `AGENT_SECRETS_SIGNIN_ISSUER`, the
  approval page `AGENT_SECRETS_APPROVE_URL`) prints only as the broker's address does, whole when
  it is a plain http(s) URL and as a fixed phrase beside its variable's name otherwise. A file that
  holds a credential (the token file `AGENT_SECRETS_MACHINE_TOKEN_FILE` names, the sign-in
  client's secret file, the sign-in store, the helper's operator, machine, identity-key and state
  files, `key.pem` and the pod token file) prints as its variable or flag, never its path, which
  for a person who pasted the credential itself into the variable is the credential: a file
  call's error prints its operation and the system's reason alone, and a file that does not parse
  prints as fixed text. A request to a server other than the broker (the sign-in issuer and the
  endpoints it names) prints its failure as its class and, for a refusal, its status and its
  error code where the OAuth specifications register that code, and never its body. A value
  refused from the environment (an identity kind, a project list) is named by its variable, not
  echoed. The new `internal/redact` helpers `Class`, `Answered` and `File` hold these rules.
