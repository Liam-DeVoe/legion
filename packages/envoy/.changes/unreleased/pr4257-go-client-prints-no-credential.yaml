kind: Fixed
body: |-
  `agent-secrets`, `agent-secrets-helper` and the token client print no part of these settings
  and files that can carry a credential. A URL setting (the sign-in issuer
  `AGENT_SECRETS_SIGNIN_ISSUER`, the approval page `AGENT_SECRETS_APPROVE_URL`, the metadata
  identity's `AGENT_SECRETS_MACHINE_AUDIENCE`) prints only as the broker's address does, whole when
  it is a plain http(s) URL and as a fixed phrase beside its variable's name otherwise. A file that
  holds a credential (the token file `AGENT_SECRETS_MACHINE_TOKEN_FILE` names, the sign-in
  client's secret file, the sign-in store, `enroll`'s `key.pem` and key directory, `--pod-token-file`,
  the helper's operator, machine, identity-key and session-record files) prints as its variable or
  flag, never its path, which for a person who pasted the credential itself into the variable is
  the credential: a file call's error prints its operation and the system's reason alone, and a
  file that does not parse prints as fixed text. The one exception is the renewal command
  `enroll --pod` prints on success, which names the token file and directory the run just used. A
  request to the sign-in issuer prints its failure as its class and, for a refusal, its status and
  its error code where the OAuth specifications register that code, and never its body. A refused
  value (an identity kind, a project list, an `AGENT_SECRETS_PERSON` nobody signed in as, an
  argument `enroll`, `unenroll` or a `machine` form does not take, a flag or unit value
  `agent-secrets-helper install` cannot use) is named by its variable or position, not echoed. The
  new `internal/redact` helpers `Class`, `Answered`, `File` and `Masked` hold these rules. The
  metadata server, Google's token services, `GOOGLE_APPLICATION_CREDENTIALS`,
  `AWS_WEB_IDENTITY_TOKEN_FILE`, keygen's and the signer's `key.pem`, flag values, refused ids,
  form names and settings-file keys, the cloud tools' account and profile selectors, gcloud's own
  error output and `AGENT_SECRETS_ENROLL_WAIT` follow when the agent-secrets stack that rewrites
  their code lands.
