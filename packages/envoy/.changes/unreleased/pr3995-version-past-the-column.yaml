kind: Fixed
custom:
  Issue: pr3995
body: |-
  Dispatch answers a number above 2147483647, the largest one its integer columns hold, as the
  caller's input. A document version number is refused: `GET .../artifacts/.../versions/{number}`
  answers `400 INVALID_VERSION` and `PUT /api/v1/me/documents/{id}/read` answers
  `400 INVALID_STATE`. An attempt of `POST /api/v1/messages/{id}/deliveries/{attempt}/accept`
  answers `404 MESSAGE_NOT_FOUND`, as an attempt the message does not have does. An event list's
  `after` or `before`, on `GET /api/v1/issues/{key}/events` and `GET /api/v1/artifacts/{id}/events`,
  answers `400 INVALID_QUERY`. Each answered `500` before.
