kind: Added
body: |-
  A `plan_task` block of a Dispatch document takes a `steps` attribute, the steps of Legion that
  the task runs, and the read of one version of a document answers that version's blocks with
  `blocks=true`, so a reader gets the plan exactly as that version wrote it. An issue's plan node
  takes the source `owner` beside `default`, and an owner's later version of the plan replaces a
  default plan whole: its document, its version and its tasks.
