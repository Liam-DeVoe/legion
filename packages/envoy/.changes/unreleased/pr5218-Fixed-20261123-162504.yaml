kind: Fixed
body: |-
  `envoy-infra buckets create` stopped by an interrupt or SIGTERM no longer says `nothing more is created`: a `STREAM.CREATE` it had already sent still lands on the hub. It now exits 1 with `envoy-infra buckets create: stopped: <the signal>; it starts no create after this, but one it had sent may still land: run create again to see what the hub holds`. A connection that reports no server version, as one that is not connected does, refuses `create` with exit 1 before any read (`refused: the connection reports no server version`), where it judged every present bucket against a stream made for a server too old for a bucket, refusing it for its discard policy, and failed the create of an absent one (`key-value requires at least server version 2.6.2`). A connection that drops during a create, and reconnects only later, now refuses that create the same way, naming the bucket, where the create printed `key-value requires at least server version 2.6.2` or, when the drop came after its read of the account's JetStream info, made the bucket with a discard policy of old; the read of the server version that chooses a bucket's discard policy now refuses no version (`bus.ServerVersion`). The writer proof of `recreate` and `check` counts a container started through a launcher - a command whose first word is not `envoy-listener`, `envoy-listener-heldport` or `envoy-dispatch`, such as a shell, `env`, `tini` or `dumb-init`, or the image's entrypoint when the container sets `args` alone - whose later words name `envoy-listener`, `ENVOY_MACHINE_ID` or `ENVOY_WEBHOOKS` as a writer of every copied bucket, and one whose later words name `envoy-dispatch` as a writer of `envoy_ci_state`, each blocker saying why and naming the launcher quoted. Before, such a pod blocked only where its name (`listener`, `envoy-listener`), its `ENVOY_MACHINE_ID` or an `envFrom` source already marked it as a listener. The proof reads a launcher's words as the kubelet and then a shell run them: a `$(VAR)` reference takes the value the container's `env` gives it; each `$NAME`, `${NAME}` and `${NAME...}` takes the value the container's `env` gives `NAME` (a literal or a field of the pod, such as a label) or a literal assignment in the script gave it before, `$1` to `$9` take the words after a `-c` script, an unset name's `${NAME:-word}` takes its word, and quotes and backslashes go, read again until nothing changes. So `[$(PROGRAM)]` with `PROGRAM=envoy-dispatch`, `sh -c 'exec "envoy-${ROLE}"'` with `ROLE=dispatch` from the `env` or a label, `sh -c 'exec "/usr/local/bin/envoy-$1"' sh dispatch` and `PROGRAM=envoy-; PROGRAM=${PROGRAM}dispatch; exec "$PROGRAM"` each block `envoy_ci_state`, where each passed the proof. An expansion of a variable whose value the pod does not show (a Secret, a ConfigMap, an `envFrom` source, which sets only names of its prefix and a key of `[-._a-zA-Z0-9]+`, so not the kubelet's `$(hostname -f)`) blocks every copied bucket, naming the expansion. The best-effort warning names a sixth way past the proof: a program a launcher picks from what the pod does not show or as its script reads it alone (a script file, a file or a command's output it reads, a variable of the image's own environment, a variable the script gives no literal value, a glob, bash's `${!REF}`). The Envoy image's, the worker image's and the held-port image's build contexts leave out `.env` and `.env.*` files anywhere (`**/.env`, `**/.env.*`), where they left them out at the context's root alone, so an untracked `.env` under `packages/envoy` or `packages/dispatch` never enters a local build.
