kind: Fixed
body: |-
  `envoy-infra buckets create` stopped by an interrupt or SIGTERM no longer says `nothing more is created`: a `STREAM.CREATE` it had already sent still lands on the hub. It now exits 1 with `envoy-infra buckets create: stopped: <the signal>; it starts no create after this, but one it had sent may still land: run create again to see what the hub holds`. A connection that reports no server version, as one that is not connected does, refuses `create` with exit 1 before any read (`refused: the connection reports no server version`), where it judged every present bucket against a stream made for a server too old for a bucket, refusing it for its discard policy, and failed the create of an absent one (`key-value requires at least server version 2.6.2`). A connection that drops during a create, and reconnects only later, now refuses that create the same way, naming the bucket, where the create printed `key-value requires at least server version 2.6.2` or, when the drop came after its read of the account's JetStream info, made the bucket with a discard policy of old; the read of the server version that chooses a bucket's discard policy now refuses no version (`bus.ServerVersion`). The Envoy image's, the worker image's and the held-port image's build contexts leave out `.env` and `.env.*` files anywhere (`**/.env`, `**/.env.*`), where they left them out at the context's root alone, so an untracked `.env` under `packages/envoy` or `packages/dispatch` never enters a local build.
