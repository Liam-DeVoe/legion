kind: Fixed
body: |-
    A start whose create of a KV bucket meets a bucket another start created a moment before no longer waits out the whole JetStream wait, ten seconds (two for the known-session bucket), when the read of the stream that the create makes after "stream name already in use" draws no answer. In the moment after another start's create lands no member answers that read, and a read no member answered is never answered later. Each send of a bucket's create step, and of the `ENVOY_NOTIFICATIONS` create, is now waited for up to the start's read limit (630 ms first) and sent again, as a read of a stream is. A create cut while its stream's first election runs is sent again as an equal create, which the server answers at once, and the start then waits for the stream's leader as before.

    An update of a stream that a start or a keeper pass sends (a bucket's raise or maximum age, the `ENVOY_NOTIFICATIONS` reconcile) is now waited for up to the same read limit, where it waited the whole JetStream wait: no member answers an update sent while the stream elects its leader. The stream is then read back, and the update is sent again only when that read shows it did not land, made from that read. An update the limit cut can still land after the one sent again, and it then writes back the read it was made from over a change another program made since. A stream update has no compare-and-swap, so an update the server applies late does that whether or not a limit cut it, and the keeper of the program whose change was lost puts it back within its period, 30 seconds.

    A start that moves the role lanes off a stream that still carries them reads the list of the stream's consumers again when its answer is lost or the list names fewer consumers than the stream counts: nats.go's list reports no error, so a lost list moved nothing and said nothing. A move of a consumer's filter and a purge of a role lane whose answer is lost are read back, and sent again only when that read shows they did not land, each send under the same read limit, until the start's hang guard passes, where one lost answer failed the start. The purge no longer waits the JetStream wait whatever context it is given: nats.go's purge ignores that context, so the start sends the purge request itself.
