kind: Added
body: 'spec-check state derives the state of each check and each statement of a scenario of The Spec at each of its subjects, says whether each wait on a statement ends at the head of main, and names the cycle of waits; --json prints the states as JSON. It refuses spec files that spec-check tree refuses, and state, compare and print read each JSON file strictly: a byte that is not UTF-8, or a member written in other letters or given two times, is exit 2. A statement follows the states of the statements under it and of the statements that support it at each level. A check reads unknown when its failing example has no letter and no digit, or when the record of the failing example of a program check names no author of the test or of the fault; a statement that other statements support and that has no check of its own reads unknown, as a leaf with no check does; and each check and statement that the rules of spec-check tree refuse never reads true or met. A scenario''s ties.json holds the tie of each check by commit, {"<commit>":{"<check id>":[…]}}, and a result at one commit counts at another only when the check''s tie is known at both commits and no path that changed between them is covered by the tie at either commit. A run of a program check of production or of the graph counts only where a result at the commit of the test that ran (test_commit) counts at the subject''s commit by that rule; such a check keeps the newest result of each leg of its job, so a leg that failed or left no result keeps it from reading true; and a pass and a failure at one transaction of the graph read unknown. A result counts only at the subject that it read: a check of production or of the graph is judged only at a subject that names a deploy, and there a check of the graph counts only the results at the subject''s graph_tx, so it reads unknown when the subject names no graph_tx or one that no result read; the reader refuses graph_tx on the head of a branch, a commit, branch, deploy or graph_tx of no letter and no digit, in subjects.json and as a commit of ties.json, and a result that names two subjects.'
