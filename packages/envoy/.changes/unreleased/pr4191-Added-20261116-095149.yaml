kind: Added
body: 'spec-check state derives the state of each check and each statement of a scenario of The Spec at each of its subjects, says whether each wait on a statement ends at the head of main, and names the cycle of waits; --json prints the states as JSON. It refuses spec files that spec-check tree refuses, and state, compare and print read each JSON file strictly: a byte that is not UTF-8, a member written in other letters or given two times, or a null at any place, is exit 2, and a value of another type is exit 2 with the form of the file and the place of the value. A statement follows the states of the statements under it and of the statements that support it at each level. A check reads unknown when its failing example has no letter and no digit, or when the record of the failing example of a program check names no author of the test or of the fault; a statement that other statements support and that has no check of its own reads unknown, as a leaf with no check does; and each check and statement that the rules of spec-check tree refuse never reads true or met. A scenario''s ties.json holds the tie of each check by commit, {"<commit>":{"<check id>":[…]}}, and a result at one commit counts at another only when the check''s tie is known at both commits and no path that changed between them is covered by the tie at either commit. A run of a program check of production or of the graph counts only where a result at the commit of the test that ran (test_commit) counts at the subject''s commit by that rule; such a check keeps the newest result of each leg of its job, so a leg that failed or left no result keeps it from reading true; and a pass and a failure at one transaction of the graph read unknown. A result counts only at the subject that it read: a check of production or of the graph is judged only at a subject that names a deploy, and there a check of the graph counts only the results at the subject''s graph_tx, so it reads unknown when the subject names no graph_tx or one that no result read, and a run of a check of the graph names its transaction, a run that could not run the one that it tried to read, so it counts there alone; the reader refuses graph_tx on the head of a branch, a commit, branch, deploy or graph_tx of no letter and no digit, in subjects.json and as a commit of ties.json, and a result that names two subjects. Each member of each input type is marked by how it reads when its writer does not set it, and a member that the derivation reads and that an input does not set is refused, never read as its zero value: a result with no at or no seq from 1, a run with no subject of its check''s kind and a failing example of a check of the code with no commit, a run of a program check with no job when the check''s text names its job, a result of a program check of production or of the graph with no test_commit, two results of one check at one at and one seq, a subject that sets both branch and deploy, a history.json that does not set commits or a commit with no files, a result or a job run that leaves out leg ("" for no matrix), a job run with no job or commit or that leaves out ended, a run of a check of the graph with no graph_tx, and a unit with no id or that does not set serves, needs or waits_on are exit 2; specgraph.Derive and specgraph.CheckStates give an error and no state for such an input, and for an approved node under another key than its id, a nil value of any type that implements History, a GitHistory with no Dir, and no JobRuns or Uncited (empty for none); and specgraph.WaitCycle gives an error for a unit with no id. A time of the files is RFC 3339 with an upper-case T, and Z or an offset, and the zero instant of year 1 is no time. state, compare and print refuse a node of approved.json that sets no removed or no partly_checked, and a refusal of a scenario''s file prints a long value of the writer, such as a commit, a check or a unit, by its first and its last 50 bytes. A scenario holds uncited.json, {} when CI refused no check. A job run sets ended, false for a run that has not ended: its leg reads unknown (no_result), never a silent leg or a pass. A refusal by CI and a run of a check''s job count wherever the results of their commit count, so a leg that ended with no result, or a refusal, at a commit whose result carries to the subject keeps the check from reading true. GitHistory gives the same changed paths whatever the settings of the clone or of the machine, such as ignore = all for a moved submodule, a replace ref, diff.relative or a GIT_DIR of the process.'
