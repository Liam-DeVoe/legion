kind: Added
body: |-
  The secrets broker can run the Envoy hub's NATS auth service, so a connection reaches only what
  its own credential allows. With `BROKER_NATS_URLS` and the three seed files
  (`BROKER_NATS_SEED_FILE`, `BROKER_NATS_ISSUER_SEED_FILE`, `BROKER_NATS_XKEY_SEED_FILE`), every
  broker replica answers the hub's authorization requests in one queue group: a session presenting
  its broker access token and a proof of that token's key over the server's own per-connection
  nonce is admitted to its own delivery channel and its own agent stream, and nothing of another
  session's; a service presenting a projected Kubernetes or Google identity token for
  `BROKER_NATS_K8S_AUDIENCE` or `BROKER_NATS_GOOGLE_AUDIENCE`, from an account
  `BROKER_NATS_SERVICES` lists, is admitted to its kind's grant. Any other connection is refused by
  one line, and the NATS user each is admitted as expires with the credential it was issued for.
  Every connection is answered within 1.5 s of its request reaching a replica, admitted or
  refused, and the broker's metrics port answers `GET /livez` with 503 once the service's loop has
  not turned for ten seconds, so a liveness probe restarts a replica that has stalled.
  Go clients present those credentials through `NATS_SERVICE_TOKEN_FILE` or
  `NATS_SERVICE_GOOGLE_AUDIENCE` for a service, and through the token client for a session, each
  reconnecting before its user expires; `natsprobe` tries one subject by hand.
  `scripts/dev-stack.sh --callout` runs the whole local stack behind the service and
  `scripts/callout-check.sh` proves it. A hub with no auth service, and clients configured with
  none, run exactly as before.
