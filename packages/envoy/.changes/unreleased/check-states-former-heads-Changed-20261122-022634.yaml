kind: Changed
body: |-
    The check states settler keeps computing and publishing the state of each `before_merge`
    check at each former head of an open pull request, a head the pull request left while it is
    open: a result recorded or retracted there, a change of a check's words or a settled CI run
    there publishes the new state there, with the event naming that head and that pull request, as
    at an open head. Before, a head the pull request left had its rows deleted with no event, so a
    tester's results at the head it tested, recorded after a push moved the pull request on,
    published nothing, and Legion moved the issue on the states from before the push. New table
    `pull_request_former_heads` keeps each head an open pull request left, written by triggers on
    `pull_request_heads` in the transaction of the write that moved the row, whichever build wrote
    it (migration `20261122071001`, one transaction with the table and the seed), so a head is kept
    whether or not a settle ran while the pull request was there. The install seeds, as
    unverified candidates, the commits of the results the settle of each open pull request's issue
    reads, recorded on any issue against a check of that issue's Verification document, other than
    its head, and marks those issues owed; the settler asks GitHub once which candidates are each
    such pull request's own commits and keeps those: a commit its list of commits names, and where
    GitHub's cap of 250 leaves that list short, a commit the head holds and the base branch does not,
    by two comparisons (only an answer about a commit drops it; any failed read keeps the commits it
    would have decided and a mark after the backoff), one read for a pull request whichever issue
    it moves to, since a settle claims the read by the pull request's canonical name and number
    (`pull_request_former_heads_reads`) and a settle of another issue leaves it to that claim, so
    a head left before the release where a result was recorded publishes its states,
    and one with no result is not known and needs none. A result recorded later at a commit that is
    no head of such a pull request and no head it is known to have left is a candidate too, left by
    an insert trigger on `check_results` and `ci_check_results`, and a row of a pull request that
    starts at the issue after such a result (its first write, as the read-through makes it after
    the result's transaction while the webhook intake is off, a reopen, a re-key or a move to the
    issue) takes the issue's results' commits as candidates by an insert and an update trigger on
    `pull_request_heads`, through the functions the install's seed calls, each reading under the
    issue's lock so a result and a row written at once are not both missed; the install takes
    `SHARE ROW EXCLUSIVE` on those two and `pull_request_heads` before its seed and triggers, so a
    result or a head write either committed before the seed read it or fires the triggers after the
    commit (it asks for them in tries of half a second each, shorter than `deadlock_timeout`,
    giving back what a try took when it runs out, for as long as the runner lets any migration
    wait for a lock, so a cycle with an issue's delete fails neither side and a busy writer is
    waited out as any migration waits one out);
    a close or a merge of a pull request under any of its names drops the former heads it holds
    under every name and records the head each other open row stands at as ended
    (`pull_request_heads_ended`), so no history of a closed lifecycle reaches a later one through a
    row's next move or its re-key, every such write taking the pull request's lock first
    (`pull_request_former_heads_lock`); a close, a merge or a delete of
    the row drops its former heads, and the delete of a row stored under a repository's old name
    carries them to the canonical row where it is open, and marks that row's issue owed, in the
    delete's own trigger with both rows locked, whichever build deletes it, so no head write and no
    close of either row loses or brings back a head meanwhile, and the carried heads' states are
    published. A former head's rows in `check_states` go once no open pull
    request is or was at it. A check CI proves is read at the former heads after the open heads, in
    a batch of their own under its own 10 s bound, at most eight reads at a time, the head whose
    read started longest ago first (`check_states.ci_read_at`, migration `20261122042853`); a
    former head whose read had not started when that bound ended keeps its published state, with no
    `read_failed`, and the next settle, a second on, reads it first, so each of N former heads is
    read within ceil(N/8) settles however slow GitHub is for the others. A mark whose change came
    after the last read of such a head stays until each former head has been read since that
    change (`check_states_owed.reads_from`, migration `20261122063706`), and a `test` handoff
    waits for it as for a due mark, so the handoff records no serial over a state at a former head
    that may be from before the change, a pass of a run that has since failed among them; the
    failure backoff of a `read_failed` state follows once every head has been read, and a mark
    after the backoff stays while any state of the issue reads `read_failed`, whichever settle
    published it, until that head is read or leaves the issue's heads.
    The result a former head's run derives counts at that former head alone, never among the
    check's results, so the state published at an open head is computed from the results
    `GET /api/v1/issues/{key}/results` computes it from, and a former head's run never changes it.
    An event at a head names each open pull request at it and each open pull request that was at
    it, whichever is at it now.
    `GET /api/v1/issues/{key}/results` answers as before.
    `TestAFormerHeadOfAnOpenPullRequestKeepsItsStates` writes the events of its two cases to
    `packages/contracts/fixtures/dispatch-events/check-states-after-a-move.json`
    (`UPDATE_GOLDEN=1`), which the Legion daemon's testing move replays.
