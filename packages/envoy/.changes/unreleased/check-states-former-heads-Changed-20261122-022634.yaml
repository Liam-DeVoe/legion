kind: Changed
body: |-
    The check states settler keeps computing and publishing the state of each `before_merge`
    check at each former head of an open pull request, a head the pull request left while it is
    open: a result recorded or retracted there, a change of a check's words or a settled CI run
    there publishes the new state there, with the event naming that head and that pull request, as
    at an open head. Before, a head the pull request left had its rows deleted with no event, so a
    tester's results at the head it tested, recorded after a push moved the pull request on,
    published nothing, and Legion moved the issue on the states from before the push. New table
    `pull_request_former_heads` (migration `20261122042244`) keeps each head an open pull request
    left, written by a trigger on `pull_request_heads` (migration `20261122042245`) in the
    transaction of the write that moved the row, whichever build wrote it, so a head is kept
    whether or not a settle ran while the pull request was there; a close, a merge or a delete of
    the row drops its former heads, and a re-key of a row stored under a repository's old name
    carries them to the canonical name. A former head's rows in `check_states` go once no open pull
    request is or was at it. A check CI proves is read at the former heads after the open heads, in
    a batch of their own under its own 10 s bound, at most eight reads at a time, the head whose
    read started longest ago first (`check_states.ci_read_at`, migration `20261122042853`); a
    former head whose read had not started when that bound ended keeps its published state, with no
    `read_failed`, and the next settle, a second on, reads it first, so each of N former heads is
    read within ceil(N/8) settles however slow GitHub is for the others. A mark whose change came
    after the last read of such a head stays until each former head has been read since that
    change (`check_states_owed.reads_from`, migration `20261122063706`), and a `test` handoff
    waits for it as for a due mark, so the handoff records no serial over a state at a former head
    that may be from before the change, a pass of a run that has since failed among them; the
    failure backoff of a `read_failed` state follows once every head has been read.
    The result a former head's run derives counts at that former head alone, never among the
    check's results, so the state published at an open head is computed from the results
    `GET /api/v1/issues/{key}/results` computes it from, and a former head's run never changes it.
    An event at a head names each open pull request at it and each open pull request that was at
    it, whichever is at it now.
    `GET /api/v1/issues/{key}/results` answers as before.
    `TestAFormerHeadOfAnOpenPullRequestKeepsItsStates` writes the events of its two cases to
    `packages/contracts/fixtures/dispatch-events/check-states-after-a-move.json`
    (`UPDATE_GOLDEN=1`), which the Legion daemon's testing move replays.
