kind: Fixed
body: |-
  `envoy-infra buckets recreate` and `check` can pass their writer proof on GKE Autopilot. The Kubernetes proof read every namespace's pods, blocking on any container named `listener`, an Actions runner's included, and each node's kubelet runtime list through `nodes/proxy`, which Autopilot refuses, so it never passed there. It now takes `--namespace`, repeatable and required with `--kube-context`, an RFC 1123 label (any other value, such as `--all-namespaces`, which kubectl would read as its own flag, is refused with exit 2 before anything runs), and reads only those namespaces through the API, every `--namespace` in every `--kube-context`: the namespace itself first (`kubectl get namespace/<ns>`), so one the API does not hold blocks rather than listing no pods, then its pods (`kubectl get pods --namespace=<ns>`). A container, an init container (a native sidecar among them) or an ephemeral container blocks only when it has not terminated and may write a bucket the run names, read from its configuration: a listener (it sets `ENVOY_MACHINE_ID`, or is named or runs as `listener` or `envoy-listener`) writes `envoy_interests`, `envoy_roles`, `envoy_sessions` and `envoy_known_sessions`, and `envoy_ci_state` when its `ENVOY_WEBHOOKS` names `github` as the listener reads it (each comma-separated entry trimmed of white space), holds a `$(VAR)` reference, or comes from a Secret, a ConfigMap or a field; `envoy-dispatch` writes `envoy_ci_state`; a container whose `envFrom` may set `ENVOY_MACHINE_ID` or `ENVOY_WEBHOOKS` counts as a writer of each bucket that variable could select, so one nothing else names, with a source of no prefix, blocks every bucket. No node's runtime list is read, so a pod deleted with `--force` whose containers still run is a fifth way past the best-effort proof, which the warning now names; `--connz` still sees its open connection.
