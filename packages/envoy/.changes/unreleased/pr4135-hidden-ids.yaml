kind: Added
body: |-
  Every route that takes a credential-request record id or a grant id answers a person a private
  Dispatch project hides the record or grant from exactly as it answers an id nothing has, and
  writes nothing. `POST /v1/credential-requests/{record}/approve` and `/deny` answer such a person
  `404 NOT_FOUND`, where a secret request answered `403 DECIDE_ON_BROKER_PAGE` with its page, or
  `403 JUDGE_DECIDES`, to any person Dispatch relayed; the person is the body's `approver`, and a
  body naming none is a person who sees no private project. `POST /v1/grants/{id}/revoke-by-approver`
  and `POST /v1/operator/grants/{id}/revoke` answer `404 NOT_FOUND` where a person-approved grant
  answered `403 NOT_APPROVER`, and where a grant the model judge approved in anyone's stead was
  ended: a grant is ended only by a person who may see it, and then only by its approver, its
  session's operator, or, for such a judged grant, anyone. The dismissal and the approval page
  read whether the person may see the record from its rows rather than its signed request, so a
  record signed for another broker address answers such a person `404` too, where the dismissal
  answered `500` and the page `503`. While Dispatch cannot say whether the person may see the
  record or grant, the decide routes and both revokes answer `503 PROJECT_ACCESS_UNAVAILABLE`, as
  the dismissal does, and change nothing.
