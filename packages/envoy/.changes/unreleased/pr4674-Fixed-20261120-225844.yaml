kind: Fixed
body: |-
  The account binding starts only once no Dispatch build without it is in the fleet, so two builds
  can serve one database during a rolling update. While a build without the binding is in the
  fleet, from its dashboard publish until its registration is gone and an hour has passed since it
  last arrived, Dispatch checks, records and revokes no account, as that build does, and every
  credential acts as it did before the binding. Each process registers the binding it serves under
  (`server_processes.account_binding` and `dashboard_builds.account_binding`, migration
  `20261120222130_account_binding_fleet`, each a constant default that rewrites no row). A broker
  revocation whose account holds its address again, which a build without the binding let take the
  address back with no settlement, is settled by the revocation pass rather than sent, so the
  holder's broker credentials are not ended.
