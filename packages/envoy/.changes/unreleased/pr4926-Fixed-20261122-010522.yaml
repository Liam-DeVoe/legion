kind: Fixed
body: |-
  A write to a JetStream stream that the server answers `nats: no response from stream` is now
  sent again while the stream exists. Before, a write sent the moment a stream got its leader could
  fail this way after half a second. That is because the server names a leader before the leader
  takes writes. This change covers every key-value bucket write (put, create, update, delete,
  purge) and every stored publish to the notification stream, including the listener's send route
  and Dispatch's publishes. A write to a stream that has been deleted still fails at once. A write
  that keeps getting this answer now fails only when its bound ends: the caller's own context, at
  most 10 seconds for a bucket write, or the publish's bound for a stored publish. It still fails
  with `no response from stream`, and a stored publish that failed this way is not reported as one
  that may have stored the message. A bucket write whose caller gave up on it is not sent again
  after that. The pause between two sends grows from about 50 ms up to 2 seconds.
