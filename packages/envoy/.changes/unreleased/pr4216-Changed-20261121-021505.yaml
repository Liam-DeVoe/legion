kind: Changed
body: |-
  `scripts/database-skips.sh --run PATTERN` passes the pattern to go test and holds the run to the
  expected skips of the tests the pattern selects, as the package's own test binary lists them
  (`-test.list`), rather than to the whole expected-skip table. CI's `envoy-go-race-api` job runs
  the Dispatch API as three legs, one shard of its tests each, and each leg now runs its shard
  through the counter with `--run`, so a skipped test there still fails the leg. A table line
  whose test the binary does not list fails every leg, and a test a report shows run that the
  pattern does not select is no count. No release changes what it ships.
time: 2026-11-21T02:15:05Z
