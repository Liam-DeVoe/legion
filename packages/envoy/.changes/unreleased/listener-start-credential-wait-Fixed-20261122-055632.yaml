kind: Fixed
body: |-
  A listener whose NATS credential the server refuses as it starts waits for the server to admit it,
  for up to 180 seconds, rather than exiting: on 2026-11-22 a session listener started before the
  hub's servers had reloaded its new nkey and exited three times in the 64 s the reload took. A
  refusal of the connect (`nats: authorization violation`, an expired or revoked authorization) or
  of a request of the `ENVOY_NOTIFICATIONS` stream's reconcile (`Permissions Violation for Publish
  to ...`) is tried again after 1 s, each wait doubling up to 10 s, the last cut to end at 180 s
  from the first try, and each refusal is logged at WARN with the wait that follows it. The role
  lane's and the session consumers' connects, which follow the main client's and each end the start
  when they fail, wait out a refusal the same way under the same 180 s, since behind a hub that
  reloads one server at a time one of them can meet a server that has not reloaded after the main
  client got in through one that has; a connect made after the 180 s tries ten times, a second
  apart, as before. A try in progress at 180 s may still succeed, and no try begins after it.
  Meanwhile `/healthz` answers `503` `unhealthy`, its error `nats credential refused: ...` naming
  the last refusal, and `/livez` answers `204`; before the first refusal and once the connect that
  met it has succeeded, `/healthz` answers as before. When the last try begun by 180 s fails, the
  listener exits 1, its last line naming its credential (`nkey user <public key>`) and the last
  refusal. A dial that fails for any other reason still ends the start after ten tries a second
  apart, and a reconcile of the stream that fails for any other reason (`ENVOY_NATS_REPLICAS` above
  1 on a single server, the reconcile's hang guard) still ends it at once; the last line then names
  the step that failed, and names the credential only when a server refused it. An edge listener
  (`ENVOY_EDGE_PROJECTS`) only reads the stream and opens no role lane: its start waits out a
  refusal of the connect, and a grant that refuses that read, the same way, and a stream the server
  does not hold, a read that times out or any other failure of the read ends its start at once.
  Every other program keeps its start as it was (`bus.WithCredentialWait` and `bus.WithStartCheck`
  are the listener's alone).
