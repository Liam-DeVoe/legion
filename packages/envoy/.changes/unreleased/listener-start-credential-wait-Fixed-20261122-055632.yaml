kind: Fixed
body: |-
  A listener whose NATS credential the server refuses as it starts waits for the server to admit it,
  for up to 180 seconds, rather than exiting: on 2026-11-22 a session listener started before the
  hub's servers had reloaded its new nkey and exited three times in the 64 s the reload took. A
  refusal of the connect (`nats: authorization violation`, an expired or revoked authorization) or
  of a request of the `ENVOY_NOTIFICATIONS` stream's reconcile (`Permissions Violation for Publish
  to ...`) is tried again after 1 s, each wait doubling up to 10 s, the last cut to end at 180 s
  from the first try, and each refusal is logged at WARN with the wait that follows it. A try in
  progress at 180 s may still succeed, and no try begins after it. Meanwhile `/healthz` answers
  `503` `unhealthy`, its error `nats credential refused: ...` naming the last refusal, and `/livez`
  answers `204`; before the first refusal and once the start has succeeded, `/healthz` answers as
  before. When the last try begun by 180 s fails, the listener exits 1, its last line naming its
  credential (`nkey user <public key>`) and the last refusal. Any other failure still ends the start
  after ten tries a second apart. An edge listener (`ENVOY_EDGE_PROJECTS`) waits out a refusal of
  the connect the same way; it only reads the stream, and a grant that refuses that read ends its
  start at once. Every other program keeps its start as it was (`bus.WithCredentialWait` is the
  listener's alone).
