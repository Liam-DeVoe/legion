kind: Fixed
body: |-
  At shutdown, an intake whose hand-back was still pending at its stop's deadline keeps the
  delivery durable's hold until a flush of its NATS connection confirms that the hand-back reached
  the server. Only a flush of the connection that the hand-back went out on counts. The shutdown
  waits up to 5 s from the stop's deadline for that flush before it closes the intake's client.
  When that connection closes first, the hold is not released: it stops renewing,
  and the standby takes the durable over when the hold expires, at most 17 s later. Before, the
  close of the client counted as a confirmation and the hold was released at once. A hand-back that
  the close had written to the socket could then reach the durable that the standby had created
  again, and that message was delivered a second time.
