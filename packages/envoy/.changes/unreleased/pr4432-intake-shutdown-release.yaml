kind: Fixed
body: |-
  Each intake's NATS client now gives a write 5 s, not nats.go's default of a minute. At shutdown
  the close of the client waits for the connection's lock, and the release of a pending
  hand-back's hold waits for that close: a write to a frozen link now holds the close at most 5 s,
  not a minute. A reconnect attempt through a frozen link holds the lock too, for up to 5 s for its
  dial and 5 s for its handshake.
