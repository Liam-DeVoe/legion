kind: Changed
body: |-
  `ListenerPermissions` and `ListenerHostPermissions` gain the selection bucket's reads and key writes, and no create or update of its stream (`natsgrant.KVWriteExisting("envoy_session_consumers")`). Upgrading a hub with a `listener` or a `listenerMachineId` user replaces its VM once. `natsgrant.Measure()` gains the leader read of a session's record, `$JS.API.STREAM.MSG.GET.KV_envoy_session_consumers`. `host:Listener` gains the input `hostUser` (default false): only a listener whose NATS user is a host-kind entry, the user its host's sessions share, sets it, and only then does it render `ENVOY_LISTENER_ROLE=host`, so such a container's environment changes once. Unset, a listener renders no role and reads the cutover marker; a read its grant refuses is no marker.
