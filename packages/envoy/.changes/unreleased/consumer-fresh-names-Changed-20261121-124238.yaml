kind: Changed
body: |-
  `ListenerPermissions` and `ListenerHostPermissions` gain the selection bucket's leader read and key writes, and no create or update of its stream (`natsgrant.KVRecordStore("envoy_session_consumers")`: `$JS.API.STREAM.MSG.GET.KV_envoy_session_consumers` and `$KV.envoy_session_consumers.>`). Upgrading a hub with a `listener` or a `listenerMachineId` user replaces its VM once. `natsgrant.Measure()` gains the leader read of a session's record, `$JS.API.STREAM.MSG.GET.KV_envoy_session_consumers`. `host:Listener` gains the input `hostUser` (default false): only a listener whose NATS user is a host-kind entry, the user its host's sessions share, sets it, and only then does it render `ENVOY_LISTENER_ROLE=host`, so such a container's environment changes once. Unset, a listener renders no role and reads the cutover marker; a read its grant refuses is no marker.
  `natsgrant.Edge` and `EdgePermissions` gain the same leader read, and write only a session's record and the edge's own durable's (`$KV.envoy_session_consumers.*` and `$KV.envoy_session_consumers.durable.listener-<machine id>`): never the bucket's sentinel or another listener's durable record. A hub user for an edge listener that copies `natsgrant/testdata/edge.golden.json` needs all three before an edge listener runs `ENVOY_CONSUMER_NAMES=fresh`; an edge listener's sweep leaves ending replay mode to the shared listeners.
