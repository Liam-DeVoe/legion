kind: Added
body: |-
  The NATS auth service passes the connection's own name to a Legion daemon's grant held to its
  projects (`natsgrant.Scope.Connection`, read from the CONNECT). Take a connection named
  `legion-go-<project>-<kind>/<generation>`, for a project the scope holds, a kind of the
  daemon's consumers and a 22-character generation (`natsgrant.DaemonGenerationConnection`). It
  is granted that one fresh consumer, `legion-go-<project>-<kind>~<generation>`: its create on
  its kind's filter, its info, its pull and its acknowledgements. Any other connection name
  adds nothing to the held grant.
