kind: Added
body: |-
  `GET /v1/private-projects` answers the shared session watch every project the broker counts
  private, sorted and each key once: each project Dispatch answers private, read with the
  broker's own token from `BROKER_PROJECT_ACCESS_URL` and kept 30 seconds. Only the new caller
  name `session-watch` reaches it, which a deployment gives the watch's ServiceAccount with a
  `BROKER_API_ACCOUNTS` entry (`session-watch=system:serviceaccount:<namespace>:<name>`);
  `dispatch`, `listener` and `access-review` are refused `403 ACCOUNT_LACKS_POWER`, and
  `session-watch` reaches no other route. While Dispatch cannot answer, the route answers the last
  list Dispatch gave for at most 5 minutes after Dispatch can have given it; past that, and on a
  broker with no `BROKER_PROJECT_ACCESS_URL`, it answers `503 PRIVATE_LIST_UNKNOWN`, naming the
  kind of failure and never a shorter list. A Dispatch answer that is any status but 200, a 404
  included, or a 200 with no `projects` list counts as Dispatch not answering.
