kind: Added
body: |-
  The secrets broker mints a token that writes only the results of one project, for one CI run. `BROKER_EXCHANGE_RESULT_WORKFLOWS` lists result entries, `<repository>=<workflow path>=<ref pattern>=<project>=<person>`, where `*` in the pattern is one segment of a ref. A run of that workflow on a matching ref exchanges its GitHub token for one that holds the OAuth scope `results` alone and the project scope `results`, names the person, the project and the session `ci-results:<repository>/<workflow path>`, and carries the run as its `ci` claim: repository, workflow, ref, commit, event, run, attempt, runner and the check run of its job. The broker refuses a run token that lacks a claim of the run, a ref that two patterns match, and a bad pattern at start-up.

  The shared broker-token verifier accepts such a token only where its service asks for it (`brokertoken.Options.ServesResults`), and marks its caller results-only with the run. A verifier of an older build refuses the token, and the Envoy listener answers it `401`.
