kind: Added
body: |-
  `gcp:Dispatch` takes `natsAudience` and `listenerAudience`, each unset by default, and a
  deployment that sets neither renders exactly as before. With `natsAudience` the app and its
  listener connect to NATS through the auth service by a projected token of their ServiceAccount
  for that audience: the component mounts, classes and grants no seed, and refuses
  `natsSeedSecret` beside it. On an app that rolls (more than one replica) with `natsInCluster`,
  `envoy-dispatch`'s start then waits for its first NATS connect, so a refused NATS credential
  stalls the rollout while the old pods serve; elsewhere it shows as `"nats":false` on `/healthz`.
  With `listenerAudience` the app calls its listener with its own
  projected token, which the listener verifies against the cluster's issuer, and no shared bearer,
  Secret or generated password exists.
  `envoy-dispatch` takes `ENVOY_ACCOUNT_TOKEN_FILE`, the file holding its own projected
  ServiceAccount token, which every listener call presents, read at call time and never at boot;
  set beside `ENVOY_TOKEN`, it refuses to start, naming both.
