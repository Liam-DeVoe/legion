kind: Added
body: |-
  `POST /api/v1/issues/{key}/results` takes a CI job's result of the check whose `ci_check` names the job's check run, under the job's results token: the body is `{check, commit, verdict, observed}` alone, and the commit must be the run's, the run a push of a branch, the check run GitHub's at that commit and the run's repository the issue's. The result is stored with role `ci`, the run's session as its actor and no person, `branch` (the branch the run pushed), `observed` kept as the project's results route keeps it (2,000 characters), and `attestation`, the in-toto statement of its run, built by the builder of the project's results route. A role's result for such a check stays `409 CHECK_PROVED_BY_CI`, and the fourth `ci_check` rule counts only a role's result. A `before_merge` check is also compared with the head of each branch that a CI job's result on its issue names (`branch_head`), so the job's pass stands at that head with no pull request. Two migrations add the nullable columns `check_results.branch` and `check_results.attestation`.
