kind: Added
body: |-
  `POST /api/v1/issues/{key}/results` takes a CI job's result of the check whose `ci_check` names the job's check run, under the job's results token: the body is `{check, commit, verdict, observed}` alone, and the commit must be the run's, the run a push of a branch, the check run GitHub's at that commit, the run's repository the issue's, and the branch it pushed one of the issue's (`403 BRANCH_NOT_THE_ISSUES` otherwise): the head branch of one of its pull requests, or a branch whose name gives it to the issue as Dispatch attributes a pull request by its branch. The result is stored with role `ci`, the run's session as its actor and no person, `branch`, `observed` kept as the project's results route keeps it (2,000 characters), and `attestation`, the in-toto statement of its run, built by the builder of the project's results route. A role's result for such a check stays `409 CHECK_PROVED_BY_CI`.
  A CI job's result is a row of the new table `ci_check_results` (migration `20261116213930`), and `check_results` holds what a role recorded, as before: a release before this one reads no row of the new table, so a job's result changes no check block under it, during a rolling deploy or after a rollback. Nobody retracts a CI job's result: `POST /api/v1/results/{id}/retract` answers its id `403 RETRACTION_FORBIDDEN` for every caller, the claim holder and a person among them.
  The kind of a check is its block's alone: the fourth `ci_check` rule, that no result a role recorded stands against the check, is removed, so a row an older build took while it served beside this one changes nothing about the check. A role's result of a check CI proves carries `not_counted` and counts for nothing, and a document write that gives `ci_check` to a check holding a role's result is stored.
  A `before_merge` check's pass must stand at each of its subjects: the head of each open pull request of its issue, or where none is open, the newest merged pull request's final head and the head of each branch of the issue that a CI job's result names, so the job's pass stands at that head with no pull request, and a fail at one head is never hidden by a pass at another. A merged pull request's head stays in `compared_with` beside an open one, and is no subject. `pass_stands` gains `subjects`, the state of each, and `reason`. On a check CI proves, a pass and a fail of CI at one commit read unknown in either order (R7), whether its CI job recorded both or one is the result derived from its check run; a role's results keep the rule they had.
  Each new fact is in a field of its own, so a `dispatch` released before it reads every field it knows as it means it: the branch heads are in `branch_heads`, a result at one names it in `at_branch_head`, and a check CI proves holds its derived result alone in `results` and every recorded result in `recorded_results`.
  The Verification tab shows `It counts for nothing: <reason>` in a result that carries `not_counted`.
