kind: Fixed
body: |-
  `agent-secrets` on Linux: a gcloud call still running when the command is killed by SIGKILL
  (the out-of-memory killer, `kill -9`, a harness's timeout) now ends with the command. gcloud
  runs in a process group of its own, which the command kills itself at a call's deadline or on a
  signal it handles; a SIGKILL runs none of its code, so gcloud ran on until it ended by itself.
  gcloud now starts with SIGKILL as its parent-death signal. It reaches gcloud's own process,
  which gcloud's script replaces with its Python; on macOS and other platforms nothing changes.
