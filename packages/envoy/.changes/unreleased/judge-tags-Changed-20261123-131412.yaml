kind: Changed
body: |-
    A key's model judge is a setting of the key itself: its `judge` tag, whole seconds from 1 to 900, makes it a key the judge decides for at most that long, and its `guidance` tag is the instruction the judge decides it on. A profile is decided by its source's tags. A `judge` tag that is not digits naming 1 to 900 seconds refuses the key at each policy load (`judge-out-of-range`, naming the key), and a `guidance` tag longer than 2000 characters refuses it too (`guidance-too-long`). The `judge` tag is in the policy version, so adding, lowering or removing it checks each live judged grant of the key again at its next release; `guidance` ends no grant.
    `agent-secrets secret create` and `retag` take `--judge SECONDS` and `--guidance TEXT`, and `retag` takes `none` for each; a value the broker would refuse is refused before anything is written.
    A profiles file whose `proxy` block sets `judge` or `guidance` is refused at boot and by `envoy-broker profiles check`, naming the tag to write instead; `profiles check --against` still reads an old file that sets them. A profile's fingerprint is unchanged by the fields' removal, so taking them out of the file ends no grant. Tag the keys and take the two fields out of the profiles file before rolling this release out; a broker rolled back past it reads the judge from the profiles file again and ignores the tags.
