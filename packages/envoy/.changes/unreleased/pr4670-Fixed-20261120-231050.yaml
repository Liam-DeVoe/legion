kind: Fixed
body: |-
  Meaning search keeps each project's vectors in an index of their own and reads only the projects its caller sees, so content of a project the caller cannot see no longer takes the caller's own matches out of the answer.
  `embeddings` is now partitioned by project. A migration builds the new table beside the old one; the boot's embeddings fill copies the stored rows in the background (71 to 82 minutes for a million rows on a production-size bench) and swaps the tables when it is done, holding them for about a third of a second (247 to 341 ms on the bench), and search reads the old table until then. The copy needs free disk for a second copy of `embeddings` and its indexes.
  A project gets its partition in the transaction that creates it, however it is written and whenever the swap commits, and a row of a project that does not exist is refused.
  A full member's search reads one index per project, each walk gathering 20 vectors before it answers (`hnsw.ef_search`, 400 before): on the bench a full member's meaning search answered at p50 1,491 and 1,482 ms against 1,471 and 1,458 ms before, and its recall@20 against an exact scan rose from 0.960 and 0.949 to 0.988 and 0.993.
  The pre-deploy census now measures a partitioned table by its partitions.
