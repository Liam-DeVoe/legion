kind: Fixed
body: Meaning search keeps each project's vectors in an index of their own and reads only the projects its caller sees, so content of a project the caller cannot see no longer takes the caller's own matches out of the answer. `embeddings` is now partitioned by project. A migration builds the new table beside the old one; the boot's embeddings fill copies the stored rows in the background (71 minutes for a million rows on a production-size bench) and swaps the tables when it is done, holding them for about a quarter of a second (247 ms on the bench), and search reads the old table until then. The copy needs free disk for a second copy of `embeddings` and its indexes. A project gets its partition in the transaction that creates it, however it is written, and a row of a project that does not exist is refused. A member who sees every project now waits about 10 ms more per project for a meaning search, one index search per project in each of the two arms that search an index. The pre-deploy census now measures a partitioned table by its partitions.
