kind: Added
body: |-
  A hub's own listener connects through the NATS auth service by its service identity: `gcp:NatsHub`'s `listener` and `gcp:ClusteredNatsHub`'s `tailnet.listener` take `natsAudience`, required with `authCallout` and refused without it, and present the VM's Google identity token or a projected token of the listener's own ServiceAccount for it.
  A hub's listener is no longer refused beside `authCallout`; behind it the hub renders no user for the listener, fetches or mounts no seed for it, and refuses the listener's `nkey` and seed inputs.
  Every value a VM hub's listener unit passes the container (its URLs and audiences) is quoted and escaped for systemd when it holds `%`, `$`, a quote or a backslash, so percent-encoded URLs reach the listener unchanged; before, a `%2F` in `listener.agentSecretsUrl` or `listener.agentSecretsAudience` made systemd refuse to load the unit.
  `core.ListenerConfig` takes `ServiceTokenFile`, `ServiceGoogleAudience` and `PrivateProjects`; both hubs, `host:Listener` and `aws:WebhookListener` take `privateProjects`, and `envoy-infra render webhook-listener-env` takes `--private-projects`, each rendering `ENVOY_PRIVATE_PROJECTS=1` only when it is set, so a deployment that sets none renders exactly as before.
