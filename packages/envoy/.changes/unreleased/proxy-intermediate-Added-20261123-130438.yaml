kind: Added
body: |-
    The broker's proxy signs each bound host's leaf with an intermediate of its own pod. With `BROKER_PROXY_CA_POOL` naming a pool of Google Certificate Authority Service, each pod makes an ECDSA P-256 key in memory, sends the pool a certificate request for a 7-day authority of path length 0 constrained to the names of the profiles file's hosts, with its own Google credential, asks for the next with 2 days left, and retries with a backoff of 1 second doubling to 5 minutes. It logs `proxy intermediate` (serial, names, start and end) for each one it takes and `proxy intermediate request failed` for each failure, an answer it refuses included: one for another key, one that reaches no root or another root than its first, and one that would sign no trusted leaf for a bound host. A pod that holds no certificate it may sign with answers `GET /healthz` with `503 NO_INTERMEDIATE`.
    `BROKER_AIRLOCK_CA_CERT_FILE` may now hold an intermediate and then each authority up to its root, as well as a self-signed root alone, and is not read with the pool set. The broker refuses at start a chain that reaches no root, one that would sign no trusted leaf for a bound host, and one whose life is over. A leaf lasts 25 hours from its start to its end, and never past the certificate that signed it; the TLS answer carries the leaf and every authority up to the root. Every release carries the root of the chain and each root of the new `BROKER_PROXY_RELEASE_ROOTS_FILE`, so a rollout hands out two roots at once.
    For the local stack alone, and refused in a cluster and on a production start: `BROKER_PROXY_TEST_CA_URL`, `BROKER_PROXY_TEST_CLOCK_OFFSET_FILE` and `BROKER_PROXY_TEST_RENEWAL_MARGIN`. `dev-airlock.sh` takes each broker's intermediate from the new `ca` stand of `cmd/dev-proxy-stands`, exports `AIRLOCK_CA_CERT_FILE` as a file of both of the stack's roots and `PROXY_ROOT_FILE` as the proxy's alone, and no longer exports `AIRLOCK_CA_KEY_FILE`; `scripts/proxy-chain-check.sh` runs the chain's checks on that stack.
