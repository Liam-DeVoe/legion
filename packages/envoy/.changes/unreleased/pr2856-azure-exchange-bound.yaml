kind: Fixed
body: |-
  An `azure` grant behind the airlock reaches only the application and the tenant its own
  azure-login secret names. The proxy now refuses a token request whose `client_id` is not the
  secret's `client_id`, or whose token endpoint is not the secret's `tenant_id`'s, with a 403
  naming the entry and the field and neither value, before the broker's federated token goes
  into the exchange, so nothing reaches the token endpoint. An access token a broker pod
  exchanges for itself is held to the same two ids. Before, the exchange was made as whatever
  application and tenant the command named, so a holder of one azure grant could ask for a token
  as any application that trusts the broker's federated identity. `scope` stays the command's
  own, since one application asks for tokens of several resources.
