kind: Added
body: Every issue, document, ask, message, comment and document block now names the project it belongs to, or, for something no project owns, the people and sessions it is between; `envoy-dispatch backfill-graph-store` fills this in for older rows, and `envoy-dispatch census --store` reports any row still missing it. During an upgrade or a rollback, the older release can leave a removed document's node behind with no document; the census reports it as `orphaned`, and `envoy-dispatch erase --node artifact:<ref_key>` removes it. Cached backfill batches recheck comment markers under their owners and distinguish replacement documents by UUID, so they cannot restore erased comments or describe a removed document as its replacement.
