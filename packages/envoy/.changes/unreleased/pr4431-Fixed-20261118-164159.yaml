kind: Fixed
body: |-
  A send, a topic publish or a role send repeated under the same `idempotency_key` (or any repeat whose dedupe key names its event, and on the role route any key) is now answered with the copy the stream holds: its `event_id`, `issued_at` and body are the first copy's, with `duplicate: true`, where the listener answered the new envelope it built for the repeat, whose `event_id` no stored message carries. `POST /v1/messages/publish` now carries `duplicate` on a topic publish and on a role send's `200`, whose stored forward is answered with the forward mark taken off its `dedupe_key`. A verdict that names the request's own first send, which the bus's resend after a closed connection can, is answered as a new copy, with no `duplicate`.
  The listener reads the copy back at the sequence the stream's duplicate verdict named; a copy it cannot read, a verdict with sequence 0, a sequence that no longer holds the copy, and a publish refused while an earlier one under the same message id is in process are answered `503` with `Retry-After: 1` and the body `envoy: the stream answered this message as a duplicate, and its stored copy could not be read: <reason>`, recorded with the outcome `stored_copy_unreadable`, and the same request again gets the copy once it can be read. Every answer's `expects_reply` is the answered envelope's, in the request's spelling where the two agree, the role send's `202` kept answer included.
