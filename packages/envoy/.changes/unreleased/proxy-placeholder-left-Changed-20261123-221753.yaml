kind: Changed
body: 'A request on a connection the broker''s proxy reads that still carries a whole placeholder after the swap is now refused `403 PLACEHOLDER_NOT_SWAPPED`, and nothing of it is sent to the service; main forwarded each of these unswapped. That covers an ended grant''s placeholder, including the old placeholder of a renewed grant of the same name as the connection''s own, another session''s, a second grant''s beside the one the request is handled for, and the connection''s own grant''s outside the headers its entry names: in another header (inside a Basic credential too, its base64 padded or not), the path or the query (as written, and unescaped with an escape that is no escape kept as written, so every pair of it is read). A whole placeholder is the prefix `agent-secrets-placeholder-` and 32 letters and digits; the prefix with fewer after it is not refused. The refusal line names the grant the placeholder was minted for, in `placeholder_grant`, while the broker still holds it. The body is not read, so a placeholder there is carried as the command wrote it.'
