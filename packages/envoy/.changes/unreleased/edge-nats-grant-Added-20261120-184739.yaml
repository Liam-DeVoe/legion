kind: Added
body: |-
  `natsgrant.Edge` and `core.EdgePermissions` are the NATS grant of an edge listener's own user:
  the listener's grant, publishing only the agent, role and `notifications.envoy.` subjects and no
  create or update of the stream, and subscribing its own inbox prefix `_INBOX_envoy_edge.>`, the
  relay subjects and the relay receipts `notifications.envoy.relayreply.>`, and no role lane.
  `natsgrant/testdata/edge.golden.json` pins it. The NATS auth service answers an `edge-listener`
  entry of `BROKER_NATS_SERVICES` with it. A listener started with `ENVOY_EDGE_PROJECTS` names
  every inbox under that prefix, reads the stream and ends its start, naming it, when the server
  has none, subscribes no role lane and publishes no Legion wake report.
