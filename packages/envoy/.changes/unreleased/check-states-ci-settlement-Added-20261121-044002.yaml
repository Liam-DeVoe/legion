kind: Added
body: |-
    A settled CI run moves the published state of the check CI proves. The delivery intake now
    takes the listener's `notifications.github.<owner>.<repo>.pr.<n>.checks` settlement, keyed as
    the pull request's own envelopes are, so it runs after them. It reads the issue of the pull
    request's open head under the repository's canonical name and marks that issue's check states
    owed with `check_states_owe`, in a statement of its own, whose commit starts the check states
    settler; a pull request that is not open, or that no issue holds, marks nothing. No table
    stores a CI run, so nothing else marks the issue when a run concludes: a settlement whose mark
    could not be written is handed back to NATS on the path a pull request whose head row was not
    stored takes, after 10 s and for at most 30 deliveries, and acknowledged with an error at the
    last. That path's bounds are renamed `delivery.ownHandBackAfter` and
    `delivery.ownHandBackMaxDeliveries`, since they now bound both.
time: 2026-11-21T04:40:02Z
