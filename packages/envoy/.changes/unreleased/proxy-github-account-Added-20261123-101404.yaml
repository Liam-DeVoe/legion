kind: Added
body: |-
    The broker's proxy swaps the placeholder of every live grant of a session's enrollment on one connection, and reads a host any of those grants binds. A command can hold the placeholders of several grants of its session - a Legion role's own GitHub grant beside the grant an `agent-secrets` run inside the role asked for, or a mail client's write grant beside the read grant whose run it is - and its proxy password names one of them. A `CONNECT` or a plain-HTTP request to a host that only another live grant of the password's enrollment binds is now read (or refused in the clear) rather than tunnelled. A request is handled for the password's own grant when it carries one of that grant's placeholders, and otherwise for the first other live grant of the enrollment, in grant id order, that binds the host and whose placeholder it carries. A request still gets one (name, slot) of one grant. A call carried for another grant is held to that grant as well: it ends within the watch interval once that grant ends. The enrollment's other grants are read only where they can change the answer: a host the password's grant does not bind, or a request whose headers hold a placeholder that the password's grant does not take. And only the grants that hold a name whose entry binds the host are read and checked, so a grant that can bind nothing there - whose project check may need Dispatch - never decides the call. A tunnel to a host no entry binds, and a request of the password's grant whose headers hold no placeholder, read nothing more. Where the read is made and does not happen, the call is `503`, as a failed grant read is.

    A GitHub call gets the installation token of the account its path names, when the grant holds that account: `/repos/{owner}/...`, `/orgs/{owner}` and `/users/{owner}` on an API host, and git's `/{owner}/{repo}` on `github.com`, the account compared without regard to case. A path that names no account, such as GraphQL, search or `/user`, or one the grant holds no installation on, gets the token of the account whose placeholder the request carries, as before. The call's log line names the slot whose token went out.
