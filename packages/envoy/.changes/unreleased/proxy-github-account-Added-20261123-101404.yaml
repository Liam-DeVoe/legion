kind: Added
body: |-
    The broker's proxy swaps the placeholder of every live grant of a session's enrollment on one connection, and reads a host any of those grants binds. A command can hold the placeholders of several grants of its session - a Legion role's own GitHub grant beside the grant an `agent-secrets` run inside the role asked for, or mailbox's send and write grants beside the read grant whose run it is - and its proxy password names one of them. A `CONNECT` or a plain-HTTP request to a host that only another live grant of the password's enrollment binds is now read (or refused in the clear) rather than tunnelled, and a request that carries none of the password's own placeholders is handled for the first live grant of the enrollment, in grant id order, whose placeholder it carries. A request still gets one (name, slot) of one grant; one that carries placeholders of two grants is handled for the password's own. A call carried for another grant is held to that grant as well: it ends within the watch interval once that grant ends. A read of the enrollment's grants that does not happen is `503`, as a failed grant read is.

    A GitHub call gets the installation token of the account its path names, when the grant holds that account: `/repos/{owner}/...`, `/orgs/{owner}` and `/users/{owner}` on an API host, and git's `/{owner}/{repo}` on `github.com`, the account compared without regard to case. A path that names no account, such as GraphQL, search or `/user`, or one the grant holds no installation on, gets the token of the account whose placeholder the request carries, as before. The call's log line names the slot whose token went out.
