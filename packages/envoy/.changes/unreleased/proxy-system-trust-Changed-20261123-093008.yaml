kind: Changed
body: |-
    `agent-secrets` sets no trust variable and writes no trust bundle for a command whose grant holds a name behind the broker's proxy when the machine's system trust bundle already trusts every root the proxy's release carries. The command keeps `SSL_CERT_FILE`, `CURL_CA_BUNDLE`, `REQUESTS_CA_BUNDLE`, `NODE_EXTRA_CA_CERTS`, `GIT_SSL_CAINFO`, `CLOUDSDK_CORE_CUSTOM_CA_CERTS_FILE`, `AWS_CA_BUNDLE`, `GRPC_DEFAULT_SSL_ROOTS_FILE_PATH` and `WGETRC` as it has them, and nothing is written under the runtime directory. The system trust bundle is the first of the usual files that exists (`/etc/ssl/certs/ca-certificates.crt` on Debian), read with no variable: git and wget built on GnuTLS, as Debian's are, read that file and neither `SSL_CERT_FILE` nor `SSL_CERT_DIR`, so a root that only the command's own `SSL_CERT_FILE` or `SSL_CERT_DIR` names still gets the bundle.
    The bundle is written as before when the store lacks any root of the release (while the proxy's root changes, a release carries two roots, and a store that holds one of them still gets the bundle), when the release carries no root that parses, and when a trust variable the command already has names a file that lacks a root or cannot be read. `NODE_EXTRA_CA_CERTS` is the exception: Node adds its file to the roots it has, so a file without the root takes nothing away. The bundle is also written when the directories the command's `SSL_CERT_DIR` names, read together, lack a root: Node's system store (`NODE_USE_SYSTEM_CA=1`) reads that directory list in place of the system's directory, with no system bundle file beside it. The same holds for the wgetrc that `WGETRC` names: the bundle is written when it cannot be read, or when its last `ca_directory`, which wget reads in place of the system store, lacks a root; a `ca_certificate` there only adds to wget's trust.
