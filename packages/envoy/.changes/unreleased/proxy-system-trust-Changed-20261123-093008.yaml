kind: Changed
body: |-
    `agent-secrets` sets no trust variable and writes no trust bundle for a command whose grant holds a name behind the broker's proxy when the machine's system trust bundle already trusts every root the proxy's release carries and the command's environment shows that each client family reads that store: `SSL_CERT_FILE`, `CURL_CA_BUNDLE`, `REQUESTS_CA_BUNDLE`, `CLOUDSDK_CORE_CUSTOM_CA_CERTS_FILE`, `AWS_CA_BUNDLE` and `GRPC_DEFAULT_SSL_ROOTS_FILE_PATH` each name a file that holds every root, `NODE_USE_SYSTEM_CA=1` is set (or `NODE_EXTRA_CA_CERTS` names a file that holds every root), and `UV_SYSTEM_CERTS` is on. Those are the eight settings a pod image or a launcher session sets for Node, Python `requests` and httpx, uv, the AWS CLI, gcloud and gRPC's C core, which read their own roots otherwise. The command then keeps its trust variables and `WGETRC` as it has them, and nothing is written under the runtime directory. The system trust bundle is the first of the usual files that exists (`/etc/ssl/certs/ca-certificates.crt` on Debian), read with no variable: git and wget built on GnuTLS, as Debian's are, read that file and neither `SSL_CERT_FILE` nor `SSL_CERT_DIR`.
    Every other command gets the bundle as before: one that lacks one of the eight settings (a shell started before they were set, a runtime that passes on only some variables, a `systemd-run` unit), one whose store lacks any root of the release (while the proxy's root changes, a release carries two roots, and a store that holds one of them still gets the bundle), one whose release carries no root that parses, and one with a trust variable naming a file that lacks a root or cannot be read, other than a `NODE_EXTRA_CA_CERTS` beside `NODE_USE_SYSTEM_CA=1`, which Node adds to the store. So does any command with an `SSL_CERT_DIR`, even an empty one, whatever its directories hold: Node's system store, uv and httpx read it in place of the system's directory, and read it differently (Node v24 takes the whole value as one path and an empty value as set; httpx finds a root only under its hash link). So does one whose wget startup files leave wget without a root: wget reads the system wgetrc (the file `SYSTEM_WGETRC` names, else `/etc/wgetrc`) and then the file `WGETRC` names, or `$HOME/.wgetrc` when `WGETRC` is unset or empty; the last `ca_directory` across them, which wget reads in place of the system store, must hold every root and not be empty, and a `ca_certificate` there only adds to wget's trust. That `ca_directory` is read for its regular files alone, each up to 1 MiB, and one of more than 4096 entries gets the bundle; a named pipe or a device there, or named by a trust variable or `WGETRC`, is not opened, so it cannot stall `agent-secrets`.
