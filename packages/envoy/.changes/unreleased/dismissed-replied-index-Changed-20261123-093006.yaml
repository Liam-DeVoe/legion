kind: Changed
body: |-
  A new partial index, user_threads_dismissed_replied, holds only the dismissed threads the
  Dismissed view lists (a reply from somebody else, `replied_at`, beside the dismissal), so a
  Dismissed page no longer walks the rows of a person's own writes that nobody answered. It is
  built concurrently; user_threads_dismissed stays for the release before.
