kind: Fixed
custom:
  Issue: pr4342
body: |-
  At shutdown the listener's role lane keeps the messages it holds only after its own connection
  has drained, so the handler's keeps of the messages its subscription still holds go first: a
  listener holding its 4,096-message bound kept those first and lost the buffered ones. A forward
  to a role's live holder that the stream refuses for the message itself (too large, or a sealed
  stream) is answered 409, recorded `stream_refused`, instead of being retried to the 504 that has
  a sender send it again for as long as the stream's answer stands. A publish to a role with no
  live holder whose keep the stream refuses that way still gets the no-holder 404.
