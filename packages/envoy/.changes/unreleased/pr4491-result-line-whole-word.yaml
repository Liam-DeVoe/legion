kind: Fixed
body: |-
  The pull-request body line of a result, recorded or derived from a CI run, keeps a first word longer than 80 characters whole, with what leads into it, such as a backtick, a bracket or a quote, and with `…` only where more of the reading follows it, where it used to cut that word at the 80th character, and it keeps a word that ends at the 80th character, which it used to leave out. The line cuts at the word boundaries of Unicode's default word rules (UAX #29, Unicode 17.0.0): text in a script written without spaces between its words, such as Chinese, Japanese or Thai, a run of emoji or symbols, and a path are still cut inside the 80 characters with `…`, now beside a character, an emoji, a symbol or a punctuation mark such as a slash, and never between a letter and its marks, between the two halves of a flag, or inside a joined emoji sequence. A URL is never cut: the line keeps it whole, with a space before a `…` after it so that the link still leads to its address, or ends before it.
