kind: Fixed
body: |-
  A pull-request body line of a result, after its public-line filter drops links and unsafe words, keeps a first word longer than 80 characters whole with what leads into it, such as a backtick, a bracket or a quote, where it used to cut that word at the 80th character, and it keeps a word that ends at the 80th character, which it used to leave out. The line cuts at the word boundaries of Unicode's default word rules (UAX #29, Unicode 17.0.0): text in a script written without spaces between its words, such as Chinese, Japanese or Thai, a run of emoji or symbols, and a path are still cut inside the 80 characters with `…`, now beside a character, an emoji, a symbol or a punctuation mark such as a slash, and never between a letter and its marks, between the two halves of a flag, or inside a joined emoji sequence. A scheme URL is one word to the cutter, so any other caller keeps it whole or ends before it; public body lines already drop the URL before that cutter runs.
