kind: Added
body: |-
  The secrets broker's airlock proxy can send the allowed requests of one bound host to an address inside the broker's own cluster: `BROKER_AIRLOCK_PRIVATE_UPSTREAM`, one `<host>=<url>` entry such as `dispatch.example-tailnet.ts.net=http://dispatch.dispatch.svc.cluster.local:8766`. Each such request goes to the URL's scheme and host on a transport of its own, keeps the host as its `Host` header, and, under a `dpop` entry, carries a proof for `https://` and the host.

  The proxy dials the URL's host only when every address it resolves to is one the proxy refuses to every other request - private, `100.64.0.0/10` or inside `BROKER_AIRLOCK_CLUSTER_RANGES` - and none is loopback, link-local, unspecified or multicast; otherwise the CONNECT to the host is refused `403 ADDRESS_REFUSED` and nothing is dialled. A tunnel or a plain-HTTP request to those addresses, and a CONNECT to the host under a grant whose names do not bind it, are refused as before.

  The broker refuses to start, naming the setting and the fault, on more than one entry, on the setting without `BROKER_AIRLOCK_RULES_FILE`, on a host that is not one lower-case host name, on a URL that is not `http` or `https`, names no host, or carries a user, a path other than `/` or a query, and unless the rules entry `DISPATCH_RESULTS_TOKEN` binds the host, exactly and alone, of kind `dpop`, with a non-empty allow list, carried in `Authorization` alone.
