kind: Changed
body: 'Every Envoy NATS client (envoy-dispatch, envoy-listener, envoy-mcp, natstail, the auth service and `redeliver-webhooks`) now refuses at start a NATS server list that names no server, or holds an entry that is blank, names no host (`nats://`, `nats://:4222`) or names the unspecified address (`nats://0.0.0.0:4222`, `nats://[::]:4222`), naming the problem (`bus: refusing a NATS server list that names no server`), with or without `ENVOY_ALLOW_REMOTE_NATS=1`. Before, such a client reached a server on this machine in its place (`nats://127.0.0.1:4222` for an empty list), so a process with no `natsUrls` in `envoy.json` and no `NATS_URLS`, or with such an entry under `ENVOY_ALLOW_REMOTE_NATS=1`, presented its credential to whatever server listened on that port. envoy-dispatch with `DISPATCH_NATS_DISABLED=1` makes no NATS client and is unchanged.'
time: 2026-11-21T08:25:55.991759324Z
