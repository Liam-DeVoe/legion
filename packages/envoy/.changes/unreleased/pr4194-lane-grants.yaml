kind: Changed
body: |-
  envoy-infra: only Dispatch's NATS user may publish Dispatch's lane (`notifications.dispatch.>`),
  and only the user of the listener that receives GitHub's webhook may publish GitHub's lane
  (`notifications.github.>`). A hub user with `listenerMachineId` takes the new input
  `githubWebhook: true` to get that grant (`core.WebhookListenerHostPermissions`); the input is
  refused beside any other user kind. The hub's own listener, host users and listener users
  without the input are denied both lanes, and Dispatch's user is denied GitHub's lane and the
  listener's resume lane (`notifications.envoy.resume.>`); it keeps the kept lane and
  `notifications.legion.wake`, which its outbox and the listener beside it publish. A deployment
  whose listener user receives GitHub's webhook sets `githubWebhook: true` on that user in the
  change that moves its envoy-infra pin, or that listener's GitHub publishes are refused.
time: 2026-11-16T18:39:48Z
