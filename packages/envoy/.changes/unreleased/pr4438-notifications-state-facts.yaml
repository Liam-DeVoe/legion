kind: Changed
body: |-
  The listener raises no wake for a `low` publish of the Legion daemon to a role with no live holder;
  a publish whose session its broker token proves still wakes the role, whatever its body names.
  Dispatch sends the events of the daemon's own session at `low`, and an ask's events at the default
  urgency. A person's reply in a thread whose session is live or unresponsive no longer also goes to
  the sessions that only a document credits. Dispatch reads Envoy's registry for that rule alone,
  with a bound on the reads open at once, and a registry that does not answer holds back only the
  events that read it.
