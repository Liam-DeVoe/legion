kind: Added
body: |-
  `envoy-infra consumer-names` runs the operator's side of the fresh JetStream consumer names, as
  the deployment's operator identity and only in the writer hold's phase each step needs. `status`
  lists every family's selection records, their retired names and what blocks a cutover. `prepare`
  records the cutover boundary and raises the fixed names' inactive thresholds through the window.
  Inside a hold, `create-bucket` makes the selection bucket and its sentinel; `convert` replaces
  every fixed name by a fresh one at its safe start and marks each family converted; `replay` gives
  one logical name its start; `create-bucket --after-loss` recovers a lost bucket from a held
  snapshot or a released walk of its records; `restore` rolls every family back to its fixed names;
  `replace` gives one listener's durable a fresh name at its floor; `cleanup` deletes recorded
  retired names; and `enroll` marks a Legion daemon's store made after the cutover converted, in
  the writer hold's new `enroll` workflow. Every command writes its intent and its done or stop
  entry in the hold's journal, and a stop records what its runs left. `envoy-infra streams census`
  reads the session consumers and the fresh names the records hold, and brings each daemon store's
  stream identity to the stream's, through this command's readers.
