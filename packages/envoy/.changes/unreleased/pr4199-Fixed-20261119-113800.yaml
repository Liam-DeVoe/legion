kind: Fixed
body: |-
  A Dispatch database restored alone no longer leaves a replaced Google account holding
  credentials at the secrets broker, or the address's real holder refused there: the runbook's
  recovery reads the Workspace directory and the broker's live credentials under each address it
  lists, and ends every account but the holder. A new session row starts at its address's floor
  (migration `20261119060414_session_generation_floors`), so a first sign-in after the restore
  cannot start below the broker's generation, and the recovery's raise clears every cookie issued
  after the backup. A broker database restored alone is told again what Dispatch settled since
  its backup, with an hour's margin for the two clocks, and one made again is told everything
  Dispatch settled. The recovery's broker reads take a libpq URL made from the broker's own, which
  can carry a pgx-only parameter psql refuses, and the directory read passes its token from a
  file rather than on the command line.
  `envoy-dispatch clear-broker-revocation <address>` prints each owed revocation's session
  generation, or `none`, which the recovery's stale branch decides by. Every guard on the
  binding's tables, in Dispatch (`20261119065002`) and in the broker (`0034_guards_search_path`),
  runs under its own `search_path`, so a session's temporary table or operator cannot take its
  write. A database an early unreleased head migrated is refused at migrate with a message to
  reset it (`20261119064905`), in a schema whose name needs quotes too. The first recording of an
  address's account also revokes its personal tokens that record no account. An address whose
  domain ends in a character IDNA maps to a full stop is judged by its domain without it, and one
  whose domain holds an empty label is refused as the Workspace's.
