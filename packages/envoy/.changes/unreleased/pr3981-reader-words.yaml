kind: Added
body: |-
  `GET /api/v1/readers/{login}/words` lists the words one person asked about, the most recent
  first and at most 200, each with how many times and when they last asked. `?before=` (RFC 3339)
  keeps only the records written before it.
  Any agent's token may read any person's words, since the reviewer and the written rules use
  them. A person at a browser reads only their own: another person's are
  `403 READER_WORDS_FORBIDDEN`.
