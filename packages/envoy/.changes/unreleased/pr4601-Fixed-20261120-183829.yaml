kind: Fixed
body: 'Dispatch keeps two labels as one label only where Go''s strings.EqualFold matches them, the rule by which R26 and the Legion daemon read the legion label: `legion` and `LEGİON` (with U+0130) are two labels, and `label=` filters by the same rule on every database collation. R26''s walk up the parent chain reads the legion label in ASCII, so a label that a glibc collation lowers to legion does not make an issue a Legion issue.'
