kind: Added
body: |-
  `natsgrant.WithinProjects` holds a Legion daemon's NATS grant to the projects its token lists:
  its own reply prefix (`natsgrant.InboxPrefix`) in place of `_INBOX.>`, the scope's issue,
  role-exception, Legion and GitHub lanes, and its own consumers under each project, each create
  naming its one filter, with a GitHub consumer per repository (`natsgrant.GitHubConsumerName`,
  `natsgrant.GitHubPrefix`, `natsgrant.GitHubFilter`). It drops the stream's info and
  stored-message get, and refuses, naming the entry, any other stored-message read, a filterless
  consumer create, a KV bucket's call, `notifications.>`, any entry it does not know, and a grant
  that would end with an empty publish or subscribe list. Nothing calls it yet: the auth service
  holds a daemon to projects only after the daemon and every listener run the change that moves
  their consumers and wake reports.
