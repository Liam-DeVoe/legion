kind: Fixed
body: |-
  Two processes under one session id no longer take its relay in turns. The newer registration
  takes the session, as before, and the session's record keeps the client instance it
  superseded. From then on the older instance's registration, its hand-back of interests and its
  role claim are refused 409 with the reason `superseded_instance`, naming the newer instance,
  and the listener logs one warning naming both. A role claim that an older instance of the
  session holds passes to the newer instance at once, so a relaunched session no longer waits
  out the live window for its own role. Once a process deletes its own registration at a clean
  stop, the next registration is refused nothing.
