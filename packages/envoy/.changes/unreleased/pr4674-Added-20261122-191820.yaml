kind: Added
body: |-
  The secrets broker's `GET /v1/settings` answers `approver_fields: true`: it takes
  `approver_issuer`, `approver_subject` and `approver_session_generation` in a machine login's
  approve. Dispatch sends those three only to a broker that answers it, read after its check of the
  approver at most once every five seconds; a read that fails, or one older than that, counts as
  no such answer. Any other broker, an older one included, which refuses an approve carrying any of
  them `400 INVALID_DECISION`, is sent the approver and the code alone, and then neither refuses an
  approval by a replaced account nor records the approving account on the login it mints. The
  settings read and the relay share one deadline, five seconds from that check. Dispatch's broker
  token checks still need a broker holding the account binding: an older broker's introspection
  names no account and no creation time, so until it moves Dispatch refuses
  `401 BROKER_TOKEN_RECORDS_NO_ACCOUNT` every person-scope broker token of an address whose account
  it records after this deploy, while members recorded before it, operator entries' tokens and
  browser sessions are unaffected.
