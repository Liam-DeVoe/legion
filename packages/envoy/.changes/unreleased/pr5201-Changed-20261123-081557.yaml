kind: Changed
body: |-
  `envoy-infra buckets create` makes a bucket that is absent with no writer proof, and can run again. A bucket that is absent holds no write to lose, so `create` needs no listener stopped, prints no best-effort warning, and refuses the proof flags (`--kube-context`, `--host`, `--this-machine`, `--ssh`, `--connz`, `--first-deployment`) with exit 2; `recreate` and `check` keep the proof. It reads each named bucket and judges it against its own configuration at the copies asked for (`bus.CopiedBucketConfig`): a bucket there with that configuration is left as it is and logged `<bucket> present at <n> copies with its own configuration: left as it is`, exit 0; one there at other copies, or with another history, max age, storage, size limit, compression, discard policy or direct get, fails the run with exit 1 naming each difference (`differs: KV_<bucket>: replicas 1, want 3`), and nothing is created. The session bucket's max age, which the listeners set from `ENVOY_SESSION_MAX_AGE`, is not compared. The create never sends a stream update, and a create that loses a race to another client reads the bucket again and applies the same rule. The new `--inbox-prefix` names the prefix of the run's reply inboxes, by default `_INBOX_envoy_buckets`; a listener's user, which subscribes only `_INBOX.>`, passes `--inbox-prefix _INBOX.`. A read or a create the server refuses under the run's grant is sent again every 5 seconds for up to 180 seconds, since a grant just applied reaches a hub at its next reload, and then fails the run naming the refusal. `create --break-glass` is the same create as a listener's user on `_INBOX.`, and a bucket that is there no longer refuses it. The single-node compose file's `buckets` service no longer takes `--this-machine`, `--connz` or `pid: host`.
