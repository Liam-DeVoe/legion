kind: Changed
body: |-
  Each finding of a `409 SPEC_FORM` refusal and of `GET /api/v1/artifacts/{id}/spec-form` carries
  its ways out in their own field, `ways`, and its `detail` holds the rule's words at its place
  only. A line of `error` and of `refusal` still writes the detail, then the ways out. A way out is
  judged at each place of its finding's words in a sentence, and a finding of the words that the
  page shows is judged in the sentence of the text as the rules of the form read it, code font and
  all. A way out is also judged in the whole text by the rules that read more than one sentence:
  two verbs for one action, ste-lint's long sentence and a list item that ends in "and" or "or". A
  way out of a finding of a footnote that changes its verbs is refused only where a text or a
  footnote that holds it gives a finding of two verbs for one action that it did not give, and two
  footnotes that refer to each other no longer give that finding again in a footnote that refers to
  them. A text that ste-lint reads as more than one line gets ways out for its first eight findings
  only. The code font of a name that ends its sentence leaves the stop after it, and a way out that
  moves where its sentence ends is refused. A way out is judged in the sentence as the text holds
  it, two spaces and all, and also in each sentence where its words stand and its finding does
  not, eight of them at most; a finding whose words stand in more gets no way out and says so.
