kind: Changed
body: |-
  Dispatch's membership answer, `GET /api/v1/access/projects/{key}`, no longer names a project's
  repositories: it answers `{project, visibility, owner, person, member_kind, visible,
  slack_channels}`. GitHub events carry no project, so no reader needs them. No Dispatch release
  has served the field. Against this Dispatch, the secrets broker's
  `projectaccess.Answer.Repositories` reads empty.
