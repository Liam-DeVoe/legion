kind: Fixed
body: |-
  The value prompt of `agent-secrets secret create` and `secret set` no longer stops while it checks
  whether a shell can still bring it to the foreground. On Linux that check reads the stat of every
  process once no ancestor of the prompt holds its process group, and a read there that did not
  answer held the prompt in the background past a create's value deadline. The check now runs
  beside the wait, which goes on answering fg and its value deadline; a create whose deadline
  passes while the check has not answered ends, saying that the check had not ended.
