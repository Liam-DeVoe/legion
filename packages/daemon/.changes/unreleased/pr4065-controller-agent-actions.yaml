kind: Added
body: |-
  Of the actions on an agent (stop, retry, suspend, resume_agent, compact and fresh session of one
  agent, named by its issue and role), the daemon serves the controller four beside the two it
  had, `POST /legion/v1/agents/stop`, `retry`, `suspend` and `resume`, behind the controller's grant
  and refused for the controller's own agent. A controller's suspension is recorded under its own
  source, `controller`: it holds against every daemon rule, the controller's `resume_agent` or the
  operator's resume lifts it, and `legion claims list` prints it as `suspended:controller`. While
  the operator's own suspension holds an agent, the controller's `stop`, `retry`, `suspend`,
  `resume_agent` and `fresh_session` are refused `409 SUSPENDED_BY_OPERATOR` and nothing of the
  claim changes; before this, the controller's `fresh_session` lifted that suspension. The same six
  agent actions (these four, `claims/fresh-session` and `claims/compact`) also take a tree
  architect's grant, for the agents of the issues it owns alone: the daemon refuses an architect an
  agent of another tree (`403 ISSUE_OUTSIDE_TREE`), an agent of an issue of its tree that it does
  not own (`403 ISSUE_NOT_OWNED`) and its own agent (`403 OWN_AGENT`). An architect's suspension
  is recorded under a source of its own, `architect`, which ranks under the controller's: an
  architect's `resume_agent` lifts it, and so do the controller's and the operator's. Each of an
  architect's agent actions is refused `409 SUSPENDED_BY_OPERATOR` or
  `409 SUSPENDED_BY_CONTROLLER` for an agent the operator's or the controller's suspension holds;
  its `resume_agent`, `suspend`, `stop` and `fresh_session` are refused `409 SUSPENDED_BY_DAEMON`
  for an agent the daemon suspended; and its `retry` and `fresh_session` are refused
  `409 ISSUE_OUT_OF_WORKFLOW` for an agent that failed or that a stop retired while its
  issue or its tree's root is out of the workflow. Two store migrations widen
  `claims_suspended_by_check`, for `controller` and then for `architect`. While the project is
  paused, the controller's and an architect's `agents/retry` and `agents/resume` are refused
  `409 PROJECT_PAUSED`, as their `fresh-session` and `compact` are, and nothing of the claim
  changes; their `agents/stop` and `agents/suspend` still run. Every `PROJECT_PAUSED` refusal now
  ends by naming what lifts the pause: the controller's `resume` operation, which names no issue,
  or the operator's `legion project resume`. A pause stops no agent that a suspension of the
  controller's, an architect's or the operator's already holds, and such a suspension that takes
  over an agent the pause stopped holds it through the project's resume.
