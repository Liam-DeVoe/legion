kind: Fixed
body: |-
  The idle-rig listener and the scratch Dispatch server of the daemon's tests serve on a socket the test holds for its whole life (`ENVOY_LISTEN_FD`, `DISPATCH_LISTEN_FD`), so a restart comes back on the same port and no other program can take it in between. Before, the idle rig chose a free port and let it go before the listener bound it. The scratch Dispatch server still releases its port in one place, the handoff-records proof's step that needs the port to refuse connections, and binds it again before its restart.
