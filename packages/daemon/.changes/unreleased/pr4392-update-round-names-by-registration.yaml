kind: Changed
custom:
  Issue: pr4392
body: |-
  On every Kubernetes deployment, with `dispatch_token_broker` on or off, each end of an update
  round names a role that had not answered only where that role's unpushed work may be on the disk
  of the round's pod. That holds at the daemon's replacement of the pod, at a replacement by issue
  or at a launch, and in the message that the pod went. The work may be there in three cases. An
  agent of the role registered a session in that pod: each claim's machine keeps, in memory, the
  pods its agents registered in, and nothing takes a pod out, so a role that registered in the pod
  and lost its session since is named, with no session or with a new one. The round passes the role
  over, a role suspended by the daemon's own rule, by a root's exit, by an idle release or by an
  unknown source, and an agent of it ran somewhere, so it has a session or a pod in its set: an
  idle release saves the workspace's unpushed work and the issue's next pod restores it before any
  role starts, or a kept volume holds it, so such a role is named although no agent of it
  registered in that pod, also after a chain of releases. A role the round passes over with no
  session and no pod in its set, as one refused for the pod with no session and suspended since,
  never ran an agent, and no end names it. The first launch of a released role puts the pod it
  goes into, or the pod it is refused for, in that set, so a released
  role woken into the round's pod is named before its agent registers there. That addition is in
  memory as well: after a daemon restart between the wake and the end, the role's set is unknown,
  and the end names it where it had not answered. And after a daemon restart, a role whose stored
  claim shows a session it held, now or abandoned, is named for every pod, so the daemon errs
  towards naming a role. The one case in which an end names fewer roles than an earlier release,
  which named every member that had not answered: a role whose session came from another pod, that
  has not registered in the round's pod and that the round does not pass over, is not named for it,
  since its work is on another pod's disk. When no role is left to name, the daemon writes no
  message. The line of a pod that went with no such role logs the members that had not answered
  under `ranNoWorkerInPod`.
