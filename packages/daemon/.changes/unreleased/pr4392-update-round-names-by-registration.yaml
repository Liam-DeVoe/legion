kind: Changed
custom:
  Issue: pr4392
body: |-
  On every Kubernetes deployment, with `dispatch_token_broker` on or off, each end of an update
  round names a role that had not answered only where that role's unpushed work may be on the disk
  of the round's pod. That holds at the daemon's replacement of the pod, at a replacement by issue
  or at a launch, and in the message that the pod went. The work may be there in three cases. An
  agent of the role registered a session in that pod: each claim's machine keeps, in memory, the
  pods its agents registered in, and nothing takes a pod out, so a role that registered in the pod
  and lost its session since is named, with no session or with a new one. The pod's disk holds
  work from before the pod: an idle release saved the unpushed work of the workspace that every
  role of the issue shares, and the pod restored it before any role started, or mounts the kept
  volume that holds it; or, under `runtime.kubernetes.sandbox.microvm.keep_volume`, the pod mounts
  a kept volume that an earlier pod of the issue mounted, which holds what the roles left unpushed
  there, with no release at all. The store records these pods (table `issue_pod_disks`, which
  migration `20261123234016_issue_pod_disks` adds): the restore's take marks its pod, and each
  role's start in a pod of a kept volume records that pod with its volume, marked where the start
  dropped the saved copy or where an earlier pod of the issue recorded the same volume. The first
  pod of a volume is not marked. The record holds after a daemon restart, and the issue's close or
  its tree's close deletes the issue's rows. Every end of a round over a marked pod names every
  role that had not answered and has a session or a pod in its set: a role the round passes over,
  a role the daemon or the operator took over after the release, a woken role whose launch the
  wake pacing parks or whose own launch replaces the pod, and a role that was suspended already at
  the release, whose work was in the shared workspace too. So such an end can name a role whose
  work the pod does not hold. A failed role is no member of the round, so no end names it in a
  message, as before. A role with no session and no pod in its set, as one that never ran an agent
  and is refused for the pod with no session, is named at no end. The replacement through a
  process in the pod names a role the round passed over only where the role has a session. And
  after a daemon restart, a role whose stored claim shows a session it held, now or abandoned, is
  named for every pod, so the daemon errs towards naming a role. A pod that ran before this release
  has no row, so where the earlier pods of a kept volume ran before it, the first pod of that
  volume that this release records is marked only for its own drop or take; a role whose stored
  claim showed a session at the restart into this release is named all the same. The one case in
  which an end names fewer roles than an earlier release, which named every member that had not
  answered: at a round over a pod the store does not mark, a role whose session came from another
  pod and that has not registered in the round's pod is not named for it, since no work from
  before the pod is on that pod's disk. When no role is left to name, the daemon writes no
  message. The line of a pod that went with no such role logs the members that had not answered
  under `ranNoWorkerInPod`.
