kind: Changed
body: |-
    The worker image's `legion-testpg` keeps `max_connections=471`, but that is no longer the
    number at which the Dispatch test suite runs at production's pool sizes: each test process also
    holds the test hooks' listener, so the suite at full sizes needs 475. On 471 the test guard now
    scales each test process's pools by one connection, and the rows that need production's pool
    sizes (the memory rows, `TestALeasedLoopsPassesNeverOverlapAcrossBothProcesses`,
    `TestTheOutboxLoadSteps`, and a start of an earlier build that does not read
    `DISPATCH_TEST_POOL_BUDGET`) refuse there by name; CI runs them on servers sized for full sizes.
time: 2026-11-16T01:57:49.000000000Z
