kind: Fixed
body: |-
  The release of a pod no claim owns no longer releases the same pod twice. The pass after a release could still read the Sandbox as it was before the release's last write, because the daemon's store of Sandboxes hears of a write only when the watch delivers it; it then released the pod again, and that second teardown logged `outbox: released the pod of an issue no role can use` and recorded a second release.
  The runtime now answers a Sandbox it has deleted, a kept Sandbox it has just marked released, and one carrying a `deletionTimestamp` as gone. A teardown of that release that finds no Sandbox to release records no release and logs `outbox: the release found no Sandbox of the issue to release and released nothing` instead.
