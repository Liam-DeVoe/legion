kind: Added
body: |-
  `GET /legion/v1/state?view=observed` serves the observed view of the state: only what Dispatch
  reads of a daemon. The view has the daemon block, the settings and the admission block of the
  full state, and each issue of the full state with only its `key`, `phase`, `tree`, `slot.index`,
  `waitingOn`, `architect.state` and `workers.<role>.claim.state`. Each of these members is absent
  where the full state does not have it. The daemon reads the view in the same repeatable-read,
  read-only snapshot as the full state, with the same bound, statement timeout and rollback. It
  does not read the pull requests, the design gates or the claims that nothing will wake. The
  route answers a different `view` value with 400 `INVALID_VIEW`, and a request with no `view`
  gets the full state, which does not change. The view is part of daemon API contract 196. On
  2026-11-20 the INFRA daemon's full state was 7,307,929 bytes, and the part that the view serves
  was 665,962 bytes.
