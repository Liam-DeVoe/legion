kind: Changed
body: |-
  The answer loop makes a model call once again when the provider cuts its reply at
  `output_tokens`, instead of passing the question on as `length` at once. Across 415 answer
  calls in three proof runs the longest reply the bound of 4000 did not cut used 567 output
  tokens, and the one reply it cut was a complete answer of about 350 tokens inside the form's
  `text` followed by about 3800 newline escapes: a model running on inside its structured
  reply. Five replays of that request with the bound at 64000 ended at 167 to 487 tokens. So
  the bound stays at 4000, and a cut reply is never sent back to the model: the same call is
  made once more without it, inside the same `model_calls` and `answer_seconds`. The exchange
  appended to the agent's Oh My Pi session or Claude Code transcript never holds the cut
  reply, while the answer's calls, tokens and cost count it. A second cut reply, or one on the
  last allowed call, is still `length`.
