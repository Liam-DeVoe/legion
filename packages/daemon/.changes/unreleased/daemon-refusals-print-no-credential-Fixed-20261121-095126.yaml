kind: Fixed
body: |-
    Four configuration refusals and the controller liveness log quoted what a person can write a
    credential into. Each now names the key, the entry's position or the variable, never the value:
    `runtime.kubernetes.session_dsn_secret is not a Secret data key`, where a postgres URL pasted in
    place of the key's name printed whole, its password included; `runtime.tmux.pane_env entry 2:
    its key …` and `runtime.kubernetes.pod.env entry 2: its key …`, where a credential pasted as a
    variable printed; and a `runtime.kubernetes.plugins` source with a user name, a password or a
    query, which is quoted no more (a dist-tag or a range still is).

    `envoy_url`, `dispatch_url` and `daemon_url` now refuse an `@` after the host, naming the key
    alone, which is how a token or password holding an unescaped `/`, `?` or `#` written in the
    userinfo parses: such a URL loaded with the credential's head as its host, and lines that name
    the host printed it. Write such a credential percent-encoded. The controller liveness probe logs
    the Envoy role lookup, and the HTTP client's error about it, without the URL's user name and
    password.
time: 2026-11-21T09:51:26Z
custom:
    Issue: daemon-refusals-print-no-credential
