kind: Fixed
body: |-
    Five configuration refusals and the controller liveness log quoted what a person can write a
    credential into. Each now names the key, the entry's position or the variable, never the value:
    `runtime.kubernetes.session_dsn_secret is not a Secret data key`, where a postgres URL pasted in
    place of the key's name printed whole, its password included; `runtime.tmux.pane_env entry 2:
    its key …` and `runtime.kubernetes.pod.env entry 2: its key …`, where a credential pasted as a
    variable printed; `nats_urls entry 2 must be a valid URL` and the other `nats_urls` refusals,
    which quoted the entry, its query or user name among it; and a `runtime.kubernetes.plugins`
    source with a user name, a password or a query, which is quoted no more (a dist-tag or a range
    still is).

    `envoy_url`, `dispatch_url`, `daemon_url` and each `nats_urls` entry now refuse an `@` after the
    host, naming the key or the entry's position alone, which is how a token or password holding an
    unescaped `/`, `?` or `#` written in the userinfo parses: such a URL loaded with the
    credential's head as its host, and lines that name the host printed it. Write such a credential
    percent-encoded. The controller liveness probe requests and logs the Envoy role lookup without
    the URL's user name and password, and sends them as Basic auth when no bearer token is set, as
    the HTTP client sent a URL's own.
time: 2026-11-21T09:51:26Z
custom:
    Issue: daemon-refusals-print-no-credential
