kind: Added
body: |-
  `legion merge -R <workspace> -m <message> <first> <second>` makes the merge commit of two
  commits in a jj workspace, and the merge holds git's merge (`git merge-tree --write-tree`):
  jj can merge two commits that have more than one merge base wrongly and show no conflict
  (jj-vcs/jj#6369). Where git conflicts, the merge holds jj's merge of git's own three versions of
  the path, over one merge base, so an unresolved conflict is a jj conflict that `jj git push`
  refuses. It exits 0 for a clean merge, 1 for a merge with conflicts, whose output ends with the
  next step, 2 for a usage error, and 3 for a refusal or a failure, which makes nothing and leaves
  the working copy where it was. Its last description line is `Legion-Merge: <git's tree id>`.
  One run at a time goes on in a workspace. A second run exits 3.
  A run removes what an earlier run in the same workspace left when it stopped before its end:
  the commits of git's versions that the stopped run wrote with git, with their bookmarks, jj's
  merge of those commits, and a merge that still carries the Legion-Merge-Run line.
  A merge whose description ends with its Legion-Merge line holds git's merge. The run leaves it.
  The run keeps a commit of the stopped run and names it on stderr when another commit stands on
  it, when a bookmark other than the stopped run's own bookmarks names it, when a remote bookmark
  is on it or on a commit above it, or when it is a working-copy commit.
  A run leaves a bookmark with the name of a stopped run's bookmark on a commit that a legion
  merge did not write, and names it.
  It needs git 2.38 or later.
