kind: Fixed
body: |-
  A daemon whose boot meets GitHub's rate limit on the read of a repository's default branch no
  longer exits at the `appauth` stage. A repository it holds a default branch for, from its last
  read or from a record of an issue on it, is served on that branch at once and read again after
  the limit's reset. One it holds none for is waited out for as long as GitHub asks, at most an
  hour, with one log line naming the repository, the limit's headers as GitHub sent them and the
  time it waits until, and is then read once more; if GitHub still refuses, only that repository
  is left out for now and read again, as one whose installation read failed is. A later read of the
  mapping applies the same rule without waiting. A 404 still refuses the boot, and a 5xx is still
  retried.

  A 403 whose body says `API rate limit exceeded` is read as GitHub's rate limit whatever its
  headers say, waited a minute when no header names a wait.
