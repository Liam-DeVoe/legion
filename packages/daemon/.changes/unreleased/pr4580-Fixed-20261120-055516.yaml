kind: Fixed
body: 'A role''s `jj git push` gives each commit it sends the author of the role that the commit''s first `Legion-Role` trailer names. An issue''s roles share one jj working copy, so a commit could reach GitHub with another role''s App as its author. Before the push, `legion jj` reads what the push sends from a dry run of it, and runs one `jj metaedit --update-author` for each role whose commits carry another author, under that role''s identity from `LEGION_ROLE_IDENTITIES`, every command with `--ignore-working-copy`. It prints one `legion jj: <role>: <old commit id> -> <new commit id>` line for each commit it rewrote, then runs the push with the role''s own arguments, where a commit id of a hidden commit names the one visible commit that replaced it, where there is one. It adds no refusal: where it cannot read the dry run, as for a commit that a `git commit` made and no jj command has imported yet, it prints one line and runs the push as written, but for a commit id of a commit whose empty author it filled first. A pod''s jj wrapper hands each push to `legion jj --real`, and a tmux pane gets a `<state_dir>/bin/jj` that runs `legion jj --after`. The daemon tells every workflow role `LEGION_ROLE_IDENTITIES` (daemon API contract 187), which an operator''s `pane_env` or pod env may not set. A tmux daemon rolled back to an earlier release leaves `<state_dir>/bin/jj`, which the operator deletes.'
