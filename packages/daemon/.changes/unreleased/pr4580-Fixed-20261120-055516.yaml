kind: Fixed
body: 'A role''s `jj git push` gives each commit it sends the author of the role that the commit''s first `Legion-Role` trailer names. An issue''s roles share one jj working copy, so a commit could reach GitHub with another role''s App as its author. Before the push, `legion jj` reads what the push sends from a dry run of it, and runs `jj metaedit --update-author` for each role whose commits carry another author, under that role''s identity from `LEGION_ROLE_IDENTITIES`, in as many batches as keep each command under 2,097,152 bytes. It decides from reads with `--ignore-working-copy`; where its first run finds nothing of the push to change, no commit and no word, or where the push itself carries `--ignore-working-copy` (which then goes to the real push alone), every command of the step carries that flag and it takes no snapshot. Otherwise it first takes the one snapshot the push would take, with the push''s own `-R` and `--quiet` arguments and those of its `--config` and `--config-file` arguments that jj keeps for the push, passes on what that snapshot prints, and reads again, so a descendant of a working-copy commit with an unsnapshotted write goes with its write; every later command carries `--ignore-working-copy`, the real push included, which then takes no second snapshot, so a snapshot''s warning prints once and a write another process makes after the step''s snapshot stays for the next jj command. It prints one `legion jj: <role>: <old commit id> -> <new commit id>` line for each commit it rewrote, then runs the push with the role''s own arguments, with `--ignore-working-copy` in front of them where the step took its snapshot, but for a revision argument whose meaning the rewrite changed: jj resolves each argument to its whole set before the rewrite, and once any metaedit of the step has run, the fill of an empty author included, an argument jj no longer resolves to that set, as rewritten, whether or not its own commits moved, gets the set as ids while that word stays under 100,000 bytes, else the primary form `(<argument>) ~ (<old ids>) ~ (<ids it now names and must not>) | <new ids> | <ids it must send>` (each empty part left out) where jj resolves it once more to the set, else the ids in as many words of the same `--change` or `--revisions` option as keep each under 100,000 bytes, each ids form with one printed line (an argument that named no commit gets `none()`), so a change offset, `latest(...)`, `mine()` or `author(...)` sends what it named before the rewrite, even through another argument''s rewrite. No word the step writes passes 100,000 bytes, but for a role''s own argument that is that long already. Only where the push would then pass 2,097,152 bytes of arguments and environment, each revision argument counted at the larger of its own word and its ids, does the step decide, before any rewrite other than the fill of an empty author and, where no such fill ran, before its snapshot, to set no other author, with one printed line, and the push runs as written, but where that fill ran, after which each revision argument is held to its set and the push carries `--ignore-working-copy`. It adds no refusal: where it cannot read the dry run, as for a commit that a `git commit` made and no jj command has imported yet, it prints one line and runs the push as written, but where a metaedit of the step ran first, such as the fill of an empty author, after which each revision argument is held to its set, and with `--ignore-working-copy` where the step took its snapshot. It matches each commit id that jj prints short against the commits of the repository''s bookmarks and tags and of the push''s revisions (for a commit with no author, against the mutable commits no remote holds), never against every commit, so a hidden commit whose id starts the same stops no push. Where jj refuses a rewrite because the commit it would make exists already, as in a retry in the same second, the step takes that commit where it stands for the hidden commit the push names, and otherwise prints one line and runs the push as written. A pod''s jj wrapper hands each push to `legion jj --real`, and a tmux pane gets a `<state_dir>/bin/jj` that runs `legion jj --after`. A push written through a jj alias, an alias of an alias or `ui.default-command` gets the step under tmux as in a pod: the pane''s `legion jj` expands a command whose command word is no built-in jj command as jj 0.45 does, after one `jj config list`, runs every command that is no push with the role''s own words, and prints one `legion jj: could not expand …; the command runs as written` line where it cannot expand one. A push whose words hold a short-flag cluster that starts with `-h` or `-V`, which jj reads as help or version, runs no step. The daemon tells every workflow role `LEGION_ROLE_IDENTITIES` (daemon API contract 230), which an operator''s `pane_env` or pod env may not set. A tmux daemon rolled back to an earlier release leaves `<state_dir>/bin/jj`, which the operator deletes.'
