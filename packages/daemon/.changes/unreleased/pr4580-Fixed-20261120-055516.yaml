kind: Fixed
body: 'A role''s `jj git push` gives each commit it sends the author of the role that the commit''s first `Legion-Role` trailer names. An issue''s roles share one jj working copy, so a commit could reach GitHub with another role''s App as its author. Before the push, `legion jj` reads what the push sends from a dry run of it, and runs one `jj metaedit --update-author` for each role whose commits carry another author, under that role''s identity from `LEGION_ROLE_IDENTITIES`, every command with `--ignore-working-copy`. It prints one `legion jj: <role>: <old commit id> -> <new commit id>` line for each commit it rewrote, then runs the push with the role''s own arguments, but for a revision argument whose commits it moved: jj resolves each argument to its whole set before the rewrite, and an argument jj no longer resolves to that set, as rewritten, gets `(<argument>) ~ (<old ids>) ~ (<ids it now names and must not>) | <new ids> | <ids it must send>` (`@` for the working-copy commit), which jj resolves once more to check it, else the set as ids while that word stays under 100,000 bytes, so a change offset, `latest(...)` or `author(...)` sends what it named before the rewrite. It adds no refusal: where it cannot read the dry run, as for a commit that a `git commit` made and no jj command has imported yet, it prints one line and runs the push as written, but for a revision argument that still names a commit a metaedit of the step rewrote or rebased first, such as one whose empty author it filled. It matches each commit id that jj prints short against the commits of the repository''s bookmarks and tags and of the push''s revisions (for a commit with no author, against the mutable commits no remote holds), never against every commit, so a hidden commit whose id starts the same stops no push. Where jj refuses a rewrite because the commit it would make exists already, as in a retry in the same second, the step takes that commit where it stands for the hidden commit the push names, and otherwise prints one line and runs the push as written. A pod''s jj wrapper hands each push to `legion jj --real`, and a tmux pane gets a `<state_dir>/bin/jj` that runs `legion jj --after`. The daemon tells every workflow role `LEGION_ROLE_IDENTITIES` (daemon API contract 202), which an operator''s `pane_env` or pod env may not set. A tmux daemon rolled back to an earlier release leaves `<state_dir>/bin/jj`, which the operator deletes.'
