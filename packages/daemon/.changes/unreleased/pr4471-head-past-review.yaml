kind: Fixed
body: |-
    An approval of one head no longer merges another head pushed after it. A push, a new head or a
    reopen at another head that reaches the pull request while the issue is in `accepting`, `retro`
    or `merging`, and a merge at another head in `accepting` or `retro`, now send the issue back to
    `reviewing` whenever the approval that decided the round no longer stands on the head, as a new
    head already re-asked the round in `reviewing`. A retry of a held phase past the review applies
    the same rule before it starts that phase's worker. No head is exempt, retro's own push
    included, since retro commits nothing. The move counts a pass under its own pair
    (`accepting-reviewing`, `retro-reviewing`, `merging-reviewing`), starts the reviewer with a
    `Reason:` naming the approved head and what replaced it, tells the architect in a
    `phase-finished` notice whose reason begins `moved back to reviewing by the daemon:`, tells the
    implementer in retro or the merger in merging that its phase ended, and posts the reason on the
    issue. Every task that starts or resumes the merger on `merging` now ends with
    `Approved head: <sha>`, read from the decided review the record holds, or
    `Approved head: none.` where it holds no approval, so a merger on a fresh session still knows
    the one head it may merge; its prompt merges nothing unless the pull request's head is that
    head, sending the issue back to `reviewing` instead.
