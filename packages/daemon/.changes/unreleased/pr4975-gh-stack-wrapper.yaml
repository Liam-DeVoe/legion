kind: Added
body: |-
    `legion gh stack …` runs the worker image's gh-stack, the one gh extension the pod's `gh`
    wrapper runs, with the token of the owner of the repository it acts on: GH_REPO where set
    and the working directory's github.com remotes, refused where they name two owners. It runs
    the image's root-owned copy at /opt/legion/gh-extensions/gh-stack directly, so no other
    program named gh-stack and no gh alias gets the token. Every flag is read against gh-stack
    0.3.0's own, with its command's name first, because gh-stack hands --remote, branches and
    other values to `git fetch` and `git push`, where a value that starts with `-` would run a
    command: such a value, an unknown flag or command, a flag before the command's name, a help
    given a value, `--`, and a --remote that names no listed remote are refused. What gh-stack's
    git reads of the repository is held the same way: every remote must be an https github.com
    OWNER/REPO URL, every key the repository's git configuration sets must be on an allowlist of
    settings that run no program and move no fetch or push, a push setting must name a listed
    remote, and branch names from gh-stack's stack file that start with `-` or fail
    `git check-ref-format` are refused. `gh stack submit` needs --auto, since its editor writes
    pull request text no guard reads, and the pull request template `submit` and `link` post
    goes to the leak guard. `gh stack alias` and `gh stack feedback` are refused. gh-stack runs
    with PATH set to root-owned image directories alone, whose `git` is `legion gh-stack-git`: it
    refuses an argument that starts with `-` and is no option gh-stack passes to git, whatever
    gh-stack read it from, then runs the image's git.
