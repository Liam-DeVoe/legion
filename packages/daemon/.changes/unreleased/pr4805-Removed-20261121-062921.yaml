kind: Removed
custom:
  Issue: pr4805
body: |-
  `envoy_token_file` is removed: the Envoy listener takes no shared bearer. A `legion.yaml` that
  names it is refused at load, under either runtime, and so is a `controller.yaml` for
  `legion controller start`; each refusal names what replaces it. Under `runtime: kubernetes`,
  `runtime.kubernetes.agent_secrets.exchange_audience` is now required: the daemon presents its own
  broker token on every listener call, and each pod's sessions trade their own. No pod or pane is
  handed `ENVOY_TOKEN`, and the controller's session is told no `ENVOY_TOKEN_FILE` and drops one it
  inherits. A `provider_keys` entry, a `runtime.tmux.pane_env` or a `runtime.kubernetes.pod.env`
  variable of either name is refused at load. Under `runtime: tmux` the daemon and its panes
  present no credential, so `envoy_url` must name a loopback listener: a host other than
  `localhost` or a loopback address is refused at load, and `legion controller start` refuses one
  too unless the controller's environment names a secrets broker and a machine identity the
  broker client can prove, each identity kind with every variable it reads.
  `dispatch_token_transition_file` is removed too: a `legion.yaml` that names it is refused at
  load, and no launch carries the transition token.
