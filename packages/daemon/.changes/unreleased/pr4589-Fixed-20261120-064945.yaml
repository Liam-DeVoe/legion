kind: Fixed
body: The release of an issue pod whose claims have all stopped no longer deletes the pod when an operator suspends one of its claims after the release is queued and before the teardown's last read, which the runtime takes under its pod lock. The teardown reads the operator's suspension again, keeps the pod, and records the hold as `unowned_operator_suspended`. A suspension that comes after that last read could keep nothing, since the pod is being deleted, so `legion claims suspend` now answers it with a 409 that names the release and the pod, and leaves the claim as it was; the same holds for an idle release.
