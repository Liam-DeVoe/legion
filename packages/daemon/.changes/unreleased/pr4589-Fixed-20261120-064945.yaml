kind: Fixed
body: The release of an issue pod whose claims have all stopped no longer deletes the pod when an operator suspends one of its claims after the release is queued and before the teardown's last read, which the runtime takes under its pod lock. The teardown reads the operator's suspension again, keeps the pod, and records the hold as `unowned_operator_suspended`. A suspension that comes after that last read could keep nothing, since the pod is being deleted, so `legion claims suspend` now answers it with a 409 that names the release and the pod, and leaves the claim as it was; the database holds that rule, and the rule that no claim of the issue goes live then, for every write of a claim. `legion claims resume` in that window answers 202 with a sentence that names the release, and the daemon resumes the claim once the release ends, in a new pod, unless the claim is suspended or stopped first; a spawn or a retry there answers 409, to be asked again. A teardown that fails before it touches the pod — its read of the Sandbox, or a write of it the API server refused with a client error — or a daemon that stops there, no longer refuses anything once the pod is known to stand. A daemon of a rolling restart whose lease on the teardown's row lapsed no longer ends the take of the daemon that now runs it. The same holds for an idle release.
