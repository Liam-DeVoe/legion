kind: Fixed
body: |-
    A work-back hook's prompt waits until the phase start its move back queued has been given to
    its worker, so it no longer wakes a released role, or prompts a live one, while the issue holds
    no admission slot. A role message to a role whose wake is already under way no longer ends
    "not worth a wake": it waits while the role's claim reads released and is published with keep
    once the claim leaves released, so the woken session receives it. A design gate's close and
    opening reach a released phase holder that is no merger the same way, waking nothing, and only
    the newest move of the gate is published.
