kind: Fixed
body: 'A start whose session store refuses or does not answer, or holds no session table, now waits a minute and tries again, keeping the claim''s session and charging nothing, where it counted as a launch failure or forgot the session: a tmux session folder the daemon cannot read or list, a pod''s session database proxy whose proof dial is refused or not answered, a Claude Code session''s keeper whose dial of the table or read of the session''s rows is refused or not answered, and a child that exits after the store stopped answering it, under either database store. Every other store failure, such as a missing credential or URL file or a refused login, is a launch failure that names its cause, and a folder another user owns is passed over at every level of the tmux search. `legion sessions import` over a database with no session table exits 1 naming the database and the table, where it reported every recorded session missing.'
