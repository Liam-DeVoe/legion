kind: Fixed
body: 'A start whose session store does not answer, or holds no session table, now waits a minute and tries again, keeping the claim''s session and charging nothing, where it counted as a launch failure or forgot the session: a tmux session folder the daemon cannot read or list, a pod''s session database proxy whose proof dial is refused or not answered, a resume''s lookup or a Claude Code session''s keeper that meets such a store, and an Oh My Pi child that exits after the store stopped answering it, under either database store. A store does not answer when it refuses or never answers the connection, ends it while it is opened or once it is open, or answers with a SQLSTATE of a class in which the server is not judging the request (a server starting up or shutting down, one with no client slot left), the rule the daemon''s own store reads a refusal by. A store outage that comes back after the store answered a start is told to the issue and the controller at once. Every other store failure, such as a missing credential or URL file, a refused login or a database that takes no writes, is a launch failure that names its cause, and so is a recorded tmux session under a file where a folder should be; a folder another user owns is passed over at every level of the tmux search. `legion sessions import` over a database with no session table exits 1 naming the database and the table, where it reported every recorded session missing.'
