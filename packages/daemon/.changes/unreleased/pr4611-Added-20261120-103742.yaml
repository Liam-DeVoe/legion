kind: Added
body: |-
  The architect who owns an issue can give Legion a plan whose one task names which of today's
  steps run, some of `planner implementer tester reviewer acceptance:owner` in that order and
  always with `implementer`, with the new architect operation `register_plan`. Legion runs those
  steps and then its own retro and merge. An issue with no plan runs the project's new setting
  `projects.<KEY>.default_steps`, whose default is today's line, and an issue that ran before
  this release goes on as it did.

  The new operation `stop_task` stops a task: the issue is held `task-stopped`, the step's
  process stops and its session stays, and a later version of the plan that changes the task
  starts it again at its first step. A version that changes a running task is refused, and so is
  each plan this release cannot carry out (`PLAN_REFUSED`, one reason for each cause). A tester's
  failed completion may name the step it returns to (`returnTo`). A task with no reviewer step
  waits for no approval, and a parent whose plan has no acceptance step waits before its retro,
  held `children`, until the issues beneath it leave the workflow. The daemon API contract is 189.

  One migration adds the plan tables. Its header and the Kubernetes guide hold the transaction
  that rolls it back: every project's daemon on the database rolls back with it, and the plans
  given before the rollback are lost.
