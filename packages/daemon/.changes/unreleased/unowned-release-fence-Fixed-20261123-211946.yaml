kind: Fixed
body: |-
    The release of a pod no claim owns no longer releases an issue a second time while the
    runtime's store still holds the Sandbox the first release deleted. It read whether the Sandbox
    was there from the runtime's informer store, which can lag the delete, and the second release
    tore down nothing but logged and recorded a release that did not happen. The finish of such a
    release now records its fence (`unowned_release_fences`, written in the transaction that clears
    its mark): the database's clock when the store authorized its teardown, under the pod's launch
    turn. The rule holds an issue whose last release's fence is at or after its claims' newest write
    under `unowned_sandbox_gone`. A launch waits for that turn and writes its claim, so a pod made
    again after a release is decided as any other.
