kind: Added
body: '`register_plan` reads each need of a `plan_task` block, a reference to another task''s block or a task id, as the id of the task it names, once, and the daemon writes those ids into the plan node it sends to Dispatch: `needs` on each task of a `plan_record` row, `[]` for a task that needs none. `register_plan` refuses a need that names no task of the plan, each set of tasks that need each other, named once by one cycle of it, the shortest from its first task in id order (`task a needs itself: a needs b, b needs a.`), and two or more tasks that no task needs. A refused plan''s answer (`409 PLAN_REFUSED`) names its first 20 reasons and counts the rest in one more, in its `error` and in its `reasons`, so a plan with a cause for each of many words or steps is answered in a few kilobytes. The read of the needs and the check of cycles each take time linear in the plan. Measured three times in one test pod, the read and both checks took 50 to 110 ms of CPU on a ring of 40,000 tasks, on 600 tasks each needing all the others (359,400 needs) and on 40,000 tasks each needing itself, and 130 to 190 ms on one task whose 350,000 words name no task. A plan of more than one task, or with a need, is still refused, since this release runs one task for each issue. Deploy Dispatch first: a Dispatch of the release before drops `needs`, and that run''s plan then reads its needs as not recorded. A rollback to the release before runs the statement of docs/kubernetes.md, "Rolling back the release that records each task''s needs", with the project''s daemon stopped, which takes `needs` off that project''s queued `plan_record` rows.'
