kind: Added
body: '`register_plan` reads each need of a `plan_task` block, a reference to another task''s block or a task id, as the id of the task it names, once, and the daemon writes those ids into the plan node it sends to Dispatch: `needs` on each task of a `plan_record` row, `[]` for a task that needs none. `register_plan` refuses a need that names no task of the plan, each set of tasks that need each other, named once by one cycle of it, the shortest from its first task in id order (`task a needs itself: a needs b, b needs a.`), and two or more tasks that no task needs. A refused plan''s answer (`409 PLAN_REFUSED`) names the first 20 causes of each kind and counts the rest of that kind in one more reason, in its `error` and in its `reasons`, so a 1 MiB attribute with a cause for each of its words or steps is answered in 3 to 12 KB, where a reason for each cause took 34 to 66 MB. The read of the needs and the check of cycles each take time linear in the plan. Measured nine times in three test pods, the read and both checks took 20 to 80 ms of CPU on a ring of 40,000 tasks, on 600 tasks each needing all the others (359,400 needs) and on 40,000 tasks each needing itself, and 80 to 120 ms on one task whose 350,000 words name no task. A plan of more than one task, or with a need, is still refused, since this release runs one task for each issue. Deploy Dispatch first: a Dispatch of the release before drops `needs`, and that run''s plan then reads its needs as not recorded. A rollback to the release before runs the statement of docs/kubernetes.md, "Rolling back the release that records each task''s needs", with the project''s daemon stopped, which takes `needs` off that project''s queued `plan_record` rows.'
