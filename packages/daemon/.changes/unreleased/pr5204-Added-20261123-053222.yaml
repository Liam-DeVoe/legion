kind: Added
body: |-
  A later version of an owner's plan can change the text of a running task alone: Legion takes
  it, the task goes on at its step, and every later start of the task holds the new text, a
  resume, a start sent again to a fresh session, a later step, a return and the retro included.
  The running agent is sent nothing for the version. A version that removes a running task or
  changes any other part of it is still refused. `register_plan` answers each running task's
  step and the role whose agent works it (`running`, contract 235), and the retro's task now
  holds the task's text. The owner's prompt puts a decision for an agent into its task's text,
  and on the project's default steps into a version whose one block is the task `default`.
