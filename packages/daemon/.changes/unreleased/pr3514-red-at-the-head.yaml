kind: Changed
body: |-
  The tester's and reviewer's role prompts give the role that holds an issue's phase one re-run of
  a red check the change did not make, at the head of its pull request, after it records the
  failure; the architect's prompt keeps the decision and gives the re-run to that worker, and the
  implementer's acts on a red only while it holds `implementing`. The merger's prompt queues a
  `failed_checks` ejection at an unchanged head once more, after it records it, and sends the
  work back only on the second such removal. The reviewer's prompt reads the head's checks as
  GitHub counts them for the pull request, never every check run at the commit: a required red the
  change made is a `REQUEST_CHANGES`, and one it did not make takes the head's one re-run first.
  It neither waits for nor re-runs a check the base does not require for the approval, and
  approves over a red of it the change did not make. The worker prompt (`go/worker-common.md`)
  gives the re-run to the role that holds the issue's phase alone.
