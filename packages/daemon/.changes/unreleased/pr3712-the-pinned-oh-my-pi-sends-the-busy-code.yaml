kind: Changed
body: |-
  The worker image runs Oh My Pi v18.18.6-sami.20261118-035823 (`.omp-pin`), whose refusal of a
  prompt sent while the agent is in a turn of its own carries `code: "session_busy"` on the
  refusal and on the prompt's result. The daemon reads a busy answer from that code, so such a
  prompt charges the claim nothing and its task is sent again when the turn ends. A pod moves onto
  the new image only at its update round, and until then its Oh My Pi sends that refusal with no
  code: the daemon reads it as busy, charging nothing, when its own record holds the claim working
  or when the agent's `get_state` says it is streaming. While the record does not hold the claim
  working, such an agent is charged as unrecognised for its refusal, and as a prompt that ran no
  turn for its prompt's result, until its pod's update round in two cases: it does not answer
  `get_state` within the RPC bound, or its turn ended between its refusal and the `get_state` ask,
  as when it refuses the task with its busy sentence during the pre-turn work of a notice and its
  turn on that notice has ended by the ask.
