kind: Fixed
body: 'The pod update sweep no longer waits for a relaunching claim when it marks a late round as told to the controller. The relaunch holds the lock of that claim for minutes, and the sweep waited on it, which held back every other issue the sweep had still to reach and the orphan reaping after it. The mark is now taken without waiting: a claim whose machine is busy is marked at a later sweep, and the round is not told again meanwhile.'
