kind: Added
body: |-
  `runtime.kubernetes.pod.controller_service_account` names the ServiceAccount of the pod of the
  controller the daemon launches; every other pod keeps `runtime.kubernetes.pod.service_account`,
  and an empty key changes nothing. The key is refused unless `controller: daemon`,
  `--check-config` names both accounts when it is set, and the relaunch and boot drift checks
  hold each pod to its own kind's account.
