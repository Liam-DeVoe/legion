kind: Fixed
body: |-
  The leak guard's private-name pass over a push no longer holds the push's whole diff and every
  record of it before it scans them. It reads git's added paths and diff as git writes them and
  scans each one as it arrives, so it holds a few records' worth and one commit's author,
  committer and message, whatever the size of the push's files, where a push adding 25,000 files
  of 1.25 GB took 6.1 GiB before; what grows with the push is the list of its commit ids. The
  report is the same, but a refusal now names at most 1000 lines and counts the rest in a last
  line of its own, so a push of many lines at a path a rule refuses no longer prints one line for
  each. A read of git's output ends with the push's bound, and one `WaitDelay` after git exits,
  even when a process git started holds the pipe open or keeps writing to it, as exec's own copy
  of a child's output does.

  A path that holds a space is now read as itself. git ends the `+++` line that names such a path
  with a tab, and the guard read that line whole: its report named the path with the tab after
  it, and where the path also held a control byte, a double quote or a backslash, which git
  quotes, it named git's C-quoted form with the `b/` prefix inside the quotes. The path rules and
  the path-scoped allowlist matched against those forms; they now match the real path, as for a
  path with no space.

  A refusal written to a log or a terminal now writes each byte below 0x20 and the byte 0x7f of
  its lines as `\x` and two hex digits, so a file name built with an escape sequence or a line
  break cannot act on the terminal that shows the refusal or start a line of its own.
