kind: Fixed
body: |-
  A listener's wake report that comes while an idle release is still stopping the session's pod
  is no longer dropped: the daemon applies it again every 30 seconds until the release records
  the claim released, for at most 15 minutes after the report, and then drops it with one
  warning. A wake records the time the daemon took it as the pod's resume time, not the time of
  the listener's report, so a wake that waited for a release is not reported stuck, and its claim
  is not reported stranded, while the new pod is still being built. A wake after a cancelled
  release, whose start is already queued, takes nothing. The task of a role woken by a message
  says what reaches it when Envoy stored or kept the message, and that a message Envoy did not
  store or keep must be sent again; the task of a role woken by a message to its session no
  longer says that nothing kept the message. A role wake report of another project decodes to no
  fact and writes no `processed_events` row. The role is read in either form of its name, the
  token alone or `<PROJECT>.<token>`, and a token named under another project is no fact either.
  A wake taken after the release recorded the claim released no longer cancels the release: the
  daemon logs `outbox: released the idle pod of an issue`, not
  `the idle release of an issue's pod did not finish` with hold `overtaken`, and the role starts
  once in the new pod, told that its pod was released. Its one resume is recorded against that
  release. While the project is paused, that wake is a wake the pause holds: its resume is
  recorded against no release, and its start waits for the pause's resume too. A wake that a
  pause holds, taken while the release that records its role still stands, is told the release's
  words once the release is recorded: its task then says that its pod was released. A release
  that is cancelled for another cause while the project is paused keeps that wake, and the woken
  role's task then says that the pause stopped its session. A notice, hook prompt, merge-queue
  removal message or merge-forward message for a released role of a pod that a release is still
  stopping waits in its outbox row until the release ends.
  A waiting retry logs
  `an intake fact waits and is applied again after its delay` at info.
