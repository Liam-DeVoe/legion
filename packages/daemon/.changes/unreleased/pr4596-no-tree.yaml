kind: Changed
body: |-
  The daemon stores no tree. It reads each parent and child question from its copy of Dispatch's
  `child_of` links: who acts on an issue (the architect the Dispatch chain names, nearest first),
  whether the issue may start and where it waits in the admission line, whether a parent may
  finish, and what a stop or a close does. A change of parent in Dispatch moves an issue's notices
  and calls to the architect the new chain names, and the issue's own architect, the one above it
  before and the one above it now each get one `reparented` notice, an architect that is two of
  them only one. An issue keeps its own run, phase, sessions, slot, design gate and pull
  request across a change of parent. Where the copy does not hold an issue's chain up to its top,
  the chain is unknown: the daemon starts nothing new on it, refuses an architect's call on it with
  `CHAIN_UNKNOWN`, lists the issue held `chain_unknown` when it has not started, and reads the
  chain again until it is known. The adoption of a closed tree's members, orphan roots, the stored
  ancestry and the hand-over of a lingering tree's children go. This release replaces #5303's
  return of a re-admitted root's members: a root's leave stops only its own claims and its return
  resumes its own phase, so no member waits for its root's re-admission; #5303's
  `20261123224717_members_owed` stays in the store, and this release neither reads nor writes it.
