kind: Fixed
body: |-
    A push to a public repository whose owner the project does not serve no longer fails in the
    leak guard's setup. The guard reads a destination's visibility through `legion gh`, and
    `legion gh` refuses an owner its gh bundle holds no directory for, so the guard could not read
    the visibility and refused the push, even when the push carried its own token. When `legion gh`
    gives exactly that refusal to the guard's REST read (exit 2, and the one line
    `legion gh: "<owner>" is not an owner of this project: <LEGION_GH_OWNERS_DIR> holds no gh directory for it`
    for that repository's owner), the guard reads the visibility with the unauthenticated
    `git ls-remote` that it already uses for a spent rate limit. Only exit 0, which lists the
    repository's refs, reads as public. A refused or failed `ls-remote`, which includes a private
    repository's 401, refuses the write as a setup error that names both reads. Any other refusal
    of `legion gh` refuses the write as before. `legion gh` now refuses a call naming such an owner
    before the guard runs, so that call still sends nothing.
