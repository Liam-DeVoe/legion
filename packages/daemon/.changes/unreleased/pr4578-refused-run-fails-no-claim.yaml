kind: Fixed
body: |-
  A turn the provider refused with an error that can clear fails no claim, however long the run.
  `POST /legion/v1/claims/turn-outcome` records the turn and fails nothing, since the report
  carries no HTTP status: the prompt result's status decides, so an overload goes back to the same
  session on the provider-error ladder, and a 4xx other than 401, 403, 408 and 429 fails the claim
  at once. A claim failed at its third refused turn before, at the shipped `launch_failure_limit`.
  A retry starts a new session only when its caller asks for one (`legion claims retry
  --fresh-session`, the controller's `fresh_session`).
