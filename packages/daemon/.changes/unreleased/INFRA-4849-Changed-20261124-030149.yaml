kind: Changed
body: |-
  The implementer and the tester run each `before_merge` check of the issue, not each check. A
  refusal of `release_children` or `rerun_child` under a root that the daemon has already accepted
  names the backward move that undoes it. The root's own close does not undo it, because that close
  lingers the tree.
