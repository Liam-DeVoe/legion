kind: Changed
custom:
  Issue: pr5158
body: |-
  The daemon checks the names of the operator's pod volumes (`runtime.kubernetes.pod.volumes`)
  at boot against the volumes Legion gives each pod slot, `<launcher|private|state|gh|agent-secrets-key>-<name>`.
  A name that is the volume of a slot of a role that exists now (Legion's roles, the controller, a
  role the deployment defines) is refused, since it would collide at every pod's build. A name of
  that form for any other agent name, such as `state-implementer-2` or `gh-cache`, is taken with a
  warning at boot: a plan can name such an agent, and its slot's volume would collide with it. A
  later release refuses that form too, so rename such a volume now.
