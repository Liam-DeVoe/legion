kind: Fixed
body: |-
  A claim can no longer register, or be relaunched into, another claim's session, which took that
  session's secret grants and its transcript. The daemon holds every name of a session to the
  first claim of its project that recorded it, whatever that claim's state since (live, suspended,
  failed or retired), in a new `claim_sessions` table: its id, its file's base name (which holds
  the path too), the id an Oh My Pi file name gives, and the id a Claude Code transcript is named
  for. A registration under a name another claim holds is refused with `409 session <name> is
  recorded for another claim of this daemon; …` before anything is recorded or enrolled, and a
  relaunch whose record names one is refused before anything starts; a claim's own earlier session
  and a session no claim has recorded register as before. A session id or a session file's name
  longer than 255 bytes is refused with `400`. At every boot the daemon holds, in one statement,
  each name a claim records that no row holds, as after a rollback to a release before this one,
  and logs at Error and suspends each claim whose current session records a name held for another
  claim or for none. An operator gives each suspended claim that is not the rightful holder a new
  session (`legion claims forget-session`, then `legion claims resume`), and for a name held for
  none records the rightful holder (`update claim_sessions set claim = '<token>' where project =
  '<project>' and kind = '<kind>' and name = '<name>'`) and resumes it. A name only an abandoned
  session records is logged at Warn and suspends nothing. A hold the store does not answer at a
  relaunch is tried again at the probe interval, charging nothing.
