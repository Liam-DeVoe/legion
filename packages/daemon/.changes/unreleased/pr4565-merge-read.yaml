kind: Changed
body: |-
  The role prompts and the merge-forward ask tell every role to make every merge of two commits
  with `legion merge`, and to make no merge and tell the architect when its `legion` has no
  `merge` command. The role prompts, the daemon's messages after a forward merge lands and the
  `HANDOFF_HEAD_MERGED_FORWARD` refusal read a merge's resolution with
  `git diff "$(git merge-tree --write-tree $(git rev-parse <merge>^1 <merge>^2) | head -n 1)" <merge>`
  in place of `git show --remerge-diff`, which can leave out a file git conflicts in. git rev-parse
  gives git the parents' full commit ids, as `legion merge` gives them, so git names a file it puts
  aside in a conflict as the merge names it. The daemon's messages, the refusal and
  `legion merge --help` give `git merge-tree` the option list of `legion merge`. The list sets
  git's merge options to their documented defaults and sets `merge.default` empty, so git merges
  each path that no attribute gives a driver with its built-in text merge. The list points
  `core.attributesFile` at `/dev/null`. So no global or repository merge option, no default driver
  and no user's attributes file changes git's merge. One exception is a driver that a
  configuration defines with an empty name (`merge..driver`). The repository's own attributes
  (`.gitattributes` and `$GIT_DIR/info/attributes`) and the machine's system attributes file
  still apply.
