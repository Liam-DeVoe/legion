kind: Changed
body: |-
  The role prompts and the merge-forward ask tell every role to make every merge of two commits
  with `legion merge`, and to make no merge and tell the architect when its `legion` has no
  `merge` command. The role prompts, the daemon's messages after a forward merge lands and the
  `HANDOFF_HEAD_MERGED_FORWARD` refusal read a merge's resolution with
  `git diff "$(git merge-tree --write-tree <merge>^1 <merge>^2 | head -n 1)" <merge>` in place of
  `git show --remerge-diff`, which can leave out a file git conflicts in.
