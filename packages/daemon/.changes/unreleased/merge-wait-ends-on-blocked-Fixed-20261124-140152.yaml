kind: Fixed
body: |-
  An approved review round no longer waits for good on a head GitHub answers `blocked` for. GitHub's
  merge state is its answer to the reader, not its verdict on the merge: a token without the
  workflows permission reads `blocked` for every pull request that changes `.github/workflows/`, and
  another pull request's check suite on the same commit can hold a required check `expected` that
  passed on this one. The round now ends on `blocked`
  once the head is MERGEABLE, every check run GitHub reported on it has concluded, and GitHub holds
  no review request open on the pull request; the merger's enqueue is then what GitHub answers about
  the merge, accepted or refused with its reason. A `blocked` head with a review request open still
  waits, and the architect and the reviewer are told once, with the count of open requests. The
  daemon records that count from the same read of the pull request (migration 20261124130001,
  `pull_requests.reviews_requested`). A CI settlement that concludes the head's last check under a
  recorded `blocked` now asks for a read of the merge state, and that read ends the round.
