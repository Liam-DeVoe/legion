kind: Changed
body: |-
  An issue's repository in Legion's record follows the repository Dispatch resolves it to, in the
  pass that reads the change: a live event, the boot listing, a hand-over, or a change of the
  project's repository mapping. The daemon replaces the issue's pod, each worker's next task names
  both repositories, and a saved bundle of the old repository is kept in `workspace_bundles_refused`
  and never restored into the new clone. A microVM pod's kept volume (`keep_volume`) does not drop
  that bundle: the volume holds the work only in the old repository's workspace, which the new pod
  does not work in. A repository Legion serves no installation of waits on the record, with its
  reason, and the issue is told what a person can do. A correction onto a
  repository no mapping names reads GitHub at that event (both Apps' installation, the spelling and
  the default branch) and never writes from an earlier read; such a waiting change is applied at the
  issue's next event or at the next boot. A mapping change's pass that runs out of its bound writes
  the corrections it has read, and its next pass reads the issues it did not reach.
