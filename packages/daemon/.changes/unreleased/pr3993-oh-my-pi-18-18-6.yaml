kind: Changed
body: |-
  The worker image carries Oh My Pi `18.18.6-sami.20261117-203324` of cybermonklabs/oh-my-pi,
  which `.omp-pin` now names as `github:cybermonklabs/oh-my-pi@<version>`. On this build a
  failed automatic Hindsight memory recall pauses the automatic recall for
  `hindsight.recallCooldownMs` (environment `HINDSIGHT_RECALL_COOLDOWN_MS`; 1 minute by default,
  doubling with each further failure in a row up to 30 minutes, or up to the setting when it is
  longer, and 0 turns the pause off). An automatic recall that answers ends the pause. The pause
  is kept in the process's memory, so a new process waits one recall timeout (30 seconds) on a
  server that does not answer before it pauses. So a recall that cannot answer no longer holds the
  start of every turn for its 30-second timeout.
