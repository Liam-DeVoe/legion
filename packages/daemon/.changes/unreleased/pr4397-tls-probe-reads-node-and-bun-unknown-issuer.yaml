kind: Fixed
body: |-
  The image probe's TLS check reads node's and bun's refusal of a chain whose root their store does
  not hold (`UNABLE_TO_VERIFY_LEAF_SIGNATURE`, `SELF_SIGNED_CERT_IN_CHAIN`,
  `UNABLE_TO_GET_ISSUER_CERT` and `DEPTH_ZERO_SELF_SIGNED_CERT`) as a refusal. It read each as
  unavailable before, which failed the probe of an image whose node or bun refuses the emSign or
  AAA chain that way. A client that accepts a chain is judged as before.
time: 2026-11-21T00:28:55Z
