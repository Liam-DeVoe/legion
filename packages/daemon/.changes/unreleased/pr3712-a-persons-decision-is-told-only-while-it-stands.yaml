kind: Fixed
body: |-
  A changes request a person's later approval answered is no longer told to an architect. One
  function decides whether a recorded decision still stands, and every task and notice about one
  asks it: the kept-decision relay, a catch-up at the moment it is delivered, and the resume task,
  which is now written when it is sent. A queued changes request is asked again when it is delivered
  to the architect, and again when its relay is published to the controller. A kept decision carries
  Dispatch's own mark of the review, so it is ordered against the approval by Dispatch and not by
  two clocks, and the only way to clear a generation first forgets a superseded decision and ends a
  queued changes request the person's approval answered. The sweep's re-send of a lost resume start
  is also rendered when it is sent. A changes request, queued to its architect, relayed to the
  controller or kept, is asked at the version reviewed, Dispatch's mark of the review and the
  document reviewed, so a kept request and its relay get one answer, and an approval of a document
  the gate has moved to answers neither. The same function decides whether a person's approval
  still stands: the approval a re-admission kept, a kept or relayed approval, the approval that
  answered a root's wait, which its resume task names, and the news of an approved version each ask
  it. An approval stands while the gate still holds that version of that document, or while the
  step has no gate, as after a re-admission cleared it; so one a later changes request cleared is
  no longer named, and the news is not told once the gate is gone. The resume task says the
  approval that answered the wait still stands where only a newer version has closed the gate
  since, and where it does not stand, it names the later approval or the changes request that
  ended it. The kept approval now records the document approved (store migration 20261122212816
  adds `readmitted_approvals.artifact`); a rollback takes the steps docs/kubernetes.md gives under
  contract 225.
