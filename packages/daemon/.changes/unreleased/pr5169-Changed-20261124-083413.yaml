kind: Changed
body: |-
    **Breaking:** a role of `legion.yaml`'s `roles` named `sub-owner`, or whose name starts with
    `sub-owner-`, now fails the config load. The daemon does not boot until that role is renamed.
    `sub-owner` is the claim role of a task's sub-owner, and each sub-owner's agent is named
    `sub-owner-` and its task.
