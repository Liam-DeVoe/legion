kind: Fixed
body: |-
  A program the daemon writes and then runs, or hands to a program that runs it, can no longer be refused with "text file busy". Linux refuses to run a file some process holds open for writing, and a child a Go process starts from another goroutine holds every file the process has open until it runs its own program. Two places were exposed in a deployment: the tmux daemon's one-shot git credential helper, which it writes while other goroutines start git, tmux and token commands, and the leak check an issue pod's launcher installs and at once runs, while it starts its roles' processes; under gVisor, the default pod sandbox, the kernel does not refuse such a run, so the second is exposed only where a pod runs a Linux kernel. Beside eight goroutines that start processes, measured on a Linux kernel, the helper was refused 28 times in 400, the installed check 23 in 300. Two other places start no process while they write today, so a deployment could not meet it there: the `legion`, `gh` and `git` scripts of a pane's PATH (written at daemon boot and `legion controller start`) and a role's copy of the pod's config home. A role's private copy of the leak check is written by `legion gh` and `legion leak-check`, which do start processes beside it, and was safe because it already held every fork back while it wrote. All of these are now written the same way.
  Each such file is now written while every fork of the process waits for the write to close it, and its mode no longer depends on the umask: an installed leak check's files take the served archive's mode less group and other write, the modes they had under the usual umask 022, and a role's copy of the config home takes its source file's mode exactly.
