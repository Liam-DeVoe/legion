kind: Changed
body: |-
  The worker image's `legion-testpg` starts the pod's test Postgres with `max_connections=491`, up
  from 483. One Dispatch process may now open 117 connections (`store.ConnectionsPerProcess`),
  because the records job and the reviewer's sweep of held texts each take a lease connection of
  their own. Four Dispatch processes and the suite's own 20 clients need 488, and Postgres keeps
  three more for superusers.
