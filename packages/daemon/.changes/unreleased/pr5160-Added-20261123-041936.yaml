kind: Added
body: |-
  An owner's plan can define a role of its own in a `plan_role` block: the block's id is the
  role's name, `type` is its type, `model` is its model and the block's text is its prompt. A step
  names the role as it names any other, and the role's agent runs on Oh My Pi with that prompt and
  model. The prompt stands between two lines that name it as the issue owner's text. A later
  version of the plan that changes the role's type, model or prompt relaunches a live agent of the
  role on its own session at its next step, with the new definition. `register_plan` refuses a role
  whose name Legion or the deployment already holds, a model the deployment does not list, and a
  key whose steps name roles of two models or two harnesses.

  The new top-level `legion.yaml` key `models` lists the models a role of a plan may name; the
  model of each role of `roles` is listed after them. The loader refuses a value of `models` that
  is not a list, and an entry that is not one model's name, as a missing comma makes, or that
  names a model again. A `default_steps` key that names one agent for roles of two models or two
  harnesses is taken with a warning at boot and at `legion config check`, its later such step runs
  as an agent of its own, and the next release refuses it. A model taken out of `models` stops, at
  the next boot, each task whose remaining steps name a role of the issue's plan on that model,
  with a `task-stopped` notice whose reason names the model.

  One migration adds the table of the roles a plan defines. A rollback runs its way back, and
  removes `models` from `legion.yaml` first, since an earlier daemon refuses the key.
