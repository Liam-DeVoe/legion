kind: Changed
body: |-
  The answer loop tells the model how to call its `gh` tool. A proof run found a loop that spent
  its whole `model_calls` bound on refused `--version` and `--help` probes and on calls that named
  no repository, then replied with nothing in its answer, which was posted to a person. The tool's
  description is now built for each answer: GitHub's own gh, run by the daemon as the agent's role
  App in an empty directory with no checkout of any repository, so every call names its
  repository (`-R <owner>/<repo>`, a github.com URL, or a `repos/<owner>/<repo>/…` endpoint for
  `gh api`); the repository the agent's issue works and, where the daemon's record holds one, the
  issue's pull request number; the commands the tool takes; and one example call that runs as
  written against that repository, which the input schema gives too. The system prompt's sentence
  on `gh` says the same. The tool still writes (comment, review, merge and the other writes its
  rules allow) when the message asks for it, with the Legion footer on every comment or review.

  A call naming no gh command, gh's `--version`, `--help` or `-h` on its own, and a command the
  tool does not take are refused with their reason and then the same guidance, and a call gh ran
  that failed with git's `not a git repository` carries gh's output and then the guidance; the
  guidance is part of what `answer_tool_calls` records for the call. Other refusals keep their own
  reason. The last model call of an answer, the one that offers no tool, now carries a short
  message saying it is the last call and to reply now in the reply form; that message is the
  loop's own and is never written into the agent's conversation, so the appended exchange is the
  same as before.
