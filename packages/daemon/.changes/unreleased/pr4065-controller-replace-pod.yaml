kind: Added
body: |-
  The daemon serves the project's controller `POST /legion/v1/issues/pod-update` (`grantId`,
  `issue`), which opens the daemon's update round over that issue's pod as a drift opens one, with
  reasons that say the controller asked for the replacement. Each role of the pod is asked to push
  its work and answer `ready_for_update`, and the sweep replaces the pod once each has answered or
  at the round's bound, whether or not the pod has drifted. The opening is held to
  `pod_update_max_open_rounds` and `pod_update_rounds_per_minute` as a drift's opening is, and a
  request they hold back is refused `409 POD_UPDATE_LIMITED`, naming the limit. A round already open
  over the pod is answered as it stands, with `opened` false. The route takes a controller grant
  alone, and refuses an issue of another project or with no claim (`404 NO_CLAIM`), an issue whose
  claims run no worker in a pod (`404 NO_POD`), and an issue whose pod is being replaced already
  (`409 POD_CHANGING`). The route answers 200 only once a claim of the issue records the round in
  the store, which a restart restores and the sweeps carry; a round no claim records within 30
  seconds is refused `503 POD_UPDATE_NOT_RECORDED`. A request waits for the update-round sweep's
  walk over the project's issues while it lasts and at most 30 seconds; one that waits longer, or
  ends first, opens nothing and is refused `503 POD_UPDATE_BUSY` with `Retry-After: 60`, the
  sweep's interval, which its sentence names too.
