kind: Changed
body: |-
  The reviewer's role prompt says how it refuses an approval while a `before_merge` check of the
  issue has no pass standing at the reviewed head from the implementer and from the tester both:
  with a `REQUEST_CHANGES` it submits at once, naming each such check and each role whose pass is
  missing there. A check of the issue whose pass lacks one role is not the required check with no
  run at the head that the worker skill waits on, so it takes no `WAITING` line. The rule for an
  issue with no Verification document, or none with a `before_merge` check, is now a paragraph of
  its own, so the paragraph that names that gap still asks for no changes.
