kind: Fixed
body: 'A pod update round''s ask that waits in the outbox no longer reaches a role that answered the round while the ask waited, nor a claim that the daemon started again in another pod than the round''s own. Before, the row checked only the round and whether an earlier ask had reached the role, so the role read the ask again after its answer. Such a row now ends on the line `outbox update ask finished without a publish: the role answered its round` or `outbox update ask finished without a publish: the claim left its round''s pod`, and it marks no delivery.'
