kind: Fixed
body: |-
  No GitHub review's `commit_id` stands for the head a reviewer read. GitHub rewrites a review's
  `commit_id` to the pull request's current head, so its record of a review can name a head the
  review never saw — an approval of one head has been seen listing, as its `commit_id`, a merge
  pushed two days later. The reviewer's verdict names the head it read in its own words instead,
  the commit its completion of reviewing carries, and that is the head the round is decided at.
  A review the daemon reads from GitHub's list, where that id has moved, decides nothing. A
  person's request for changes still refuses the head by its webhook, on the `commit_id` that
  event carried.
