kind: Changed
body: |-
  The answer loop asks once again for a reply its form's own rules refuse, instead of passing the
  question on as `malformed` at once. A proof run found the model answering `not_answered` with
  an empty `needs`: the reply schema allows it, since the strict schema subset the providers
  enforce takes no `minLength`, `pattern` or `anyOf`, and the daemon then refused the reply. The
  schema's field descriptions now state the two rules (a `not_answered` or `needs_work` reply
  names what it needs, and every kind but `none` carries text), and a reply that breaks one is
  answered with the daemon's reason as a message after it and asked for again, within the same
  `model_calls`, `answer_seconds` and `output_tokens`. A second such reply, or one made on the
  last allowed call, is still `malformed`. The exchange appended to the agent's Oh My Pi session
  or Claude Code transcript holds the refused reply, that message as a user message and the
  reply after it, in that order, so the agent resumes holding the run as it happened.
