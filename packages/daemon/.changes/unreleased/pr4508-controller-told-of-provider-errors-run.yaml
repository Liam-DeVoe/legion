kind: Fixed
body: 'The project''s controller is told of each run of six provider-error turns on one worker, once, whatever comes after the run. The daemon''s store keeps the notice each run owes until the daemon writes it, across a clean turn, a compaction, a new session, a daemon restart and a later run of the same worker that reaches six too, whose notice is kept beside the first run''s and never in its place. The daemon writes the notices while a controller is registered: at each failed turn of a run from the sixth on, at the run''s end, at the controller''s registration, and at every fact, tick and boot. So runs that reached six while no controller was registered, which is the default since an operator launches the controller, are told when one registers, in one notice per worker that names each run, and a notice whose write failed is written at the next of those moments. A later run of the same worker is told while an earlier run''s notice still waits unsent. The notice is published only once the session registered as the controller follows the controller topic at the Envoy listener: a controller registers with the daemon before it claims its role and follows the topic, and a notice published in between could reach no session. Until then the notice waits in the outbox on its backoff, read again at most a minute apart, and holds no other row back. An update round''s question now waits behind the task its worker holds, the task in its turn or the one a provider error kept for its next send, and goes once the worker holds no task. Migration `20261119114140_provider_errors_told` adds to `claims` the run''s number and the mark that it was told, the table `provider_errors_owed` of the runs owed and not yet told, a trigger that numbers a run an earlier release begins, so a rollback and a roll forward leave no old mark that matches a new run, and a trigger that owes the notice of a run an earlier release takes to six. A worker whose run already stands at six or more at the upgrade owes its notice at once, live, retired or failed alike, since a retired or failed worker can run again in a fresh session that puts its run back to zero; the notice says that the earlier release kept no model and no HTTP status of it. The project controller''s own claim owes no notice. The earlier release kept no mark of whether it told a run, so the controller can be told of such a run a second time, at the upgrade and after a rollback and a roll forward.'
