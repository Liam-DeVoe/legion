kind: Fixed
body: 'The project''s controller is told of each run of six provider-error turns on one worker, once, whatever comes after the run. The worker''s claim keeps the notice the run owes until the daemon writes it, across a clean turn, a compaction, a new session and a daemon restart, and the daemon writes it while a controller is registered: at each failed turn of the run from the sixth on, at the run''s end, at the controller''s registration, and at every fact, tick and boot. So a run that reached six while no controller was registered, which is the default since an operator launches the controller, is told when one registers, and a notice whose write failed is written at the next of those moments. A later run of the same worker is told while an earlier run''s notice still waits unsent. An update round''s question now waits behind the task its worker holds, the task in its turn or the one a provider error kept for its next send, and goes once the worker holds no task. Migration `20261119114140_provider_errors_told` adds to `claims` the run''s number, the notice it owes and the mark that it was told, and a trigger that numbers a run an earlier release begins, so a rollback and a roll forward leave no old mark that matches a new run. A worker whose run already stands at six or more at the upgrade owes its notice at once: the earlier release kept no mark of whether it told that run, so the controller can be told of it a second time.'
