kind: Fixed
body: |-
    The daemon boots when its project has no repository mapped in Dispatch, where it refused the
    boot and its supervisor restarted it into the same refusal. It serves none and admits nothing,
    telling each issue, and each architect whose child it refuses, that the project has no
    repository mapped and to map one. While it serves no repository, because the project maps none
    or every repository it maps is left out, it reads the mapping again on its own, 30 s doubling
    to 10 min and starting again at 30 s on each new mapping and each transition into serving none,
    as well as on each mapping change, so a repository mapped later or an App installed after its
    repository was mapped is served with no restart. The reads stop once any repository is served,
    and a project that serves one boots as before.

    Every way into serving no repository (an empty mapping at boot, the last repository unmapped
    while the daemon runs, every mapped repository left out at boot or on a later read) now logs one
    ERROR line, `workflow: the daemon serves no repository, so it admits nothing and reads the
    mapping again`, with `project` and `cause`, once each time the daemon comes to serve none.
    Unmapping the last repository and leaving out every one logged only at INFO before. The line
    replaces the boot's `workflow: every mapped repository's GitHub App installation read failed,
    so the daemon boots serving none and reads them again`, so a log filter or alert on that message
    needs the new one. Plain `legion state` prints a `repositories:` line, naming what the daemon
    serves and each repository it leaves out, on every daemon that runs the workflow.
