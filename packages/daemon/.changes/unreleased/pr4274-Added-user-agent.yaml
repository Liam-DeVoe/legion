kind: Added
custom:
  Issue: pr4274
body: |-
  The daemon's Dispatch client names the daemon and its build in every request's `User-Agent`,
  `legion-daemon/<release>`: the release a release binary was built for, else the commit its build
  links, else `(devel)`, what `legion version` prints, so Dispatch's access log tells the daemon's
  calls from every other client's. The calls still go to `/api/v1`, which Dispatch now marks
  deprecated.
