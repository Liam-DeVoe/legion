kind: Fixed
body: |-
  An update round's ask to a role whose agent is not running, a suspended claim (the idle
  release's among the rest) or a failed one, is no longer published. The listener raises the role's wake for a
  publish to a holder that has lapsed, so such an ask brought a released pod back only to be asked
  about the pod the round replaces. The row now finishes with nothing published and nothing
  marked, and the daemon logs `outbox update ask finished without a publish: the claim's agent is
  not running`; the sweep asks the claim again once its agent is ready.
