kind: Fixed
body: |-
  A production check backs off a checking role that keeps failing. Before, each look's start
  retried a failed claim with a fresh budget, so a role that could not start (a pod that died in
  `workspace-init` every time, say) was launched a whole `launch_failure_limit` of times at every
  look, every two hours, until the check's bound fourteen days on. Now the claim's failure, in a
  look or after it ended, ends the look, and the next look comes two hours later after the first
  such look and twice as long after each failed look in a row after it (4 h, 8 h and so on, never
  past the check's bound), until a look the role reports sets it back to two hours. That look's
  start retries the claim with one attempt left of each budget its failure spent (the launch
  budget, the deaths, or the prompt retirements), so one more failure of the same kind fails it
  again at once; a failure that spent no budget, a provider error's or a prompt refused at launch,
  starts a fresh run as before. The architect's `worker-died` notice now names the cause, how the
  last pod ended and when the next look retries the claim, and a failure between looks, which
  used to tell nobody, sends one too. An operator's `legion claims retry` and the controller's
  `fresh_session` still give the whole budget. The count of failed looks is kept in a new column,
  `production_checks.failed_looks` (migration `20261124131010_production_check_failed_looks`); a
  rollback runs the way back in that migration's header first, with every daemon of the database
  stopped.
time: 2026-11-24T13:15:00Z
