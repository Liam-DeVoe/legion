body: |-
    The worker image's `legion-testpg` starts the pod's test Postgres with `max_connections=487` rather than 483, because a Dispatch process may now open 116 connections rather than 115: four processes at 116 plus the suite's own 20 clients (`testlimits.ServerConnections`), and the three slots Postgres reserves for superusers.
