kind: Added
body: |-
  The answer loop has a second tool, `dispatch`: Dispatch's own `dispatch` command, the one a
  Legion pane runs, run as the stopped agent's own session with the Dispatch token the daemon
  gives its pane or pod, in an environment of nothing of the daemon's own (an empty HOME, the five
  DISPATCH variables, and a PATH of bun's directory and /bin). It runs the reads read, doc-read,
  search, related, issues, projects, priorities, open-asks, answers, whoami, limits, handoff-read,
  steps, plans, results and inbox, and the writes comment, message, send-to-agent and
  resolve-comment; every other command is refused before it runs, as is an option that hands it a
  file of the daemon's host (a `--<field>-file` or `--<field>-json-file` whose value is not `-`, or
  `--image`). Each comment, message and agent's message it posts carries the loop's mark, so the
  loop answers none of them. Each call has a gh call's time and output bounds, and an answer makes
  at most `answers.bounds.gh_calls` dispatch calls, counted apart from its gh calls, as gh's calls
  are now counted apart from its dispatch calls. Each call is recorded in `answer_tool_calls`; a
  call the daemon stopped during is told to the next run as of unknown outcome, and the daemon's
  reply on a fault names each dispatch write. The daemon finds `dispatch` at boot at
  `LEGION_DISPATCH_PATH`, else on PATH, else at `/opt/legion/pi-envoy/bin/dispatch`, and `bun` at
  `LEGION_BUN_PATH` or on PATH; a daemon that finds neither offers no dispatch tool. The boot log's
  `answers: tools` line and `legion config check` name the loop's tools and why one is not
  offered. Store migration `20261124072849_answer_tool_calls_tool` adds `answer_tool_calls.tool`.
