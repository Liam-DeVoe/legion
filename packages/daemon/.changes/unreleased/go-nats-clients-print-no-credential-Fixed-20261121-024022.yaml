kind: Fixed
body: |-
    A `nats_urls` entry the loader refuses is named by its position alone (`nats_urls entry 2 must
    be a valid URL`), never by any of its text. A user name or password holding an unescaped `/`,
    `?`, `#` or space ends the URL's host part early, so the refusal quoted the credential whole
    and nothing that strips a URL's user name and password found it; a refused entry's query,
    where a person can put a token, printed too. Two entries that used to load are now refused:

    - one holding a comma, which the NATS client reads as the end of a server URL. Such an entry
      was a list of servers in one entry, which loaded and connected to each, or a credential
      holding a comma, whose pieces the client read as servers. List each server as its own
      `nats_urls` entry, and write a comma in a credential as `%2C`.
    - one with an `@` after its host, which is how a token holding a `/` written as the URL's user
      parses: it loaded with the token's head as the host. Write such a credential percent-encoded.

    The daemon's NATS connection refuses the same URLs, by position, and a websocket URL whose path
    stops parsing once the NATS client's handshake decodes it; its `NATS connection restored` line
    names the server without its user name; and the refusal of a loopback or unspecified host under
    `runtime: kubernetes` names the URL by its scheme and host alone.

    A `provider_keys` refusal of a variable that is no variable name names its entry by position
    (`provider_keys entry 2: its key …`), and of a value that is no secretsd key's name names the
    variable it is for, never the value. Every boot error and log line about an entry's secretsd key
    names the entry by its variable alone (`provider_keys.GEMINI_API_KEY: secrets get [the key name]
    --value failed …`), with `[the key name]` where the command's stderr quoted it. A provider's key
    pasted where its name goes, one made only of letters, digits and underscores among them, printed
    whole in each.
