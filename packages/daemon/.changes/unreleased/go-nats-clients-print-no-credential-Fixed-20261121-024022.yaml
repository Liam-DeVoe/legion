kind: Fixed
body: |-
    A `nats_urls` entry the loader refuses is named by its position alone (`nats_urls entry 2 must
    be a valid URL`), never by any of its text. A user name or password holding an unescaped `/`,
    `?`, `#` or space ends the URL's host part early, so the refusal quoted the credential whole
    and nothing that strips a URL's user name and password found it; a refused entry's query,
    where a person can put a token, printed too. Two entries that used to load are now refused: one
    holding a comma, where the NATS client splits its list, so it could never connect, and one with
    an `@` after its host, which is how a token holding a `/` written as the URL's user parses (it
    loaded with the token's head as the host). Write such a credential percent-encoded. The
    daemon's NATS connection refuses the same URLs, by position; its `NATS connection restored`
    line names the server without its user name; and the refusal of a loopback or unspecified host
    under `runtime: kubernetes` names the URL by its scheme and host alone.
time: 2026-11-21T02:40:22Z
custom:
    Issue: go-nats-clients-print-no-credential
