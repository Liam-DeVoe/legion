kind: Changed
body: |-
    The worker image's `legion-testpg` starts the pod's test Postgres with `max_connections=475`
    rather than 471: the Legion sampler Dispatch runs for this change takes one more connection of
    the lease pool, so one Dispatch process may open 113 rather than 112, and the script's number is
    four of those plus the suite's own clients and the slots Postgres reserves for superusers
    (`testlimits.ServerConnections`, which `testlimits_test.go` holds the script to).
time: 2026-11-15T07:00:00Z
custom:
