kind: Added
body: |-
    The worker image carries `gh stack` (github/gh-stack v0.3.0), the GitHub CLI extension for
    stacked pull requests, pinned by version and by the sha256 of its binary, at
    /opt/legion/gh-extensions/gh-stack. gh reads an extension only from its data directory, which
    in a pod is on the issue's scratch, so the worker shim links each extension the image ships
    there before the agent starts, and leaves an entry already there as it is. The pod's `gh`
    wrapper still refuses extensions, so `gh stack` is not yet usable through it. The merger's
    instructions now say how to land a pull request that is part of a stack: once no pull request
    below it is open, through GitHub's asynchronous merge call at the head it read, with the
    stack's target branch deciding the rules and the merge queue; a stack lands bottom first,
    each layer through its own issue's merger.
