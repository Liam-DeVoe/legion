kind: Fixed
body: |-
  A worker that starts while another role's merge forward of the head is still owed is told to
  wait for it, as the worker of the phase the merge was asked in is told: on a move forward or back,
  in any order of a task's steps, after a read that finds the head mergeable, and on the
  architect's retry of a held phase and the operator's restart of a phase's worker. The planner
  gets the hold and the landed message, and its completion at a head a merge forward replaced is
  refused as the tester's and the reviewer's are; on the default steps that is a planner that a
  move back starts while the implementer's ask is open. The reviewer's review of a landed merge
  tells the worker of the phase the issue stands in, the planner included. One merge of one head
  has one asked role: where a move leaves the implementer's ask of `implementing` owed by nobody,
  or the merger is asked for its head, the implementer is told once that the merge is no longer
  its work, and its ask is delivered no more. A move back out of `merging` asks the merge of the
  role of the phase it enters, with its hold. An ask whose role's claim ended keeps its held
  workers held, is told to the owning architect in the claim's notice, and is sent again at that
  role's next start. The news of an approved design to the architect that holds an issue in
  `accepting` names, as its move-back targets, the phases of the task's steps before the
  acceptance.

  The release before refuses a merge-forward row whose step is `withdrawn` and a hold or landed
  row to the planner. A rollback past this release deletes those queued `merge_forward` rows first
  (docs/kubernetes.md, "Rolling back the release that holds every worker while a merge forward is
  owed").
