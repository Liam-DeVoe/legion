kind: Fixed
body: |-
  A worker that starts while another role's merge forward of the head is still owed is told to
  wait for it, as the worker of the phase the merge was asked in is told: on a move forward or back,
  in any order of a task's steps, after a read that finds the head mergeable, and on the
  architect's retry of a held phase and the operator's restart of a phase's worker. The planner
  gets the hold and the landed message, and its completion at a head a merge forward replaced is
  refused as the tester's and the reviewer's are; on the default steps that is a planner that a
  move back starts while the implementer's ask is open. The reviewer's review of a landed merge
  tells the worker of the phase the issue stands in, the planner included. One merge of one head
  has one asked role: where a move leaves the implementer's ask of `implementing` owed by nobody,
  or the merger is asked for its head, the implementer is told once that the merge is no longer
  its work, and its ask is delivered no more. A move back out of `merging` asks the merge of the
  role of the phase it enters, with its hold. Each launch of an asked role is told an owed ask
  once: an ask whose role's claim ended - it failed, an operator stopped it, or its agent reported
  its own exit - keeps its held workers held and is sent again at the ready of that role's next
  launch, unless a row of it is still queued for that role; that row's end, delivered or not, reads
  the role's claim again and sends the ask to a later launch the row did not reach, so a launch that
  comes ready while the row ends is told too. The record's ask keeps the launch it was delivered or
  sent to (`sentLaunch`), and a failed claim's notice tells the owning architect. One case can be
  told two times: a launch that resumes the session of an earlier launch, where the message was
  stored for that session. Envoy stores a message for a session, and it cannot say which launch read
  it: the resumed launch reads the copy stored for its session and is asked again at its ready, or
  the earlier launch read it before it ended and the resumed one is asked again. The second ask
  names the same merge. So can a launch that runs a new session and takes the message in the moment
  between the daemon's read of the launch and the publish. The news of an approved design to the
  architect
  that holds an issue in `accepting` names, as its move-back targets, the phases of the task's steps
  before the acceptance.

  The release before refuses a merge-forward row whose step is `withdrawn` and a hold or landed
  row to the planner. A rollback past this release deletes those queued `merge_forward` rows first
  (docs/kubernetes.md, "Rolling back the release that holds every worker while a merge forward is
  owed"). An ask sent again at a launch is a plain ask row, which the release before delivers. The
  release before reads the record's ask without `withdrawn` and `sentLaunch`, drops both at its
  next write, and sends no ask again at a role's next launch.
