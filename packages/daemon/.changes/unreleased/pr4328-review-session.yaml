kind: Changed
body: |-
  No session other than the reviewer's can decide a review round. Before, in an issue's first
  round, an approval or a request for changes from any session that held the review App's token
  decided the round, so the controller, an architect or a role of a sibling tree could decide it.
  Now the round is decided by the reviewer's verdict, which only the reviewer's own claim can send
  with its completion of reviewing, and a GitHub review written with the one App's token decides
  nothing, whichever session wrote it. A person's request for changes still refuses the head.
