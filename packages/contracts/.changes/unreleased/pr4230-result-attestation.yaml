kind: Changed
body: |-
  The statement types of a CI job's result are named for both results routes: `ResultAttestation`, `ResultPredicate`, `ResultTest`, `ResultRun` and `ResultRecorder` (before, `SpecCheckAttestation`, `SpecCheckPredicate`, `SpecCheckTest`, `SpecCheckRun` and `SpecCheckRecorder`). `CheckResult` gains `branch`, `attestation`, `not_counted` and `at_branch_head`, and `CheckBlock` gains `branch_heads` and `recorded_results`; `CheckBasis` gains the kind `branch_head`, and `CheckPassStands` gains `reason` and `subjects` (`PassStandsSubject`), the state of each head a `before_merge` check's pass must stand at. `checkWithNewerFields` puts `branch_heads`, `recorded_results` and `at_branch_head` back into `compared_with`, `results` and `commit_stands` for a reader of this build. The `dispatch_result` and `dispatch_results` tools say that a CI job records the result of a check its `ci_check` names, and the issue form of `dispatch_results` takes `json`.
