kind: Fixed
body: 'The help of `dispatch_read` says a document summary names its approval only once its approval has been asked for. The help of `dispatch_inbox` says the Needs you heading lists the asks alone, and that its count also counts the credential requests the person may decide, which are listed under Credential requests. Both now say what the command prints.'
