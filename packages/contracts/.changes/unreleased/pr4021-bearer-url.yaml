kind: Changed
custom:
  Issue: pr4021
body: |-
  The shared redaction fixture (`capability-redaction.json`) expects the whole word after a
  `Bearer` or an API-key label masked, a URL included, and its `note` says that the fixture is the
  fixed list of shapes the rules cover: a secret that no named pattern marks, such as a positional
  argument, is not masked.
