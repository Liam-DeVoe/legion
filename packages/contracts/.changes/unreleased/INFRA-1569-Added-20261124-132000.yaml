kind: Added
body: |-
  `@legion/contracts/daemon-contract` exports `daemonContract(manifest, from)`, the daemon API
  contract a plugin build speaks (dispatch://INFRA-1569). It returns the manifest's
  `legion.daemonApiVersion` where the manifest holds one, as every packed plugin's does. Else, in
  a checkout (a directory from `from` up that holds
  `packages/contracts/fixtures/daemon-api/released-contracts.json`), it returns the greatest
  number of that list plus the count of entry fixtures beside it, `contracts/*.json`. Else it
  throws, naming both.
time: 2026-11-24T13:20:00Z
custom:
  Issue: INFRA-1569
