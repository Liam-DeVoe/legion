kind: Added
body: |-
    `CONTAINER_MARKER_PATTERN` is the regular expression source of one container marker a block nested in a quote, a list item or a footnote is written after: `>`, a list marker (`-`, `*`, `+`, or a number and `.` or `)`) followed by a space or a tab, or a footnote label `[^label]:` with a label that is not blank. `askOpenerLines(markdown)` returns each line of a document that opens an ask block (`:::ask{`), without its indentation and the container markers (`CONTAINER_MARKER_PATTERN`) before it; it skips every line of fenced code, a fence of backticks or tildes, and of the front matter a document opens with, so an opener quoted in either is not read as one. The web's reader of the answer a Dispatch of the release before writes on an ask block's opening line, `dispatch doc-read`'s answer lines and `dispatch request-approval`'s check for open ask blocks read the opening lines through it.
