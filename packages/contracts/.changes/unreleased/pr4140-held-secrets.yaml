kind: Added
body: |-
    `@legion/contracts/held-secrets` is the backstop under the rules of `log-text`: the secrets a
    process holds (`holdSecret`: its broker token, its Dispatch and Envoy bearers, the identity
    tokens it trades, a sign-in's refresh token and client secret, the contents of every secret
    file it reads), and `scrub(text)`, which every line the clients print passes. Each held value
    of 10 or more characters, and each run of 10 or more of its characters, prints as
    `<withheld>`; a line that holds none comes back as itself. `scrubError` scrubs an error a host
    prints whole, and `scrubProcessStreams` passes a process's stdout and stderr through the scrub.
