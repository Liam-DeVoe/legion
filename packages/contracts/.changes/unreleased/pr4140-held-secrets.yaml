kind: Added
body: |-
    `@legion/contracts/held-secrets` is the backstop under the rules of `log-text`: the secrets a
    process holds (`holdSecret`), and `scrub(text)`, which takes each held value of 10 or more
    characters, and each run of 10 or more of its characters, out as `<withheld>`; a text that
    holds none comes back as itself. It looks each of a line's 10-character windows up in one set
    of every held value's windows, so its cost grows with the line, not with the secrets.
    `scrubError` scrubs an error's message, stack and causes in place, and `scrubProcessStreams`
    passes a process's stdout and stderr writes through the scrub. `holdUrlUserinfo(url)` holds a
    configured URL's user and password, as written and decoded, and the `Authorization: Basic`
    value Bun's fetch builds of them. What holds a value and what scrubs a line is named by each
    client's own changelog; broker-client, which keeps none, holds the subject, actor and access
    tokens of every trade, a sign-in's refresh token and client secret, and the user info of the
    broker's, the issuer's and Google's URLs, and scrubs the text of a broker refusal
    (`BrokerRefusedError`) where the error is made. It prints the exchange policy's refusal of a
    subject token only where it is one of the policy's own sentences, each slot the shape of what
    fills it, as the Go refusal corpus writes them; any other wording is withheld.
