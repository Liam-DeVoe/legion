kind: Added
body: |-
  The Dispatch tool specs add `dispatch_lens`, `dispatch_lenses`, `dispatch_finding`,
  `dispatch_risk`, `dispatch_constraint`, `dispatch_constraints`, `dispatch_pointer`,
  `dispatch_state`, `dispatch_proposed`, `dispatch_settle` and `dispatch_premortem_convert`, and the
  OpenAPI document gives a graph node its `state`, its `visibility` and the new node kinds
  (`interaction`, `lens`, `lens_kind`, `risk` and `constraint`). Each member added to an existing
  response schema is optional.
