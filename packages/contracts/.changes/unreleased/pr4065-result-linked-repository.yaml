kind: Changed
body: |-
  The `dispatch_result` tool's description, which `dispatch result --help` prints, states the
  commit rule: Dispatch takes a commit of the repository of the check's issue, or of a repository
  in which the issue's external links name an open or merged GitHub pull request, and
  `400 RESULT_COMMIT_UNKNOWN` names each repository that Dispatch asked. The generated
  `POST /api/v1/issues/{key}/results` description states the same rule, and the generated
  `GET /api/v1/issues/{key}/results` description says that a `before_merge` check is compared
  with the heads of those linked pull requests too.
