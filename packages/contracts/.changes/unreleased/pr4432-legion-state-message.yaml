kind: Added
body: |-
  `legionStateSubject(token)` is the subject of a Legion deployment's state lane,
  `notifications.legion.<token>.state` (`LEGION_STATE_SUFFIX`, and `LegionStateSubject` in the
  `Subject` union). `bun run gen:go` writes it into Go as `LegionStateSubject` and
  `LegionStateSuffix`. `legionStateMessage` is one message of that lane: the state events of one
  committed daemon transaction, with `project`, `run`, `firstSeq`, `seq`, `at` and `events`, each
  event a `change`, an `admission` or a `boot`. The daemon block of the state answer reads
  `stateSeq`, which is optional: the sequence of the newest state event that the answer's
  snapshot holds (daemon API contract 166). `fixtures/daemon-api/state-events.json` is the
  daemon's golden of the lane.
