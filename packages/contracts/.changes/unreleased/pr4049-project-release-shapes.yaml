kind: Changed
body: |-
  The daemon API contract is 191. `legion-api.ts` gains `LegionProjectReleaseRequest` and
  `LegionProjectReleaseResponse`, the bodies of `POST` and `GET /legion/v1/operator/project/release`,
  and the state's optional `projectRelease`, the project's newest project release, which a caller
  in a pod below contract 191 is not served. Its `outcome`, `endedBy` and a stopped claim's `ended`
  are enums of the words the daemon writes, `LEGION_RELEASE_OUTCOMES`,
  `LEGION_PROJECT_RELEASE_ENDERS` and `LEGION_RELEASED_CLAIM_ENDS`, each held to the daemon's own
  list in `fixtures/daemon-api/project-release-words.json`. A claim's `suspendedBy` gains
  `project_release`, a claim the project release stopped, which the daemon's next boot starts
  again. The release's refusal while the project is paused or a pod a pause stopped is still held
  is `PROJECT_PAUSED` with `heldPods` (fixture `project-release-paused.json`), and a pause while a
  project release runs is refused `PROJECT_RELEASING` (fixture `project-pause-releasing.json`).
