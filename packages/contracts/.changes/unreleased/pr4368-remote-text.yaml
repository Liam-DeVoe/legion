kind: Added
body: |-
  `@legion/contracts/remote-text` exports `readRemoteText`, `redactRemoteText`, `oneLine` and
  `WORDS_NOT_READABLE`: the fail-closed rule for a field another party wrote, the TypeScript half
  of Go's `redact.Remote` and `redact.Field`. A field prints with each URL's user information and
  each query and fragment value removed only when the rule can read every URL in it, and as
  `WORDS_NOT_READABLE` otherwise, which includes a `user:secret@` after a scheme's `://` or a
  key's `=`, or a URL's query or fragment value, that whitespace splits; a bare
  `label: secret@host`, with no scheme and no key, prints. Both halves replay the fixture at
  `packages/envoy/internal/redact/testdata/remote.json`. `RemoteText` holds such a field in a
  private field and prints it, in a message, `JSON.stringify` and an inspection, only as
  `redactRemoteText` reads it, as Go's `redact.RemoteText` does, and answers no text: it compares
  (`equals`, `equalsIgnoringCase`, `startsWith`, `isEmpty`) and parses a time (`date`).
