kind: Added
body: |-
  Four tools for the author of a post: dispatch_edit_comment, dispatch_delete_comment,
  dispatch_edit_message and dispatch_delete_message, and dispatch_read takes history, which lists
  the bodies an edit or a delete of one post replaced: a delete writes an entry of its own, and a
  deleted post's entries carry no body. Each spec's description states what it does.
  Three event kinds join the union: comment.deleted, message.edited and message.deleted. A comment's
  edit and delete events carry its thread_root_id and the thread_logins on its thread.
  IDEMPOTENCY_ANSWER_NOT_KEPT also answers a repeat whose first answer held text a delete withdrew,
  and its message says whether the request wrote. GOING_ERROR_ANSWER_WITHDRAWN is the error code
  that ends an answer's stream once a comment or an issue message whose text the answer read is
  deleted.
