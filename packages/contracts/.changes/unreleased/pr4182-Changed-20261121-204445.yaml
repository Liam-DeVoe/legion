kind: Changed
body: 'The Dispatch API contract gains `GET /api/v1/me/inbox`, `GET /api/v1/agents/{session_id}/conversation` and the `waiting_on` key of `GET /api/v1/asks/open`. The open-ask row shared by the open-asks read, the Inbox read and the one read is named `OpenAskRow`, with `AskOwnerIssue` and `AskOwnerDocument`: the exports `InboxRow`, `InboxIssue` and `InboxDocument` are removed, and the JSON on the wire is unchanged. The `dispatch_message` tool says whom a message reaches: the other people in its thread and each person it names by address.'
