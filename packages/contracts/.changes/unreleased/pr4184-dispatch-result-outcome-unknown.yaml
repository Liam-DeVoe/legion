kind: Added
body: |-
  The `dispatch_result` tool's description says that a CI job's write that reached Dispatch with no answer that says whether it stored the result prints `{"write_outcome_unknown":"<code>"}` and exits 1: the result may be stored, and a second run is safe, because Dispatch keeps each result. It also says that a call the broker's rate limit (429), a broker that cannot answer the trade (5xx) or Dispatch's check of the job's token (429 BROKER_TOKEN_RATE_LIMITED, 503 BROKER_UNAVAILABLE) turns away before anything is stored is asked again after the answer's Retry-After, or a second, for at most 60 s of waits in all.
