kind: Added
body: |-
  The response schema of the claim operations the controller and a tree's architect hold (`stop`,
  `retry`, `suspend`, `resume_claim`): the claim's state, and who suspended it or holds a
  suspension for its turn. `suspendedBy` and `suspensionHeldBy` take `architect` as well as
  `controller`. The daemon API contract moves to 193.
