kind: Added
custom:
  Issue: pr4314
body: |-
  A new subpath, `@legion/contracts/setting-url`, exports `withoutUserinfo`, a URL with no user and
  no password, moved from `@legion/envoy-client/errors`, and `shownSettingUrl`, what a line may show
  of a setting whose value names an http or https URL: the value with no user and no password when
  the URL parser reads it as an http or https URL with a host, and nothing for any other value, of
  which a line names the length alone.
