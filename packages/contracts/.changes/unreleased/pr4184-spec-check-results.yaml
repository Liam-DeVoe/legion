kind: Added
body: |-
  The generated Dispatch API types and the OpenAPI document hold `POST /api/v1/projects/{key}/results` and its read: `SpecCheckResult`, the stored result of a check of the spec files a CI job wrote, with its in-toto statement (`SpecCheckAttestation`, `SpecCheckPredicate`), and the body the job writes, `{commit, check, verdict, observed}`.
