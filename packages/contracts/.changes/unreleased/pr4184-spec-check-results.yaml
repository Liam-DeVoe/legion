kind: Added
body: |-
  The generated Dispatch API types and the OpenAPI document hold `POST /api/v1/projects/{key}/results` and its read: `SpecCheckResult`, the stored result of a check of the spec files a CI job wrote, with its in-toto statement (`SpecCheckAttestation`, `SpecCheckPredicate`), whose recorder (`SpecCheckRecorder`) is the run's session and principal and no person, and the body the job writes, `{commit, check, verdict, observed}`. `SPEC_CHECK_OBSERVED_MAX` (2000) is how many characters of `observed` a result keeps, and `SPEC_CHECK_OBSERVED_CUT_NOTE` is the last line of a text cut to it, both generated into Go.
