body: |-
  Daemon API contract 219. `dispatchCredential` holds `session` and
  `liveLaunchesWithDispatchToken` alone: the transition token is gone, and with it
  `transitionLaunches` and `lastTransitionLaunchAt`. A caller below 219, 212 among them, is served
  the state without `dispatchCredential`. The state fixture (`state.json`) carries 219, and so does
  `version.json`.
