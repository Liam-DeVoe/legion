kind: Added
custom:
  Issue: pr5192
body: |-
  `DispatchTargetedFrameSchema`, `RecoverableDispatchDeliveryFailureSchema` and
  `isCommentTargetedDelivery` move here from `envoy-client`, beside a new `dispatchPayloadKind`,
  which says what a host makes of a Dispatch payload: an event it shows, a targeted frame it
  refuses by name, or a payload it reads as neither. `bun run gen:go` emits
  `schemas/dispatch-frame.schema.json` from those zod schemas, the Go copy the edge listener
  checks a payload by, and `fixtures/dispatch-frame-verdicts.json`, `dispatchPayloadKind`'s verdict
  on every payload of a corpus, which the Go reader is tested against.
