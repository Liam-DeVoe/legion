kind: Changed
body: '`DISPATCH_READING_SURFACES` holds a row for every place the dashboard draws a stored text, not only the ones the renderer draws: a line that draws the plain-text projection, a text shown as the characters it is, and the document body the Proof editor paints each have a row with its reason. `DispatchReadingSurface` names each row, so a mount of the renderer, of a reference card or of the projection is tied to its row by a typed `surface`. A backlink excerpt that is the head of a stored body is a rendered row, and the margin decision passage is a record.'
