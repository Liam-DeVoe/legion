kind: Fixed
body: |-
    An Envoy listener call answered 408 is sent once more, as one answered with a 5xx is. The
    listener writes no 408, so one is a hop's timeout sent before it forwarded anything: a send
    answered 408 on every attempt is that refusal, not "may or may not have arrived". A 429 is
    still not sent again.
