kind: Fixed
body: |-
  A session whose first NATS dial fails at its start no longer shows "Envoy inbound unavailable"
  while the background retry opens its relay. It is told only when no registration was accepted
  within two minutes. A refusal by the listener is still told at once, and so is a relay lost
  after the first accepted registration. Once a registration is accepted after a told outage, the
  UI note is `envoy: inbound messages are back` and the log line is at info, where both were
  warnings that said the registration was accepted. A session whose stop has begun registers nothing and shows neither
  notice, where a pass that ran after the stop closed the relay could hold "Envoy inbound
  unavailable" in the session file for the session's next process to show. A removal from the
  listener's registry that the listener's message bus did not answer is warned as that outage,
  with the words that the registry may already be without those topics, where the warning said
  they were not taken out: a relayed subscription removal, a role's notice subjects, a resumed
  controller's retired Slack topics, and a role's hand-back. A removal whose first attempt got
  that answer and whose retry got no answer, or a 5xx that names no reason, is warned the same
  way.
