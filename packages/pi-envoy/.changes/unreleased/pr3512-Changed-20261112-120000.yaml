kind: Changed
body: |-
  AskGate reviews the four post corrections this release adds, as it reviews `dispatch comment` and
  `dispatch message`: `dispatch edit-comment` and `dispatch edit-message` with their new body as the
  reviewed text, and `dispatch delete-comment` and `dispatch delete-message`, which carry no body,
  as the call itself. Its warn note names the two edits as the way to correct a comment or an issue
  message. Before it told the agent that a comment or a message cannot be edited and to post a reply
  instead, which two lanes answered by resending whole comments. A message of a direct conversation
  takes no edit, so the note still asks there for a reply with the correction, and only where the
  original would mislead its reader. The four commands need a Dispatch of this release: where an
  older server answers with no route, or with the scope or the `actor` refusal its comment edit
  gives, each says that this Dispatch predates post corrections. An older Dispatch that ignores the
  `actor` field answers a person's own token as the person: it takes an edit of that person's own
  comment and keeps no earlier body, refuses that edit on a closed issue with ISSUE_CLOSED, and
  refuses an edit of the comment of a session the token names with NOT_AUTHOR.
