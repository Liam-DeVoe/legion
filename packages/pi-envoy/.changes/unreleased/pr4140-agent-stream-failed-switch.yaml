kind: Fixed
body: |-
  After a session switch whose move to the new session's NATS token failed, the previous session's
  agent-stream control subject stayed open, and a viewer of that session was replayed the new
  session's turns. A switch now closes another session's control subject and resets the ring before
  anything else of the new session's opens.
