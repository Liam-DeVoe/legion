kind: Fixed
body: |-
  Every notice, log line, tool answer and tool error the extension gives the host passes the scrub
  of the secrets the process holds (`@legion/contracts/held-secrets`): a server at the wrong URL
  that echoes a token the session sent it, whole or in part, prints `<withheld>` in its place. A
  line that holds no held secret reaches the host as it was.
