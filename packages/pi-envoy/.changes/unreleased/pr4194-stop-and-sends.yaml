kind: Fixed
body: |-
  A stopping session gives back its role claims before it deletes its session record, on SIGTERM
  and on every clean stop, so the session's next process claims the role at once. In RPC mode,
  which a Legion pane runs, a SIGTERM emits no `session_shutdown`, so before this a stopped pane
  sent neither the release nor the record's delete; the stop now also runs from the host's exit
  callbacks. A release that does not answer in 250 ms is left, and the delete still goes. Once
  the stop has begun, the session makes no role move. A heartbeat's pass whose registration the
  listener accepts after that point reads and claims no role. A role move that runs or waits its
  turn when the stop begins sends no claim after that point. It claims no role back after the
  release, fires no regain hook and tells the pane nothing. A claim already on the wire when the
  stop begins writes no transcript record, also when the listener grants it. `envoy_role_set`
  and the Legion role claim are refused once the stop has begun, with
  `this session is stopping, so it claims no role: role <role> is not held here`. The pane is
  told nothing of a heartbeat that fails or a pass that stalls once the stop has begun. A send
  answered `no_receiver` says the session takes no message into its conversation now instead of
  live.
