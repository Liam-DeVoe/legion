kind: Fixed
body: |-
  A `!` token command in envoy.json no longer holds the Oh My Pi process while it runs: the
  extension's load awaits the start read, and every Dispatch reply, open-ask read, accept of a
  person's turn, whole-body and picture read, AskGate read and decision record waits for its read
  without stopping the session's timers, deliveries and NATS pings for up to the command's 10 s.
  AskGate's dry run of a `dispatch` command kills its process group once the script's shell
  exits, so a helper the script left running neither outlives it nor holds its answer open until
  the limit. The process groups of a dry run and of a person's `!command` end with the session's
  process however it ends, a signal or a crash included, where only its own exit took them before.
