kind: Added
body: |-
  With `NATS_AUTH=broker` (or `"natsAuth": "broker"` in envoy.json), the session's NATS connection
  presents the session's own broker token, which a hub running the NATS auth service admits to that
  session's subjects alone. The token is taken before the connection is dialled and renewed before
  it lapses, and a session switch (`/new`, `/fork`, `/resume`, a branch) moves the connection to the
  new session's token and waits for it to come back before anything of the new session's is
  subscribed. Unset, the connection presents a seed or no credential, as before.
