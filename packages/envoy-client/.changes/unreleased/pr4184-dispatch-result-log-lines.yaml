kind: Added
body: |-
  `dispatch result --project` writes into a GitHub Actions runner's log, which reads workflow commands from it, so each text it did not write (an argument, a variable, a file's name, an answer of the secrets broker or of Dispatch) prints by the rule of Go's `runnerlog.Printable`: each control character, format character, line or paragraph separator as its escape, such as `\n`, and the `[` of each `##[` as `\x5b`, or as `\u005b` inside JSON. No such text starts a line of its own or names a workflow command, and a refusal that starts with `::` has that first `:` written as `\x3a`. The rule is `runner-log.ts`.

  A write that reached Dispatch with no answer that says whether it stored the result prints `{"write_outcome_unknown":"<code>"}`, the code of its last failure such as `ECONNRESET`, and exits 1: the result may be stored, and a second run is safe, because Dispatch keeps each result. `writeOutcomeUnknown(error)` in `dispatch-http.ts` tells such a failure. A connection that was never opened (refused, a name that did not resolve, no route), a request Dispatch's check of its broker token turned away before any handler ran (`tokenNotChecked`: `429 BROKER_TOKEN_RATE_LIMITED`, `503 BROKER_UNAVAILABLE`), and an attempt the client's deadline ended before it was sent no longer count as an attempt that may have reached Dispatch. `DispatchServiceError` carries its answer's `Retry-After` as `retryAfterMs`. `DispatchClient` takes a caller's `deadline` signal in place of the 60 s timeout it makes itself, and hands its signal to the credential, whose `RequestCredential.headers` takes a `signal`: a broker credential's trade and the identity it reads end with the request.

  A call that the secrets broker's rate limit (429), a broker that cannot answer the trade (5xx) or Dispatch's check of the job's token turns away before anything is stored is asked again after the answer's `Retry-After`, or a second. The whole call has one bound, 60 s from its start: one timeout, made where the call starts, is the signal the runner's token request, the broker's trade, each write and each wait run under (`ResultBound`), and no round and no ask again under the key starts in its last 7 s, a reserve greater than the 5 s Dispatch's check of a token waits on the broker. A call turned away until then prints, on one line, which turned it away with the last answer, its code named, and exits 1; a bound that ends in the trade prints which part, the job's own token or the broker's trade, and that nothing was written. A job's step of many checks meets those limits of one address with no fault of its own, so its results are no longer lost to them. `BrokerRefusedError` carries the answer's `Retry-After` as `retryAfterMs`, a trade the broker did not refuse is a `BrokerTradeFailedError` with the answer's status, `identityReadFailed(error)` tells a trade that failed reading its identity, a caller that joins a trade under way ends at its own signal, and an exchange whose caller gives no signal ends after 30 s, the Go client's bound of one call to the broker.

  What a write's attempts showed is a fact of the whole call: a write carries one `Idempotency-Key` across its no-route retries and its re-send after a dead token, and once an attempt may have reached a handler, a later answer that proves nothing of it (no route, Dispatch's check of the token, a dead token) ends the call as a `DispatchWriteUnsettledError`, so `dispatch result --project` prints `write_outcome_unknown` and not a refusal that says nothing was stored. Only the keyed layer's verdict on the key, a definitive answer that names it back, settles the call. A multipart upload is encoded once for all its attempts.

  `dispatch results --project` prints each line and its `--json` by the same rule of a runner's log.
