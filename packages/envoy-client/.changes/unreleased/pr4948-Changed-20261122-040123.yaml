kind: Changed
body: '`dispatch steps --issue <KEY>` prints, before the runs of each task of the issue''s plan, a line `task <task> needs <tasks>: <place> <step> <state>, …`: the tasks it needs, `nothing`, or `are not recorded` where its plan node records none, then each step the plan gives it at the state Dispatch answers. A script that reads the run lines skips that line: its third word is `needs`, where a run line''s third word is its kind.'
