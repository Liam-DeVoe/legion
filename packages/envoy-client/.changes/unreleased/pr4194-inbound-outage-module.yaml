kind: Changed
body: |-
  The inbound outage report has a module of its own, `@legion/envoy-client/inbound-outage`:
  `inboundUnavailable`, `InboundUnavailable`, `InboundUnavailableOptions`, `InboundOutage`,
  `InboundOutageKind`, `inboundUnavailableNoticeText`, `inboundRestoredNoticeText` and
  `INBOUND_FIRST_OPEN_BOUND_MS` move there from `@legion/envoy-client/consumer-delivery`, which
  no longer exports them.
