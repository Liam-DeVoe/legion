kind: Added
body: |-
  `natsDialFailure(named, error, presenting)` (`nats-connection`) is the one line a failed NATS
  dial is logged with: the servers as a log names them and why it failed, with nothing nats.js or
  the runtime derived from what the servers were set to. `natsServerForLog(server)` names a server
  by scheme, host and port alone, and only where nats.js dials that host and that port
  (`natsDialedAddress`, nats.js's own `hostPort`, which takes the port from the first `:<digits>`,
  a password's included, and reads the host as an http: URL) and the host is an IP literal or a
  name written in one case, so a pasted nkey seed or token, and a password's digits, are never
  named. `natsFailureReason(error)` is an allowlist: the server's own `-ERR` text for its
  refusals, nats.js's code for its other errors, a runtime error's syscall and code
  (`getaddrinfo EAI_AGAIN`, `ERR_SOCKET_BAD_PORT`), the message of a `LoggableError` (`errors`,
  this package's own reasons and a caller's), and for anything else its type and
  `(message withheld)`. A broker token's `ready` waits at most 20 s, nats.js's own dial timeout,
  for the secrets broker to answer the trade, and then fails naming the setting that chose the
  broker token, rather than holding a session's start in silence. `followNatsCredential`
  reconnects again when a redial that was in flight comes back with the old token, rather than
  waiting out its 15 s.
