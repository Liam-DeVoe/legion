kind: Added
body: |-
  `natsServerForLog(server)` and `natsErrorForLog(text, servers)` (`nats-connection`) name a NATS
  server, and a connect error's text, as a log may: a server by scheme, host and port alone, and
  not at all where its address does not read as a host (a pasted nkey seed or token parses as one,
  and a label of 16 or more hexadecimal characters, or of 16 or more letters and digits mixing
  upper and lower case, is read as a token), where its URL holds more than scheme, host and port
  (a token or password with an unencoded `/`, `?` or `#` ends the authority there, so the host is
  the credential's first segment), or where the host nats.js dials is not the one the URL names;
  and in nats.js's own error text neither such an address, as written, as its host or as the host
  nats.js dials, nor any credential a URL holds, its user info taken whole up to the last `@`
  whatever its characters, in any case, also for a URL nats.js cannot parse. `natsDialedHost(server)`
  is that dialed host, from nats.js's own `hostPort`: it reads the server as an http: URL, which
  ends the host at a `\`, takes the last of a comma list written in one entry, percent-decodes and
  writes a Unicode name in punycode. Each part is replaced once, in one pass over the text as
  nats.js wrote it, searched as written with Unicode case folding; `natsUnnamedParts(servers)` and
  `replaceEachOnce(text, replacements)` are the two halves, for a log that hides other parts in the
  same pass. A broker token's `ready` waits at most 20 s, nats.js's own dial timeout, for the
  secrets broker to answer the trade, and then fails naming the setting that chose the broker
  token, rather than holding a session's start in silence. `followNatsCredential` reconnects again
  when a redial that was in flight comes back with the old token, rather than waiting out its 15 s.
