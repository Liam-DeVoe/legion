kind: Changed
body: |-
  `registrationTopics` no longer leaves out a topic that the stream subjects of this build do not
  capture. It still leaves out a topic that reaches the private stream subject of another session.
  `expandSubscriptionTopics` now always carries the base `X` of an `X.>` topic. The listener reads
  the subjects of the deployed stream again before it judges a topic. During a roll, these
  subjects include the subjects of a newer build. Before this change, a client of an older build
  did not register a topic that only a newer subject captures. The consumer of the session then
  did not filter on that topic, and it moved past each message that the stream stored on it.
  `streamStores`, `streamDeliversNothing` and `refuseUncapturedTopics` are removed. The
  `envoy_subscribe` description now says that the listener returns a warning for a topic that no
  stream subject captures yet.

  Each `X.>` follow now also registers `X`. While no stream subject captures `X`, it is a filter
  subject that receives nothing, and the listener returns a warning for it. The new
  `warningsForNamedTopics` takes the answer of the registration and the topics that the caller
  named. It removes the uncaptured-topic warning of each topic that the caller did not name in
  that call. A subscribe tool shows the other warnings. The function compares each warning with
  the text that `uncapturedTopicWarning` builds for its topic and the `session_id` of the answer.
  It removes a warning only when the two texts are the same, because the answer of the listener
  has no structured field for it.

  No listener that a plugin of this release needs refuses such a registration. The oldest is the
  listener with #2446, `legion-envoy-v27.1.0`. It stores the topic and filters the consumer only
  on the subjects that it compiles (`packages/envoy/cmd/listener/api.go:1477-1497` and
  `session_delivery.go:367-376` at that tag). A listener from #2603 (`legion-envoy-v30.8.0`) to
  `legion-envoy-v30.36.0` leaves the topic out with its own warning and stores the other topics
  (`api.go:2611-2617` and `api.go:2683-2685` at `legion-envoy-v30.8.0`).
