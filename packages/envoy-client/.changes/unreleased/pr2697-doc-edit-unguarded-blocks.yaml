kind: Added
body: |-
  `dispatch doc-edit` under a block guard prints, under its first line, each typed block a
  `replace`'s `with` of blocks rewrote in place that the guard did not name, with the token the
  edit read it at, from the server's `unguarded_blocks`: `Block guard: this edit rewrote in place a
  typed block the guard did not name: <id> (token <token>); compare its token with the one you
  read.` The result's details carry the same blocks as `unguarded_blocks`. A `409
  PRECONDITION_FAILED` that names the blocks the edit would remove that the guard leaves out adds a
  line under Dispatch's words: `Block guard: this edit would remove a block the guard did not name:
  <id> (token <token>); add it to the guard's precondition.blocks (--precondition-json) at that
  token and send the edit again.`, and the error carries those blocks as `unguardedBlocks`. An
  edit under no block guard, or a server that sends no such field, prints as before.
time: 2026-11-20T18:00:00Z
