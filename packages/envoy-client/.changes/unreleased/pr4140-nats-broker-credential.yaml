kind: Added
body: |-
  A session can connect to an Envoy hub that runs the NATS auth service with its own broker token.
  `NATS_AUTH=broker` (or `"natsAuth": "broker"` in the `envoy` section of envoy.json; the variable
  wins) makes the NATS connection present the session's own broker token, the one its listener
  calls present where they present one, with a proof of its key over the server's per-connection
  nonce, and `keepNatsCredential` reconnects the connection with each renewed token before the old
  one lapses. The keeper reads the connection's status too: a server that refuses the live token
  in hand (`AUTHORIZATION_VIOLATION`, `AUTHENTICATION_EXPIRED`) is warned of at once, naming the
  code, and again every 30 minutes until the connection is back; at the second refusal the keeper
  drops that token, in the NATS credential and in the token client (`BrokerNatsCredential.drop`,
  `dropTradedToken`), and trades for another, once until the connection is back, so a revoked
  token is not presented again until it lapses. Its connection is now a `Pick` of `reconnect`,
  `isClosed`, `closed` and `status`. `NATS_AUTH=none`, or nothing set, presents no credential, as
  before, whatever broker route the machine has; a seed is presented as before. `broker` on a
  machine with no broker route, `broker` for a caller that names no session (a token traded under
  none is the machine's or the signed-in person's, not the session's; a name read from a function
  that reads none trades nothing), `broker` beside a seed, a file's `broker` with an
  `ENVOY_NATS_URL` naming other servers than the file's own, and any other value each turn off
  inbound messages alone, naming the reason (never a value that is neither broker nor none).
  `broker` against a hub that runs no auth service fails the connection, saying so and naming the
  setting that chose the broker token (`NATS_AUTH`, or the file's `envoy.natsAuth`) to undo there,
  rather than connecting with no credential. `followNatsCredential(connection, credential,
  boundMs?)` takes at most `boundMs` (`FOLLOW_DEADLINE_MS`, 28 s, by default): the trade waits all
  of it but the connection's share, 8 s or half the bound. `envoySettings`' `inbound` now carries
  `natsCredential` (a seed, the broker token, or none) in place of `natsSeed`, and
  `natsConnectionOptions` and `natsAuthOptions` take that credential.
