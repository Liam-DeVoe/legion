kind: Added
body: |-
  A session can connect to an Envoy hub that runs the NATS auth service with its own broker token.
  `NATS_AUTH=broker` (or `"natsAuth": "broker"` in the `envoy` section of envoy.json; the variable
  wins) makes the NATS connection present the session's own broker token, the one its listener
  calls present where they present one, with a proof of its key over the server's per-connection
  nonce, and `keepNatsCredential` reconnects the connection with each renewed token before the old
  one lapses. `NATS_AUTH=none`, or nothing set, presents no credential, as before, whatever broker
  route the machine has; a seed is presented as before. `broker` on a machine with no broker route,
  `broker` beside a seed, a file's `broker` with an `ENVOY_NATS_URL` naming other servers than the
  file's own, and any other value each turn off inbound messages alone, naming the reason (never a
  value that is neither broker nor none). `broker` against a hub that runs no auth service fails the
  connection, saying so and that NATS_AUTH should be unset there, rather than connecting with no
  credential.
  `envoySettings`' `inbound` now carries `natsCredential` (a seed, the broker token, or none) in
  place of `natsSeed`, and `natsConnectionOptions` and `natsAuthOptions` take that credential.
