kind: Added
body: |-
  A session can connect to an Envoy hub that runs the NATS auth service with its own broker token.
  `NATS_AUTH=broker` (or `"natsAuth": "broker"` in the `envoy` section of envoy.json; the variable
  wins) makes the NATS connection present the token the session's listener calls already present,
  with a proof of its key over the server's per-connection nonce, and `keepNatsCredential`
  reconnects the connection with each renewed token before the old one lapses. `NATS_AUTH=none`,
  or nothing set, presents no credential, as before, whatever broker route the machine has; a seed
  is presented as before. `broker` on a machine with no broker route, either value beside a seed,
  and any other value each turn off inbound messages alone, naming the reason.
  `envoySettings`' `inbound` now carries `natsCredential` (a seed, the broker token, or none) in
  place of `natsSeed`, and `natsConnectionOptions` and `natsAuthOptions` take that credential.
