kind: Changed
body: |-
    The publish tool's description no longer lists the agent topics, Dispatch's lane or GitHub's
    lane among the topics a publish stores. It says that the listener refuses a publish to each by
    name: `envoy_send` sends to one session, only Dispatch publishes on Dispatch's lane, and only
    the listener that receives GitHub's webhooks publishes on GitHub's. The subscribe tool's
    description still lists every lane the stream stores.
