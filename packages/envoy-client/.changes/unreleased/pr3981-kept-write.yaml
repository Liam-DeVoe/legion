kind: Fixed
body: |-
  A write whose path names a text Dispatch's reviewer holds, which has not posted (an issue, an
  ask, a comment or a message), is kept by Dispatch and runs right after that text posts. Dispatch
  answers such a write `202` with only the id it keeps the write under and `held`. Three kinds of
  write are not kept so: a new ask, comment or message on a held issue, which the reviewer holds
  under an id of its own and answers `201` in its whole shape; a reply to a delivered message or
  mention, and a delivery's resend or accept; and a result's dry run. Commands read the `202` as
  their own answer. `dispatch result`, `dispatch artifact` and `dispatch claim` threw a TypeError
  reading a field the answer lacks; `dispatch claim --release` printed a status of `undefined`;
  `dispatch handoff-write`, `dispatch edit-ask` and `dispatch resolve-comment` printed `undefined`
  in place of what they wrote; `dispatch resolve-ask` failed, saying the ask had no resolution;
  and `dispatch follow --action unfollow` said it had unfollowed the ask. An upload to a held issue
  is kept before Dispatch's keyed layer runs, so its `202` carries no `Idempotency-Key`, and a
  client that knew Dispatch runs that layer failed the upload as a write that may or may not have
  landed: `dispatch artifact` with text always, since its Markdown round trip shows the layer
  first, and a picture whenever the session wrote in the five minutes before. Now `DispatchClient`
  throws `DispatchWriteKept` for that answer, with the method, the URL, the kept id and `held`, and
  the command prints `Kept until held text <id> posts: Dispatch keeps this write as <kept id> and
  runs it right after that text posts.` with `dispatch held <kept id>`, and exits 0.
  `dispatch edit-ask`, `dispatch resolve-ask`, `dispatch follow --action unfollow` and
  `dispatch resolve-comment` reach such a write when given the text's full id. Given a
  `dispatch://` reference they read the text first, as `dispatch issue-update` and
  `dispatch follow --action follow` always do, and Dispatch answers a session's read of a held
  text `409 HELD_TEXT`, so they send no write. A picture that Dispatch keeps fails its call before
  the call's own write, and says that the picture was not uploaded yet.
