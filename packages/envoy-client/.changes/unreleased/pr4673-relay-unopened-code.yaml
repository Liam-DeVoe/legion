kind: Fixed
body: |-
  A relay socket that did not open within its caller's bound now throws `RelayNotOpenedError`
  (`@legion/envoy-client/listener-relay`), whose `code` is the code the runtime gave the last
  open's socket: `ECONNREFUSED` for a listener whose port nothing took, `ENOTFOUND` for a name that
  did not resolve, `ETIMEDOUT` for an upgrade not answered within 20 s, and none where the listener
  answered. A call of `createEnvoyClient` that got no answer carries its failure's `code` the same
  way. Neither keeps a cause, since the runtime's error repeats the URL, so before this a caller
  could not tell a listener that answered nothing from one that refused.
time: 2026-11-22T06:30:20.014428172Z
