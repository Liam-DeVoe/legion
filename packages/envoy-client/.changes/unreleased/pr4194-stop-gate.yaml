kind: Added
body: |-
  `createEnvoyClient` takes the host's reading that its session's stop has begun (`stopping`).
  Once that reading is true, the client's stop gate sends no registration, removal of topics,
  interest read, role claim or role read. Such a call none of whose attempts was sent throws
  `EnvoyStoppingError`, which names the call. The client reads the stop before each attempt, a
  retry's included. An attempt already sent is answered as before. A retry the gate refuses after
  an earlier attempt was sent ends the call with that attempt's own error, as a call whose retries
  ran out ends, because that attempt may have landed. The stop's own DELETE and its role
  hand-back (`stopCallsOf`) still go, and so do a send and a publish. A listener relay socket that
  is given `stopping` opens no socket again once the stop has begun.
