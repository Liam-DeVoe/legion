kind: Fixed
custom:
  Issue: pr4369
body: |-
  The `dispatch` command refuses a file or stdin field holding bytes that are not UTF-8, for every
  command, where it stored U+FFFD in place of each such byte before: `--content-file`,
  `--body-file` and every other `--<field>-file` and `--<field>-json-file`, from a file or from
  stdin (`-`), are read as bytes and decoded strictly, and bytes that are not UTF-8 refuse the
  command, its dry run and its call alike, with exit 1 and nothing sent, in Dispatch's own refusal
  of such a byte: `INVALID_UTF8: <field> holds a byte that is not UTF-8 (0xFF) at character N,
  which Dispatch cannot store`, naming the field the flag sets, the first such byte and where it
  stands, counted from 1 in UTF-16 units. A byte order mark is kept as U+FEFF, as before.
