kind: Changed
body: |-
  `isAncestor` takes an optional reader of a process's parent, as `nearestAncestorNamed` does, and
  `readTmuxPlace` an optional check of whether the pane's first process is one of this session's,
  so a caller or a test can name the chain it walks rather than the runner's own. With none, each
  reads this machine's chain as before, and init is still never a match: pid 1 is an ancestor of
  every process of its namespace, so a match there would hold for every process.
