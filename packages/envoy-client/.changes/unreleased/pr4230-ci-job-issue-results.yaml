kind: Added
body: |-
  `dispatch result --issue` under `AGENT_SECRETS_MACHINE_IDENTITY=github-actions` records a CI job's result of the check its `ci_check` names with the job's own identity: it trades the run's OIDC token at the secrets broker, as `--project` does, sends `--check`, `--verdict`, `--commit` and `--observed` alone, and cuts `observed` by the shared rule. It refuses `--role`, `--surface`, `--run`, `--negative-control`, `--failed`, `--skipped`, `--excluded`, `--screenshot` and `--retract` before any request. `dispatch results --issue` names a `branch_head` basis, prints each result the CI job recorded after the derived one with `on branch <branch>`, names each head where no pass stands and what it holds there (`A pass stands: no, as …`), prints no `Pull request line:` for an issue with no pull request, and takes `--json`, which prints the route's answer whole.
