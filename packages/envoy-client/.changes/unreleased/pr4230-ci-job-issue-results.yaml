kind: Added
body: |-
  `dispatch result --issue` under `AGENT_SECRETS_MACHINE_IDENTITY=github-actions` records a CI job's result of the check its `ci_check` names with the job's own identity: it trades the run's OIDC token at the secrets broker, as `--project` does, sends `--check`, `--verdict`, `--commit` and `--observed` alone, and cuts `observed` by the shared rule. It refuses `--role`, `--surface`, `--run`, `--negative-control`, `--failed`, `--skipped`, `--excluded`, `--screenshot` and `--retract` before any request, and it prints each line by the runner log's one-line rule, waits for a broker's 429 or 5xx as `--project` does, and prints `{"write_outcome_unknown": <code>}` where no answer says whether the write landed. `dispatch results --issue` names a branch head, prints each result the CI job recorded after the derived one with `on branch <branch>`, names each head where no pass stands and what it holds there (`A pass stands: no, as …`), prints no `Pull request line:` for an issue with no pull request, prints each line of a result's reading by the one-line rule, so a job's log names no workflow command, and takes `--json`, which prints the route's answer whole.
