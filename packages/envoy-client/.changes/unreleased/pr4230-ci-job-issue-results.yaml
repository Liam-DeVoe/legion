kind: Added
body: |-
  `dispatch result --issue` under `AGENT_SECRETS_MACHINE_IDENTITY=github-actions` records a CI job's result of the check its `ci_check` names with the job's own identity: it trades the run's OIDC token at the secrets broker, as `--project` does, sends `--check`, `--verdict`, `--commit` and `--observed` alone, and cuts `observed` by the shared rule. It refuses `--role`, `--surface`, `--run`, `--negative-control`, `--failed`, `--skipped`, `--excluded`, `--screenshot` and `--retract` before any request, and it prints each line by the runner log's one-line rule, waits for a broker's 429 or 5xx as `--project` does, prints `{"write_outcome_unknown": <code>}` where no answer says whether the write landed, and prints `{"landed_without_answer":"ANSWER_LOST"}` and exits 0 for a 2xx whose body gives no stored result, as `--project` does. `dispatch results --issue` names a branch head, prints each result the CI job recorded after the derived one with `on branch <branch>`, names each head where no pass stands and what it holds there (`A pass stands: no, as …`), prints no `Pull request line:` for an issue with no pull request, prints `It counts for nothing: <reason>` under a result whose `not_counted` says why it counts for nothing, and takes `--json`, which prints the route's answer whole. It prints every string of Dispatch's answer by the runner log's one-line rule: a result's reading is one line, its line breaks written as `\n`, so no line of a job's log reads as a line of the command's own, such as another check's head line or an `A pass stands:` line. `--json` of `dispatch results` keeps each line break inside its JSON string by the same rule, and `dispatch result` prints a retraction's reason and the pull request line by it too.
