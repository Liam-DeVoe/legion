kind: Fixed
body: |-
  Three texts the client prints pass the scrub of the secrets the process holds
  (`@legion/contracts/held-secrets`): `messageFor` (every error the `dispatch` command, the
  Dispatch client's callers and the listener client's callers print), `natsFailureReason` and
  `tradeFailureReason`. A Dispatch, listener or broker at the wrong URL that echoes the bearer or
  the identity token it was sent, whole or in a run of 10 or more characters, prints `<withheld>`
  in its place there. The client holds every Dispatch and Envoy bearer it makes a credential of
  (`bearerCredential`) and the contents of every secret file it reads (`readSecretFile`). A broker
  refusal prints its text where it is one of the broker's known refusals as its OAuth library
  writes it (the library's sentence, then the hint), the policy's own refusal of a subject token
  included, and where a sentence names a person or a session it must be the ones the trade sent.
