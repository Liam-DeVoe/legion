kind: Fixed
body: |-
  Every error and reason text the client prints (`messageFor`, `natsFailureReason`,
  `tradeFailureReason`) passes the scrub of the secrets the process holds
  (`@legion/contracts/held-secrets`), so a Dispatch, listener or broker at the wrong URL that
  echoes the bearer or the identity token it was sent, whole or in part, prints `<withheld>` in its
  place. Every Dispatch and Envoy bearer, and every secret file read, is held. A broker refusal
  prints its text where it is one of the broker's known refusals as its OAuth library writes it
  (the library's sentence, then the hint), the policy's own refusal of a subject token included,
  and where a sentence names a person or a session it must be the ones the trade sent.
