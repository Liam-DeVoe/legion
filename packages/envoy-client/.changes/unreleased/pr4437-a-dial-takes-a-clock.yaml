kind: Added
body: |-
  `connectNats`'s hooks take a `clock` (`NatsDialClock`): the monotonic reading its budget is
  counted on, the wait before a redial, and the timer of each dial's bound. A session plugin passes
  none and dials on the process's own, `performance.now`, `node:timers/promises`' `setTimeout` and
  `setTimeout`, as before; the dial's tests hand it one they drive, and read the delay of each wait,
  the bound of each dial and their order with the dials rather than the wall clock.
time: 2026-11-20T18:30:00Z
