kind: Fixed
custom:
  Issue: pr4274
body: |-
  `dispatch artifact --path` sends a file as the type its `--name` says. A name that ends in `.md`
  or `.markdown` is Markdown, whatever the path's extension, so `--name plan.md --path plan.txt`
  stores a document. A name with any other extension is that extension's type, whatever the path,
  so `--name cases.txt --path cases.md` stores a file whose bytes are the bytes sent, which before
  was stored as a document with its text changed. Only a name with no extension keeps the path's
  type. A trailing extension of digits alone does not count (`rows.jsonl.1` is a `.jsonl` name,
  `Plan v1.2` has none), and the CLI holds an upload for AskGate's marker by the same reading. Its
  answer names the kind Dispatch stored: `a document
  (kind doc; …)`, `a file (kind file; …)` or `a picture (kind image; …)`. `dispatch doc-read
  --version` reads a document's version stored as bytes as a file.

  A `dispatch` write that may have reached Dispatch says so and tells the caller to check before it
  retries: a keyed write whose every attempt failed on the network, an unkeyed `PUT` or `DELETE` that
  failed in transport or at its deadline, and Dispatch's own JSON `5xx`, which before read as a
  refusal. A refusal Dispatch decided prints none of those words, and neither does a request that
  writes nothing (the markdown round trip, the related search).
