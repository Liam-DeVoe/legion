kind: Changed
body: |-
  The broker credential trades through one retry loop per session, which every caller waits on
  within its own deadline and none cuts short, so the broker sees one trade per slot of the
  loop's schedule however many callers ask. Each trade ends at 30 s where the broker has not
  answered. A trade the broker did not answer, answered with a 5xx, its 429 or a DPoP refusal, or
  that the identity's source could not make, is traded again 15 s later, doubling to 5 minutes,
  with a line at each wait; a pod session not registered yet is traded again on its own 2 s to
  30 s schedule; a refusal no trade cures ends the loop, and a call before the next slot is told
  the same with no trade. A call whose deadline ends while the loop trades again fails with
  `TradeRetryingError`, saying what the last trade came to. Once a renewal has failed, calls take
  the token in hand at once while it is live. The NATS credential's `ready` waits on the loop for
  as long as its caller gives it (`ready(life)`), and a session switch ends every wait for the
  session before.
