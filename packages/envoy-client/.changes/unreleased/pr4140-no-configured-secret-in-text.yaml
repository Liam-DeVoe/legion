kind: Fixed
body: |-
  No error or notice text names what a setting holds where that can be a secret pasted into the
  wrong setting. A `<VARIABLE>_FILE` pointer that cannot be read, is empty, or holds whitespace is
  refused by its variable and the read error's code (`NATS_NKEY_SEED_FILE names a file that could
  not be read (ENOENT)`), no longer by its path, which a seed pasted in place of the path is, and a
  seed file's errors name `the file NATS_NKEY_SEED_FILE names`; `AGENT_SECRETS_MACHINE_TOKEN_FILE`
  and `AGENT_SECRETS_SIGNIN_CLIENT_SECRET_FILE` are named the same way. `DISPATCH_TOKEN_BROKER`,
  `SLACK_POST_API_URL` and `AGENT_SECRETS_MACHINE_IDENTITY` are refused without quoting their
  values, and an `AGENT_SECRETS_URL` or `AGENT_SECRETS_SIGNIN_ISSUER` that is no http or https URL
  is refused naming the variable alone. The secrets broker, the sign-in issuer, Google's security
  token service and IAM Credentials are named without their user info, query and fragment, and
  the metadata server by `GCE_METADATA_HOST` where that names it. An error the runtime or a library
  threw on the way to any of them, or to Dispatch, is named by its class (`getaddrinfo ENOTFOUND`,
  `ECONNREFUSED`) rather than its message, which repeats the host or URL it was handed, and no
  such error is kept as the cause of the one a caller prints.
