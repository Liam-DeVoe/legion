kind: Changed
custom:
  Issue: pr4369
body: |-
  `dispatch artifact --dry-run` with inline content asks Dispatch how it would store the text
  (`POST /api/v1/markdown/round-trip`), as the call does, and refuses a text that Dispatch would
  store under another spelling with the call's own refusal and exit code. It stores nothing. The
  call and its dry run refuse a document's text past the document limit (1 MiB of UTF-8), inline
  or in a `--path` file whose path ends in .md or .markdown, with Dispatch's own `CAP_EXCEEDED`
  message before they ask the round trip or upload, the call before it reads whether the owner
  holds the name, so the two answer alike under a held name too; a file past the limit is refused
  by its size before it is read. They refuse a text whose round trip answer Dispatch marks as its
  refusal of the text (`Dispatch-Text-Refusal`), at any status, with Dispatch's own refusal
  (`<CODE>: <message>`), which is the upload's refusal of that text: a NUL character, a text or a
  rendering too large, markdown the parser refuses, an ask block that breaks its content rule, a
  block id written twice, a check proved by CI that breaks its rules. Without `--force` the call
  makes a new document, so the round trip asks for the refusals only a new document's seed makes
  (`new_document: true`); with `--force`, which may replace a document judged by looser rules, it
  asks for none of them, and Dispatch answers as the most permissive replacement takes the text:
  with the rendering that replacement stores, whose spelling the call and its dry run check as for
  any text, or with a refusal every replacement makes. Under a name the owner does not hold,
  `--force` uploads a new document, so its dry run passes, with no warning, a text that upload
  then refuses for one of a new document's checks. An answer it does not mark is no answer about
  the text. Blank inline text, other than the empty string, is asked too, for a refusal alone and
  never for its spelling. The dry run of such a Markdown file refuses a U+0000 or a byte that is
  not UTF-8 in it before it asks anything, in the words its upload refuses it with, then sends the
  file's bytes to their own round trip (`POST /api/v1/markdown/file-round-trip`), and takes its
  refusal alone, never a spelling, since the call stores a Markdown file as the store spells it; a
  file stored as its bytes is asked nothing. Each of these refusals exits 1. The call of such a
  Markdown file asks the same file round trip as its dry run asks it, with the dry run's own
  client options - once, within 5 s, with no wait before asking a route again - about the bytes it
  then uploads, and refuses what it refuses before it uploads, with the dry run's refusal and exit
  code; on any other answer, or none (no answer in time, a failure, or a Dispatch without the
  route), it uploads the file as before, and the dry run's warning for such a file says that the
  call asks once more and uploads the file unchecked if it gets no answer either. The call checks
  the text, inline or a file's, before it reads whether the owner holds the name, so a text
  refused for the text alone under a name the owner holds gets that refusal, as from its dry run,
  not the refusal of the held name. The dry run refuses a text past the document limit without
  asking Dispatch, so with no Dispatch configured too. For any other text,
  when Dispatch gives no answer within 5 s, or has no such route, or is not configured, the dry
  run passes and says so on stderr, so its standard output is the arguments' JSON alone. The dry
  run sends no second attempt after a failed one, and names the failure Dispatch answers, such as
  a 500; where Dispatch says the token is no longer live, it presents a fresh token once.
  `DISPATCH_DRY_RUN_LOCAL=1` keeps an upload's dry run local: it then checks the arguments alone,
  as it did before. It leaves a `dispatch result` record's dry run as it was, asking Dispatch for
  the pull-request body line, as it did before too.
