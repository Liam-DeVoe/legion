kind: Added
body: |-
  `agent-secrets result-grant -- dispatch result --project <KEY> --check <id> --verdict pass|fail|could_not_run --commit <sha> [--observed <text>]` records a CI job's result of a check of the spec files with the job's own identity. The Go producer presents the job's signed GitHub identity to the broker. The broker trades it under a pod-owned DPoP key and gives the child only a `DISPATCH_RESULTS_TOKEN` airlock placeholder, proxy and public certificate settings. The Dispatch access token and private key never leave the broker. The child reads `DISPATCH_URL`, no envoy.json and no session bearer; it performs no identity trade. It sends `{commit, check, verdict, observed}` alone to `POST /api/v1/projects/{key}/results`, prints the stored result as JSON and exits 0, or prints Dispatch's refusal as `<CODE>: <message>` and exits 1. An argument of an issue's record beside `--project`, or `--issue` with it, is refused before any request.

  `dispatch results --project <KEY> --commit <sha> [--check <id>] [--json]` lists the results CI jobs stored at that commit, one line each, newest first: the record number, the check, the verdict, the job, the leg, the run, its attempt and the commit.

  The Go producer's `AGENT_SECRETS_MACHINE_IDENTITY=github-actions` source asks the runner's endpoint (`ACTIONS_ID_TOKEN_REQUEST_URL` with `ACTIONS_ID_TOKEN_REQUEST_TOKEN`) for an OIDC token of `AGENT_SECRETS_MACHINE_AUDIENCE`, or reads it from `AGENT_SECRETS_MACHINE_TOKEN_FILE` where the job has no endpoint. Only the broker trades that identity for this capability. A refused or expired grant runs no child, and a lost grant does not change the identity behind a keyed write.
