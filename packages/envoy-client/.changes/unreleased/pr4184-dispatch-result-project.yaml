kind: Added
body: |-
  `dispatch result --project <KEY> --check <id> --verdict pass|fail|could_not_run --commit <sha> [--observed <text>]` records a CI job's result of a check of the spec files with the job's own identity. The job has no session: the command reads `DISPATCH_URL` and trades this machine's identity at the secrets broker (`AGENT_SECRETS_URL` with `AGENT_SECRETS_MACHINE_IDENTITY`), reads no envoy.json and no bearer, and trades no person's sign-in. It sends `{commit, check, verdict, observed}` alone to `POST /api/v1/projects/{key}/results`, prints the stored result as JSON and exits 0, or prints Dispatch's refusal as `<CODE>: <message>` and exits 1. The stored result names the run and no person, so the job's log holds no person's address. An argument of an issue's record beside `--project`, or `--issue` with it, is refused before any request.

  The command sends at most the 2000 characters of `observed` that a result keeps: a longer text goes as its first characters and a last line that says it was cut, so a test log of any size still writes its result. A NUL goes as U+FFFD, and so does each byte of an `--observed-file` that is not UTF-8.

  `dispatch results --project <KEY> --commit <sha> [--check <id>] [--json]` lists the results CI jobs stored at that commit, one line each, newest first: the record number, the check, the verdict, the job, the leg, the run, its attempt and the commit.

  `AGENT_SECRETS_MACHINE_IDENTITY=github-actions` trades a GitHub Actions job's OIDC token, which the client asks of the runner's endpoint (`ACTIONS_ID_TOKEN_REQUEST_URL` with `ACTIONS_ID_TOKEN_REQUEST_TOKEN`) for `AGENT_SECRETS_MACHINE_AUDIENCE` at every trade, or reads from `AGENT_SECRETS_MACHINE_TOKEN_FILE` where the job has no endpoint.
