kind: Changed
body: |-
    `dispatch request-approval` judges an ask block a version of this release writes by the server's read of its ask, and a copy by its source; its refusal says an answer is held on the ask, not in the text, and that Dispatch records the answer's state, and who answered and when, on the block's opening line, which settles into a version on its own about two seconds later and changes no word of the text. `dispatch://KEY/decisions` and a pasted Decisions URL read as the issue. Printed labels say ask block for a question to a person. `dispatch doc-read` prints the text as the server answers it, which uploads back unchanged, and one trailer line beside `Document token:` for each answer the server's `asks` names. `dispatch doc-edit`'s insert takes `into: "block:<id>"` and writes inside that block.
