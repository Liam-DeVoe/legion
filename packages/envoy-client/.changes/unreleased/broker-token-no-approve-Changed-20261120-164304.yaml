kind: Changed
body: |-
  Dispatch no longer gives a token traded at the secrets broker, a person's `agent-secrets login` sign-in included, the `approve` scope, so such a token sent directly is refused `403 OAUTH_SCOPE_REQUIRED` naming `approve`, as is its answer to an approval request. A session on a box where a person signed in approves instead through Cipher's proxy, with the approve placeholder its sign-in trades for, and the secrets broker spends an approve-only token that never reaches the box (see the `dispatch review` entry of this release). Elsewhere, `dispatch review` works only with a personal token (`DISPATCH_TOKEN`) that holds `approve`.
