kind: Fixed
body: |-
  `inboundUnavailable` holds a registration the listener answered with the bus-outage 503
  (`isBusUnanswered`) as it holds the start race: the first such refusal since the last accepted
  registration starts the `INBOUND_FIRST_OPEN_BOUND_MS` bound, an accepted registration inside it
  ends the hold with nothing said, and only a refusal at or after its end tells the session.
  `inboundUnavailableNoticeText` words a `why` that begins with `BUS_UNANSWERED_PREFIX` as a
  registration the listener did not record, which Envoy messages may still reach, not as a
  session with no durable consumer. `restored` takes the `why` the outage told, and so does
  `inboundRestoredNoticeText`. After such a `why`, the restored notice says that the listener
  recorded a registration of this session, and that a message the stream stored that has not
  reached the session arrives now. It
  does not say that the session receives again, as it still does after any other `why`. The new
  `isUnrecordedRegistration(why)` says whether a told `why` is a registration the listener did
  not record, so each host picks the words of its own one-line texts by it and does not test the
  prefix itself.
