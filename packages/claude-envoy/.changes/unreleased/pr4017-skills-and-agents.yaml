kind: Changed
body: |-
  The `dispatch-writing-specs` outline says that a view holds no requirement block and that its
  `Delivers:` line names the ancestor's requirements its checks serve. The `dispatch-first` table
  no longer sends a Legion architect to `skill://legion-architect`, because the architect's own
  prompt already does. In the generated `legion` plugin, the architect, worker and controller
  skills say that the daemon holds a parent's phase starts while a child of it is open, in
  `awaiting_children`, and that the parent comes back with a forward merge and a full test round.
  They also tell an architect how to write a root as a view on an approved ancestor and register
  it on that ancestor's approval, that an issue with children carries no code of its own, so a
  root whose work needs another child's merge names that child and builds on its branch or waits
  on it as the deployment says, and that a
  view's Design decides how the root builds each of the ancestor's requirements. The
  `plan-reviewer` and `plan-gap-analyst` agents ask for no task and no check of a requirement
  whose text starts `Delivered by` after its number and title and names the issue that delivers
  it, whatever that issue's parent, since that issue's checks serve it.
