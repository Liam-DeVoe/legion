kind: Fixed
body: |-
  Once a registration is accepted after the session was told "Envoy inbound unavailable", the
  server says once that the session receives again: a notice "Envoy inbound restored", which says
  that what the stream stored meanwhile arrives now, and one stderr line. Before this the session
  never learned that its inbound came back. A removal frame's registry write that the listener's
  message bus did not answer is reported as that outage, with the words that the registry may
  already be without the topic, where the line said the topic could not be dropped. A session
  whose shutdown has begun registers nothing and is told neither notice, where a heartbeat that
  ran after the shutdown closed the relay could tell it "Envoy inbound unavailable".
