kind: Fixed
body: |-
  The channel server, the session hooks and `envoy-send` pass everything they write to stdout and
  stderr, the MCP stream and the context Claude Code hands the model included, through the scrub of
  the secrets the process holds (`@legion/contracts/held-secrets`): a server at the wrong URL that
  echoes a token the session sent it, whole or in part, prints `<withheld>` in its place. A write
  that holds no held secret goes out byte for byte.
