kind: Changed
body: |-
  The Legion plugin this package builds ships `skill://legion-worker/references/red-at-the-head.md`:
  the role that holds an issue's phase re-runs a red check at the head of its pull request once,
  after it records the failure, and the `legion-controller` skill keeps one issue per test that
  such a re-run cleared.
