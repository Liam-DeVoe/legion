kind: Fixed
body: |-
  With `NATS_AUTH=broker`, the channel server waits for its broker token for as long as it runs:
  through a pod session not registered yet, a secrets broker that does not answer, and a 5xx, the
  token client saying at each wait what it waits on. It used to fail its start after 20 s, and
  Claude Code does not restart a channel server that ended, so the session had no delivery for
  its life. A refusal no trade cures still ends the start, naming it.
