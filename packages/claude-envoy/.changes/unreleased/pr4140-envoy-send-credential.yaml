kind: Changed
body: |-
  `envoy-send` sends through envoy-client's own send, as a session's own sends do. The message
  carries one idempotency key on every attempt, so the listener stores it at most once; an attempt
  that got no answer or a 5xx is sent again under that key; and a send that may have arrived is
  reported as such, with the key that resends it safely, where it used to make one attempt with no
  key, fail, and deliver the message twice when run again. Each attempt's broker credential waits
  the attempt's 5 s less a 1 s reserve and then the send goes without it, so a listener that asks
  for no credential still takes it while the broker is down or silent; a listener that wants one
  answers 401, and the error names both that answer and why the credential could not be minted,
  and offers no resend, since nothing was stored. Its failure line names the listener's URL only as
  the other clients do, never its user info. The session-start hook and a person's message's
  Dispatch calls give their Dispatch client its budget as its deadline, so the credential is given
  that budget less the request's reserve.
