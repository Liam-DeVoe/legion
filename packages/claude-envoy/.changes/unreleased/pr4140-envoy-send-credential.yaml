kind: Changed
body: |-
  `envoy-send` gives its broker credential the send's 5 s less a 1 s reserve, and a credential
  that did not come by then lets the send go without one, so a listener that asks for no
  credential still takes it while the broker is down or silent. A listener that wants one answers
  401, and the error names both that answer and why the credential could not be minted. The
  session-start hook and a person's message's Dispatch calls give their Dispatch client its
  budget as its deadline, so the credential is given that budget less the request's reserve.
