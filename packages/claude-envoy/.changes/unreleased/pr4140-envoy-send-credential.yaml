kind: Changed
body: |-
  `envoy-send` sends through envoy-client's own send, as a session's own sends do. The message
  carries one idempotency key on every attempt, so the listener stores it at most once, and an
  attempt that got no answer or a 5xx is sent again under that key. A send that may have arrived
  is no longer reported as failed: it exits 75 (`EX_TEMPFAIL`), names its key, and prints the
  command that sends it again under that key, `envoy-send --idempotency-key <key> <target>
  <message>`, which the listener drops as a repeat if the first copy arrived. Before, it made one
  attempt with no key, printed "failed", exited 1, and a run of it again delivered the message
  twice. A refusal exits 1 as before, a listener that refused the connection or whose name did
  not resolve included. Each attempt's broker credential waits the attempt's 5 s less a 1 s
  reserve and then the send goes without it, so a listener that asks for no credential still
  takes it while the broker is down or silent; a listener that wants one answers 401, and the
  error names both that answer and why the credential could not be minted, and offers no resend,
  since nothing was stored. Its failure line names the listener's URL only as the other clients
  do, never its user info. The session-start hook and a person's message's Dispatch calls give
  their Dispatch client its budget as its deadline, so the credential is given that budget less
  the request's reserve.
