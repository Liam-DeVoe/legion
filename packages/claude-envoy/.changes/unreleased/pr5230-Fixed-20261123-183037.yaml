kind: Fixed
body: |-
    The Legion claim reads a 408 and a 429 from the Legion daemon as it reads a 5xx: `claims/ready`
    is sent again, at boot and after a role regain, and a `claims/register` answered either is
    logged and rejects without stopping the pane, which the daemon's registration deadline then
    covers. The daemon writes neither, so only a proxy between the session and the daemon sends
    one. `envoy-send` and every Envoy listener call send a 408 once more, as a 5xx; a send answered
    408 on every attempt is that refusal, not "may or may not have arrived".
