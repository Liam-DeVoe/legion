kind: Changed
body: |-
  The plugin speaks daemon API contract 206. The `legion` MCP tool's `handoff_complete` sends no
  verdict on a phase completion: Dispatch's check states at the tested head decide the testing
  phase. A phase completion that names one is refused once the daemon's record shows it is a
  phase's, before the handoff record is read or a grant minted, with `handoff_complete carries no
  verdict on a phase completion: Dispatch's check states decide the testing phase`. `verdict`
  (pass, pending or fail) belongs to a production check report alone, and the tool's description
  says so.
