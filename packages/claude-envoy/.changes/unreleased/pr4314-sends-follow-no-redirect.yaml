kind: Fixed
body: |-
  `envoy-send` and the Legion daemon client follow no redirect. A 3xx is a refusal, read from its
  status before any of its body, that names the status, says where it points (another origin by
  its scheme and host, another path of the same address, or no target) and names the setting to
  correct, and `envoy-send` exits 1. Before, the send followed it with the broker's DPoP proof and
  the message and printed `Sent`, and a daemon call sent a 307's or 308's body, with the boot token
  or the claim's secret, on to the other origin. `envoy-send` names its Envoy URL with no user and
  no password on every line it fails with.
