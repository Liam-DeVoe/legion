kind: Added
body: |-
  A Codex CLI session's NATS connection takes the session's broker token where its settings say
  `NATS_AUTH=broker` (or `envoy.natsAuth: broker`), as a Claude Code session's does: it dials
  through the same path (`dialChannelNats`), keeps the token renewed, and at a `/new` moves the
  connection to the new session's token before it takes the new session's subjects. The live view
  takes the new id's control subject only once the connection is admitted as it. A seed, or no
  credential, dials as before.
