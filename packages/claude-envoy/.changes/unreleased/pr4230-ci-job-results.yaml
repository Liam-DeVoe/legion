kind: Changed
body: |-
  The Legion plugin's skills say that a run of a check's CI job on a push of the change's branch records its own result of a check carrying `ci_check`, and that a pass from CI is the derived result or one the job recorded. Their merge gate asks a pass from the implementer and from the tester both at the head being reviewed, or from CI for a check carrying `ci_check`, and retro's read says that a pass at another commit does not count and a pass and a fail at one head leave it not known.
