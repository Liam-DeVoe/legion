name: CI job agent-harness

# The steps of ci.yaml's `agent-harness` job, in a file of its own.
# ci.yaml's job of the same id calls this file, and that caller keeps `needs: changes` and the
# whole `if:` that decides whether these steps run, so this file carries no `if:` of its own.
# That `if:` tests an output the merge queue and the `full-ci` label hold back, as they hold back
# the slow suites (the comment on ci.yaml's `agent_harness` output says why).
#
# The tests here drive real agents, each answered by a model stand-in of the test's own. The job
# is split into parts, and each part is a literal job of this file, not a leg of a matrix: the
# readers of ci.yaml (check-ci-filters.sh, ci-ok's report) read each job of this file by its id
# and expand no matrix. Each part installs what its own tests use and nothing more, and ends with
# the upload of its tests' logs when it fails and with the ci-ok-report step. Each part stays
# within the time of daemon-go's median green run, about 24 minutes.
#
# pane-drivers runs the five live proofs of internal/daemon that drive real Oh My Pi panes, the
# tests .github/scripts/ci_job_reads.py's AGENT_HARNESS_TESTS names, every test of the five files
# its AGENT_HARNESS_FILES names. Each boots the whole daemon through the function `legion start`
# calls, over this job's PostgreSQL and the package's test NATS server, builds the `legion` its
# panes run and packs both plugins from this checkout, installs them on the pinned Oh My Pi, and
# runs each pane as a child process group of the test (internal/daemon's
# localruntime_live_test.go) against a model stand-in of its own. They were the drivers of five
# scripts under scripts/e2e, which no CI job ran; they carry no build tag now, and the daemon-go
# race step, which runs their package, skips them by name, so each runs once per run of the
# router, here, where its reads are this job's inputs: with them in daemon-go a change to the
# lockfile or to one skill would run the daemon's whole Go suite.
#
# The tests' names are written in .github/scripts/ci_job_reads.py (AGENT_HARNESS_TESTS), which
# builds the pane-drivers step's `-run` and the race step's `-skip` from the one list and holds
# each step's whole script to the text it builds, so the two cannot come to name different tests.
#
# What pane-drivers installs is what those tests need:
#   * the pgvector Postgres service and LEGION_TEST_PG_DSN - the store every daemon the tests
#     boot migrates and runs on, and the server late_completion_live_test.go's Dispatch makes a
#     database of its own on, whose migrations create the pgvector extension;
#   * the NATS image the daemon package's test broker starts (internal/testnats's Image), pulled
#     first for the reason the action gives, and TESTCONTAINERS_RYUK_DISABLED, as daemon-go sets
#     it;
#   * git and jj 0.38 or later, which the daemon resolves at boot and refuses to start without:
#     git is the runner image's own, and install-jj gives the jj the worker image ships and
#     installs the mise install-omp installs the pin through, so it comes first;
#   * Oh My Pi at the pin .omp-pin names (LEGION_TEST_OMP), which every pane runs;
#   * Bun and a frozen install, for the plugin packs;
#   * setup-go and the go-daemon cache restore: the step compiles internal/daemon's test binary,
#     the same package the plugin-pack and daemon-live jobs' steps build, and builds `legion` and
#     the Dispatch server.
# No tmux, no socat and no Claude Code: the panes are child process groups on Oh My Pi alone.
#
# A failed test leaves its logs: each test writes the daemon's own log at debug, Dispatch's where
# it starts one, and each pane's output to a directory named for it under
# LEGION_TEST_DAEMON_LOG_DIR (internal/daemon/live_proof_test.go's liveLogDir), and the step after
# the tests uploads that directory when the part fails.
#
# Each part's last step reports ci-ok for the caller: on a merge-group run that part's own result
# decides, it posts the failing ci-ok at once (.github/actions/ci-ok-report), as every job of
# ci.yaml ends. `ci-ok-changes` carries ci.yaml's `toJSON(needs.changes)` for it.
on:
  workflow_call:
    inputs:
      ci-ok-changes:
        description: >-
          ci.yaml's `toJSON(needs.changes)`: end each part with ci-ok's report
          (.github/actions/ci-ok-report), as every job of ci.yaml ends.
        type: string
        required: true

# A `|` between proxy entries makes a go command fall through to the next source after ANY error,
# where a `,` falls through only after a 404 or a 410 (Go's module reference, "GOPROXY protocol").
# proxy.golang.org reset a download mid-stream and turned a Go lane red on a module whose hash
# go.sum already holds (sjawhar/legion#2512); with `|direct` the command fetches the same bytes
# straight from the source and checks them against go.sum, so this is a second path, not a weaker
# check.
env:
  GOPROXY: https://proxy.golang.org|direct

jobs:
  pane-drivers:
    runs-on: ubuntu-24.04
    # The step's own -timeout is 20 minutes, inside the part's budget of about 24. The five tests'
    # drivers took 152 s (claim compaction), 300 s (provider error retry), about 55 s (role prompt
    # rule), 78 s (late completion) and about 213 s (busy relaunch) in a Legion worker pod under
    # gVisor, about 13 minutes one after another, and a hung test prints the goroutine dump that
    # names it before the runner cancels the job. Around it are the jj, Oh My Pi and Bun
    # installs, the image pull and the Go build of internal/daemon's test binary,
    # which the cache restore makes incremental; 40 minutes leaves that setup the other 20 on a
    # slow runner.
    timeout-minutes: 40
    services:
      postgres:
        # ghcr.io/cybermonklabs/legion/ci, the copy of pgvector/pgvector (.github/ci-images.yaml):
        # the image and the shape the daemon-go job declares.
        image: ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LEGION_TEST_PG_DSN: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      # The runner VM is discarded after the job, so testcontainers' Ryuk reaper has nothing to
      # clean up, and its image (testcontainers/ryuk, on Docker Hub) would be one more registry
      # pull a test could fail on.
      TESTCONTAINERS_RYUK_DISABLED: "true"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every daemon the tests boot resolves git and jj at boot and refuses to start without
      # either, and late_completion_live_test.go makes its panes' workspace with them: git is the
      # runner image's own, and this is the jj the worker image ships. It also leaves mise at
      # ~/.local/bin/mise, which install-omp installs the pin through.
      - uses: ./.github/actions/install-jj

      # Every pane runs the Oh My Pi .omp-pin names, and the tests refuse on GitHub Actions
      # without one (LEGION_TEST_OMP).
      - uses: ./.github/actions/install-omp

      # Each test packs both plugins with `bun pm pack`, whose prepack builds each bundle from the
      # installed workspace.
      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/daemon/go.mod
          cache: false

      # go-daemon, shared with typecheck, daemon-go, plugin-pack, daemon-live and pi-legion: this
      # step compiles the same package's test binary the plugin-pack job's step does.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-daemon-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: ${{ format('go-daemon-{0}-{1}-', runner.os, runner.arch) }}

      # The package's test broker starts testnats.Image (the hub's 2.15.1), pulled first for the
      # reason the action gives.
      - name: Pull the NATS test container image
        uses: ./.github/actions/pull-test-images
        with:
          consts: |
            packages/daemon/internal/testnats/nats.go Image

      # The five tests, by name. .github/scripts/ci_job_reads.py builds this text and the
      # daemon-go race step's `-skip` from AGENT_HARNESS_TESTS and holds both steps to what it
      # builds.
      - name: Run the pane drivers on the pinned Oh My Pi
        env:
          LEGION_TEST_DAEMON_LOG_DIR: ${{ runner.temp }}/agent-harness-logs
        run: go test -v -count=1 -timeout 20m -run '^(TestABusyAgentIsSentItsTaskOnceAndARelaunchSaysWhatItEndedLive|TestAProviderErrorKeepsTheTaskAndTheOperatorRetriesWhatItLeavesLive|TestEveryRoleIsLaunchedWithTheRulesItsOwnPromptCarriesLive|TestLateCompletionsThroughTheRealLegionToolLive|TestTheOperatorAndTheControllerCompactAClaimsSessionAndStartItFreshLive)$' ./internal/daemon/
        working-directory: packages/daemon

      # A failed test's logs, one directory per test: the daemon's own daemon.log at debug,
      # Dispatch's dispatch.log where the test starts one, and each pane's output.
      - name: Upload the pane drivers' logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-harness-pane-drivers-logs-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agent-harness-logs

      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        uses: ./.github/actions/ci-ok-report
        with:
          job: agent-harness
          changes: ${{ inputs.ci-ok-changes }}
          job-status: ${{ job.status }}
