name: CI job pi-shared

# The steps of ci.yaml's `pi-shared` job, in a file of its own.
# ci.yaml's job of the same id calls this file, and that caller keeps `needs: changes` and the
# whole `if:` that decides whether these steps run, so this file carries no `if:` of its own.
#
# The split is for the filters. This job's filter names this file beside ci.yaml, so a change to
# these steps selects this job alone, where a change to ci.yaml selects every job.
#
# The job's last step reports ci-ok for the caller: on a merge-group run this job's own result
# decides, it posts the failing ci-ok at once (.github/actions/ci-ok-report), as every job of
# ci.yaml ends. `ci-ok-changes` carries ci.yaml's `toJSON(needs.changes)` for it.
on:
  workflow_call:
    inputs:
      ci-ok-changes:
        description: >-
          ci.yaml's `toJSON(needs.changes)`: end the job with ci-ok's report
          (.github/actions/ci-ok-report), as every job of ci.yaml ends.
        type: string
        required: true

jobs:
  pi-shared:
    runs-on: ubuntu-24.04
    # Budget (ci-budgets.md's Budgets note): 600 s, the 10 minutes this job carried, above its 36 s
    # measured maximum, plus its slowest retried step alone — install-jj, whose two
    # `ci_tools_fetch` calls and `mise install` of the jj release are 2562 + 450 = 3012 s, above
    # the setup-bun step's 2562 s, the workspace install's 5 x 180 + 150 = 1050 s and the ci-ok
    # report's 1380 s. 600 + 3012 = 3612 s -> 61 min. Main's #4012 added that install-jj step,
    # and this job carried 53 until the forward merge of round 35 priced it.
    timeout-minutes: 61
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Its own retry arithmetic, which is the action's: two `ci_tools_fetch` calls,
      # 2 x 1281 = 2562 s (ci-budgets.md's Budgets note) -> 43 min.
      - uses: ./.github/actions/setup-bun
        timeout-minutes: 43
      # Retried at 180 s per attempt like every Bun install here (ci-budgets.md's Retries note).
      - name: bun install --frozen-lockfile
        # Its own retry arithmetic: 5 x 180 + 150 = 1050 s -> 18 min.
        timeout-minutes: 18
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "the workspace's dependencies" 180 -- bun install --frozen-lockfile
      - name: Typecheck pi-shared
        run: bun run typecheck
        working-directory: packages/pi-shared
      # src/jj-attribution.test.ts runs the real jj in a scratch repository for one case, and
      # refuses on GitHub Actions without one.
      # install-jj's own retry arithmetic: two `ci_tools_fetch` calls and its `mise install`
      # of the jj release, 2562 + 450 = 3012 s (ci-budgets.md's Budgets note) -> 51 min.
      - uses: ./.github/actions/install-jj
        timeout-minutes: 51
      # test/skills-partition.test.ts stages each plugin's skills with scripts/pi-plugin-prepack.sh
      # --stage-skills and holds the two lists to a partition of skills/.
      - name: Test pi-shared
        run: bun run test
        working-directory: packages/pi-shared

      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        # Its 1500 s: ci-budgets.md's Budgets note, "The ci-ok report".
        timeout-minutes: 25
        uses: ./.github/actions/ci-ok-report
        with:
          job: pi-shared
          changes: ${{ inputs.ci-ok-changes }}
          job-status: ${{ job.status }}
