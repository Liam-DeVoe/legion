name: CI job envoy-go

# The steps of ci.yaml's `envoy-go` job, in a file of its own.
# ci.yaml's job of the same id calls this file, and that caller keeps `needs: changes` and the
# whole `if:` that decides whether these steps run, so this file carries no `if:` of its own.
#
# The split is for the filters. This job's filter names this file beside ci.yaml, so a change to
# these steps selects this job alone, where a change to ci.yaml selects every job.
#
# The job's last step reports ci-ok for the caller: on a merge-group run this job's own result
# decides, it posts the failing ci-ok at once (.github/actions/ci-ok-report), as every job of
# ci.yaml ends. `ci-ok-changes` carries ci.yaml's `toJSON(needs.changes)` for it.
on:
  workflow_call:
    inputs:
      ci-ok-changes:
        description: >-
          ci.yaml's `toJSON(needs.changes)`: end the job with ci-ok's report
          (.github/actions/ci-ok-report), as every job of ci.yaml ends.
        type: string
        required: true

# A `|` between proxy entries makes a go command fall through to the next source after ANY error,
# where a `,` falls through only after a 404 or a 410 (Go's module reference, "GOPROXY protocol").
# proxy.golang.org reset a download mid-stream and turned a Go lane red on a module whose hash
# go.sum already holds (sjawhar/legion#2512); with `|direct` the command fetches the same bytes
# straight from the source and checks them against go.sum, so this is a second path, not a weaker
# check.
env:
  GOPROXY: https://proxy.golang.org|direct

jobs:
  envoy-go:
    runs-on: ubuntu-24.04
    # Every go test call of this job and of the race lane is sized from THE LARGEST READING THIS
    # CHANGE HAS of that call's slowest package, over every measurement pair it ran, each pair
    # two workflow_dispatch runs of this file at one head. R6 sizes a limit from "the call's
    # slowest package, on the slower attempt", and the subject of that clause is the call, so a
    # limit takes the larger reading, which can only raise a limit and never lower one; taking
    # the largest of every pair is that same rule over every measurement, and it is what makes
    # a number settle, since a later pair moves one only by reading higher than every pair
    # before it. Each job's own timeout-minutes is sized the same way, from the largest time
    # this change measured of that job, and the derivation and the run it was read in stand in
    # the comment on that job rather than here, so one reading lives in one place
    # (dispatch://INFRA-1075, check 6224bb0e).
    #
    # Each go test call's -timeout meets two conditions. The first is R6's: the limit is the
    # smallest whole minute at which the call's slowest package takes at most half of it, so a
    # hung test prints the dump that names it well before the runner cancels the job, and a
    # test that merely runs long does not. The second is a floor the first does not see: a call
    # whose tests read roomWaitMargin - the documents package's room waits, 30 s
    # (settlement_credit_test.go:541) - must leave at least that margin above its slowest
    # package's own time, or those tests refuse the run rather than waiting in it. A limit at
    # least twice its package's time clears the floor by the same arithmetic that clears the
    # half.
    #
    # Each limit is the smallest whole minute its package's time is at most half of, taking the
    # largest reading this branch has of that package, read off the envoy-go artifact of every
    # workflow_dispatch run of this file on the branch:
    #
    #   call              slowest package       limit  fills    read in
    #   the package list  pmdoc 686.5 s          23m   49.7 %   run 43823941384
    #   race-impossible   docs 467.6 s           16m   48.7 %   run 43857871536
    #   pgmigrate         pgmigrate 386.1 s      13m   49.5 %   run 42779139068
    #   shutdown          cmd/dispatch 76.1 s     3m   42.3 %   run 43723760337
    #   routes            routes 54.5 s           2m   45.4 %   run 43519308059
    #   events            events 161.2 s          6m   44.8 %   run 43138709383
    #   natslive (rig)    testnats 9.1 s          1m   15.1 %   run 42863916685
    #   natslive (cap)    bus 14.2 s              1m   23.7 %   run 43733795306
    #   integration       integration 10.1 s      1m   16.9 %   run 43716631673
    #
    # Each row is its package's time divided by 30 and rounded up, which is the smallest whole
    # minute that time is at most half of, and this table is where the reading that sizes each
    # limit is derived; the comment on each call below names its limit and points here, and the
    # package-list call's comment repeats its own reading because the margin it clears is read
    # off it.
    #
    # Three calls run tests that read a margin off the binary's own deadline, and each clears it:
    # 23m leaves 693.5 s over internal/dispatch/pmdoc's own time in the package list, against the
    # 60 s of pmdoc's perCallReportMargin; 16m leaves 492.4 s over the documents package's time in
    # the race-impossible call, against its 30 s of roomWaitMargin; and 3m leaves 103.9 s over
    # cmd/dispatch's time in the shutdown call, against the 30 s of eventsStartDrain
    # (cmd/dispatch/live_events_wait_test.go:76), which waitEventsStart leaves of the deadline so
    # that its failure prints rather than being cut off by the package timeout. At 4 minutes the
    # race-impossible call failed that floor and said so
    # itself, in both arms of run 42577832967: "the test binary's deadline leaves 20.769s, not
    # more than roomWaitMargin (30s): this looks like a misconfigured run; raise -timeout".
    #
    # The job's own bound follows the largest measured time this branch has of a green run of
    # it, plus the limit of the step whose hang would run longest, plus 6. Main's merge at
    # 12a6fd4f added three steps after the unit step - the store-form count (backend-count.sh's
    # own -timeout of 5 minutes), the database broker suites' skip count (a step limit of 25
    # minutes, measured at 331 s on a dev box) and the agent-secrets moto vet - so the step whose
    # hang runs longest is the skip count, after the steps before it at their measured times.
    # Before those steps joined, the largest green reading was 795 s (run 43602043317, job
    # 132468719806), 13.25 minutes, with the unit step's 23-minute call the longest limit. Until
    # a pair measures the job with them, the store-form count is counted at its whole 5-minute
    # limit: 13.25 + 5 + 25 + 6 = 49.25, so 50, which also holds the unit step's own worst case,
    # 13.25 + 23 + 6 = 42.25. The eight runs of 2026-11-08 whose file carried TEMPORARY profiling
    # and -p sweep steps (runs 42439260413 to 42506378238, up to 1,655 s) ran work this job does
    # not, and are no reading of it. A bound is met when it is at least what the head's own pair
    # asks for, and it follows the largest reading rather than the newest, because a job of this
    # lane varies by two minutes between two attempts of one commit and does not settle inside a
    # one-minute band. The nine calls of the unit step run at the same time, so the step's own
    # worst case is the longest of them rather than their sum.
    timeout-minutes: 50
    services:
      postgres:
        # ghcr.io/cybermonklabs/legion/ci, the copy of pgvector/pgvector (.github/ci-images.yaml)
        image: ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        # The settings these tests need, as the server's own command line, so it starts with them
        # and no step has to restart it (jobs.<job_id>.services.<service_id>.command overrides the
        # image's CMD, and the runner passes it as the arguments after the image name in its
        # `docker create`). The read-back step below holds the server to every one of them.
        #
        # This job's Postgres is a container that dies with it, so nothing it holds has to
        # survive a crash: fsync, full_page_writes and synchronous_commit are off, which is what
        # makes a forced checkpoint cheap. It is the top wait of the unit step otherwise - a
        # sample of pg_stat_activity beside it found IPC/CheckpointDone and IPC/CheckpointStart
        # outweighing every other wait event of an ACTIVE backend together by five times (run
        # 42035294257), because `create database … strategy file_copy` forces two and a drop forces
        # one. The harness changes no server setting, so a developer's own Postgres keeps its
        # durability (dispatch://INFRA-1075).
        #
        # The tests of this job run at the same time, each with a pool of its own, and the image's
        # default max_connections is 100, which several package binaries at once exhaust (`FATAL:
        # sorry, too many clients already`). 500 is five times that default, and no bound on what
        # the job can reach: eight package binaries (`go test -p 8`), each running up to twelve
        # tests at once (`-parallel 12`), each test store holding up to 16 connections
        # (storetest's testPoolSize), could ask for 1,536 at once, and 512 even at four tests a
        # binary, the runner's cores.
        #
        # max_prepared_transactions is raised with it, from the image's default of 0, though no
        # test of this job prepares a transaction. The one test that does is the event log's floor
        # test, TestNoPreparedTransactionHoldsAnEventIDAndTheFloorTrailsOneAnyway, which only
        # envoy-go-race-api runs: it prepares a transaction holding the lock an insert into events
        # takes, which is the one writer pg_locks shows with no backend pid, and in CI it fails on
        # a server that can prepare none. This job carries the setting because every Postgres
        # service of this file starts on the same five settings, and
        # .github/scripts/postgres-service-settings.sh holds each of them to all five
        # (dispatch://INFRA-1075).
        command: postgres -c fsync=off -c full_page_writes=off -c synchronous_commit=off -c max_connections=500 -c max_prepared_transactions=20
        # --shm-size: a service container gets 64 MB of /dev/shm by default, and Postgres puts a
        # parallel worker's shared memory there. With the module's packages running at once the
        # seed's HNSW build failed on it ("could not resize shared memory segment … No space left
        # on device", job 127148899326), which is the container's limit rather than the server's
        # (dispatch://INFRA-1075).
        #
        # --health-interval is a second rather than ten, and --health-retries 50 rather than 5,
        # which is the same 50 s a slow start was given before: docker runs the first health
        # check an interval after the container starts, so at ten this server was reported
        # healthy at 14 s where it had been ready at about 1, and the job's first step waited
        # that out (run 42307926510, "Initialize containers", 22 s of which 15 s was the wait).
        # A `pg_isready` a second for the job's length is one short exec of the service
        # container, which no step of this job is measured against (dispatch://INFRA-1075).
        options: >-
          --shm-size=1g
          --health-cmd "pg_isready -U postgres"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 50
      # internal/dispatch/routes gets an instance of its own, and the routes call of the unit
      # step below is the only thing pointed at it. Its tests wait for the event log's safe
      # horizon, which is instance-wide by design: it rests on pg_snapshot_xmin, so ANY
      # transaction running anywhere on the instance holds it back until it ends, this job's
      # other package binaries' `create database … strategy file_copy` among them
      # (internal/dispatch/events/horizon.go, "Safe horizon"). That is not a cost a setting can
      # take away - the settings below are this server's too - so the only way to keep those
      # waits off the other packages' transactions is a second instance. Measured on a pod: one
      # transaction holding a transaction id on another database of the same instance, with no
      # load at all, takes TestAnEventsSubscriptionFromTheWhoamiHeadReplaysWhatCommittedSince
      # to the exact failure CI saw twice in three runs ("read the events_start: … i/o
      # timeout", runs 42378432951 and 42424201523), with the server's own warning naming the
      # holder: "event horizon held back by an open transaction; live event readers wait for
      # it … query=select pg_current_xact_id(), pg_sleep(30)". The subscription is open
      # throughout - the socket's read deadline is what ends it, not the socket - so the wait
      # is the horizon's (dispatch://INFRA-1075).
      postgres_routes:
        # ghcr.io/cybermonklabs/legion/ci, the copy of pgvector/pgvector (.github/ci-images.yaml)
        image: ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_PASSWORD: ci
        # 5433 on the runner: the service above holds 5432, and two services cannot publish one
        # host port. The container's own port is 5432 either way.
        ports: ["5433:5432"]
        # The five settings of the service above, for the reasons given there: this server is
        # as disposable as that one, and one package's binary opens as many connections per
        # store. No routes test prepares a transaction: max_prepared_transactions is here because
        # the read-back step below holds this server to every one of the five too.
        command: postgres -c fsync=off -c full_page_writes=off -c synchronous_commit=off -c max_connections=500 -c max_prepared_transactions=20
        options: >-
          --shm-size=1g
          --health-cmd "pg_isready -U postgres"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 50
      # A third instance, for the one untagged test of cmd/dispatch that reads a live event feed
      # (TestSIGTERMWithOpenStreamsExitsPromptlyAndSettlesTheOwedDocument, shutdown_test.go). It
      # waits on events_start exactly as the routes package does, and in run 42581214577 it timed
      # out on it with the server naming the holder: "event horizon held back by an open
      # transaction … database=dispatch_test_2be55348167c1ee8", a database of another package of
      # this job, pending_for 5.14 s. It cannot share the routes service either, in either
      # direction: routes' own tests hold instance-wide transaction ids on purpose
      # (whoami_test.go's pg_current_xact_id hold, its cluster-database holder and its
      # out-of-order insert), and routes' horizon loop has already been blown once by a sibling's
      # `create database … strategy file_copy` (run 41868325451), which is what this test's own
      # harness does. So it gets a server no other test touches, on 5434
      # (dispatch://INFRA-1075).
      postgres_shutdown:
        # ghcr.io/cybermonklabs/legion/ci, the copy of pgvector/pgvector (.github/ci-images.yaml)
        image: ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5434:5432"]
        # The five settings of the services above, for the reasons given there.
        command: postgres -c fsync=off -c full_page_writes=off -c synchronous_commit=off -c max_connections=500 -c max_prepared_transactions=20
        options: >-
          --shm-size=1g
          --health-cmd "pg_isready -U postgres"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 50
      # A fourth instance, for internal/pgmigrate, whose redaction oracle holds scanl.go's
      # transcription of PostgreSQL's scan.l to a real PostgreSQL: it asks a server about 158,364
      # (text, setting) pairs, and what a pair costs is a round trip, not arithmetic. Measured on
      # run 42774209109: 2.16 ms a round trip in this lane against 0.16 ms against an idle
      # server, the package 375.5 s here for 53.7 s of wall alone on four idle cores and 63.8 s
      # of CPU. Two things follow, and the service answers both: the package waits on a queue the
      # rest of this job fills, and those 158,364 round trips are themselves load on the server
      # every other package of the job shares - a cost its own time does not show. So it gets an
      # instance of its own, on 5435, named on the pgmigrate call of the unit step and nowhere
      # else (dispatch://INFRA-1075).
      postgres_pgmigrate:
        # ghcr.io/cybermonklabs/legion/ci, the copy of pgvector/pgvector (.github/ci-images.yaml)
        image: ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5435:5432"]
        # The five settings of the services above, for the reasons given there.
        command: postgres -c fsync=off -c full_page_writes=off -c synchronous_commit=off -c max_connections=500 -c max_prepared_transactions=20
        options: >-
          --shm-size=1g
          --health-cmd "pg_isready -U postgres"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 50
      # A fifth instance, for internal/dispatch/events, whose horizon tests wait for the event
      # log's safe horizon as the routes package and the shutdown feed test do: it rests on
      # pg_snapshot_xmin, so any transaction open anywhere on the instance holds it back
      # (internal/dispatch/events/horizon.go, "Safe horizon"). In the package list, on the first
      # service, which every other package of this job shares,
      # TestHorizonAwaitCoversEveryIDCommittedBeforeTheCall took 27.07 s and 53.94 s on the two
      # passing runs of an earlier pair (runs 43514262740 and 43519308059), and on run
      # 43596122521 (job 132450917326) it failed at its one-minute give-up after 60.48 s ("await
      # event horizon: context deadline exceeded"), while cmd/dispatch-seed's batched seeds and
      # pmdoc ran beside it. The routes package and the shutdown feed test have servers of their
      # own for the same reason, and it cannot share either of theirs: its own tests hold
      # transaction ids on purpose (TestHorizonStaysBelowAnOpenLowerWrite's open write, and
      # TestWriterFloorIgnoresATransactionInAnotherDatabase's transaction in another database of
      # the instance), which would hold back the horizon those two wait on. Nor pgmigrate's: that
      # server is there to keep its package's 158,364 round trips off every other package's
      # queue. So it gets a server no other package touches, on 5436, named on the events call of
      # the unit step and nowhere else (dispatch://INFRA-1075).
      postgres_events:
        # ghcr.io/cybermonklabs/legion/ci, the copy of pgvector/pgvector (.github/ci-images.yaml)
        image: ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5436:5432"]
        # The five settings of the services above, for the reasons given there.
        command: postgres -c fsync=off -c full_page_writes=off -c synchronous_commit=off -c max_connections=500 -c max_prepared_transactions=20
        options: >-
          --shm-size=1g
          --health-cmd "pg_isready -U postgres"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 50
    env:
      DISPATCH_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      BROKER_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      # The runner VM is discarded after the job, so testcontainers' Ryuk reaper has nothing to
      # clean up, and its image would be one more registry pull a test could fail on.
      TESTCONTAINERS_RYUK_DISABLED: "true"
      # (The smoke test and the image it runs are ci.yaml's envoy-smoke job,
      # .github/workflows/ci-job-envoy-smoke.yaml.)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # bun, because a test runs it: internal/dispatch/pmdoc's update tests drive the proof
      # editor's own TypeScript through `bun run` and refuse to pass without it
      # (update_test.go:304-312, `bun is required in CI`). No step of this job runs bun, which is
      # why dropping these two steps looked free and cost run 42473681063 its unit step
      # (dispatch://INFRA-1075).
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          cache: false
      # go-envoy-test: this job builds and runs the plain test binaries of the envoy module's
      # packages - the race lane's left to that lane but the two its race-impossible call runs -
      # a set no other job builds, so it keeps a family of its own. The entry holds no
      # module zip: .github/workflows/ci-caches.yaml leaves them out when it fills the family,
      # since go reads an extracted module from its own tree and the zip only to extract it, and
      # they are the largest part of this restore that the archive cannot compress
      # (dispatch://INFRA-1075). The path repeats the fill's, exclusion and all, because
      # .github/scripts/check-ci-filters.sh holds a family's restore to the paths its save
      # names: an entry that held other directories than the job reads would have the job
      # rebuild what the fill already built.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            !~/go/pkg/mod/cache/download/**/*.zip
          key: go-envoy-test-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: ${{ format('go-envoy-test-{0}-', runner.os) }}
      # The script raises max_connections with `alter system` and restarts the server only where
      # the server does not already allow what the lane needs. A setting on a server's command
      # line holds over `alter system`, and this service, as every Postgres service of this file,
      # starts at max_connections=500, which is over testlimits.ServerConnections and the
      # superuser reserve, so the script reads that, prints what the service allows, and alters
      # and restarts nothing. What the step is here for is that check
      # (dispatch://INFRA-1075: the lane's A8 says no step of these jobs runs `alter system`,
      # and a restart would cost the job the time and the connections of a fresh server).
      - name: Size the service for this lane's Dispatch processes
        run: .github/scripts/pg-connection-ceiling.sh "${{ job.services.postgres.id }}"
      # The server's version and the pgvector version it offers, read from the service itself, so
      # the run shows which Postgres the tests below ran on.
      - name: Postgres service version
        run: |
          docker exec "${{ job.services.postgres.id }}" psql -U postgres -Atc "select current_setting('server_version_num'), coalesce((select default_version from pg_available_extensions where name = 'vector'), 'no vector')"
      # The settings each service's command: asks for, read back from the server itself, because a
      # command the runner does not pass through leaves the server up on the image's defaults
      # rather than failing: the job would then refuse connections under load and pay for the
      # forced checkpoints it meant to make cheap. No test of this job needs the fifth setting,
      # max_prepared_transactions: envoy-go-race-api's floor test does, and fails in CI on a
      # server without it. A setting the server itself refuses never reaches these steps -
      # postgres exits and the service's health check fails the job before its first step.
      # .github/scripts/postgres-service-settings.sh
      # holds the five settings and reads them, for these steps and every step like them in this
      # file; its head says why it is a script. There is a step for each of this job's five
      # services, because each is a server of its own started from a command: line of its own,
      # and a runner that dropped one of those lines would leave that one server on the image's
      # defaults with nothing else saying so.
      - name: Read the disposable service's settings back
        run: .github/scripts/postgres-service-settings.sh "${{ job.services.postgres.id }}" postgres
      - name: Read the routes service's settings back
        run: .github/scripts/postgres-service-settings.sh "${{ job.services.postgres_routes.id }}" postgres_routes
      - name: Read the shutdown service's settings back
        run: .github/scripts/postgres-service-settings.sh "${{ job.services.postgres_shutdown.id }}" postgres_shutdown
      - name: Read the pgmigrate service's settings back
        run: .github/scripts/postgres-service-settings.sh "${{ job.services.postgres_pgmigrate.id }}" postgres_pgmigrate
      - name: Read the events service's settings back
        run: .github/scripts/postgres-service-settings.sh "${{ job.services.postgres_events.id }}" postgres_events
      # Every image the tests here start: testnats.HubImage, which the natslive call of the unit
      # step below runs Envoy on, testnats.Image (nats:2.10), which only the tests of that server
      # itself and of the listener's refusal of it start, and tests3.Image, pulled first for the
      # reason the action gives.
      - name: Pull test container images
        uses: ./.github/actions/pull-test-images
        with:
          consts: |
            packages/envoy/internal/testnats/nats.go Image
            packages/envoy/internal/testnats/nats.go HubImage
            packages/envoy/internal/tests3/seaweedfs.go Image
      # The step below runs the module's packages in the background and, beside them, eight other
      # calls: the plain run of what the race build cannot make, internal/pgmigrate, the routes
      # package, internal/dispatch/events, the shutdown feed test, the container-backed NATS
      # matrix, the integration suite and the agentloop vet. The package list runs 114 test
      # binaries, beside 39 packages with no test files (both runs of the pair at cf069e0d, read
      # from the call's own -json). In the pair at bdffd7d2 (runs 43687973145 and 43691345741,
      # jobs 132732382594 and 132742525106) it took 519.0 s and 594.0 s from the first event of
      # its stream to the last, and every other call of this step had ended before it did. All nine
      # calls are started in the background at the step's head, the long ones longest first, so the
      # step costs the longest of them rather than their sum. The short calls follow the long ones,
      # and their order among themselves decides nothing: in run 2 the last of them ended at
      # 07:50:49 while the package list ran until 07:58:31.
      # The race-impossible call runs here since the measurement dispatch://INFRA-985 asked for
      # was made; the comment on that call says what was measured and what it came back with.
      # The shutdown feed test, internal/pgmigrate and internal/dispatch/events are each out of
      # the package list on a Postgres service of its own, for the reasons their own calls and
      # services give.
      #
      # Each call but the vet writes a `go test -json` stream to a file of its own under
      # $RUNNER_TEMP/go-test-json - the natslive call's two go test commands write one between
      # them - which the upload step below publishes as one artifact per run attempt.
      # .github/scripts/go-test-times.py ranks the tests and packages of such a stream, and
      # compares two of them, which is how this job's time is measured (dispatch://INFRA-1075).
      # The stream is a file rather than the log because `go test -json` is verbose: the step
      # replays each call's package result lines to the log, and that call's whole stream only
      # when it failed, so a green log reads as it did and a red one carries every failing test's
      # output. -count=1 keeps the restored build cache from replaying a stored result as
      # `(cached)`. What a background call prints outside its stream cannot be left to interleave
      # with the others', so each writes that to a log of its own under $RUNNER_TEMP/go-test-logs,
      # replayed with its stream; the package list, which prints as it goes, writes no log of
      # its own. The step waits for all nine, replays one group per call, and exits with the
      # first non-zero status of the nine, each failing call named in an ::error:: of its own.
      #
      # The API package used to run first and on its own in this job, because the per-test
      # database clone and drop of every other package queued on the service's one checkpointer
      # beside it; it runs in envoy-go-race-api now, and the plain run this job keeps of it is
      # the race-impossible call below. The server above writes nothing durable either way, so a
      # clone's two forced checkpoints and its drop's one cost little and that queue sets no
      # step's time here any more.
      # -p 8 rather than go test's default of GOMAXPROCS, and -parallel 12 rather than its default
      # of GOMAXPROCS as well, because these tests wait far more than they compute: a profile of
      # the API package spends 2.19 per cent of its wall time on this process's CPU, and the
      # document service's spends 583 s of CPU over 1,867 s of wall. Four lanes on a four-core
      # runner would be four waits at a time, not four workers. The two numbers are bounded by
      # what the runner's own Postgres can serve beside them, which is why max_connections is
      # raised above, and by the race lanes' memory, which is why those jobs set their own
      # (envoy-go-race-docs). Twelve is measured rather than chosen: at twenty-four the step went
      # 749 s to 1,105 s and ten tests of the document service and the outbox failed on their own
      # deadlines, the runner's four cores being the bound once the waits overlap (run
      # 42035294257, dispatch://INFRA-1075). Both were measured while the API and documents
      # packages were still in this call; the race lane runs them now, so the call they bound is
      # a lighter one.
      #
      # internal/dispatch/routes is NOT in that call: it is the routes call of this step, against
      # the second Postgres service, for the reason that service's own comment gives. It was in
      # this call for one revision of this change, and CI answered the question that put it here -
      # whether a disposable server's clones hold the safe horizon back long enough to matter -
      # by failing TestAnEventsSubscriptionFromTheWhoamiHeadReplaysWhatCommittedSince on its
      # events_start twice in three runs (42378432951 and 42424201523, passing in between). The
      # settings this service carries make a clone cheap; they do not make it free of a
      # transaction id, and the horizon waits on the oldest one open anywhere on the instance,
      # whatever it is doing (dispatch://INFRA-1075).
      #
      # Everything the three race jobs run is left out of the package list, since they run it
      # under the detector, and so is internal/integration, which the integration call tests, and
      # internal/textcheck, whose tests are the text-check job's: that job runs them in a job
      # with no database and no Bun, and a change to only what they read must not start this
      # one. So are internal/dispatch/architecture/notes, internal/runnerlog,
      # internal/dispatch/specgraph, cmd/architecture-check and cmd/spec-check, which
      # envoy-go-checks tests on every push (NOTE_AND_SPEC_PACKAGES). The pattern is built
      # in .github/scripts/ci_job_reads.py from the same lists those jobs' own steps are built
      # from, so what the list leaves out and what the other jobs run cannot drift apart. What is
      # left is the rest of the module less the routes package, internal/dispatch/events and
      # internal/pgmigrate, each of which has a call and a service of its own, and less the two
      # longest packages it held (the API's and the documents service's), which the lane runs
      # now. Its own -timeout is below, with the call. Its one -skip names three tests: the
      # shutdown feed test, which the shutdown call runs on a service of its own, and the two
      # tests of the web app's display-tree fixture. Without `--check` TestWebDisplayFixture
      # writes the committed fixture rather than checking it, so a run here would ask nothing of
      # it, and TestTheWebFixtureFindsItsFilesFromAnyDirectory stats that same file, which would
      # make it a read of this job; envoy-go-checks runs both, the first with the check, and both
      # texts are built from the same list.
      # The long poles lead the list. `go test` starts the packages in the order its arguments
      # name, so a package that starts late ends the call late however little it is waiting for:
      # measured in run 42469495554, pmdoc started about 95 s into the step and ended it 91 s
      # after any other package finished, while every other long package was done 90 s earlier.
      # Leading with the five longest overlaps the longest one with the rest, which is what
      # longest-first scheduling buys. The five are internal/dispatch/pmdoc, cmd/dispatch,
      # cmd/agent-secrets, cmd/dispatch-seed and internal/dispatch/outbox, which are the five
      # longest in both runs of the pair at cf069e0d (runs 43733795306 and 43737129665: pmdoc
      # 525.2 s and 487.2 s, cmd/dispatch 521.0 s and 495.6 s, cmd/agent-secrets 411.2 s and
      # 398.4 s, cmd/dispatch-seed 396.6 s and 388.1 s, outbox 391.1 s and 386.4 s), ahead of
      # cmd/broker at 215.7 s and 211.3 s. Their order among themselves is not a ranking: the two
      # runs rank the first two the other way round, so what the list leads with is the five,
      # read back from the call's own -json (dispatch://INFRA-1075).
      - name: Unit test envoy Go package
        run: |
          mkdir -p "$RUNNER_TEMP/go-test-json" "$RUNNER_TEMP/go-test-logs"
          # The three long calls first, longest first; the short calls after them, in any order.
          # The nine calls share this runner's four cores, so the step is over
          # when its longest call is, and a call that starts late ends as late as it started.
          # Measured on run 42716398877, job 129499072292, every stream on one clock whose zero
          # is the first event of any of them: natslive 0.0 s to 61.0 s, integration 20.8 s to
          # 24.1 s, the race-impossible call 35.9 s to 397.2 s, the package list 76.4 s to
          # 524.5 s, routes 94.9 s to 130.6 s, the shutdown call 110.7 s to 166.4 s. The step
          # was 543 s and the package list was its critical path at 448 s: it started 76.4 s in,
          # after three other calls had begun building and were competing for the cores, and
          # internal/dispatch/pmdoc, its own longest package, started with it. So the list is
          # started first and the race-impossible call, 361 s and the next longest, second
          # (dispatch://INFRA-1075). The `go list` that builds the list's arguments runs ahead of
          # every call for the same reason: what the longest call needs waits on nothing.
          # The pgmigrate call is third because it is the third longest. The run above had its
          # package inside the package list; on a server of its own it took 298.8 s and 223.3 s
          # in the pair at fae4eab5 (runs 43654965125 and 43657875798), against the
          # race-impossible call's 381.3 s and 292.5 s, each from the first event of its stream
          # to the last. The short calls follow it: the longest of them, natslive, took 73.0 s
          # and 65.6 s in that pair.
          #
          # -timeout 23m. A call's limit is the smallest whole minute at which its slowest
          # package takes at most half of it, measured on the largest reading this branch
          # has of that package (dispatch://INFRA-1075). This call's slowest package is
          # internal/dispatch/pmdoc at 686.5 s (run 43823941384, job 133154393766), the first
          # run of this list after main's forward merge brought main's own tests into it, which
          # is 49.7 per cent of 23m and would be 52.0 per cent of 22m, the whole minute below it;
          # the readings before that merge asked 19m (567.3 s, run 43797411630) and 18m
          # (cmd/dispatch 525.9 s, run 43691345741).
          # The limit leaves 693.5 s above the slowest package's own time, far over the 60 s of
          # pmdoc's perCallReportMargin, which is the floor a package that reads the test
          # binary's deadline sets for itself.
          lead="github.com/sjawhar/envoy/internal/dispatch/pmdoc
          github.com/sjawhar/envoy/cmd/dispatch-seed
          github.com/sjawhar/envoy/internal/dispatch/outbox
          github.com/sjawhar/envoy/cmd/dispatch
          github.com/sjawhar/envoy/cmd/agent-secrets"
          rest=$(go list ./... | grep -Ev '/integration|/internal/textcheck$|/internal/dispatch/architecture/notes$|/internal/runnerlog$|/internal/dispatch/specgraph$|/cmd/architecture-check$|/cmd/spec-check$|/internal/dispatch/delivery($|/)|/internal/dispatch/store($|/)|/internal/bus$|/cmd/listener$|/internal/store$|/internal/session$|/internal/kvwatch($|/)|/internal/dispatch/api$|/internal/dispatch/docs$|/internal/dispatch/routes$|/internal/pgmigrate$|/internal/dispatch/events$' | grep -vxF "$lead")
          printf '%s\n%s\n' "$lead" "$rest" | xargs go test -json -count=1 -p 8 -parallel 12 -skip '^(TestSIGTERMWithOpenStreamsExitsPromptlyAndSettlesTheOwedDocument|TestTheWebFixtureFindsItsFilesFromAnyDirectory|TestWebDisplayFixture)$' -timeout 23m > "$RUNNER_TEMP/go-test-json/unit.json" &
          unit=$!
          # The tests the race detector makes impossible, which the race job of each of these
          # packages therefore cannot make, so envoy-go keeps a plain run of exactly them:
          # internal/bus counts HoldsSeed's allocations, which the race runtime's own
          # allocations would be counted into, and the documents package measures the heap a
          # room keeps, which the detector's shadow memory and instrumentation move. Those are
          # out of the race build altogether (//go:build !race), and the two render-reuse storms
          # run fewer seeds and fewer edits under it (raceEnabled), so this is their full-size
          # run. The API's seven source guards, and one_expression_guard_test.go beside them,
          # carry that tag too and are deliberately not here: they read the module's source,
          # the text-check job runs their fifteen tests by name, and ci_job_reads.py's
          # TEXT_CHECK_TESTS leaves exactly those out of this call rather than have each of
          # them run twice.
          # It was a step of its own before this one until dispatch://INFRA-985's condition for
          # running it here was measured: the three documents memory bounds read this process's
          # own heap after two forced collections, and the question was whether a slow mark
          # under contention lets the heap overshoot before the reading is taken. Run
          # 42526940781 ran all three sixty times in this shape - beside pmdoc's CPU-budget
          # tests, under busy loops at twice the runner's cores, against a Postgres service
          # exactly like this job's - and every run passed, the worst of them using 36.1 per
          # cent of its bound, where the condition was no failure and no run within 15 per cent.
          # The other half of that step's old reason went with the API package, whose live-feed
          # and delivery-hub tests wait for the event log's safe horizon and run in
          # envoy-go-race-api now. The one -run list is derived in
          # .github/scripts/ci_job_reads.py from the race lane's own packages and those files'
          # //go:build !race and raceEnabled, so a test added to either and missing here fails
          # the ci-filters job naming this step. -timeout 16m: this call's slowest package is
          # internal/dispatch/docs, whose largest reading and the run it came from are in the
          # table on this job, and the limit leaves 492.4 s above that reading, over the 30 s of
          # the documents package's roomWaitMargin.
          #
          # One go test over both packages rather than one per package: go builds the test
          # binaries together and runs each package's tests as soon as its own binary is
          # linked, so one package's tests run beside the other's build instead of after it.
          # Three commands in a row, while the API package's source guards were still among
          # them, cost 96 s for 44 s of tests - 40 s of them the API package's build, with
          # nothing running beside it (run 42307926510, dispatch://INFRA-1075). Each package
          # measures its own process's heap or allocations, so running them at the same time
          # changes no number either of them asserts on.
          go test -json -count=1 -timeout 16m -run '^(TestARoomFedOnlyByAgentWritesKeepsMemoryWithinTheBound|TestHoldsSeedAllocatesAtMostOneCopyPerDecoding|TestRenderReuseARandomisedEditStorm|TestRenderReuseAReplicaReplaysTheRoomsFormattingExactly|TestUploadsOverOpenAnchorsKeepMemoryWithinTheBound|TestUploadsToARoomInUseKeepMemoryWithinTheBound)$' ./internal/bus ./internal/dispatch/docs > "$RUNNER_TEMP/go-test-json/race-impossible.json" 2> "$RUNNER_TEMP/go-test-logs/race-impossible.log" &
          impossible=$!
          # internal/pgmigrate, on a Postgres service of its own: its redaction oracle holds
          # scanl.go's transcription of PostgreSQL's scan.l to a real PostgreSQL, which is
          # 158,364 (text, setting) pairs asked over two connections, and what a pair costs is a
          # round trip rather than arithmetic. Measured on run 42774209109: 2.16 ms a round trip
          # in this lane against 0.16 ms against an idle server, the package 375.5 s here for
          # 53.7 s of wall alone on four idle cores and 63.8 s of CPU. The instance pays for
          # both halves of that - the queue this package waits in, and the 158,364 round trips
          # it puts into the queue every other package of the job waits in - so
          # DISPATCH_TEST_DATABASE_URL names 5435 on this call and nowhere else, as the three
          # calls below name 5433, 5436 and 5434. The package list above leaves the package out.
          #
          # -timeout 13m, from the call's own measured times rather than from its CPU. The
          # first arithmetic took the half rule on 120 s - 63.8 s of CPU at about half a core -
          # and 4m was too small: the call measured 159.7 s and 183.2 s on two runs and then
          # ran past 240 s on a slower one, where go killed it mid-test ("panic: test timed out
          # after 4m0s, running tests: TestRedactionAgainstServerOutcomes (3m20s)", run
          # 42856652273). A call's limit is the smallest whole minute at which its slowest
          # package takes at most half of it, and this package's largest reading and the run it
          # came from are in the table on this job: 13m, from the 386.1 s this package read
          # in run 42779139068, where it ran inside the package list rather than in a call of
          # its own. No floor stands above that rule here: no test of internal/pgmigrate reads
          # the test binary's deadline, so it declares no margin of its own the way the
          # documents package's roomWaitMargin (30 s) and pmdoc's perCallReportMargin (60 s)
          # are theirs.
          DISPATCH_TEST_DATABASE_URL=postgres://postgres:ci@localhost:5435/postgres?sslmode=disable go test -json -count=1 -timeout 13m ./internal/pgmigrate/ > "$RUNNER_TEMP/go-test-json/pgmigrate.json" 2> "$RUNNER_TEMP/go-test-logs/pgmigrate.log" &
          pgmigrate=$!
          # The routes package, on the second Postgres service: DISPATCH_TEST_DATABASE_URL names
          # 5433 on this call and nowhere else, so the only transactions its horizon waits on are
          # its own tests'. It is on the call rather than in the step's env:, which would reach
          # every call; the calls that name no server of their own run against 5432. -timeout
          # 2m, from this package's largest reading and the run it came from, which are in the
          # table on this job.
          DISPATCH_TEST_DATABASE_URL=postgres://postgres:ci@localhost:5433/postgres?sslmode=disable go test -json -count=1 -timeout 2m ./internal/dispatch/routes/ > "$RUNNER_TEMP/go-test-json/routes.json" 2> "$RUNNER_TEMP/go-test-logs/routes.log" &
          routes=$!
          # internal/dispatch/events, on the fifth Postgres service, for the reason the routes
          # call gives: its horizon tests wait for the event log's safe horizon, which any
          # transaction open anywhere on the instance holds back, and in the package list one
          # of them failed at its one-minute give-up (run 43596122521, job 132450917326). Its
          # own tests hold transaction ids on purpose, so it shares no other call's service:
          # 5436 is named on this call and nowhere else, and the package list above leaves the
          # package out (dispatch://INFRA-1075). -timeout 6m, from this package's largest
          # reading and the run it came from, which are in the table on this job.
          DISPATCH_TEST_DATABASE_URL=postgres://postgres:ci@localhost:5436/postgres?sslmode=disable go test -json -count=1 -timeout 6m ./internal/dispatch/events/ > "$RUNNER_TEMP/go-test-json/events.json" 2> "$RUNNER_TEMP/go-test-logs/events.log" &
          events=$!
          # The one untagged test of cmd/dispatch that reads a live event feed, on the third
          # Postgres service: the horizon it waits on is instance-wide, so in run 42581214577 it
          # timed out on events_start while another package's database held a transaction open,
          # the server naming that holder. It cannot share the routes service in either
          # direction - routes' own tests hold transaction ids on purpose, and its horizon loop
          # has been blown by a sibling's clone before - so 5434 is named on this call and
          # nowhere else. The package list above skips this test by name, which is unique in the
          # module (dispatch://INFRA-1075). -timeout 3m, from this package's largest reading and
          # the run it came from, which are in the table on this job. 2m would hold the 58.3 s
          # an earlier pair read, but not the 63.0 s of another or the 61.7 s of the pair at
          # 84ca8f33, each over half of it, so the limit follows the largest reading rather
          # than the smallest.
          DISPATCH_TEST_DATABASE_URL=postgres://postgres:ci@localhost:5434/postgres?sslmode=disable go test -json -count=1 -timeout 3m -run '^(TestSIGTERMWithOpenStreamsExitsPromptlyAndSettlesTheOwedDocument)$' ./cmd/dispatch/ > "$RUNNER_TEMP/go-test-json/shutdown.json" 2> "$RUNNER_TEMP/go-test-logs/shutdown.log" &
          shutdown=$!
          # internal/testnats runs its server in the test process, so the package list above
          # starts no container. The real-server tests, a rendered authorization on the image the
          # hub runs among them, are the one thing an in-process server cannot reproduce: they sit
          # behind the natslive tag, and this call is where they run (INFRA-250). internal/bus has
          # tests of its own there. One is the consumer cap: the module links nats-server v2.15.1
          # in process, which caps a stream that sets no cap at a default of its own and takes a
          # change of MaxConsumers on a stream that already exists, so the raise of an uncapped
          # ENVOY_NOTIFICATIONS to the consumer cap this binary compiles and the keeper's restore of
          # a cap an operator lowered or unset are proved in process. What is left for a real image
          # is the pair of 2.10 cases - the stream with no cap the binary must leave alone, and the
          # refusal of the raise of a lower cap, naming the field, the cap and the first server
          # taking the change - and the hub's own reconcile on the nats:2.15.1-alpine image the
          # deployment runs (INFRA-1384). The others are a session consumer's own messages behind
          # other sessions' traffic on the hub's image, the listener's refusal of nats:2.10
          # (natsversion), and that refusal's control: on 2.10, stepped past, the consumer loses
          # its old-form message. Each package runs
          # only the tests its tag adds: `-tags natslive ./pkg` would re-run the package's
          # untagged tests, which already run elsewhere - internal/testnats in the package list
          # above, and internal/bus in envoy-go-race, which that list's grep -Ev leaves out - so
          # the -run comes from .github/scripts/go-tagged-tests.sh, which reads the names off the
          # source at run time, and no test name is spelled here. Each assignment is a line of
          # its own and runs before the command it feeds: under bash -e it carries the script's
          # exit status, so an empty or refused list fails the step instead of running -run "",
          # which matches every test. -timeout 1m on each command, the smallest whole minute
          # there is; each package's largest reading and the run it came from are in the table
          # on this job.
          rig=$(../../.github/scripts/go-tagged-tests.sh natslive ./internal/testnats)
          cap=$(../../.github/scripts/go-tagged-tests.sh natslive ./internal/bus)
          { go test -json -count=1 -timeout 1m -tags natslive -run "$rig" ./internal/testnats/ &&
            go test -json -count=1 -timeout 1m -tags natslive -run "$cap" -v ./internal/bus/; } > "$RUNNER_TEMP/go-test-json/natslive.json" 2> "$RUNNER_TEMP/go-test-logs/natslive.log" &
          natslive=$!
          # The integration suite, which runs a real NATS server in the test process.
          # -timeout 1m, the smallest whole minute there is; the package's largest reading and
          # the run it came from are in the table on this job.
          go test -json -count=1 -timeout 1m ./internal/integration/ > "$RUNNER_TEMP/go-test-json/integration.json" 2> "$RUNNER_TEMP/go-test-logs/integration.log" &
          integration=$!
          # agentloop's live proof makes a real model call, so it sits behind a build tag and CI
          # never runs it. Vetting it keeps it compiling as the package changes. It writes no
          # stream: its log is everything it prints.
          go vet -tags modellive ./agentloop/ > "$RUNNER_TEMP/go-test-logs/agentloop-vet.log" 2>&1 &
          vet=$!
          s=0
          wait "$unit" || s=$?
          p=0
          wait "$impossible" || p=$?
          m=0
          wait "$pgmigrate" || m=$?
          r=0
          wait "$routes" || r=$?
          e=0
          wait "$events" || e=$?
          d=0
          wait "$shutdown" || d=$?
          n=0
          wait "$natslive" || n=$?
          i=0
          wait "$integration" || i=$?
          v=0
          wait "$vet" || v=$?
          # One group per call, in the order the calls were started: the package list first,
          # then the rest. Each is its own log, then its stream - the package result lines
          # when it passed, the whole stream when it failed - and an ::error:: naming it when it
          # failed. The step's status is the first non-zero of the nine, and the package list,
          # which prints as it goes, writes no log of its own.
          status=0
          replay() {
            echo "::group::$1 (exit $2)"
            [ ! -s "$RUNNER_TEMP/go-test-logs/$3.log" ] || cat "$RUNNER_TEMP/go-test-logs/$3.log"
            if [ "$2" -eq 0 ]; then
              jq -rj 'select(.Action == "build-output" or (.Action == "output" and .Test == null)) | .Output' "$RUNNER_TEMP/go-test-json/$3.json"
            else
              jq -rj 'select(.Action == "build-output" or .Action == "output") | .Output' "$RUNNER_TEMP/go-test-json/$3.json"
            fi
            echo "::endgroup::"
            [ "$2" -eq 0 ] || echo "::error::$1 failed (exit $2)"
            [ "$status" -ne 0 ] || status=$2
          }
          replay "the package list" "$s" unit
          replay "the race-impossible run" "$p" race-impossible
          replay "the pgmigrate package" "$m" pgmigrate
          replay "the routes package" "$r" routes
          replay "the events package" "$e" events
          replay "the shutdown feed test" "$d" shutdown
          replay "the natslive matrix" "$n" natslive
          replay "the integration suite" "$i" integration
          echo "::group::the agentloop vet (exit $v)"
          cat "$RUNNER_TEMP/go-test-logs/agentloop-vet.log"
          echo "::endgroup::"
          [ "$v" -eq 0 ] || echo "::error::the agentloop vet failed (exit $v)"
          [ "$status" -ne 0 ] || status=$v
          exit "$status"
        working-directory: packages/envoy
      # Each named test runs every store form once against the GCP fake and once against the
      # in-process AWS store, as its `aws` and `gcp` subtests (onEachStore); this step runs only
      # those tests (-run, under backend-count.sh's own 5-minute -timeout, which the bound above
      # counts) and counts the passes of each, so a test whose AWS half was skipped or removed
      # reads aws=0 and fails, as the verification's check c8 requires.
      - name: Count the store-form rows on each backend
        run: packages/envoy/scripts/backend-count.sh TestEverySecretFormNamesTheSourceItUses TestNoSecretFormAsksTheBrokerForACredential
      # c8 also asks that the database broker suites run with BROKER_TEST_DATABASE_URL set and that
      # none skips. The unit step runs them, but go test reports a skip as a pass and that step
      # writes no report to count from, so this step runs ./internal/broker/... again with -json
      # and fails on any skipped test there, FuzzAirlock apart (it needs a built Lean model of the
      # airlock, and the airlock-lean job runs it). A report it cannot read prints
      # database_skips=UNKNOWN and fails too. database-skips.sh's -timeout of 15 minutes bounds
      # each package's test binary, and the packages run several at a time, so one that starts
      # late ends up to 15 minutes after its own start: the step's own limit of 25 minutes leaves
      # a package that starts within the first 10 its whole -timeout, and so its dump. Measured on
      # a loaded dev box on 2026-11-16: 331 s for the whole step, the slowest package,
      # internal/broker/helper, 329 s.
      - name: Count the database broker suites' skips
        timeout-minutes: 25
        run: packages/envoy/scripts/database-skips.sh
      # The run of the built agent-secrets against moto needs moto, so it sits behind a build tag
      # and packages/envoy/scripts/aws-moto-check.sh runs it. Vetting it keeps it compiling.
      - name: Vet agent-secrets' moto run (no moto)
        run: go vet -tags moto ./cmd/agent-secrets/
        working-directory: packages/envoy
      # Always, because a red attempt's times are the ones a reader needs, and one artifact per
      # attempt because a run's artifacts are listed per run, not per attempt, and a download by
      # name picks one of several of that name without saying so
      # (docs/solutions/github/run-download-by-name-picks-one-of-several-same-named-artifacts.md).
      - name: Upload the go test -json streams
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: envoy-go-test-json-${{ github.run_attempt }}
          path: ${{ runner.temp }}/go-test-json/
          if-no-files-found: warn
      - name: Report ci-ok when this job decides a merge-group run
        if: always()
