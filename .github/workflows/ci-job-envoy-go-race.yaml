name: CI job envoy-go-race

# The steps of ci.yaml's `envoy-go-race` job, in a file of its own.
# ci.yaml's job of the same id calls this file, and that caller keeps `needs: changes` and the
# whole `if:` that decides whether these steps run, so this file carries no `if:` of its own.
#
# The split is for the filters. This job's filter names this file beside ci.yaml, so a change to
# these steps selects this job alone, where a change to ci.yaml selects every job.
#
# The job's last step reports ci-ok for the caller: on a merge-group run this job's own result
# decides, it posts the failing ci-ok at once (.github/actions/ci-ok-report), as every job of
# ci.yaml ends. `ci-ok-changes` carries ci.yaml's `toJSON(needs.changes)` for it.
on:
  workflow_call:
    inputs:
      ci-ok-changes:
        description: >-
          ci.yaml's `toJSON(needs.changes)`: end the job with ci-ok's report
          (.github/actions/ci-ok-report), as every job of ci.yaml ends.
        type: string
        required: true

# A `|` between proxy entries makes a go command fall through to the next source after ANY error,
# where a `,` falls through only after a 404 or a 410 (Go's module reference, "GOPROXY protocol").
# proxy.golang.org reset a download mid-stream and turned a Go lane red on a module whose hash
# go.sum already holds (sjawhar/legion#2512); with `|direct` the command fetches the same bytes
# straight from the source and checks them against go.sum, so this is a second path, not a weaker
# check.
env:
  GOPROXY: https://proxy.golang.org|direct

jobs:
  envoy-go-race:
    runs-on: ubuntu-24.04-arm
    # R6 sizes both numbers from one measurement pair alone, runs 44604816847 and 44604887499 at
    # ae055610 (dispatch://INFRA-1075, check 6224bb0e). The step's -timeout is the smallest whole
    # minute at which its slowest package, on the slower run of the pair, takes at most half of
    # it: cmd/listener, 682.6 s (run 44604887499, job 135864937409), 682.6 / 30 = 22.75, so 23m.
    # The job's bound is its larger time in the pair, 927 s (run 44604887499, job 135864937409),
    # 15.45 minutes, plus that -timeout plus 6: 15.45 + 23 + 6 = 44.45, so 45. The limit must
    # fire before the runner cancels the job, so a hung test prints the dump that names it. The
    # pair ran this job on arm64 (ubuntu-24.04-arm), where cmd/listener took 682.2 s and 682.6 s;
    # the pair at 4f1f4436 read it at 585.3 s at most, on x64 (ubuntu-24.04). natscred and the
    # NATS auth service (internal/broker/natscallout), which main added to the step after that
    # earlier pair (#4139), are in this pair: 31.2 s and 102.5 s at most. So is the step that
    # tests the wall-clock measurements alone, whose comment gives its reading.
    timeout-minutes: 45
    services:
      postgres:
        # ghcr.io/cybermonklabs/legion/ci, the copy of pgvector/pgvector (.github/ci-images.yaml)
        image: ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        # The settings these tests need, as the server's own command line, so it starts with them
        # and no step has to restart it; envoy-go's own service says what each of them buys and
        # why this container can do without durability (dispatch://INFRA-1075).
        command: postgres -c fsync=off -c full_page_writes=off -c synchronous_commit=off -c max_connections=500 -c max_prepared_transactions=20
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 50
    env:
      DISPATCH_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          cache: false
      # go-envoy, restored only, for the plain build of the step that tests the wall-clock
      # measurements alone: its modules are the envoy module's, but this job builds delivery's and
      # the auth service's test binaries, not the listener and natsd of
      # .github/workflows/ci-caches.yaml's envoy job, which is what fills this family, so it saves
      # none. The race step's build reads none of its plain entries and is as it was.
      - id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: ${{ format('go-envoy-{0}-{1}-', runner.os, runner.arch) }}
      # The settings the service's command: asks for, read back from the server itself; envoy-go's
      # own read-back step says why a command is worth reading back.
      - name: Read the disposable service's settings back
        run: .github/scripts/postgres-service-settings.sh "${{ job.services.postgres.id }}" postgres
      - name: Size the service for this lane's Dispatch processes
        run: .github/scripts/pg-connection-ceiling.sh "${{ job.services.postgres.id }}"
      # The tests whose assertion is a wall-clock time measured in the test's own process, of the
      # packages this job race-tests: delivery's xid window tests, which judge each gap of a
      # transaction's xid window against storetest.XidMaxGap (5 ms), and the NATS auth service's
      # restart storm, whose slowest decision must take less than decideBudget (storm_test.go). Main
      # runs them in a step of their own with nothing else on the runner; run beside envoy-go's
      # other calls, an xid window test failed in each run of the pair at c3e93e7e (runs
      # 44476496859 and 44476544762). So they run here, alone, as the first test step, while the
      # job's Postgres service is quiet, one package at a time (-p 1) as main ran them, and plain:
      # the detector stretches the gaps past any bound, and the storm opens five hundred
      # connections only without it. The -run list is derived in .github/scripts/ci_job_reads.py
      # (ALONE_PREFIX, ALONE_TESTS and ALONE_STEPS) from the race lane's packages and their source,
      # so a test added there that this step lacks fails the ci-filters job naming it. The
      # `go test -json` stream goes to its own file beside the race step's, for the reason that
      # step gives. With the xid window tests in one call, delivery took 4.106 s on a two-vCPU pod
      # (INFRA-636), and the restart storm 17 s on a dev box. -timeout 1m, by R6 from the pair at
      # ae055610 (envoy-go's comment gives the rule): this call's slowest package on the slower run
      # is internal/broker/natscallout, 17.0 s (run 44604816847, job 135845994792), and
      # 17.0 / 30 = 0.57, so 1m, the smallest whole minute there is.
      - name: Test the wall-clock measurements alone
        run: |
          mkdir -p "$RUNNER_TEMP/go-test-json"
          s=0
          go test -json -count=1 -p 1 -timeout 1m -run '^(TestACalloutStormAfterAServerRestartAdmitsEveryConnection|TestXidWindowAttributionMoveRecorded|TestXidWindowDeployedEventRecorded)$' ./internal/dispatch/delivery ./internal/broker/natscallout > "$RUNNER_TEMP/go-test-json/alone.json" || s=$?
          if [ "$s" -eq 0 ]; then
            jq -rj 'select(.Action == "build-output" or (.Action == "output" and .Test == null)) | .Output' "$RUNNER_TEMP/go-test-json/alone.json"
          else
            jq -rj 'select(.Action == "build-output" or .Action == "output") | .Output' "$RUNNER_TEMP/go-test-json/alone.json"
          fi
          exit $s
        working-directory: packages/envoy
      # The `go test -json` stream goes to a file the upload step below publishes, as every test
      # step of envoy-go does and for the same reason: .github/scripts/go-test-times.py ranks the
      # packages and tests of such a stream, and this lane's per-package times are what the next
      # change to it is measured against (dispatch://INFRA-1075). The log keeps the package result
      # lines of a green run and the whole stream of a red one, race report included. -count=1
      # keeps a restored build cache from replaying a stored result as `(cached)`.
      - name: Race-test delivery, the store, the bus, the listener, the registry store, the session cache, kvwatch, the NATS credentials and the NATS auth service
        run: |
          mkdir -p "$RUNNER_TEMP/go-test-json"
          s=0
          go test -json -race -count=1 -timeout 23m ./internal/dispatch/delivery/... ./internal/dispatch/store/... ./internal/bus/ ./cmd/listener/ ./internal/store/ ./internal/session/ ./internal/kvwatch/... ./natscred/ ./internal/broker/natscallout/ > "$RUNNER_TEMP/go-test-json/race.json" || s=$?
          if [ "$s" -eq 0 ]; then
            jq -rj 'select(.Action == "build-output" or (.Action == "output" and .Test == null)) | .Output' "$RUNNER_TEMP/go-test-json/race.json"
          else
            jq -rj 'select(.Action == "build-output" or .Action == "output") | .Output' "$RUNNER_TEMP/go-test-json/race.json"
          fi
          exit $s
        working-directory: packages/envoy
      # Always, and one artifact per run attempt, for the reasons envoy-go's own upload step gives.
      - name: Upload the go test -json stream
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: envoy-go-race-test-json-${{ github.run_attempt }}
          path: ${{ runner.temp }}/go-test-json/
          if-no-files-found: warn

      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        uses: ./.github/actions/ci-ok-report
        with:
          job: envoy-go-race
          changes: ${{ inputs.ci-ok-changes }}
          job-status: ${{ job.status }}
