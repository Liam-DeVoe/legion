name: CI job kind

# The steps of ci.yaml's `kind` job, in a file of its own.
# ci.yaml's job of the same id calls this file, and that caller keeps `needs: changes` and the
# whole `if:` that decides whether these steps run, so this file carries no `if:` of its own but
# the call mode of its image job below. That `if:` tests an output the merge queue and the
# `full-ci` label hold back, as they hold back the slow suites (the comment on ci.yaml's `kind`
# output says why).
#
# The tests here run Legion's Sandbox runtime against a real API server and kubelet: a kind
# cluster on the runner with Agent Sandbox's controller and gVisor, a registry the node pulls
# from, and the fake GitHub of packages/daemon/internal/fakegithub, which the cluster's pods reach
# as github.com and api.github.com through a CoreDNS rule. packages/daemon/internal/kindtest
# brings that rig up from the test process, and every pin of it is
# scripts/e2e/lib/kind-sandbox.sh's: kind v0.33.0 built with `go install`, the node, registry,
# busybox, NFS server and PostgreSQL images by the digests of their .github/ci-images.yaml rows,
# Agent Sandbox's vendored manifest and gVisor's dated release.
#
# image builds the worker image under test, once per run, when the caller hands none. On a pull
# request whose worker-image job built the head, ci.yaml hands that job's pushed reference
# (`worker-image`), this job is skipped, and each part pulls that reference: the image the pull
# request publishes is the image its kind tests run. On every other run (a merge group, a
# dispatched run, a pull request that changed none of the image's inputs) this job builds
# packages/daemon/docker/worker.Dockerfile as worker-image.yaml's build does, from the same
# context, BuildKit and layer cache scope, and publishes nothing: the image goes into a docker
# archive, which each part downloads as an artifact. Its gate is the call mode
# `inputs.worker-image == ''`, which .github/scripts/check-image-trigger-paths.sh admits, and
# ci.yaml's kind filter names every file the build reads, which that check holds it to: the
# worker_image filter's own paths, so a change the image is built from runs this job whichever
# of the two builds the run's image comes from.
#
# rig runs every Go test .github/scripts/ci_job_reads.py's KIND_PACKAGE_FILES names, and tree the
# two of its KIND_TREE_FILES, which boot the whole daemon on the rig with real agents in issue pods;
# daemon-go's two steps skip both lists by name (KIND_TESTS). Each part runs one package at a
# time, each test on a rig of its own. Grouping them by measured time into more parts is a later
# change. The rig's measuring test times each piece of the rig by name (the pinned kind's build,
# the cluster, Agent Sandbox, gVisor, the registry, the fake GitHub, the worker image's pull or
# load, the build
# FROM it of the image that trusts the fake GitHub's authority, the push of both into the registry
# and the load into the node), then runs a Burstable Sandbox under gVisor that clones a private
# repository from the fake GitHub and a gVisor pod that mounts an NFS share of a server in the
# cluster, and logs `df -h` before the rig and with it up. internal/daemon's three live tests
# launch issue pods and a project controller through the Sandbox runtime the daemon builds from a
# legion.yaml, with small explicit reservations, and the Sandbox runtime's own live test,
# TestStage4aSandboxRuntimeLive, runs its checks as subtests, against a restricted identity of the
# cluster's own, PostgreSQL in the cluster and this repository's own broker in the test process.
# A failed test leaves the cluster's pods, Sandboxes, events, logs and the Agent Sandbox
# controller's log, the fake GitHub's requests and the runtime's own log under kind-logs, which
# the step after it uploads.
#
# Each job's last step reports ci-ok for the caller: on a merge-group run that job's own result
# decides, it posts the failing ci-ok at once (.github/actions/ci-ok-report), as every job of
# ci.yaml ends. `ci-ok-changes` carries ci.yaml's `toJSON(needs.changes)` for it.
on:
  workflow_call:
    inputs:
      ci-ok-changes:
        description: >-
          ci.yaml's `toJSON(needs.changes)`: end each job with ci-ok's report
          (.github/actions/ci-ok-report), as every job of ci.yaml ends.
        type: string
        required: true
      worker-image:
        description: >-
          The worker image under test, by digest, which the worker-image job of the same run
          pushed; empty where that job did not run, and the image job builds the image itself.
        type: string
        required: false
        default: ""

# A `|` between proxy entries makes a go command fall through to the next source after ANY error,
# where a `,` falls through only after a 404 or a 410 (Go's module reference, "GOPROXY protocol").
# proxy.golang.org reset a download mid-stream and turned a Go lane red on a module whose hash
# go.sum already holds (sjawhar/legion#2512); with `|direct` the command fetches the same bytes
# straight from the source and checks them against go.sum, so this is a second path, not a weaker
# check.
env:
  GOPROXY: https://proxy.golang.org|direct

jobs:
  image:
    if: inputs.worker-image == ''
    runs-on: ubuntu-24.04
    # worker-image.yaml's build has 30 minutes; the archive's upload is the rest.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # worker-image.yaml's builder: provenance-add-gha=false keeps the run's event out of every
      # predicate, and image= is the driver's own BuildKit, ghcr.io/cybermonklabs/legion/ci's copy
      # of moby/buildkit:buildx-stable-1 (.github/ci-images.yaml).
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: |
            provenance-add-gha=false
            image=ghcr.io/cybermonklabs/legion/ci@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

      # worker-image.yaml's build of the same Dockerfile and context, reading main's layer cache
      # under the same scope and writing none, with the version label and the plugin versions
      # left to their pull-request defaults. The two env names keep the run's event out of the
      # metadata the action logs, as that build's comment says.
      - name: Build the worker image into a docker archive
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          BUILDX_METADATA_PROVENANCE: disabled
          DOCKER_BUILD_SUMMARY: "false"
        with:
          context: .
          file: packages/daemon/docker/worker.Dockerfile
          platforms: linux/amd64
          provenance: false
          push: false
          outputs: type=docker,dest=${{ runner.temp }}/worker-image.tar
          tags: legion-worker:kind
          cache-from: type=gha,scope=worker-image
          build-args: |
            LEGION_REVISION=${{ github.sha }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}

      # Layers a docker archive holds are compressed already, so the artifact stores them as
      # they are. A day is long enough for a re-run of the part that reads it.
      - name: Upload the worker image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kind-worker-image-${{ github.run_attempt }}
          path: ${{ runner.temp }}/worker-image.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        uses: ./.github/actions/ci-ok-report
        with:
          job: kind
          changes: ${{ inputs.ci-ok-changes }}
          job-status: ${{ job.status }}

  rig:
    needs: image
    # Past the image job the caller's worker-image input skipped, and never past one that failed,
    # whose own report has posted the failure.
    if: ${{ !cancelled() && needs.image.result != 'failure' }}
    runs-on: ubuntu-24.04
    # The step runs one package at a time, each test bringing a rig up in about five minutes (the
    # rig's first CI run): the measuring test, about six minutes in all; internal/daemon's three,
    # about half an hour between them, the share test's probes the longest; and the sandbox
    # runtime's, about an hour, its forty checks each a pod start under gVisor or a wait of a minute
    # or two: about an hour and a half. Two and a half hours holds the three with room for the
    # disk's cleanup, the archive's download, the bun install and the test binaries' builds.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # What the rig runs beside Go and git is the runner image's own, and nothing here installs
      # it: Docker 28.0.4, kubectl 1.37.2, zstd 1.5.7 (gVisor's release is a .tar.zstd), curl, GNU
      # tar and sha512sum, as actions/runner-images' Ubuntu2404-Readme.md lists them for image
      # 20261111.370.1. kind is the one tool it does not take from there: the rig builds kind
      # v0.33.0 with `go install` itself. internal/kindtest fails naming any of them it cannot
      # find on PATH.

      # The rig holds the worker image, several gigabytes, in Docker, in the registry and in the
      # node's containerd while it loads it (kindtest drops Docker's copies once the registry has
      # them). The runner image's Android SDK, .NET, Haskell and CodeQL toolchains, which no step
      # here uses, go first; `df -h` before and after says what that gave, and the test logs it
      # again before the rig and with the rig up.
      - name: Free the runner's disk of toolchains the rig does not use
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Download the worker image the image job built
        if: inputs.worker-image == ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kind-worker-image-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kind-image

      # The sandbox runtime's live test packs this checkout's pi-envoy and pi-legion through
      # scripts/e2e/lib/pack-plugin.sh, which builds each bundle over the installed workspace.
      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The tests build their packages' test binaries, the rig's library builds kind with `go
      # install`, which reads only kind's own module, and the sandbox runtime's test builds the
      # checkout's agent-secrets in packages/envoy.
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/daemon/go.mod
          cache: false

      # The tests, by name, one package at a time. .github/scripts/ci_job_reads.py builds this text
      # and daemon-go's two `-skip`s from KIND_TESTS and holds the steps to what it builds. The image
      # comes by the caller's reference or the image job's archive (internal/kindtest's ImageEnv
      # and ImageArchiveEnv), and a failed test's state goes to kind-logs.
      - name: Run the kind tests
        env:
          LEGION_TEST_KIND_IMAGE: ${{ inputs.worker-image }}
          LEGION_TEST_KIND_IMAGE_ARCHIVE: ${{ inputs.worker-image == '' && format('{0}/kind-image/worker-image.tar', runner.temp) || '' }}
          LEGION_TEST_KIND_LOG_DIR: ${{ runner.temp }}/kind-logs
        run: go test -v -count=1 -p 1 -timeout 90m -run '^(TestABurstableGVisorPodOnTheKindRigClonesFromTheFakeGitHub|TestABurstableIssuePodRendersLive|TestShareVolumesMountInAnIssuePodLive|TestStage4aSandboxRuntimeLive|TestTheControllerOrphanSweepLive)$' ./internal/kindtest/ ./internal/daemon/ ./internal/runtime/sandbox/
        working-directory: packages/daemon

      # A failed test's state, one directory per test: the cluster's nodes, pods, the legion
      # namespace's Sandboxes and volume claims, its pods' descriptions and logs and the NFS and
      # PostgreSQL servers', every event, the Agent Sandbox controller's log, the fake GitHub's
      # requests, and the sandbox runtime's own log.
      - name: Upload the rig's state at the failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kind-rig-logs-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kind-logs

      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        uses: ./.github/actions/ci-ok-report
        with:
          job: kind
          changes: ${{ inputs.ci-ok-changes }}
          job-status: ${{ job.status }}

  tree:
    needs: image
    # Past the image job the caller's worker-image input skipped, and never past one that failed,
    # whose own report has posted the failure.
    if: ${{ !cancelled() && needs.image.result != 'failure' }}
    runs-on: ubuntu-24.04
    # The step runs internal/daemon's two whole-tree tests, one after the other, each on a rig of
    # its own (about five minutes): the Claude Code backend's three checks over one issue pod, and
    # Stage 4b's tree, whose fourteen checkpoints include a credential refresh and two restarts that
    # relaunch every claim. The test binary has two hours; the rest is the disk's cleanup, the
    # archive's download and the binaries' builds.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The rig part's comment says what the runner image gives the rig and why its disk is
      # cleared first.
      - name: Free the runner's disk of toolchains the rig does not use
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Download the worker image the image job built
        if: inputs.worker-image == ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kind-worker-image-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kind-image

      # The tests build their package's test binary, the `legion` every pod's launcher and the
      # fence's worker-shim are, and Dispatch, the Envoy listener and natsd from packages/envoy.
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/daemon/go.mod
          cache: false

      # The tests, by name. .github/scripts/ci_job_reads.py builds this text from KIND_TREE_FILES,
      # whose tests daemon-go's two `-skip`s name with the rig part's, and holds the step to it.
      # The image comes as the rig part's does, and a failed test's state goes to kind-logs.
      - name: Run the tree tests
        env:
          LEGION_TEST_KIND_IMAGE: ${{ inputs.worker-image }}
          LEGION_TEST_KIND_IMAGE_ARCHIVE: ${{ inputs.worker-image == '' && format('{0}/kind-image/worker-image.tar', runner.temp) || '' }}
          LEGION_TEST_KIND_LOG_DIR: ${{ runner.temp }}/kind-logs
        run: go test -v -count=1 -timeout 120m -run '^(TestStage4bSandboxTreeOnTheKindRigLive|TestTheClaudeCodeImplementerInAnIssuePodRegistersRunsThePinnedBridgeAndResumesLive)$' ./internal/daemon/
        working-directory: packages/daemon

      # A failed test's state, one directory per test: the rig part's, and the daemon's, Dispatch's
      # and the listener's own logs beside it.
      - name: Upload the rig's state at the failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kind-tree-logs-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kind-logs

      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        uses: ./.github/actions/ci-ok-report
        with:
          job: kind
          changes: ${{ inputs.ci-ok-changes }}
          job-status: ${{ job.status }}
