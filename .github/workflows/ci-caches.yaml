name: CI caches

# Fills the Actions caches ci.yaml's jobs restore, so a pull request or a merge group finds
# them warm. ci.yaml runs on a pull request, a merge group and a dispatch, and no longer on a push
# to main: the queue tests every change on the tree it lands as, so a run on main would only test
# that tree again (ci.yaml's header says it). No step of that workflow saves a cache entry any
# more, and the actions it calls save only in a dispatched run, so the families it restores need
# a filler of their own, and this workflow is it.
#
# Why the filler runs on a push: a run reads the cache scope of its own branch and that of the
# default branch, and only an event that writes the default branch's scope - a push to main among
# them - leaves an entry every later run can read. A save made in a merge group or on a pull
# request lands in that run's own scope, which the next pull request's run cannot read, so it
# would reach nobody.
#
# Ten Go families, each one a restore step of ci.yaml's run names, keyed on the runner's
# architecture, on the Go version the family's own module installs, and on the hash of the files
# that decide what its readers fetch: the module files of each workspace their fetch files name,
# those fetch files (.github/go-fetch/<job>.txt), each tool pin file they name, and
# .github/scripts/go-fetch.sh (go-notices on the notices scripts and target lists too):
# go-notices (lint's notices step), go-daemon (typecheck, daemon-go, plugin-pack and pi-legion),
# go-envoy (envoy-go-checks, envoy-go-race, envoy-go-race-api, envoy-go-race-docs,
# envoy-go-docs-finalizers, listener-server-change, envoy-e2e-local, envoy-session-stall,
# airlock-lean, broker-multiprocess, dispatch-memory and dispatch-multiprocess, and the embedder
# job of .github/workflows/dispatch-browser.yaml), go-envoy-test (envoy-go, and the binaries,
# multiprocess and visual jobs of .github/workflows/dispatch-browser.yaml, which ci.yaml's
# dispatch-browser job calls: those three build the Dispatch server and the real broker's
# commands, whose packages the go-envoy entry's build of the listener and natsd alone does not
# hold), go-envoy-infra (envoy-infra-go, envoy-smoke, and the build job of
# release-envoy-infra.yaml), and five that hold modules alone, each what one job's fetch step
# fetches, for the jobs with a fetch step that restore no family above: go-fetch-text-checks,
# go-fetch-lint, go-fetch-test, go-fetch-private-names-port and go-fetch-dispatch-two-builds (the
# comment above their jobs says why).
# Each fill runs, before its save, the fetch file of every job that restores its family, in the
# order of their paths, as each reader's fetch step runs its own after its restore: so an entry
# holds what each reader's fetch fetches, and a reader that finds its key downloads nothing.
# check-ci-filters.sh holds the two sides to one list (rule 21) and each key to the files it must
# hash (rule 22).
# The key carries `runner.arch` because Go's build cache holds the objects of the architecture
# that compiled them: an entry an x86_64 runner filled gives an arm64 job its modules and none of
# its objects. So each family is filled on every architecture one of its readers runs on, one
# matrix leg per runner: go-notices on ubuntu-24.04-arm alone, where lint runs, and go-daemon,
# go-envoy, go-envoy-test and go-envoy-infra on ubuntu-24.04-arm and on ubuntu-24.04 both, since
# each has a reader on each (typecheck and the envoy lanes on the first; daemon-go, plugin-pack,
# pi-legion, envoy-go-checks, envoy-smoke, the browser lane and the release builds on the second),
# and each go-fetch family on the one runner its job runs on: ubuntu-24.04 for
# dispatch-two-builds, ubuntu-24.04-arm for the other four. A module cache holds no objects, but
# `go list -deps` follows the imports of one GOOS and GOARCH, so a fill on the reader's own
# architecture fetches what that reader's fetch does.
# A leg builds what that runner's readers build and no more: go-daemon's arm64 reader is
# typecheck alone, so its arm64 leg runs typecheck's vet and leaves the test and race builds to
# the x86_64 leg.
# go-notices carries the architecture before the OS (go-notices-<arch>-<os>-go<version>) and
# every other family after it: the go-notices entry holds go-licenses, a program lint's notices
# step runs, and a run of a workflow file older than the architecture in the key restores by
# go-notices-<os>-, which an <os>-<arch> key starts with (ci-job-lint.yaml's restore step says what
# that did). One
# Go setup per leg, since the key carries the version that module's go.mod names: the daemon's
# go.mod for go-daemon and for go-notices, which lint installs the daemon's Go for; the envoy
# module's for go-envoy and go-envoy-test; the infra module's for go-envoy-infra; for each
# go-fetch family, the go.mod its reader sets Go up from. Each family is
# first looked up (`lookup-only`, and no `restore-keys`: the question is whether that exact key
# exists, and the answer downloads nothing), and only a miss runs the fetch and the build the
# ci.yaml jobs run and saves what it left in the module cache and the build cache. A family whose
# key is already there builds nothing, so a run that finds every key costs a checkout and a
# setup-go. Each job fills one family: an entry holds what every step before its save left, so a
# second family's fill in the same job would hold the first one's fetch too. A leg of a matrix
# that fails leaves the other running (`fail-fast: false`): a cancelled leg saves nothing, and one
# architecture's fill has no reason to cost the other's.
#
# Beside those ten, the architecture-check job fills
# architecture-check-<os>-<arch>-go<version>-<hash>, the family of the composite action
# .github/actions/architecture-check, and the spec-check job fills
# spec-check-<os>-<arch>-go<version>-<hash>, the family of .github/actions/spec-check; ci.yaml's
# envoy-go-checks runs both actions. Neither is a lookup step of this workflow: each action
# restores and saves its entry itself, keyed on the runner's architecture, on the Go version its
# own setup-go installs from packages/envoy/go.mod and on the SHA-256 of packages/envoy/go.sum,
# so both jobs run on ubuntu-24.04, the runner envoy-go-checks runs on.
# On a miss it restores the newest entry of that Go version (restore-keys, which this workflow's
# own lookups do not use). It saves only on a miss of the exact key in a push, schedule or
# workflow_dispatch run: a run of any other event (pull_request, pull_request_target,
# merge_group, issue_comment, workflow_run and the rest) may hold another person's code, so it
# restores the entry and never saves it. This workflow's push to main is where the entry lands in
# the scope every later run reads. check-ci-filters.sh's cache-family rule reads this workflow's
# own actions/cache steps and not a composite action's, so it holds nothing of these two families;
# ci.yaml's "Caches" paragraph is the record of their restores and saves.
#
# One entry here is no Go family: the elan home the airlock-lean job restores, whose key is the
# content of the Lean toolchain the model names rather than a Go version. Two others that were
# no Go family went with the jobs that read them - the Playwright browsers and the .deb files of
# the apt list the browser suite installed - because dispatch-browser.yaml's shard and alone
# jobs run in the image this repository builds, which carries the browsers and their host
# packages, so neither entry has a restore left to serve (dispatch://INFRA-1443). A save whose
# restore is gone is what check-ci-filters.sh refuses, so the two jobs that wrote them are gone
# with them.
#
# A second entry that is no Go family: the apt job's, the .deb files and checksums of every pin of
# .github/apt-packages.txt, which daemon-go and pi-envoy (tmux), claude-envoy and dispatch-ui (zsh),
# dispatch-unit-repeat.yaml's harness lane (zsh) and e2e.yaml's proofs (their rows' packages)
# restore and install with no network (.github/scripts/apt-cache.sh, whose header says how). Its
# key is the runner's OS, architecture and release and the hash of that list and that script, so
# a pin moves to another version, or the script changes, with a fresh entry on the next push.
#
# go-docs is not here: docs-pages.yaml saves it on this same push, from the build job it shares
# with ci.yaml's docs job. The Bun cache is not here either: .github/actions/setup-bun reads and
# writes it on main, and five workflows that run there call it.

# A push to main is what writes the default branch's cache scope; workflow_dispatch fills a family
# by hand, after a Go bump, a move of the Lean toolchain or an eviction. No `paths:`: a key holds
# a Go version, that toolchain file's hash, the hash of packages/envoy/go.sum or, for each Go
# family, the hash of the files that decide what its readers fetch, not a file list, so what the
# push touched decides nothing, and a run whose keys are all there is seconds.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One fill at a time per ref, and no cancellation: a cancelled run saves nothing, so cutting the
# running fill short would leave the caches empty and make the next push pay for them again. The
# default queue holds the newer run until this one ends, and a push after it replaces the one
# waiting, since both would fill the same keys.
concurrency:
  group: ci-caches-${{ github.ref }}
  cancel-in-progress: false

# Reading the tree and the caches is all this workflow does but in one job: the cache scope needs no
# token scope of its own, and nothing here reports a check or writes an artifact. The superseded
# job alone takes `actions: write`, to delete the Go families' entries a fill replaced, and builds
# nothing.
permissions:
  contents: read

# The proxy fall-through ci.yaml's env block explains: with `|`, a go command that hits ANY error
# from proxy.golang.org - a reset mid-stream among them - fetches the same bytes from the source
# and checks them against go.sum.
env:
  GOPROXY: https://proxy.golang.org|direct

jobs:
  # go-daemon. It keys on packages/daemon/go.mod's Go: ci.yaml's typecheck, daemon-go, plugin-pack
  # and pi-legion set Go up from it. One leg per runner, because typecheck runs on
  # ubuntu-24.04-arm and the other three on ubuntu-24.04, and the key carries the runner's
  # architecture. Each leg fetches what every reader's fetch step fetches and builds what its
  # runner's readers build: typecheck's vet on both, and the test and race builds on the x86_64
  # leg alone, since no job that reads the arm64 entry runs them. The superseded job deletes the
  # entry each leg's fill replaced.
  daemon:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    # The limit this job carried while it filled go-notices too, whose build is the long one; no
    # leg of the daemon build alone has been measured near it.
    timeout-minutes: 90
    outputs:
      # The key each leg looked up, and whether it filled it, by the leg's architecture, as the
      # envoy-infra job below names its own and for the reason it gives.
      key-x64: ${{ steps.leg.outputs.key-x64 }}
      filled-x64: ${{ steps.leg.outputs.filled-x64 }}
      key-arm64: ${{ steps.leg.outputs.key-arm64 }}
      filled-arm64: ${{ steps.leg.outputs.filled-arm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/daemon/go.mod
          cache: false

      # The key hashes the root workspace's module files, every fetch file go-daemon's readers
      # run and go-fetch.sh, as each reader's restore does: a change to any of them misses this
      # lookup and fills a fresh entry that holds what the readers' fetch steps now fetch.
      - id: go-daemon
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-daemon-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.work', 'go.work.sum', 'packages/envoy/go.mod', 'packages/envoy/go.sum', 'packages/daemon/go.mod', 'packages/daemon/go.sum', '.github/go-fetch/daemon-go.txt', '.github/go-fetch/pi-legion.txt', '.github/go-fetch/plugin-pack.txt', '.github/go-fetch/typecheck.txt', '.github/scripts/go-fetch.sh') }}
          lookup-only: true

      # The lookup's key and whether this leg fills it, as the job's outputs name them: RUNNER_ARCH
      # is X64 or ARM64, lowercased here.
      - name: Name this leg's key by its architecture
        id: leg
        env:
          KEY: ${{ steps.go-daemon.outputs.cache-primary-key }}
          FILLED: ${{ steps.go-daemon.outputs.cache-hit != 'true' }}
        run: |
          arch=${RUNNER_ARCH,,}
          echo "key-$arch=$KEY" >>"$GITHUB_OUTPUT"
          echo "filled-$arch=$FILLED" >>"$GITHUB_OUTPUT"

      # What the readers' fetch steps fetch, each reader's fetch file in the order of their paths,
      # so an entry this fill saves leaves each of those steps nothing to download: typecheck's two
      # vets (darwin's included), daemon-go's and plugin-pack's tests and the envoy commands they
      # build (testbuild.EnvoyBinary), the legion binary and pi-legion's daemon packages.
      - name: Fetch what go-daemon's readers fetch
        if: steps.go-daemon.outputs.cache-hit != 'true'
        run: |
          .github/scripts/go-fetch.sh file .github/go-fetch/daemon-go.txt
          .github/scripts/go-fetch.sh file .github/go-fetch/pi-legion.txt
          .github/scripts/go-fetch.sh file .github/go-fetch/plugin-pack.txt
          .github/scripts/go-fetch.sh file .github/go-fetch/typecheck.txt

      # What typecheck builds: the vet behind the e2e tag. It is the one build of this family an
      # arm64 job makes (.github/workflows/ci-job-typecheck.yaml), so both legs run it.
      # typecheck's darwin vet is the one build left out: its darwin objects, about 1.65 GB of build
      # cache on a devbox, would ride in an entry every job that restores go-daemon downloads, and
      # the step builds them in about two minutes (run 43990864191).
      - name: Build what typecheck builds of the daemon module
        if: steps.go-daemon.outputs.cache-hit != 'true'
        run: go vet -tags e2e ./...
        working-directory: packages/daemon

      # What daemon-go builds: the test binary of every package, and the race build of the three
      # packages daemon-go runs under the detector, whose
      # objects are cache entries of their own. Those three are the list
      # .github/scripts/ci_job_reads.py's DAEMON_RACE_PACKAGES holds, which check-ci-filters.sh
      # holds ci.yaml's two steps to, so a package that joins or leaves the detector there is the
      # side this command follows. The test binaries are compiled and never run (`go test -c -o
      # /dev/null` links each one and writes nothing): running them would want tmux, jj, Oh My Pi,
      # uv, container images and a Postgres service, and the build cache this entry holds is what
      # a compile leaves. The x86_64 leg alone: daemon-go, plugin-pack and pi-legion, which read
      # these objects, run on ubuntu-24.04.
      - name: Build what daemon-go builds of the daemon module
        if: steps.go-daemon.outputs.cache-hit != 'true' && runner.arch == 'X64'
        run: |
          go test -c -o /dev/null ./...
          go test -c -o /dev/null -race ./internal/daemon/ ./internal/sessionproxy/ ./internal/launcher/
        working-directory: packages/daemon

      - if: steps.go-daemon.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-daemon-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.work', 'go.work.sum', 'packages/envoy/go.mod', 'packages/envoy/go.sum', 'packages/daemon/go.mod', 'packages/daemon/go.sum', '.github/go-fetch/daemon-go.txt', '.github/go-fetch/pi-legion.txt', '.github/go-fetch/plugin-pack.txt', '.github/go-fetch/typecheck.txt', '.github/scripts/go-fetch.sh') }}

  # go-notices, in a job of its own on ubuntu-24.04-arm, the runner of lint, whose notices step the
  # family belongs to. It keys on packages/daemon/go.mod's Go, which lint installs, though that
  # step also builds the envoy and infra modules' commands, and on the runner's architecture
  # before the OS, as lint's restore does: the entry holds the go-licenses that step runs, and an
  # <os>-<arch> key would start with the go-notices-<os>- prefix of a run of a workflow file older
  # than the architecture in the key, which then restores this arm64 program on x86_64. The key
  # hashes what decides what that step builds, as lint's restore says, so the superseded job
  # deletes the entry each fill replaced.
  notices:
    runs-on: ubuntu-24.04-arm
    # The notices build is the long one: it writes the notices of, and cross-compiles, every
    # release target of three modules on a cold module cache.
    timeout-minutes: 90
    outputs:
      key-arm64: ${{ steps.go-notices.outputs.cache-primary-key }}
      filled-arm64: ${{ steps.go-notices.outputs.cache-hit != 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/daemon/go.mod
          cache: false

      - id: go-notices
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/legion
          key: go-notices-${{ runner.arch }}-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.work', 'go.work.sum', 'packages/envoy/go.mod', 'packages/envoy/go.sum', 'packages/daemon/go.mod', 'packages/daemon/go.sum', 'packages/envoy/infra/go.work', 'packages/envoy/infra/go.work.sum', 'packages/envoy/infra/go.mod', 'packages/envoy/infra/go.sum', '.github/scripts/go-release-notices.sh', 'scripts/go-third-party-notices.sh', '.github/go-release-targets.json', '.github/agent-secrets-client-targets.json', '.github/envoy-infra-targets.json', '.github/go-fetch/lint.txt', '.github/scripts/go-fetch.sh') }}
          lookup-only: true

      # What lint's fetch step fetches after it restores this entry, so that step finds it here.
      - name: Fetch what go-notices' reader fetches
        if: steps.go-notices.outputs.cache-hit != 'true'
        run: .github/scripts/go-fetch.sh file .github/go-fetch/lint.txt

      # The very script lint's notices step runs, .github/scripts/go-release-notices.sh: the
      # same loops over .github/go-release-targets.json, .github/agent-secrets-client-targets.json
      # and .github/envoy-infra-targets.json, with the same GOOS, GOARCH and CGO_ENABLED per
      # target, so the modules it downloads, the go-licenses it builds under ~/.cache/legion and
      # the objects it leaves are the ones lint restores. One script and not a copy of those
      # loops, because a copy stops warming a target the day lint gains one, and nothing fails:
      # lint just builds those objects cold on every run.
      - name: Write every Go release archive's third-party notices and cross-build the commands
        if: steps.go-notices.outputs.cache-hit != 'true'
        run: .github/scripts/go-release-notices.sh "$RUNNER_TEMP/notices"

      - if: steps.go-notices.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/legion
          key: go-notices-${{ runner.arch }}-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.work', 'go.work.sum', 'packages/envoy/go.mod', 'packages/envoy/go.sum', 'packages/daemon/go.mod', 'packages/daemon/go.sum', 'packages/envoy/infra/go.work', 'packages/envoy/infra/go.work.sum', 'packages/envoy/infra/go.mod', 'packages/envoy/infra/go.sum', '.github/scripts/go-release-notices.sh', 'scripts/go-third-party-notices.sh', '.github/go-release-targets.json', '.github/agent-secrets-client-targets.json', '.github/envoy-infra-targets.json', '.github/go-fetch/lint.txt', '.github/scripts/go-fetch.sh') }}

  # go-envoy. It keys on packages/envoy/go.mod's Go, the module every job that restores it sets Go
  # up from. One leg per runner: the envoy lanes that restore it run on ubuntu-24.04-arm, and
  # envoy-go-checks and the browser lane's embedder job on ubuntu-24.04. A job of its own beside
  # envoy-test's go-envoy-test: an entry saves the module cache every step before its save left,
  # so one job that filled both families filled the second with the first one's fetch too.
  envoy:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    # The fetch and the listener and natsd are minutes; this was the limit of the job that also
    # compiled every test binary of the envoy module, and no leg of the go-envoy fill alone has
    # been measured near it.
    timeout-minutes: 60
    outputs:
      # The go-envoy key each leg looked up, and whether it filled it, by the leg's architecture,
      # as the envoy-infra job below names its own and for the reason it gives: the superseded job
      # deletes the go-envoy entries each fill replaced.
      key-x64: ${{ steps.leg.outputs.key-x64 }}
      filled-x64: ${{ steps.leg.outputs.filled-x64 }}
      key-arm64: ${{ steps.leg.outputs.key-arm64 }}
      filled-arm64: ${{ steps.leg.outputs.filled-arm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          cache: false

      # go-envoy's key carries the hash of the files that decide what its readers' fetch steps
      # fetch, as every Go family's does: the root workspace's module files (a build in
      # packages/envoy runs in the root workspace, so go.work, go.work.sum and the go.mod and
      # go.sum of both modules it binds), every fetch file its readers run, the helm pin
      # (loadtest/cluster/tools.txt) envoy-go-checks' fetch file names, and go-fetch.sh. Keyed on
      # less, an entry went stale as those files moved, and every reader then fetched what moved;
      # with the hash, a push to main that changes one misses the lookup and fills a fresh entry,
      # and a pull request that changes one restores the newest by prefix.
      - id: go-envoy
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.work', 'go.work.sum', 'packages/envoy/go.mod', 'packages/envoy/go.sum', 'packages/daemon/go.mod', 'packages/daemon/go.sum', '.github/go-fetch/airlock-lean.txt', '.github/go-fetch/broker-multiprocess.txt', '.github/go-fetch/dispatch-browser-embedder.txt', '.github/go-fetch/dispatch-memory.txt', '.github/go-fetch/dispatch-multiprocess.txt', '.github/go-fetch/envoy-e2e-local.txt', '.github/go-fetch/envoy-go-checks.txt', '.github/go-fetch/envoy-go-docs-finalizers.txt', '.github/go-fetch/envoy-go-race-api.txt', '.github/go-fetch/envoy-go-race-docs.txt', '.github/go-fetch/envoy-go-race.txt', '.github/go-fetch/envoy-session-stall.txt', '.github/go-fetch/listener-server-change.txt', 'packages/envoy/loadtest/cluster/tools.txt', '.github/scripts/go-fetch.sh') }}
          lookup-only: true

      # The lookup's key and whether this leg fills it, as the job's outputs name them: RUNNER_ARCH
      # is X64 or ARM64, lowercased here.
      - name: Name this leg's key by its architecture
        id: leg
        env:
          KEY: ${{ steps.go-envoy.outputs.cache-primary-key }}
          FILLED: ${{ steps.go-envoy.outputs.cache-hit != 'true' }}
        run: |
          arch=${RUNNER_ARCH,,}
          echo "key-$arch=$KEY" >>"$GITHUB_OUTPUT"
          echo "filled-$arch=$FILLED" >>"$GITHUB_OUTPUT"

      # What the readers' fetch steps fetch, each reader's fetch file in the order of their paths,
      # so an entry this fill saves leaves each of those steps nothing to download: the modules of
      # each lane's tests and of the commands they build with GOPROXY=off, the listener clients
      # envoy-go-checks' wire test lists, its darwin vet's modules, and the helm
      # loadtest/cluster/tools.txt pins, installed, so its modules, its version list and its
      # compiled packages are in the entry and go-fetch.sh's tools mode on the reader asks the
      # network nothing. go list compiles nothing, so the darwin lines add modules and no objects.
      - name: Fetch what go-envoy's readers fetch
        if: steps.go-envoy.outputs.cache-hit != 'true'
        run: |
          .github/scripts/go-fetch.sh file .github/go-fetch/airlock-lean.txt
          .github/scripts/go-fetch.sh file .github/go-fetch/broker-multiprocess.txt
          .github/scripts/go-fetch.sh file .github/go-fetch/dispatch-browser-embedder.txt
          .github/scripts/go-fetch.sh file .github/go-fetch/dispatch-memory.txt
          .github/scripts/go-fetch.sh file .github/go-fetch/dispatch-multiprocess.txt
          .github/scripts/go-fetch.sh file .github/go-fetch/envoy-e2e-local.txt
          .github/scripts/go-fetch.sh file .github/go-fetch/envoy-go-checks.txt
          .github/scripts/go-fetch.sh file .github/go-fetch/envoy-go-docs-finalizers.txt
          .github/scripts/go-fetch.sh file .github/go-fetch/envoy-go-race-api.txt
          .github/scripts/go-fetch.sh file .github/go-fetch/envoy-go-race-docs.txt
          .github/scripts/go-fetch.sh file .github/go-fetch/envoy-go-race.txt
          .github/scripts/go-fetch.sh file .github/go-fetch/envoy-session-stall.txt
          .github/scripts/go-fetch.sh file .github/go-fetch/listener-server-change.txt

      # The two binaries envoy-e2e-local's scripts/e2e-local.sh and envoy-session-stall's
      # test/envoy-stack.ts build, and whose packages listener-server-change compiles too: the
      # listener and the in-process NATS server's natsd. An -o ending in a separator names a
      # directory, as envoy-stack.ts's build does, so both main packages build in one command.
      # envoy-go-checks' darwin vet is left out: its darwin objects, about 1.6 GB of build cache on
      # a devbox, would ride in an entry every job that restores go-envoy downloads, and the step
      # builds them in under three minutes (run 43990864191).
      - name: Build the listener and natsd
        if: steps.go-envoy.outputs.cache-hit != 'true'
        run: go build -o "$RUNNER_TEMP/envoy-bin/" ./cmd/listener ./internal/testnats/cmd/natsd
        working-directory: packages/envoy

      - if: steps.go-envoy.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.work', 'go.work.sum', 'packages/envoy/go.mod', 'packages/envoy/go.sum', 'packages/daemon/go.mod', 'packages/daemon/go.sum', '.github/go-fetch/airlock-lean.txt', '.github/go-fetch/broker-multiprocess.txt', '.github/go-fetch/dispatch-browser-embedder.txt', '.github/go-fetch/dispatch-memory.txt', '.github/go-fetch/dispatch-multiprocess.txt', '.github/go-fetch/envoy-e2e-local.txt', '.github/go-fetch/envoy-go-checks.txt', '.github/go-fetch/envoy-go-docs-finalizers.txt', '.github/go-fetch/envoy-go-race-api.txt', '.github/go-fetch/envoy-go-race-docs.txt', '.github/go-fetch/envoy-go-race.txt', '.github/go-fetch/envoy-session-stall.txt', '.github/go-fetch/listener-server-change.txt', 'packages/envoy/loadtest/cluster/tools.txt', '.github/scripts/go-fetch.sh') }}

  # go-envoy-test, on packages/envoy/go.mod's Go as go-envoy is. One leg per runner: envoy-go
  # runs on ubuntu-24.04-arm, and the browser lane's binaries, multiprocess and visual jobs on
  # ubuntu-24.04.
  envoy-test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    # Compiling the test binary of every package of the envoy module on a cold module cache is
    # the long step.
    timeout-minutes: 60
    outputs:
      # As the envoy job's: the superseded job deletes the go-envoy-test entries each fill
      # replaced.
      key-x64: ${{ steps.leg.outputs.key-x64 }}
      filled-x64: ${{ steps.leg.outputs.filled-x64 }}
      key-arm64: ${{ steps.leg.outputs.key-arm64 }}
      filled-arm64: ${{ steps.leg.outputs.filled-arm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          cache: false

      # The key hashes the root workspace's module files, every fetch file go-envoy-test's
      # readers run and go-fetch.sh, as go-envoy's does and for its reason.
      - id: go-envoy-test
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-test-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.work', 'go.work.sum', 'packages/envoy/go.mod', 'packages/envoy/go.sum', 'packages/daemon/go.mod', 'packages/daemon/go.sum', '.github/go-fetch/dispatch-browser-binaries.txt', '.github/go-fetch/dispatch-browser-multiprocess.txt', '.github/go-fetch/dispatch-browser-visual.txt', '.github/go-fetch/envoy-go.txt', '.github/scripts/go-fetch.sh') }}
          lookup-only: true

      # The lookup's key and whether this leg fills it, as the job's outputs name them.
      - name: Name this leg's key by its architecture
        id: leg
        env:
          KEY: ${{ steps.go-envoy-test.outputs.cache-primary-key }}
          FILLED: ${{ steps.go-envoy-test.outputs.cache-hit != 'true' }}
        run: |
          arch=${RUNNER_ARCH,,}
          echo "key-$arch=$KEY" >>"$GITHUB_OUTPUT"
          echo "filled-$arch=$FILLED" >>"$GITHUB_OUTPUT"

      # What the readers' fetch steps fetch, each reader's fetch file in the order of their paths:
      # envoy-go's tests with each tag its steps add and the other platforms its tests build for,
      # and the commands the browser lane's three jobs build.
      - name: Fetch what go-envoy-test's readers fetch
        if: steps.go-envoy-test.outputs.cache-hit != 'true'
        run: |
          .github/scripts/go-fetch.sh file .github/go-fetch/dispatch-browser-binaries.txt
          .github/scripts/go-fetch.sh file .github/go-fetch/dispatch-browser-multiprocess.txt
          .github/scripts/go-fetch.sh file .github/go-fetch/dispatch-browser-visual.txt
          .github/scripts/go-fetch.sh file .github/go-fetch/envoy-go.txt

      # envoy-go's set: the test binary of every package of the envoy module, the integration
      # package's and the natslive build of internal/testnats among them. `go test -c` links each
      # package's test binary and `-o /dev/null` writes none of them, so every object the restored
      # build cache holds is made and no test runs: envoy-go's tests want the job's Postgres
      # service and container images, which a cache fill has no reason to start.
      - name: Build the test binary of every package of the envoy module
        if: steps.go-envoy-test.outputs.cache-hit != 'true'
        run: |
          go test -c -o /dev/null ./...
          go test -c -o /dev/null -tags natslive ./internal/testnats/
        working-directory: packages/envoy

      - if: steps.go-envoy-test.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-test-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.work', 'go.work.sum', 'packages/envoy/go.mod', 'packages/envoy/go.sum', 'packages/daemon/go.mod', 'packages/daemon/go.sum', '.github/go-fetch/dispatch-browser-binaries.txt', '.github/go-fetch/dispatch-browser-multiprocess.txt', '.github/go-fetch/dispatch-browser-visual.txt', '.github/go-fetch/envoy-go.txt', '.github/scripts/go-fetch.sh') }}

  # architecture-check-<os>-<arch>-go<version>-<hash>, the family of the composite action
  # .github/actions/architecture-check, run as ci.yaml's envoy-go-checks runs it. The action sets
  # its own Go up, from packages/envoy/go.mod, and restores and saves the entry itself. It saves
  # only in a push, schedule or workflow_dispatch run, so on a push to main it fills the entry in
  # main's scope, where every pull request and merge group of this repository finds it: on a hit
  # it restores the entry and compiles only the command's own packages that changed since the entry
  # was saved; on a miss, as after a go.sum change, it builds the command from the newest entry of
  # that Go version, or cold when there is none, and saves the entry. It also checks main's notes;
  # the action saves before it checks, so a refused set does not cost the entry. A job of its own
  # is one of the two placements the action's README.md gives ("The Go toolchain"). The other, in
  # the envoy job, would run the action first, before that job's setup-go, and a refused note set
  # on main would then stop the go-envoy fills, so it is a job of its own.
  architecture-check:
    runs-on: ubuntu-24.04
    # The action takes seconds: 13 s with its own Go download and a cache miss, in ci.yaml's
    # envoy-go-checks of run 43553309875.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fill the architecture-check action's cache and check main's notes
        uses: ./.github/actions/architecture-check

  # spec-check-<os>-<arch>-go<version>-<hash>, the family of the composite action
  # .github/actions/spec-check, run as ci.yaml's envoy-go-checks runs it, with allow-empty while
  # main holds no spec file. It fills the entry as the architecture-check job above fills its own.
  # It is a job of its own, so a refused note set on main cannot stop this fill and a refused spec
  # tree on main cannot stop the note check.
  spec-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fill the spec-check action's cache and check main's spec files
        uses: ./.github/actions/spec-check
        with:
          allow-empty: 'true'

  # go-envoy-infra. The infra module is not in the root go.work - its own go.work binds it and
  # packages/envoy - so it keys on packages/envoy/infra/go.mod's Go and builds in a job of its own,
  # as ci.yaml's envoy-infra-go does. Its key carries the hash of the files that choose the module
  # versions it builds and fetches: that go.work and its go.work.sum, the go.mod and go.sum of both
  # modules it binds, the root workspace's module files (the envoy commands its readers' tests
  # build read them), gcp's live tests' tool pins (gcp/testdata/live-tools.txt), which the fill
  # installs, every fetch file its readers run and go-fetch.sh. An entry keyed on the Go version
  # alone was refreshed only by a Go bump and went stale as those files moved: restoring the entry
  # of 2026-11-06, eleven days old, envoy-infra-go's linux vet took 175, 229 and 177 s in runs
  # 43990864191, 43996496498 and 44008055050, 83 to 85% of what its darwin vet took in the same run
  # with nothing cached, because google.golang.org/api, gax-go, the AWS SDK and nats had moved
  # under it. With the hash, a push to main that changes those files misses the lookup and fills a
  # fresh entry; a pull request
  # that changes none of them restores one built from the same module versions, and one that
  # changes them restores the newest entry by prefix and builds what moved. One leg per runner:
  # envoy-infra-go runs on ubuntu-24.04-arm, and envoy-smoke and release-envoy-infra.yaml's build,
  # which restore the family too, on ubuntu-24.04. The superseded job below deletes the entry each
  # leg's fill replaced.
  envoy-infra:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    outputs:
      # The key each leg looked up, and whether it filled it, under names of that leg's
      # architecture: a matrix job's outputs are combined from its legs, and an output both legs
      # set holds the value of whichever leg ended last. The superseded job keeps each filled key,
      # deletes the entries it supersedes (this ref's go-envoy-infra entries of the same runner and
      # Go with an older module-file hash), and runs only after a fill.
      key-x64: ${{ steps.leg.outputs.key-x64 }}
      filled-x64: ${{ steps.leg.outputs.filled-x64 }}
      key-arm64: ${{ steps.leg.outputs.key-arm64 }}
      filled-arm64: ${{ steps.leg.outputs.filled-arm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/infra/go.mod
          cache: false

      - id: go-envoy-infra
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-infra-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('packages/envoy/infra/go.work', 'packages/envoy/infra/go.work.sum', 'packages/envoy/infra/go.mod', 'packages/envoy/infra/go.sum', 'packages/envoy/go.mod', 'packages/envoy/go.sum', 'go.work', 'go.work.sum', 'packages/daemon/go.mod', 'packages/daemon/go.sum', '.github/go-fetch/envoy-infra-go.txt', '.github/go-fetch/envoy-smoke.txt', 'packages/envoy/infra/gcp/testdata/live-tools.txt', '.github/scripts/go-fetch.sh') }}
          lookup-only: true

      # The lookup's key and whether this leg fills it, as the job's outputs name them: RUNNER_ARCH
      # is X64 or ARM64, lowercased here.
      - name: Name this leg's key by its architecture
        id: leg
        env:
          KEY: ${{ steps.go-envoy-infra.outputs.cache-primary-key }}
          FILLED: ${{ steps.go-envoy-infra.outputs.cache-hit != 'true' }}
        run: |
          arch=${RUNNER_ARCH,,}
          echo "key-$arch=$KEY" >>"$GITHUB_OUTPUT"
          echo "filled-$arch=$FILLED" >>"$GITHUB_OUTPUT"

      # What the readers' fetch steps fetch, each reader's fetch file in the order of their paths,
      # so an entry this fill saves leaves each of those steps nothing to download: envoy-infra-go's
      # vets, tests, gcp's live tools, installed, and the envoy commands its tests build, and
      # envoy-smoke's smoke test, plugin and host live tests.
      - name: Fetch what go-envoy-infra's readers fetch
        if: steps.go-envoy-infra.outputs.cache-hit != 'true'
        run: |
          .github/scripts/go-fetch.sh file .github/go-fetch/envoy-infra-go.txt
          .github/scripts/go-fetch.sh file .github/go-fetch/envoy-smoke.txt

      # What envoy-infra-go builds: the vet with both live-test tags, for linux and for darwin, the
      # test binary of every package and the natslive binaries of the three packages its live step
      # runs. Compiled, not run: the live tests need nats-server, Postgres and container images,
      # and the unit tests nothing a build cache keeps. The darwin vet is in the fill because,
      # built cold, it is the step that brought envoy-infra-go near its time limit.
      - name: Build what envoy-infra-go builds
        if: steps.go-envoy-infra.outputs.cache-hit != 'true'
        run: |
          flags=$(python3 ../../../.github/scripts/go_build_tags.py . darwin arm64)
          go vet -tags pulumilive,natslive ./...
          while IFS= read -r flag; do
            GOOS=darwin GOARCH=arm64 go vet "$flag" ./...
          done <<< "$flags"
          go test -c -o /dev/null ./...
          go test -c -o /dev/null -tags natslive ./core/ ./seed/ ./gcp/
        working-directory: packages/envoy/infra

      - if: steps.go-envoy-infra.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-infra-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('packages/envoy/infra/go.work', 'packages/envoy/infra/go.work.sum', 'packages/envoy/infra/go.mod', 'packages/envoy/infra/go.sum', 'packages/envoy/go.mod', 'packages/envoy/go.sum', 'go.work', 'go.work.sum', 'packages/daemon/go.mod', 'packages/daemon/go.sum', '.github/go-fetch/envoy-infra-go.txt', '.github/go-fetch/envoy-smoke.txt', 'packages/envoy/infra/gcp/testdata/live-tools.txt', '.github/scripts/go-fetch.sh') }}

  # The five go-fetch families: each holds what one job's fetch step fetches and nothing else,
  # ~/go/pkg/mod without a build cache, for the five jobs of ci.yaml that have a fetch step and
  # restore no family above: text-checks, lint, test, private-names-port and dispatch-two-builds.
  # Each family above that holds those modules holds its own readers' build cache too
  # (go-envoy-infra, go-daemon and go-envoy hold 0.17 to 1.4 GB on main), which these five jobs
  # would download to read a few hundred of its modules. A module cache that one of these fetches
  # leaves on an empty runner is 48 MB (lint), 70 MB (test), 202 MB (dispatch-two-builds), 253 MB
  # (text-checks) and 328 MB (private-names-port) as a zstd tar, measured on a devbox; go-envoy's
  # 165 MB took 2 to 3 s to restore in run 44433142648's arm64 jobs. A job of its own for each
  # family, on the one runner its reader runs on and with the Go that reader sets up: each fill
  # runs its readers' fetch files in the module cache of a fresh runner, so the entry holds exactly
  # what their fetch steps fetch, and a restore of it leaves those steps nothing to download. Each
  # key carries the hash of the module files that fetch reads, of its fetch files and of
  # go-fetch.sh, as every Go family's does: a fetch reads the module graph, so an entry keyed on
  # the Go version alone would hold the versions of the push that filled it, and its reader would
  # fetch on every run what moved since. The superseded job below deletes the entry each fill
  # replaced, so each job names its key and whether it filled it under the output names that job
  # reads.
  #
  # go-fetch-text-checks: text-checks' fetch, in both workspaces (packages/envoy/infra/go.work binds
  # that module and packages/envoy; the root go.work binds packages/envoy and packages/daemon),
  # whose module files the key hashes.
  fetch-text-checks:
    runs-on: ubuntu-24.04-arm
    # One download of the modules, the fetch step's 8 s in run 44433142648; a run whose key is
    # there costs a checkout and a setup-go.
    timeout-minutes: 15
    outputs:
      key-arm64: ${{ steps.go-fetch-text-checks.outputs.cache-primary-key }}
      filled-arm64: ${{ steps.go-fetch-text-checks.outputs.cache-hit != 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          cache: false

      - id: go-fetch-text-checks
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-fetch-text-checks-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('packages/envoy/infra/go.work', 'packages/envoy/infra/go.work.sum', 'packages/envoy/infra/go.mod', 'packages/envoy/infra/go.sum', 'packages/envoy/go.mod', 'packages/envoy/go.sum', 'go.work', 'go.work.sum', 'packages/daemon/go.mod', 'packages/daemon/go.sum', '.github/go-fetch/text-checks.txt', '.github/scripts/go-fetch.sh') }}
          lookup-only: true

      - name: Fetch what text-checks' fetch step fetches
        if: steps.go-fetch-text-checks.outputs.cache-hit != 'true'
        run: .github/scripts/go-fetch.sh file .github/go-fetch/text-checks.txt

      - if: steps.go-fetch-text-checks.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-fetch-text-checks-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('packages/envoy/infra/go.work', 'packages/envoy/infra/go.work.sum', 'packages/envoy/infra/go.mod', 'packages/envoy/infra/go.sum', 'packages/envoy/go.mod', 'packages/envoy/go.sum', 'go.work', 'go.work.sum', 'packages/daemon/go.mod', 'packages/daemon/go.sum', '.github/go-fetch/text-checks.txt', '.github/scripts/go-fetch.sh') }}

  # go-fetch-lint: lint's fetch for the natsfloor build of its NATS pin scan, in the root
  # workspace (go.work binds packages/daemon and packages/envoy), with packages/daemon/go.mod's
  # Go, as lint sets it up.
  fetch-lint:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    outputs:
      key-arm64: ${{ steps.go-fetch-lint.outputs.cache-primary-key }}
      filled-arm64: ${{ steps.go-fetch-lint.outputs.cache-hit != 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/daemon/go.mod
          cache: false

      - id: go-fetch-lint
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-fetch-lint-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.work', 'go.work.sum', 'packages/envoy/go.mod', 'packages/envoy/go.sum', 'packages/daemon/go.mod', 'packages/daemon/go.sum', '.github/go-fetch/lint.txt', '.github/scripts/go-fetch.sh') }}
          lookup-only: true

      - name: Fetch what lint's fetch step fetches
        if: steps.go-fetch-lint.outputs.cache-hit != 'true'
        run: .github/scripts/go-fetch.sh file .github/go-fetch/lint.txt

      - if: steps.go-fetch-lint.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-fetch-lint-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.work', 'go.work.sum', 'packages/envoy/go.mod', 'packages/envoy/go.sum', 'packages/daemon/go.mod', 'packages/daemon/go.sum', '.github/go-fetch/lint.txt', '.github/scripts/go-fetch.sh') }}

  # go-fetch-test: the test job's fetch for the listener and natsfloor builds its e2e library
  # tests make, in the root workspace, with packages/daemon/go.mod's Go, as that job sets it up.
  fetch-test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    outputs:
      key-arm64: ${{ steps.go-fetch-test.outputs.cache-primary-key }}
      filled-arm64: ${{ steps.go-fetch-test.outputs.cache-hit != 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/daemon/go.mod
          cache: false

      - id: go-fetch-test
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-fetch-test-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.work', 'go.work.sum', 'packages/envoy/go.mod', 'packages/envoy/go.sum', 'packages/daemon/go.mod', 'packages/daemon/go.sum', '.github/go-fetch/test.txt', '.github/scripts/go-fetch.sh') }}
          lookup-only: true

      - name: Fetch what the test job's fetch step fetches
        if: steps.go-fetch-test.outputs.cache-hit != 'true'
        run: .github/scripts/go-fetch.sh file .github/go-fetch/test.txt

      - if: steps.go-fetch-test.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-fetch-test-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.work', 'go.work.sum', 'packages/envoy/go.mod', 'packages/envoy/go.sum', 'packages/daemon/go.mod', 'packages/daemon/go.sum', '.github/go-fetch/test.txt', '.github/scripts/go-fetch.sh') }}

  # go-fetch-private-names-port: that job's fetch for the `legion` build its harness makes, in
  # the root workspace, with packages/daemon/go.mod's Go, as that job sets it up.
  fetch-private-names-port:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    outputs:
      key-arm64: ${{ steps.go-fetch-private-names-port.outputs.cache-primary-key }}
      filled-arm64: ${{ steps.go-fetch-private-names-port.outputs.cache-hit != 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/daemon/go.mod
          cache: false

      - id: go-fetch-private-names-port
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-fetch-private-names-port-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.work', 'go.work.sum', 'packages/envoy/go.mod', 'packages/envoy/go.sum', 'packages/daemon/go.mod', 'packages/daemon/go.sum', '.github/go-fetch/private-names-port.txt', '.github/scripts/go-fetch.sh') }}
          lookup-only: true

      - name: Fetch what private-names-port's fetch step fetches
        if: steps.go-fetch-private-names-port.outputs.cache-hit != 'true'
        run: .github/scripts/go-fetch.sh file .github/go-fetch/private-names-port.txt

      - if: steps.go-fetch-private-names-port.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-fetch-private-names-port-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.work', 'go.work.sum', 'packages/envoy/go.mod', 'packages/envoy/go.sum', 'packages/daemon/go.mod', 'packages/daemon/go.sum', '.github/go-fetch/private-names-port.txt', '.github/scripts/go-fetch.sh') }}

  # go-fetch-dispatch-two-builds: the fetches of that file's two jobs, dispatch-two-builds and
  # dispatch-two-builds-same, in the root workspace, on ubuntu-24.04, the runner both run on, with
  # packages/envoy/go.mod's Go, as they set it up.
  fetch-dispatch-two-builds:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      key-x64: ${{ steps.go-fetch-dispatch-two-builds.outputs.cache-primary-key }}
      filled-x64: ${{ steps.go-fetch-dispatch-two-builds.outputs.cache-hit != 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          cache: false

      - id: go-fetch-dispatch-two-builds
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-fetch-dispatch-two-builds-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.work', 'go.work.sum', 'packages/envoy/go.mod', 'packages/envoy/go.sum', 'packages/daemon/go.mod', 'packages/daemon/go.sum', '.github/go-fetch/dispatch-two-builds-same.txt', '.github/go-fetch/dispatch-two-builds.txt', '.github/scripts/go-fetch.sh') }}
          lookup-only: true

      - name: Fetch what the two dispatch-two-builds jobs' fetch steps fetch
        if: steps.go-fetch-dispatch-two-builds.outputs.cache-hit != 'true'
        run: |
          .github/scripts/go-fetch.sh file .github/go-fetch/dispatch-two-builds-same.txt
          .github/scripts/go-fetch.sh file .github/go-fetch/dispatch-two-builds.txt

      - if: steps.go-fetch-dispatch-two-builds.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-fetch-dispatch-two-builds-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.work', 'go.work.sum', 'packages/envoy/go.mod', 'packages/envoy/go.sum', 'packages/daemon/go.mod', 'packages/daemon/go.sum', '.github/go-fetch/dispatch-two-builds-same.txt', '.github/go-fetch/dispatch-two-builds.txt', '.github/scripts/go-fetch.sh') }}

  # The entries the hashed fills above superseded - every Go family's: go-daemon's, go-notices',
  # go-envoy's, go-envoy-test's, go-envoy-infra's and the five go-fetch families' - deleted once
  # each has saved the new one. A change to a hashed file gives each family it names a new key, and
  # the entry under the old key, about 1.4 GB for go-envoy-infra and 2.2 GB for go-notices, is then
  # read by no run of this ref: left alone it would hold its space until GitHub drops it after
  # seven days unread, and over the repository's cache limit GitHub evicts the least recently used
  # entries, which can be another family's live one. An entry the new one supersedes is one of this
  # ref whose key is the new key but for its 64-hex hash: the same family, runner and Go, with
  # older hashed files, the hashless key of the fill before this one included. An entry of another
  # runner, another Go or another family is no such entry and stays: go-envoy-test's key and
  # go-envoy-infra's differ from go-envoy's before any hash, and each go-fetch family's key from
  # every other family's, so a deletion of one family's entries reaches no other, and a fill that
  # runs once per architecture deletes nothing the other leg saved. None is deleted unless the new
  # key is among this ref's entries, so a save that did not land leaves the old entry in place. A
  # job of its own, so the token that may delete caches is in no job that builds code. A cache key
  # is text any build that saves on this ref chose, so the step never splits or prints one raw: the
  # list stays JSON, jq selects the numeric ids of the superseded entries, and each id is checked to
  # be a number before `gh cache delete` gets it. A key holding a newline then cannot add a line of
  # its own, such as `--all`, to that list. One leg per family and architecture of the fills, each
  # keeping the key that leg of that fill saved, under the output names its fill job gives it; a
  # leg whose fill filled nothing skips its step. Every leg runs on ubuntu-24.04-arm: gh and jq
  # need nothing of an x64 machine.
  superseded:
    needs: [daemon, notices, envoy, envoy-test, envoy-infra, fetch-text-checks, fetch-lint, fetch-test, fetch-private-names-port, fetch-dispatch-two-builds]
    # !cancelled(), not the default success(): a failed leg of one fill must not keep the other
    # fill's superseded entries. Each step below runs only for a leg that filled, and a leg whose
    # save did not land leaves a key that is not among this ref's entries, so it deletes nothing.
    if: >-
      !cancelled() && (needs.daemon.outputs.filled-x64 == 'true' || needs.daemon.outputs.filled-arm64 == 'true'
      || needs.notices.outputs.filled-arm64 == 'true'
      || needs.envoy.outputs.filled-x64 == 'true' || needs.envoy.outputs.filled-arm64 == 'true'
      || needs.envoy-test.outputs.filled-x64 == 'true' || needs.envoy-test.outputs.filled-arm64 == 'true'
      || needs.envoy-infra.outputs.filled-x64 == 'true' || needs.envoy-infra.outputs.filled-arm64 == 'true'
      || needs.fetch-text-checks.outputs.filled-arm64 == 'true' || needs.fetch-lint.outputs.filled-arm64 == 'true'
      || needs.fetch-test.outputs.filled-arm64 == 'true' || needs.fetch-private-names-port.outputs.filled-arm64 == 'true'
      || needs.fetch-dispatch-two-builds.outputs.filled-x64 == 'true')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { fill: daemon, family: go-daemon, arch: x64 }
          - { fill: daemon, family: go-daemon, arch: arm64 }
          - { fill: notices, family: go-notices, arch: arm64 }
          - { fill: envoy, family: go-envoy, arch: x64 }
          - { fill: envoy, family: go-envoy, arch: arm64 }
          - { fill: envoy-test, family: go-envoy-test, arch: x64 }
          - { fill: envoy-test, family: go-envoy-test, arch: arm64 }
          - { fill: envoy-infra, family: go-envoy-infra, arch: x64 }
          - { fill: envoy-infra, family: go-envoy-infra, arch: arm64 }
          - { fill: fetch-text-checks, family: go-fetch-text-checks, arch: arm64 }
          - { fill: fetch-lint, family: go-fetch-lint, arch: arm64 }
          - { fill: fetch-test, family: go-fetch-test, arch: arm64 }
          - { fill: fetch-private-names-port, family: go-fetch-private-names-port, arch: arm64 }
          - { fill: fetch-dispatch-two-builds, family: go-fetch-dispatch-two-builds, arch: x64 }
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Delete this ref's entries of the family the new one supersedes
        if: needs[matrix.fill].outputs[format('filled-{0}', matrix.arch)] == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FAMILY: ${{ matrix.family }}
          KEEP: ${{ needs[matrix.fill].outputs[format('key-{0}', matrix.arch)] }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          entries=$(gh cache list --ref "$REF" --key "$FAMILY-" --limit 100 --json id,key,ref)
          if ! jq -e --arg keep "$KEEP" --arg ref "$REF" 'any(.[]; .key == $keep and .ref == $ref)' <<<"$entries" >/dev/null; then
            echo "::warning::the new $FAMILY entry is not among this ref's entries, so none is deleted"
            exit 0
          fi
          jq -r --arg keep "$KEEP" --arg ref "$REF" --arg family "$FAMILY" \
            'def base: gsub("-[0-9a-f]{64}"; "");
             .[] | select(.ref == $ref and (.key | startswith($family + "-")) and .key != $keep
                          and (.key | base) == ($keep | base)) | .id' <<<"$entries" |
            while read -r id; do
              if ! [[ $id =~ ^[0-9]+$ ]]; then
                echo "::error::the cache list gave an id that is not a number, so nothing more is deleted"
                exit 1
              fi
              echo "Deleting $FAMILY entry $id, which the new entry supersedes"
              gh cache delete "$id"
            done

  # The elan home ci.yaml's airlock-lean job restores, the Lean toolchain that job's `lake build`
  # needs. No setup-go and no Go family: the key is the runner's architecture, since elan and the
  # toolchain are binaries of it, and the content of the lean-toolchain the model names, since
  # that file is what decides which toolchain elan installs, so the entry is refreshed when the
  # model moves to another Lean and at no other time. install-elan puts elan under
  # $RUNNER_TEMP/elan and `lake build` downloads the named toolchain into it on a miss, which is
  # the whole of what is saved. It runs on ubuntu-24.04-arm, the runner airlock-lean runs on.
  elan:
    runs-on: ubuntu-24.04-arm
    # One toolchain download and one build of the model on a miss; a run that finds the key
    # costs the checkout alone.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: elan-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/elan
          key: elan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/envoy/internal/broker/airlock/lean/lean-toolchain') }}
          lookup-only: true

      - if: steps.elan-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/install-elan

      # The build is what downloads the toolchain lean-toolchain names, so the entry holds what
      # airlock-lean will find rather than elan alone.
      - name: Build what airlock-lean builds
        if: steps.elan-cache.outputs.cache-hit != 'true'
        run: lake build
        working-directory: packages/envoy/internal/broker/airlock/lean

      - if: steps.elan-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/elan
          key: elan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/envoy/internal/broker/airlock/lean/lean-toolchain') }}

  # The apt entry: the .deb files of every pin of .github/apt-packages.txt with what each depends
  # on, and their checksums, which the install steps of daemon-go, pi-envoy, claude-envoy,
  # dispatch-ui, dispatch-unit-repeat.yaml and e2e.yaml read with no network. One leg per runner
  # those jobs run on: daemon-go, pi-envoy, dispatch-unit-repeat's legs and e2e's proofs on
  # ubuntu-24.04, claude-envoy and dispatch-ui on ubuntu-24.04-arm, since a .deb is a binary of its
  # architecture. The first step reads the runner's release for the key, as each reader's does,
  # so the two keys are the same text (check-ci-filters.sh holds them to it). The fetch runs as the
  # runner's user, into directories of its own, and installs nothing; it retries as an install's
  # miss does, under the bound .github/scripts/apt-cache.sh's header gives, which the step's 5
  # minutes are above. Entries are small - about 30 MB, measured in an ubuntu:24.04 container on
  # 2026-11-19 - so no job deletes the one a new key supersedes: GitHub drops it after seven days
  # unread.
  apt:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    # A checkout, the lookup and, on a miss, one fetch: the step's own bound and the save.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the runner's release for the apt cache key
        id: apt-image
        run: .github/scripts/apt-cache.sh image >> "$GITHUB_OUTPUT"

      - id: apt
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apt
          key: apt-${{ runner.os }}-${{ runner.arch }}-${{ steps.apt-image.outputs.image }}-${{ hashFiles('.github/apt-packages.txt', '.github/scripts/apt-cache.sh') }}
          lookup-only: true

      - name: Fetch every pinned package with what it depends on
        if: steps.apt.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: .github/scripts/apt-cache.sh fill .github/apt-packages.txt "$RUNNER_TEMP/apt"

      - if: steps.apt.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apt
          key: apt-${{ runner.os }}-${{ runner.arch }}-${{ steps.apt-image.outputs.image }}-${{ hashFiles('.github/apt-packages.txt', '.github/scripts/apt-cache.sh') }}
