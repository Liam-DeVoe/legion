# Temporary, for dispatch://INFRA-1075 alone: twenty runs of each test that the lane runs alone
# because its subject is a wall-clock time, on the arrangement the lane runs it in. The API's xid
# window tests run in envoy-go-checks' step on ubuntu-24.04, and delivery's xid window tests and
# the NATS auth service's restart storm in envoy-go-race's step on ubuntu-24.04-arm. Each runs
# alone on its runner, against the lane's disposable Postgres, after the go-envoy restore. Four
# runners of each, five runs each, are the twenty. A push to this branch that changes this file
# starts it, since GitHub lists a workflow that is not on the default branch only once a push has
# run it, and only then can it be dispatched. This file is deleted in the commit after the run it
# records, so no lane carries it and nothing of main's CI reads it.
name: INFRA-1075 twenty runs alone

on:
  push:
    branches: [legion/INFRA-1075]
    paths: [.github/workflows/infra-1075-alone20.yaml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alone20:
    name: alone20 (${{ matrix.step }}, ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        step: [api, delivery-natscallout]
        include:
          - step: api
            runner: ubuntu-24.04
            packages: ./internal/dispatch/api
            run: '^(TestXidWindowApprovalAnswerOverTwoDocuments|TestXidWindowAskAnswerBlock|TestXidWindowAskBlockEditThenIssueClose|TestXidWindowAskResolveBlock|TestXidWindowDeliveries|TestXidWindowDocumentRebuild|TestXidWindowIssueAskRepairRestoration|TestXidWindowIssueAskRepairWithdrawal|TestXidWindowRouteTable|TestXidWindowUploadRestoringTheApprovedText|TestXidWindowsOnTheLargeSpec)$'
          - step: delivery-natscallout
            runner: ubuntu-24.04-arm
            packages: ./internal/dispatch/delivery ./internal/broker/natscallout
            run: '^(TestACalloutStormAfterAServerRestartAdmitsEveryConnection|TestXidWindowAttributionMoveRecorded|TestXidWindowDeployedEventRecorded)$'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    services:
      postgres:
        # ghcr.io/cybermonklabs/legion/ci, the copy of pgvector/pgvector (.github/ci-images.yaml)
        image: ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        command: postgres -c fsync=off -c full_page_writes=off -c synchronous_commit=off -c max_connections=500 -c max_prepared_transactions=20
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 50
    env:
      DISPATCH_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          cache: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: ${{ format('go-envoy-{0}-{1}-', runner.os, runner.arch) }}
      - name: Read the disposable service's settings back
        run: .github/scripts/postgres-service-settings.sh "${{ job.services.postgres.id }}" postgres
      - name: Size the service for this lane's Dispatch processes
        run: .github/scripts/pg-connection-ceiling.sh "${{ job.services.postgres.id }}"
      - name: Five runs of the step's tests, alone
        run: |
          mkdir -p "$RUNNER_TEMP/go-test-json"
          s=0
          go test -json -count=5 -p 1 -timeout 50m -run "${{ matrix.run }}" ${{ matrix.packages }} > "$RUNNER_TEMP/go-test-json/alone20.json" || s=$?
          jq -rj 'select(.Action == "build-output" or (.Action == "output" and .Test == null) or ((.Action == "pass" or .Action == "fail") and .Test != null and (.Test | test("/") | not))) | if .Output then .Output else "\(.Action) \(.Test) \(.Elapsed)\n" end' "$RUNNER_TEMP/go-test-json/alone20.json"
          exit $s
        working-directory: packages/envoy
      - name: Upload the go test -json stream
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: alone20-${{ matrix.step }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/go-test-json/
          if-no-files-found: warn
