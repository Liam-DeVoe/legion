name: CI

# why: .github/ci-notes/ci.md#the-router-every-check-a-pull-request-or-the-merge-queue-runs

# why: .github/ci-notes/ci.md#why-the-router-runs-on-these-events-and-no-others
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      # why: .github/ci-notes/ci.md#the-commit-main-pointed-at-before-the-push-the-bypass-check-read
      migration-base:
        description: >-
          The commit main pointed at before the push this run tests. A run on main must name it;
          a run on another branch that names none compares with the branch's merge base with main.
        type: string
        required: false
      # The layout's changes job leaves kind and agent-harness out of a dispatched run unless this
      # is true (main-bypass-check.yaml sets it), since every other dispatched run would add their
      # job-minutes.
      kind-and-agent-harness:
        description: Run kind and agent-harness too, which a dispatched run leaves out otherwise.
        type: boolean
        required: false
        default: false

# why: .github/ci-notes/ci.md#what-a-newer-push-cancels-and-what-is-never-cancelled
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# why: .github/ci-notes/ci.md#why-the-routers-permissions-block-holds-those-two-scopes
permissions:
  contents: read
  actions: read
  checks: write

env:
  # The Go jobs' module proxy: a `|` makes a go command fall through to the next source after any
  # error, where a `,` falls through only after a 404 or a 410, so a download proxy.golang.org reset
  # mid-stream is fetched from the source and checked against go.sum (sjawhar/legion#2512).
  GOPROXY: https://proxy.golang.org|direct
  # why: .github/ci-notes/ci.md#what-ci_ok_selected_by-holds-and-which-programs-read-it
  CI_OK_SELECTED_BY: |
    {
      "typecheck": "typecheck",
      "test": "test",
      "go-daemon": "go-daemon",
      "daemon-go": "go-daemon",
      "plugin-pack": "plugin-pack",
      "daemon-live": "daemon-live",
      "agent-harness": "agent_harness",
      "kind": "kind",
      "private-names-port": "private_names_port",
      "docs": "docs",
      "contracts": "contracts",
      "test-fixtures": "test_fixtures",
      "conflicts-script": "conflicts_script",
      "sessions-script": "sessions_script",
      "broker-client": "broker_client",
      "envoy-client": "envoy_client",
      "pi-shared": "pi_shared",
      "pi-envoy": "pi_envoy",
      "pi-legion": "pi_legion",
      "dispatch-ui": "dispatch_ui",
      "dispatch-browser": "dispatch_browser",
      "claude-envoy": "claude_envoy",
      "go-envoy": "go-envoy",
      "go-envoy-held": "go-envoy-held",
      "envoy-go": "go-envoy-held",
      "envoy-go-race-api": "go-envoy-held",
      "envoy-go-race-docs": "go-envoy-held",
      "dispatch-memory": "go-envoy-held",
      "airlock-arm": "airlock-arm",
      "text-checks": "text-checks",
      "notices": "notices",
      "ci-filters": "ci_filters",
      "ci-images": "ci_images",
      "tool-fallback": "tool_fallback",
      "tool-fallback-arm": "tool_fallback",
      "proof-sdk-offline": "proof_sdk_offline",
      "worker-image": "worker_image",
      "browser-image": "browser_image"
    }
  CI_OK_PULL_REQUEST_ONLY: '["worker-image"]'
  # why: .github/ci-notes/ci.md#the-jobs-that-run-on-every-change
  CI_OK_ALWAYS_RUN: |
    [
      "changes",
      "lint"
    ]
  # why: .github/ci-notes/ci.md#the-jobs-outside-ci-oks-accounting
  CI_OK_EXEMPT: |
    [
      "cancel-started",
      "ci-ok",
      "pr-title"
    ]
  # Each leg's and carrier's check-run name to its job id. A leg whose name: is an expression
  # carries the name it evaluates to and no job id, so ci-ok.sh, ci-ok-report.sh and
  # runner-shutdown.sh find its check run here (ci-ok.jq, runs_of); every other check run is named
  # after its job's id.
  CI_OK_CHECK_RUN_JOBS: |
    {
      "daemon-go (1/3)": "go-daemon",
      "daemon-go (2/3)": "go-daemon",
      "daemon-go (3/3)": "go-daemon",
      "daemon-go / daemon-go": "daemon-go",
      "plugin-pack / plugin-pack": "plugin-pack",
      "daemon-live / daemon-live": "daemon-live",
      "envoy-go-checks / envoy-go-checks": "go-envoy",
      "envoy-infra-go / envoy-infra-go": "go-envoy",
      "airlock-lean / airlock-lean": "go-envoy",
      "envoy-session-stall / envoy-session-stall": "go-envoy",
      "envoy-e2e-local / envoy-e2e-local": "go-envoy",
      "broker-multiprocess / broker-multiprocess": "go-envoy",
      "listener-server-change / listener-server-change": "go-envoy",
      "envoy-go (1/3)": "go-envoy-held",
      "envoy-go (2/3)": "go-envoy-held",
      "envoy-go (3/3)": "go-envoy-held",
      "envoy-go-race / envoy-go-race": "go-envoy-held",
      "envoy-go-race-api (1/2)": "go-envoy-held",
      "envoy-go-race-api (2/2)": "go-envoy-held",
      "envoy-go-claim-model / envoy-go-claim-model": "go-envoy-held",
      "envoy-go-race-docs (1/2)": "go-envoy-held",
      "envoy-go-race-docs (2/2)": "go-envoy-held",
      "envoy-go-docs-finalizers / envoy-go-docs-finalizers": "go-envoy-held",
      "dispatch-memory (1/2)": "go-envoy-held",
      "dispatch-memory (2/2)": "go-envoy-held",
      "dispatch-multiprocess / dispatch-multiprocess": "go-envoy-held",
      "dispatch-two-builds / dispatch-two-builds": "go-envoy-held",
      "dispatch-two-builds / dispatch-two-builds-same": "go-envoy-held",
      "envoy-smoke / envoy-smoke": "go-envoy-held",
      "envoy-go / envoy-go": "envoy-go",
      "envoy-go-race-api / envoy-go-race-api": "envoy-go-race-api",
      "envoy-go-race-docs / envoy-go-race-docs": "envoy-go-race-docs",
      "dispatch-memory / dispatch-memory": "dispatch-memory",
      "airlock-arm / airlock-arm": "airlock-arm",
      "text-checks / text-checks": "text-checks",
      "notices / notices": "notices"
    }

jobs:
  # why: .github/ci-notes/ci.md#what-the-changes-job-selects-and-the-two-terms-every-job-carries
  changes:
    if: ${{ !github.event.pull_request.draft && (github.event_name != 'merge_group' || github.run_attempt == '1') }}
    # why: .github/ci-notes/ci.md#why-changes-pr-title-cancel-started-and-ci-ok-run-on-arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    # One output per filter of .github/ci-areas.yaml, named as the filter and read by the job of
    # that id (kind-image reads kind's, claude-envoy-names pi's, a carrier its legs' job's):
    #   * pull_request: the job's filter matches, or the unnamed-file step found a changed file no
    #     filter names. go-envoy-held, airlock-arm and agent-harness also need the full-ci label,
    #     the unnamed-file step inside that term; kind runs on no pull request.
    #   * merge_group: every job.
    #   * workflow_dispatch: every job but kind and agent-harness, which the kind-and-agent-harness
    #     input selects. dorny/paths-filter and the unnamed-file step are skipped there.
    # No job's if: but its own gate tests these; lint (with the R3 search) tests none.
    outputs:
      worker-image: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.worker-image == 'true' || steps.unnamed.outputs.found == 'true' }}
      kind: ${{ github.event_name == 'merge_group' && 'true' || github.event_name == 'workflow_dispatch' && inputs.kind-and-agent-harness && 'true' || github.event_name != 'pull_request' && steps.filter.outputs.kind || 'false' }}
      go-daemon: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.go-daemon == 'true' || steps.unnamed.outputs.found == 'true' }}
      plugin-pack: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.plugin-pack == 'true' || steps.unnamed.outputs.found == 'true' }}
      daemon-live: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.daemon-live == 'true' || steps.unnamed.outputs.found == 'true' }}
      agent-harness: ${{ github.event_name == 'merge_group' && 'true' || github.event_name == 'workflow_dispatch' && inputs.kind-and-agent-harness && 'true' || github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci') && (steps.filter.outputs.agent-harness == 'true' || steps.unnamed.outputs.found == 'true') || 'false' }}
      airlock-arm: ${{ github.event_name != 'pull_request' && 'true' || contains(github.event.pull_request.labels.*.name, 'full-ci') && (steps.filter.outputs.airlock-arm == 'true' || steps.unnamed.outputs.found == 'true') || 'false' }}
      go-envoy-held: ${{ github.event_name != 'pull_request' && 'true' || contains(github.event.pull_request.labels.*.name, 'full-ci') && (steps.filter.outputs.go-envoy-held == 'true' || steps.unnamed.outputs.found == 'true') || 'false' }}
      ts: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.ts == 'true' || steps.unnamed.outputs.found == 'true' }}
      pi: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.pi == 'true' || steps.unnamed.outputs.found == 'true' }}
      dispatch-browser: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.dispatch-browser == 'true' || steps.unnamed.outputs.found == 'true' }}
      docs: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.docs == 'true' || steps.unnamed.outputs.found == 'true' }}
      browser-image: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.browser-image == 'true' || steps.unnamed.outputs.found == 'true' }}
      ci-images: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.ci-images == 'true' || steps.unnamed.outputs.found == 'true' }}
      tool-fallback: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.tool-fallback == 'true' || steps.unnamed.outputs.found == 'true' }}
      notices: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.notices == 'true' || steps.unnamed.outputs.found == 'true' }}
      scripts: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.scripts == 'true' || steps.unnamed.outputs.found == 'true' }}
      go-envoy: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.go-envoy == 'true' || steps.unnamed.outputs.found == 'true' }}
      text-checks: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.text-checks == 'true' || steps.unnamed.outputs.found == 'true' }}
      # why: .github/ci-notes/ci.md#the-paths-filters-own-verdict-for-every-filter-before-the-full-ci-term
      filter_verdicts: ${{ github.event_name == 'workflow_dispatch' && '{}' || toJSON(steps.filter.outputs) }}
      # Whether a changed file matches no filter, which selected every job; ci-ok reads it beside
      # filter_verdicts on a merge group.
      unnamed_files: ${{ steps.unnamed.outputs.found }}
      # why: .github/ci-notes/ci.md#why-a-dispatched-run-off-main-reports-under-names-of-its-own
      ref_is_main: ${{ steps.ref.outputs.is_main }}
    steps:
      - if: github.event_name != 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # On a pull request the two steps below read the file list from the API: the filters and
      # what the unnamed-file step runs are the whole checkout they need.
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/ci-areas.yaml
            .github/scripts/unnamed-files.sh
            .github/scripts/gh-read.sh
            .github/scripts/workflow_paths.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # why: .github/ci-notes/ci.md#why-the-filter-step-is-skipped-on-a-dispatched-run
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          predicate-quantifier: some-with-excludes
          filters: .github/ci-areas.yaml
      - name: Select every job when a changed file matches no filter
        id: unnamed
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: .github/scripts/unnamed-files.sh .github/ci-areas.yaml
      # why: .github/ci-notes/ci.md#why-a-dispatched-run-off-main-reports-under-names-of-its-own
      - name: Read whether this run's ref is exactly refs/heads/main
        id: ref
        run: if [ "$GITHUB_REF" = refs/heads/main ]; then echo is_main=true; else echo is_main=false; fi >> "$GITHUB_OUTPUT"

  # Reads the whole tree, so it runs on every non-draft run, also when `changes` failed.
  lint:
    needs: changes
    if: ${{ !cancelled() && !github.event.pull_request.draft && (github.event_name != 'merge_group' || github.run_attempt == '1') }}
    # why: .github/ci-notes/ci.md#why-the-lint-job-holds-each-of-its-scopes
    permissions:
      contents: read
      actions: read
      checks: write
      pull-requests: read
    uses: ./.github/workflows/ci-job-lint.yaml
    with:
      ci-ok-changes: ${{ toJSON(needs.changes) }}
    secrets:
      PRIVATE_NAME_TERMS: ${{ secrets.PRIVATE_NAME_TERMS }}

  # why: .github/ci-notes/ci.md#what-the-ci-images-job-copies-and-why-the-order-is-the-point
  ci-images:
    needs: changes
    if: needs.changes.outputs.ci_images == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    # why: .github/ci-notes/ci.md#why-the-ci-images-job-holds-packages-write
    permissions:
      contents: read
      packages: write
      actions: read
      checks: write
    uses: ./.github/workflows/ci-job-ci-images.yaml
    with:
      ci-ok-changes: ${{ toJSON(needs.changes) }}

  # why: .github/ci-notes/ci.md#the-tool-fallback-proof-what-it-drives-what-it-only-reasons-about-and-how-to-read-it-when-it-is-red
  tool-fallback:
    needs: [changes, ci-images]
    if: ${{ !cancelled() && needs.changes.outputs.tool_fallback == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1') }}
    # why: .github/ci-notes/ci.md#why-the-tool-fallback-job-needs-no-packages-scope
    permissions:
      contents: read
      actions: read
      checks: write
    uses: ./.github/workflows/ci-job-tool-fallback.yaml
    with:
      ci-ok-changes: ${{ toJSON(needs.changes) }}

  # why: .github/ci-notes/ci.md#the-arm64-half-of-the-tool-fallback-proof
  tool-fallback-arm:
    needs: [changes, ci-images]
    if: ${{ !cancelled() && needs.changes.outputs.tool_fallback == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1') }}
    # why: .github/ci-notes/ci.md#why-the-tool-fallback-arm-job-needs-no-other-scope
    permissions:
      contents: read
      actions: read
      checks: write
    uses: ./.github/workflows/ci-job-tool-fallback-arm.yaml
    with:
      ci-ok-changes: ${{ toJSON(needs.changes) }}

  # why: .github/ci-notes/ci.md#the-fail-open-jobs-and-what-they-buy-while-changes-is-broken
  typecheck:
    needs: changes
    if: ${{ !cancelled() && !github.event.pull_request.draft && (github.event_name != 'merge_group' || github.run_attempt == '1') && (needs.changes.result != 'success' || needs.changes.outputs.typecheck == 'true') }}
    permissions:
      contents: read
      actions: read
      checks: write
    uses: ./.github/workflows/ci-job-typecheck.yaml
    with:
      ci-ok-changes: ${{ toJSON(needs.changes) }}


  # why: .github/ci-notes/ci.md#what-the-test-job-runs-and-how-each-harness-step-is-gated
  test:
    needs: changes
    if: ${{ !cancelled() && !github.event.pull_request.draft && (github.event_name != 'merge_group' || github.run_attempt == '1') && (needs.changes.result != 'success' || needs.changes.outputs.test == 'true') }}
    permissions:
      contents: read
      actions: read
      checks: write
    uses: ./.github/workflows/ci-job-test.yaml
    with:
      ci-ok-changes: ${{ toJSON(needs.changes) }}
      changes-result: ${{ needs.changes.result }}
      guide_layout: ${{ needs.changes.outputs.guide_layout }}
      release_push_test: ${{ needs.changes.outputs.release_push_test }}
      release_bump_test: ${{ needs.changes.outputs.release_bump_test }}
      check_bun_version_test: ${{ needs.changes.outputs.check_bun_version_test }}
      check_playwright_version_test: ${{ needs.changes.outputs.check_playwright_version_test }}
      check_bun_workspace_manifests_test: ${{ needs.changes.outputs.check_bun_workspace_manifests_test }}
      check_zod_version_test: ${{ needs.changes.outputs.check_zod_version_test }}
      check_gh_version_test: ${{ needs.changes.outputs.check_gh_version_test }}
      check_gitleaks_version_test: ${{ needs.changes.outputs.check_gitleaks_version_test }}
      workflow_paths_test: ${{ needs.changes.outputs.workflow_paths_test }}
      check_image_trigger_paths_test: ${{ needs.changes.outputs.check_image_trigger_paths_test }}
      check_ci_images_test: ${{ needs.changes.outputs.check_ci_images_test }}
      mirror_ci_images_test: ${{ needs.changes.outputs.mirror_ci_images_test }}
      ci_tools_test: ${{ needs.changes.outputs.ci_tools_test }}
      mirror_ci_tools_test: ${{ needs.changes.outputs.mirror_ci_tools_test }}
      check_ci_tools_test: ${{ needs.changes.outputs.check_ci_tools_test }}
      ci_tools_proof_test: ${{ needs.changes.outputs.ci_tools_proof_test }}
      check_action_pins_test: ${{ needs.changes.outputs.check_action_pins_test }}
      check_workflow_files_test: ${{ needs.changes.outputs.check_workflow_files_test }}
      check_private_names_test: ${{ needs.changes.outputs.check_private_names_test }}
      check_private_names_terms_test: ${{ needs.changes.outputs.check_private_names_terms_test }}
      check_private_names_keys_test: ${{ needs.changes.outputs.check_private_names_keys_test }}
      check_plugin_names_test: ${{ needs.changes.outputs.check_plugin_names_test }}
      check_fireevent_reasons_test: ${{ needs.changes.outputs.check_fireevent_reasons_test }}
      check_daemon_api_contract_test: ${{ needs.changes.outputs.check_daemon_api_contract_test }}
      check_release_credentials_test: ${{ needs.changes.outputs.check_release_credentials_test }}
      repo_paths_test: ${{ needs.changes.outputs.repo_paths_test }}
      go_tagged_tests_test: ${{ needs.changes.outputs.go_tagged_tests_test }}
      ci_ok_test: ${{ needs.changes.outputs.ci_ok_test }}
      ci_ok_report_test: ${{ needs.changes.outputs.ci_ok_report_test }}
      ci_ok_reconcile_test: ${{ needs.changes.outputs.ci_ok_reconcile_test }}
      find_pr_payload_test: ${{ needs.changes.outputs.find_pr_payload_test }}
      merge_group_cancels_test: ${{ needs.changes.outputs.merge_group_cancels_test }}
      main_bypass_check_test: ${{ needs.changes.outputs.main_bypass_check_test }}
      edited_migrations_base_test: ${{ needs.changes.outputs.edited_migrations_base_test }}
      dispatch_browser_latest_blobs_test: ${{ needs.changes.outputs.dispatch_browser_latest_blobs_test }}
      dispatch_browser_run_reads_test: ${{ needs.changes.outputs.dispatch_browser_run_reads_test }}
      dispatch_browser_samples_test: ${{ needs.changes.outputs.dispatch_browser_samples_test }}
      race_memory_test: ${{ needs.changes.outputs.race_memory_test }}
      disk_watch_test: ${{ needs.changes.outputs.disk_watch_test }}
      priorities_seed_check_test: ${{ needs.changes.outputs.priorities_seed_check_test }}
      check_ci_filters_test: ${{ needs.changes.outputs.check_ci_filters_test }}
      check_ts_filters_test: ${{ needs.changes.outputs.check_ts_filters_test }}
      go_test_step_expansion_test: ${{ needs.changes.outputs.go_test_step_expansion_test }}
      check_test_reach_test: ${{ needs.changes.outputs.check_test_reach_test }}
      go_test_test: ${{ needs.changes.outputs.go_test_test }}
      go_test_split_test: ${{ needs.changes.outputs.go_test_split_test }}
      ci_ok_retries_test: ${{ needs.changes.outputs.ci_ok_retries_test }}
      unnamed_files_test: ${{ needs.changes.outputs.unnamed_files_test }}

  # why: .github/ci-notes/ci.md#why-the-daemons-go-suite-is-a-job-of-its-own
  # The daemon's Go suite in three legs: at two, one leg's -run would be about 136 KB of test
  # names, past the 131,072 bytes Linux takes in one argument (.github/actions/go-daemon says how
  # each leg's bounds are read); daemon-go below carries its old check-run name.
  go-daemon:
    needs: changes
    if: ${{ !cancelled() && !github.event.pull_request.draft && (github.event_name != 'merge_group' || github.run_attempt == '1') && (needs.changes.result != 'success' || needs.changes.outputs.go-daemon == 'true') }}
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: daemon-go (1/3), leg: 1, timeout: 28, race: 18m}
          - {name: daemon-go (2/3), leg: 2, timeout: 38, race: 28m}
          - {name: daemon-go (3/3), leg: 3, timeout: 30, race: 18m}
    services:
      postgres:
        # ghcr.io/cybermonklabs/legion/ci, the copy of pgvector/pgvector (.github/ci-images.yaml)
        image: ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env: {POSTGRES_PASSWORD: ci}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -h 127.0.0.1 -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      # LEGION_TEST_UV, which a step of the same action would write for no step the search reads.
      - uses: ./.github/actions/install-uv
      - name: daemon-go
        uses: ./.github/actions/go-daemon
        with:
          leg: ${{ matrix.leg }}
          legs: 3
          race-timeout: ${{ matrix.race }}
      - if: always()
        uses: ./.github/actions/ci-ok-report
        with:
          changes: ${{ toJSON(needs.changes) }}
          job-status: ${{ job.status }}

  # A job split into legs keeps its old check-run name on a job of its own, which needs the legs'
  # job, runs under their gate and passes only when each of its own legs' newest record passed
  # (.github/scripts/leg-verdict.sh): a failure in another suite's leg leaves it passing.
  daemon-go:
    name: ${{ 'daemon-go / daemon-go' }}
    needs: [changes, go-daemon]
    if: ${{ !cancelled() && !github.event.pull_request.draft && (github.event_name != 'merge_group' || github.run_attempt == '1') && (needs.changes.result != 'success' || needs.changes.outputs.go-daemon == 'true') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {sparse-checkout: .github, persist-credentials: false}
      - env: {GH_TOKEN: '${{ github.token }}'}
        run: .github/scripts/leg-verdict.sh 'daemon-go (1/3)' 'daemon-go (2/3)' 'daemon-go (3/3)'
      - if: always()
        uses: ./.github/actions/ci-ok-report
        with:
          changes: ${{ toJSON(needs.changes) }}
          job-status: ${{ job.status }}

  # why: .github/ci-notes/ci.md#why-the-three-plugin-pack-tests-are-a-job-of-their-own
  plugin-pack:
    needs: changes
    if: ${{ !cancelled() && !github.event.pull_request.draft && (github.event_name != 'merge_group' || github.run_attempt == '1') && (needs.changes.result != 'success' || needs.changes.outputs.plugin-pack == 'true') }}
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy: {fail-fast: false, matrix: {name: [plugin-pack / plugin-pack]}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: plugin-pack
        uses: ./.github/actions/plugin-pack
      - if: always()
        uses: ./.github/actions/ci-ok-report
        with:
          changes: ${{ toJSON(needs.changes) }}
          job-status: ${{ job.status }}

  # why: .github/ci-notes/ci.md#why-the-daemons-whole-daemon-live-tests-are-a-job-of-their-own
  daemon-live:
    needs: changes
    if: needs.changes.outputs.daemon-live == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy: {fail-fast: false, matrix: {name: [daemon-live / daemon-live]}}
    services:
      postgres:
        image: ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env: {POSTGRES_PASSWORD: ci}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -h 127.0.0.1 -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: daemon-live
        uses: ./.github/actions/daemon-live
      - if: always()
        uses: ./.github/actions/ci-ok-report
        with:
          changes: ${{ toJSON(needs.changes) }}
          job-status: ${{ job.status }}

  # why: .github/ci-notes/ci.md#the-agent-harness-job-and-its-parts
  agent-harness:
    needs: changes
    if: needs.changes.outputs.agent_harness == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    permissions:
      contents: read
      actions: read
      checks: write
    uses: ./.github/workflows/ci-job-agent-harness.yaml
    with:
      ci-ok-changes: ${{ toJSON(needs.changes) }}

  # why: .github/ci-notes/ci.md#the-kind-rig-job-its-parts-and-the-image-it-tests
  kind:
    needs: [changes, ci-images, worker-image]
    if: ${{ !cancelled() && needs.changes.outputs.kind == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1') }}
    permissions:
      contents: read
      actions: read
      checks: write
    uses: ./.github/workflows/ci-job-kind.yaml
    with:
      ci-ok-changes: ${{ toJSON(needs.changes) }}
      worker-image: ${{ needs.worker-image.outputs.ref }}

  # why: .github/ci-notes/ci.md#the-private-names-port-job-and-the-closure-it-took-off-the-test-filter
  private-names-port:
    needs: changes
    if: ${{ !cancelled() && !github.event.pull_request.draft && (github.event_name != 'merge_group' || github.run_attempt == '1') && (needs.changes.result != 'success' || needs.changes.outputs.private_names_port == 'true') }}
    permissions:
      contents: read
      actions: read
      checks: write
    uses: ./.github/workflows/ci-job-private-names-port.yaml
    with:
      ci-ok-changes: ${{ toJSON(needs.changes) }}

  # why: .github/ci-notes/ci.md#what-the-docs-job-builds-and-why-it-declares-no-timeout-minutes
  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    # why: .github/ci-notes/ci.md#why-the-docs-job-declares-the-scopes-the-called-workflow-needs
    permissions:
      contents: read
      actions: read
      checks: write
    uses: ./.github/workflows/docs-site.yaml
    with:
      ci-ok-changes: ${{ toJSON(needs.changes) }}
    secrets:
      PRIVATE_NAME_TERMS: ${{ secrets.PRIVATE_NAME_TERMS }}

  contracts:
    needs: changes
    if: needs.changes.outputs.contracts == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    permissions:
      contents: read
      actions: read
      checks: write
    uses: ./.github/workflows/ci-job-contracts.yaml
    with:
      ci-ok-changes: ${{ toJSON(needs.changes) }}

  # The shared test fixtures package has no build: nothing imports it at run time, and its
  # consumers read its sources through the workspace.
  test-fixtures:
    needs: changes
    if: needs.changes.outputs.test_fixtures == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    permissions:
      contents: read
      actions: read
      checks: write
    uses: ./.github/workflows/ci-job-test-fixtures.yaml
    with:
      ci-ok-changes: ${{ toJSON(needs.changes) }}

  conflicts-script:
    needs: changes
    if: needs.changes.outputs.conflicts_script == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    permissions:
      contents: read
      actions: read
      checks: write
    uses: ./.github/workflows/ci-job-conflicts-script.yaml
    with:
      ci-ok-changes: ${{ toJSON(needs.changes) }}

  # why: .github/ci-notes/ci.md#why-the-session-message-wait-suite-carries-a-database-of-its-own
  sessions-script:
    needs: changes
    if: ${{ !cancelled() && !github.event.pull_request.draft && (github.event_name != 'merge_group' || github.run_attempt == '1') && (needs.changes.result != 'success' || needs.changes.outputs.sessions_script == 'true') }}
    permissions:
      contents: read
      actions: read
      checks: write
    uses: ./.github/workflows/ci-job-sessions-script.yaml
    with:
      ci-ok-changes: ${{ toJSON(needs.changes) }}

  # The secrets broker's TypeScript client, which packages/envoy-client's broker credential
  # imports. It has no build: its consumers read its sources through the workspace.
  broker-client:
    needs: changes
    if: needs.changes.outputs.broker_client == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    permissions:
      contents: read
      actions: read
      checks: write
    uses: ./.github/workflows/ci-job-broker-client.yaml
    with:
      ci-ok-changes: ${{ toJSON(needs.changes) }}

  envoy-client:
    needs: changes
    if: needs.changes.outputs.envoy_client == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    permissions:
      contents: read
      actions: read
      checks: write
    uses: ./.github/workflows/ci-job-envoy-client.yaml
    with:
      ci-ok-changes: ${{ toJSON(needs.changes) }}

  pi-shared:
    needs: changes
    if: needs.changes.outputs.pi_shared == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    permissions:
      contents: read
      actions: read
      checks: write
    uses: ./.github/workflows/ci-job-pi-shared.yaml
    with:
      ci-ok-changes: ${{ toJSON(needs.changes) }}

  pi-envoy:
    needs: changes
    if: needs.changes.outputs.pi_envoy == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    permissions:
      contents: read
      actions: read
      checks: write
    uses: ./.github/workflows/ci-job-pi-envoy.yaml
    with:
      ci-ok-changes: ${{ toJSON(needs.changes) }}

  pi-legion:
    needs: changes
    if: needs.changes.outputs.pi_legion == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    permissions:
      contents: read
      actions: read
      checks: write
    uses: ./.github/workflows/ci-job-pi-legion.yaml
    with:
      ci-ok-changes: ${{ toJSON(needs.changes) }}

  # why: .github/ci-notes/ci.md#the-dashboards-and-the-proof-editors-lint-typecheck-unit-tests-build-and
  dispatch-ui:
    needs: changes
    if: needs.changes.outputs.dispatch_ui == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    permissions:
      contents: read
      actions: read
      checks: write
    uses: ./.github/workflows/ci-job-dispatch-ui.yaml
    with:
      ci-ok-changes: ${{ toJSON(needs.changes) }}

  # why: .github/ci-notes/ci.md#the-browser-suite-job-its-lanes-its-one-input-and-why-the-matrix-is-in-the-called-file
  dispatch-browser:
    needs: changes
    if: needs.changes.outputs.dispatch_browser == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    # why: .github/ci-notes/ci.md#why-the-dispatch-browser-job-declares-the-scopes-the-called-workflow-needs
    permissions:
      contents: read
      actions: read
      checks: write
    uses: ./.github/workflows/dispatch-browser.yaml
    with:
      # why: .github/ci-notes/ci.md#what-the-lane-input-reads
      lane: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && 'full' || 'pull-request' }}
      ci-ok-changes: ${{ toJSON(needs.changes) }}

  claude-envoy:
    needs: changes
    if: needs.changes.outputs.claude_envoy == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    permissions:
      contents: read
      actions: read
      checks: write
    uses: ./.github/workflows/ci-job-claude-envoy.yaml
    with:
      ci-ok-changes: ${{ toJSON(needs.changes) }}
    secrets:
      PRIVATE_NAME_TERMS: ${{ secrets.PRIVATE_NAME_TERMS }}

  # why: .github/ci-notes/ci.md#envoy-gos-fast-half-the-go-format-check-the-two-generated-code-checks-the
  # envoy's suites a pull request runs whenever its filter selects them, a leg each named with its
  # old job's check-run name; .github/actions/go-envoy/<leg> holds the leg's steps.
  go-envoy:
    needs: changes
    if: needs.changes.outputs.go-envoy == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    name: ${{ format('{0} / {0}', matrix.leg) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {leg: envoy-go-checks, runner: ubuntu-24.04, timeout: 40}
          - {leg: envoy-infra-go, runner: ubuntu-24.04-arm, timeout: 32}
          - {leg: airlock-lean, runner: ubuntu-24.04-arm, timeout: 45}
          - {leg: envoy-session-stall, runner: ubuntu-24.04, timeout: 30, pg: true}
          - {leg: envoy-e2e-local, runner: ubuntu-24.04-arm, timeout: 30}
          - {leg: broker-multiprocess, runner: ubuntu-24.04-arm, timeout: 30, pg: true}
          - {leg: listener-server-change, runner: ubuntu-24.04-arm, timeout: 30}
    services:
      postgres:
        image: ${{ matrix.pg && 'ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11' || '' }}
        env: {POSTGRES_PASSWORD: ci}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: envoy-go-checks
        if: matrix.leg == 'envoy-go-checks'
        uses: ./.github/actions/go-envoy/envoy-go-checks
        with: {migration-base: '${{ inputs.migration-base }}'}
      - name: envoy-infra-go
        if: matrix.leg == 'envoy-infra-go'
        uses: ./.github/actions/go-envoy/envoy-infra-go
      - name: airlock-lean
        if: matrix.leg == 'airlock-lean'
        uses: ./.github/actions/go-envoy/airlock-lean
      - name: envoy-session-stall
        if: matrix.leg == 'envoy-session-stall'
        uses: ./.github/actions/go-envoy/envoy-session-stall
        with: {postgres: '${{ job.services.postgres.id }}'}
      - name: envoy-e2e-local
        if: matrix.leg == 'envoy-e2e-local'
        uses: ./.github/actions/go-envoy/envoy-e2e-local
      - name: broker-multiprocess
        if: matrix.leg == 'broker-multiprocess'
        uses: ./.github/actions/go-envoy/broker-multiprocess
      - name: listener-server-change
        if: matrix.leg == 'listener-server-change'
        uses: ./.github/actions/go-envoy/listener-server-change
      - if: always()
        uses: ./.github/actions/ci-ok-report
        with:
          changes: ${{ toJSON(needs.changes) }}
          job-status: ${{ job.status }}

  # why: .github/ci-notes/ci.md#the-twelve-slow-suites-whose-runner-time-dwarfs-every-other-jobs-the
  # The suites held to the merge queue and to full-ci, a leg each; the jobs after it carry the five
  # split ones' old names. dispatch-two-builds-same, a merge group's alone, takes the defaults: an
  # include entry would add back what the exclude takes out (.github/actions/go-envoy-held/<leg>).
  go-envoy-held:
    needs: changes
    if: needs.changes.outputs.go-envoy-held == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    name: ${{ matrix.name || 'dispatch-two-builds / dispatch-two-builds-same' }}
    runs-on: ${{ matrix.runner || 'ubuntu-24.04' }}
    timeout-minutes: ${{ matrix.timeout || 45 }}
    strategy:
      fail-fast: false
      matrix:
        leg: [envoy-go-1, envoy-go-2, envoy-go-3, envoy-go-race, envoy-go-race-api-1, envoy-go-race-api-2, envoy-go-claim-model, envoy-go-race-docs-1, envoy-go-race-docs-2, envoy-go-docs-finalizers, dispatch-memory-1, dispatch-memory-2, dispatch-multiprocess, dispatch-two-builds, dispatch-two-builds-same, envoy-smoke]
        exclude:
          - leg: ${{ github.event_name != 'merge_group' && 'dispatch-two-builds-same' || '' }}
        include:
          - {leg: envoy-go-1, suite: envoy-go, part: 1, name: envoy-go (1/3), runner: ubuntu-24.04-arm, timeout: 39}
          - {leg: envoy-go-2, suite: envoy-go, part: 2, rest: true, name: envoy-go (2/3), runner: ubuntu-24.04-arm, timeout: 40}
          - {leg: envoy-go-3, suite: envoy-go, part: 3, name: envoy-go (3/3), runner: ubuntu-24.04-arm, timeout: 26}
          - {leg: envoy-go-race, name: envoy-go-race / envoy-go-race, runner: ubuntu-24.04-arm, timeout: 45}
          - {leg: envoy-go-race-api-1, suite: envoy-go-race-api, part: 1, name: envoy-go-race-api (1/2), runner: ubuntu-24.04-arm, timeout: 30}
          - {leg: envoy-go-race-api-2, suite: envoy-go-race-api, part: 2, name: envoy-go-race-api (2/2), runner: ubuntu-24.04-arm, timeout: 30}
          - {leg: envoy-go-claim-model, name: envoy-go-claim-model / envoy-go-claim-model, timeout: 50}
          - {leg: envoy-go-race-docs-1, suite: envoy-go-race-docs, part: 1, name: envoy-go-race-docs (1/2), runner: ubuntu-24.04-arm, timeout: 27, go: 24m}
          - {leg: envoy-go-race-docs-2, suite: envoy-go-race-docs, part: 2, name: envoy-go-race-docs (2/2), runner: ubuntu-24.04-arm, timeout: 31, go: 28m}
          - {leg: envoy-go-docs-finalizers, name: envoy-go-docs-finalizers / envoy-go-docs-finalizers, runner: ubuntu-24.04-arm, timeout: 55}
          - {leg: dispatch-memory-1, suite: dispatch-memory, part: 1, name: dispatch-memory (1/2), runner: ubuntu-24.04-arm, timeout: 32, go: 28m}
          - {leg: dispatch-memory-2, suite: dispatch-memory, part: 2, name: dispatch-memory (2/2), runner: ubuntu-24.04-arm, timeout: 38, go: 34m}
          - {leg: dispatch-multiprocess, name: dispatch-multiprocess / dispatch-multiprocess, runner: ubuntu-24.04-arm, timeout: 35}
          - {leg: dispatch-two-builds, name: dispatch-two-builds / dispatch-two-builds}
          - {leg: envoy-smoke, name: envoy-smoke / envoy-smoke, timeout: 20}
    services:
      postgres:
        image: ${{ matrix.leg != 'envoy-smoke' && 'ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11' || '' }}
        env: {POSTGRES_PASSWORD: ci}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DISPATCH_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      BROKER_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      LEGION_TEST_PG_DSN: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - if: ${{ !startsWith(matrix.leg, 'dispatch-two-builds') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      # The two-build legs' whole history, 2 minutes an attempt and a second after a first that did
      # not succeed (.github/actions/go-envoy-held/dispatch-two-builds says why).
      - id: checkout
        if: startsWith(matrix.leg, 'dispatch-two-builds')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        continue-on-error: true
        with: {persist-credentials: false, fetch-depth: 0}
      - name: End the git processes and the workspace a first attempt cut at its budget leaves
        if: startsWith(matrix.leg, 'dispatch-two-builds') && steps.checkout.outcome != 'success'
        timeout-minutes: 2
        run: |
          pgrep -a git || true
          pkill -KILL -x git || true
          pkill -KILL -f git-remote-http || true
          while pgrep -x git > /dev/null || pgrep -f git-remote-http > /dev/null; do sleep 1; done
          pgrep -a git || echo "no git process is left"
          find "$GITHUB_WORKSPACE" -mindepth 1 -delete
      - name: Check out again, after a first attempt that did not complete
        if: startsWith(matrix.leg, 'dispatch-two-builds') && steps.checkout.outcome != 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with: {persist-credentials: false, fetch-depth: 0}
      - name: envoy-go
        if: matrix.suite == 'envoy-go'
        uses: ./.github/actions/go-envoy-held/envoy-go
        with:
          part: ${{ matrix.part }}
          legs: 3
          rest: ${{ matrix.rest }}
          postgres: ${{ job.services.postgres.id }}
      # The broker's database-backed packages' skip count, this leg's share, a step of this file to
      # keep its 30-minute bound (packages/envoy/scripts/database-skips.sh says what it refuses).
      - name: Count the database broker suites' skips
        if: matrix.suite == 'envoy-go'
        timeout-minutes: 30
        working-directory: packages/envoy
        env: {LEG: '${{ matrix.part }}'}
        run: scripts/database-skips.sh --timeout 15m --skip '^(TestSettingsNameTheGoogleExchangeAudienceOnEitherStore)$' --run "$(../../.github/scripts/go-test-split.sh "$LEG" 3 ./internal/cipher/... ./cmd/cipherd/)" --jsonfile "go-envoy-held-envoy-go-$LEG-database-skips.json"
      - if: always() && matrix.suite == 'envoy-go'
        uses: ./.github/actions/go-test-upload
        with: {name: 'go-envoy-held-envoy-go-${{ matrix.part }}-database-skips'}
      # Each Pair of TestStatementTimings, on the database cmd/dispatch-seed fills, one package at a
      # time after every Postgres-backed step of the leg (ci_job_reads.py's STATEMENT_TIMING_*).
      - name: Time the statements on the seeded measurement database
        if: matrix.rest
        timeout-minutes: 15
        working-directory: packages/envoy
        env: {DISPATCH_BENCH_DATABASE_URL: 'postgres://postgres:ci@localhost:5432/dispatch_bench?sslmode=disable'}
        run: |
          docker exec "${{ job.services.postgres.id }}" createdb -U postgres dispatch_bench
          go run ./cmd/dispatch-seed --database-url "$DISPATCH_BENCH_DATABASE_URL" --scale 0.01
          ../../.github/scripts/go-test.sh --jsonfile go-envoy-held-envoy-go-timings-docs.json --packages ./internal/dispatch/docs/ -- -count=1 -timeout 5m -run '^(TestStatementTimings)$'
          ../../.github/scripts/go-test.sh --jsonfile go-envoy-held-envoy-go-timings-refs.json --packages ./internal/dispatch/refs/ -- -count=1 -timeout 5m -run '^(TestStatementTimings)$'
      - if: always() && matrix.rest
        uses: ./.github/actions/go-test-upload
        with: {name: go-envoy-held-envoy-go-timings}
      - name: envoy-go-race
        if: matrix.leg == 'envoy-go-race'
        uses: ./.github/actions/go-envoy-held/envoy-go-race
        with: {postgres: '${{ job.services.postgres.id }}'}
      - name: envoy-go-race-api
        if: matrix.suite == 'envoy-go-race-api'
        uses: ./.github/actions/go-envoy-held/envoy-go-race-api
        with: {part: '${{ matrix.part }}', legs: 2, postgres: '${{ job.services.postgres.id }}'}
      - name: envoy-go-claim-model
        if: matrix.leg == 'envoy-go-claim-model'
        uses: ./.github/actions/go-envoy-held/envoy-go-claim-model
      - name: envoy-go-race-docs
        if: matrix.suite == 'envoy-go-race-docs'
        uses: ./.github/actions/go-envoy-held/envoy-go-race-docs
        with: {part: '${{ matrix.part }}', legs: 2, go-timeout: '${{ matrix.go }}', postgres: '${{ job.services.postgres.id }}'}
      - name: envoy-go-docs-finalizers
        if: matrix.leg == 'envoy-go-docs-finalizers'
        uses: ./.github/actions/go-envoy-held/envoy-go-docs-finalizers
        with: {postgres: '${{ job.services.postgres.id }}'}
      - name: dispatch-memory
        if: matrix.suite == 'dispatch-memory'
        uses: ./.github/actions/go-envoy-held/dispatch-memory
        with: {part: '${{ matrix.part }}', legs: 2, go-timeout: '${{ matrix.go }}', postgres: '${{ job.services.postgres.id }}'}
      - name: dispatch-multiprocess
        if: matrix.leg == 'dispatch-multiprocess'
        uses: ./.github/actions/go-envoy-held/dispatch-multiprocess
        with: {postgres: '${{ job.services.postgres.id }}'}
      - name: dispatch-two-builds
        if: matrix.leg == 'dispatch-two-builds'
        uses: ./.github/actions/go-envoy-held/dispatch-two-builds
        with: {postgres: '${{ job.services.postgres.id }}'}
      - name: dispatch-two-builds-same
        if: matrix.leg == 'dispatch-two-builds-same'
        uses: ./.github/actions/go-envoy-held/dispatch-two-builds-same
        with: {postgres: '${{ job.services.postgres.id }}'}
      - name: envoy-smoke
        if: matrix.leg == 'envoy-smoke'
        uses: ./.github/actions/go-envoy-held/envoy-smoke
      - if: always()
        uses: ./.github/actions/ci-ok-report
        with:
          changes: ${{ toJSON(needs.changes) }}
          job-status: ${{ job.status }}

  # The old check-run names of go-envoy-held's split suites, as daemon-go carries go-daemon's.
  envoy-go:
    name: ${{ 'envoy-go / envoy-go' }}
    needs: [changes, go-envoy-held]
    if: ${{ !cancelled() && needs.changes.outputs.go-envoy-held == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {sparse-checkout: .github, persist-credentials: false}
      - env: {GH_TOKEN: '${{ github.token }}'}
        run: .github/scripts/leg-verdict.sh 'envoy-go (1/3)' 'envoy-go (2/3)' 'envoy-go (3/3)'
      - if: always()
        uses: ./.github/actions/ci-ok-report
        with:
          changes: ${{ toJSON(needs.changes) }}
          job-status: ${{ job.status }}

  envoy-go-race-api:
    name: ${{ 'envoy-go-race-api / envoy-go-race-api' }}
    needs: [changes, go-envoy-held]
    if: ${{ !cancelled() && needs.changes.outputs.go-envoy-held == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {sparse-checkout: .github, persist-credentials: false}
      - env: {GH_TOKEN: '${{ github.token }}'}
        run: .github/scripts/leg-verdict.sh 'envoy-go-race-api (1/2)' 'envoy-go-race-api (2/2)'
      - if: always()
        uses: ./.github/actions/ci-ok-report
        with:
          changes: ${{ toJSON(needs.changes) }}
          job-status: ${{ job.status }}

  envoy-go-race-docs:
    name: ${{ 'envoy-go-race-docs / envoy-go-race-docs' }}
    needs: [changes, go-envoy-held]
    if: ${{ !cancelled() && needs.changes.outputs.go-envoy-held == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {sparse-checkout: .github, persist-credentials: false}
      - env: {GH_TOKEN: '${{ github.token }}'}
        run: .github/scripts/leg-verdict.sh 'envoy-go-race-docs (1/2)' 'envoy-go-race-docs (2/2)'
      - if: always()
        uses: ./.github/actions/ci-ok-report
        with:
          changes: ${{ toJSON(needs.changes) }}
          job-status: ${{ job.status }}

  dispatch-memory:
    name: ${{ 'dispatch-memory / dispatch-memory' }}
    needs: [changes, go-envoy-held]
    if: ${{ !cancelled() && needs.changes.outputs.go-envoy-held == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {sparse-checkout: .github, persist-credentials: false}
      - env: {GH_TOKEN: '${{ github.token }}'}
        run: .github/scripts/leg-verdict.sh 'dispatch-memory (1/2)' 'dispatch-memory (2/2)'
      - if: always()
        uses: ./.github/actions/ci-ok-report
        with:
          changes: ${{ toJSON(needs.changes) }}
          job-status: ${{ job.status }}

  # The airlock's check k9 and its lease test (.github/actions/airlock-arm), held as the slow suites
  # are, on arm64 as broker-multiprocess ran them, under the 70 minutes that job held them to.
  airlock-arm:
    needs: changes
    if: needs.changes.outputs.airlock-arm == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 70
    strategy: {fail-fast: false, matrix: {name: [airlock-arm / airlock-arm]}}
    services:
      postgres:
        image: ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env: {POSTGRES_PASSWORD: ci}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: airlock-arm
        uses: ./.github/actions/airlock-arm
      - if: always()
        uses: ./.github/actions/ci-ok-report
        with:
          changes: ${{ toJSON(needs.changes) }}
          job-status: ${{ job.status }}

  # why: .github/ci-notes/ci.md#the-checks-whose-subject-is-text-each-modules-internaltextcheck-package-the-dispatch
  text-checks:
    needs: changes
    if: ${{ !cancelled() && !github.event.pull_request.draft && (github.event_name != 'merge_group' || github.run_attempt == '1') && (needs.changes.result != 'success' || needs.changes.outputs.text-checks == 'true') }}
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    strategy: {fail-fast: false, matrix: {name: [text-checks / text-checks]}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: text-checks
        uses: ./.github/actions/text-checks
      - if: always()
        uses: ./.github/actions/ci-ok-report
        with:
          changes: ${{ toJSON(needs.changes) }}
          job-status: ${{ job.status }}

  # The third-party notices of every Go release archive (.github/actions/notices), lint's step until
  # it took a filter of its own: the modules the release builds load, the target lists, its script.
  notices:
    needs: changes
    if: ${{ !cancelled() && !github.event.pull_request.draft && (github.event_name != 'merge_group' || github.run_attempt == '1') && (needs.changes.result != 'success' || needs.changes.outputs.notices == 'true') }}
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy: {fail-fast: false, matrix: {name: [notices / notices]}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: notices
        uses: ./.github/actions/notices
      - if: always()
        uses: ./.github/actions/ci-ok-report
        with:
          changes: ${{ toJSON(needs.changes) }}
          job-status: ${{ job.status }}

  # why: .github/ci-notes/ci.md#what-the-ci-filters-job-holds-every-filter-and-every-workflow-file-to
  ci-filters:
    needs: changes
    if: needs.changes.outputs.ci_filters == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    permissions:
      contents: read
      actions: read
      checks: write
    uses: ./.github/workflows/ci-job-ci-filters.yaml
    with:
      ci-ok-changes: ${{ toJSON(needs.changes) }}

  # why: .github/ci-notes/ci.md#what-the-proof-editors-offline-proof-shows
  proof-sdk-offline:
    needs: changes
    if: needs.changes.outputs.proof_sdk_offline == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    permissions:
      contents: read
      actions: read
      checks: write
    uses: ./.github/workflows/ci-job-proof-sdk-offline.yaml
    with:
      ci-ok-changes: ${{ toJSON(needs.changes) }}

  # The worker image's pull-request build: worker-image.yaml builds the head and publishes its
  # sha- tag only. Main's image builds are release.yaml's call of the same workflow.
  worker-image:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.worker_image == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    uses: ./.github/workflows/worker-image.yaml
    # why: .github/ci-notes/ci.md#why-the-worker-image-job-grants-every-scope-the-called-workflow-declares
    permissions:
      contents: read
      packages: write
      actions: read
      checks: write
      id-token: write
      attestations: write
    with:
      ci-ok-changes: ${{ toJSON(needs.changes) }}

  # why: .github/ci-notes/ci.md#why-the-browser-images-build-runs-on-a-merge-group-too
  browser-image:
    needs: changes
    if: needs.changes.outputs.browser_image == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    uses: ./.github/workflows/browser-image.yaml
    # why: .github/ci-notes/ci.md#why-the-browser-image-job-grants-every-scope-the-called-workflow-declares
    permissions:
      contents: read
      packages: write
      actions: read
      checks: write
      id-token: write
      attestations: write
    with:
      ci-ok-changes: ${{ toJSON(needs.changes) }}

  # why: .github/ci-notes/ci.md#the-pr-title-job-what-it-checks-and-why-it-posts-nothing
  pr-title:
    # why: .github/ci-notes/ci.md#why-a-dispatched-run-off-main-reports-under-names-of-its-own
    name: ${{ github.event_name == 'workflow_dispatch' && 'pr-title (dispatch)' || 'pr-title' }}
    if: ${{ !github.event.pull_request.draft && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
    # arm64, as .github/ci-notes/ci.md#why-changes-pr-title-cancel-started-and-ci-ok-run-on-arm64 says.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    # why: .github/ci-notes/ci.md#what-the-pr-title-jobs-scopes-are-for
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      # why: .github/ci-notes/ci.md#why-pr-title-refuses-a-re-run-attempt-in-a-step-of-its-own
      - name: Refuse a re-run attempt of a merge-group run
        if: ${{ github.event_name == 'merge_group' && github.run_attempt != '1' }}
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          echo "::error::pr-title is failure on attempt $RUN_ATTEMPT of this merge-group run, whatever the pull request's text says: a merge group is tested once, the queue builds a new group rather than re-running one, and this attempt checks a tree the queue is no longer waiting on."
          exit 1

      # The job reads nothing of the tree but find-pr-payload.sh, check-pr-text.sh and the
      # check-private-names.sh that one runs, so the .github cone is the whole checkout it needs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
          persist-credentials: false

      # why: .github/ci-notes/ci.md#what-the-pr-title-check-step-maps-and-how-it-runs-its-scripts
      - name: Check the pull request's title, body, branch name, commits, comments and reviews
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVATE_NAME_TERMS: ${{ secrets.PRIVATE_NAME_TERMS }}
        run: |
          payload=$("$GITHUB_WORKSPACE/.github/scripts/find-pr-payload.sh")
          GITHUB_EVENT_PATH="$payload" "$GITHUB_WORKSPACE/.github/scripts/check-pr-text.sh"

  # why: .github/ci-notes/ci.md#the-merge-queues-cancel-act-mains-queue-builds-each-group-on-top
  cancel-started:
    if: ${{ github.event_name == 'merge_group' && github.run_attempt == '1' }}
    # arm64, as .github/ci-notes/ci.md#why-changes-pr-title-cancel-started-and-ci-ok-run-on-arm64 says.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      # The job reads nothing of the tree but .github/scripts/cancel-started-act.sh and the
      # merge-group-cancels.sh it runs, so the .github cone is the whole checkout it needs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: .github/scripts/cancel-started-act.sh

  # why: .github/ci-notes/ci.md#the-verdict-and-one-of-the-two-checks-mains-ruleset-requires-of
  ci-ok:
    # why: .github/ci-notes/ci.md#why-a-dispatched-run-off-main-reports-under-names-of-its-own
    name: ${{ github.event_name == 'workflow_dispatch' && needs.changes.outputs.ref_is_main != 'true' && 'ci-ok (dispatch)' || 'ci-ok' }}
    needs:
      - changes
      - lint
      - ci-images
      - tool-fallback
      - tool-fallback-arm
      - typecheck
      - test
      - go-daemon
      - daemon-go
      - plugin-pack
      - daemon-live
      - agent-harness
      - kind
      - private-names-port
      - docs
      - contracts
      - test-fixtures
      - conflicts-script
      - sessions-script
      - broker-client
      - envoy-client
      - pi-shared
      - pi-envoy
      - pi-legion
      - dispatch-ui
      - dispatch-browser
      - claude-envoy
      - go-envoy
      - go-envoy-held
      - envoy-go
      - envoy-go-race-api
      - envoy-go-race-docs
      - dispatch-memory
      - airlock-arm
      - text-checks
      - notices
      - ci-filters
      - proof-sdk-offline
      - worker-image
      - browser-image
    if: ${{ always() }}
    # arm64, as .github/ci-notes/ci.md#why-changes-pr-title-cancel-started-and-ci-ok-run-on-arm64 says.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      checks: write
    steps:
      # why: .github/ci-notes/ci.md#the-job-reads-nothing-of-the-tree-but-ci-oksh-ci-okjq-ci-ok-reconcilesh-and
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
          persist-credentials: false

      # why: .github/ci-notes/ci.md#why-a-draft-pull-request-is-refused-in-a-step
      - name: Refuse a draft pull request
        if: ${{ github.event.pull_request.draft }}
        run: |
          echo "::error::ci-ok is failure because this pull request is a draft: every other job of this run skipped, so nothing in it has been tested. Mark the pull request ready for review: that starts a run which selects by the same diff and concludes a real verdict over it."
          exit 1

      # why: .github/ci-notes/ci.md#why-a-re-run-attempt-of-a-merge-group-run-is-refused-in-a-step
      - name: Refuse a re-run attempt of a merge-group run
        if: ${{ github.event_name == 'merge_group' && github.run_attempt != '1' }}
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          echo "::error::ci-ok is failure on attempt $RUN_ATTEMPT of this merge-group run, whatever the jobs of it did: a merge group is tested once, the queue builds a new group rather than re-running one, and this attempt judges a tree the queue is no longer waiting on."
          exit 1

      # Each Go step's gotestsum jsonfile and rerun report (.github/scripts/go-test.sh), uploaded as
      # a go-test-* artifact, read for the summary: each test that passed only on its retry and each
      # package that failed with no test failing. A run whose Go jobs all skipped uploads none, and
      # the step below says so; the report decides nothing of the verdict.
      - name: Download the Go steps' gotestsum jsonfiles
        if: ${{ always() }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: go-test-*
          path: ${{ runner.temp }}/go-test-reports
          merge-multiple: true
      - name: Name each Go test that passed only on its retry
        if: ${{ always() }}
        run: |
          mkdir -p "$RUNNER_TEMP/go-test-reports"
          .github/scripts/ci-ok-retries.sh "$RUNNER_TEMP/go-test-reports"

      # why: .github/ci-notes/ci.md#needs-is-tojsonneeds-changes-result-and-outputs-with-every-other-jobs-result
      - name: Judge every job of this run
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
          SELECTED_BY: ${{ env.CI_OK_SELECTED_BY }}
          PULL_REQUEST_ONLY: ${{ env.CI_OK_PULL_REQUEST_ONLY }}
          ALWAYS_RUN: ${{ env.CI_OK_ALWAYS_RUN }}
          CHECK_RUN_JOBS: ${{ env.CI_OK_CHECK_RUN_JOBS }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: .github/scripts/ci-ok.sh

      # why: .github/ci-notes/ci.md#why-every-other-ci-ok-on-this-head-is-set-to-this-jobs-conclusion
      - name: Set every other ci-ok on this head to this job's conclusion
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || needs.changes.outputs.ref_is_main == 'true') }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CHECK_RUN_ID: ${{ job.check_run_id }}
          CONCLUSION: ${{ job.status }}
        run: .github/scripts/ci-ok-reconcile.sh
