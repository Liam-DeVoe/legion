name: CI

# A job joins: an area in .github/ci-areas.yaml, the changes output of its name, a job or leg here
# whose name: is an expression of its check-run name, its steps in .github/actions/<job>, and a
# place in ci-ok's needs; CI_OK_SELECTED_BY maps it where its output is not its own id.
# why: .github/ci-notes/ci.md#the-router-every-check-a-pull-request-or-the-merge-queue-runs

# why: .github/ci-notes/ci.md#why-the-router-runs-on-these-events-and-no-others
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      # why: .github/ci-notes/ci.md#the-migration-base-input
      migration-base:
        description: >-
          The commit main pointed at before the push this run tests. A run on main must name it;
          a run on another branch that names none compares with the branch's merge base with main.
        type: string
        required: false
      # why: .github/ci-notes/ci.md#the-kind-and-agent-harness-input
      kind-and-agent-harness:
        description: Run kind and agent-harness too, which a dispatched run leaves out otherwise.
        type: boolean
        required: false
        default: false

# why: .github/ci-notes/ci.md#what-a-newer-push-cancels-and-what-is-never-cancelled
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# why: .github/ci-notes/ci.md#why-the-routers-permissions-block-holds-those-two-scopes
permissions:
  contents: read
  actions: read
  checks: write

env:
  # why: .github/ci-notes/ci.md#the-go-jobs-module-proxy
  GOPROXY: https://proxy.golang.org|direct
  # why: .github/ci-notes/ci.md#what-ci_ok_selected_by-holds-and-which-programs-read-it
  CI_OK_SELECTED_BY: '{"daemon-go": "go-daemon", "claude-envoy-names": "pi", "kind-image": "kind", "envoy-go": "go-envoy-held", "envoy-go-race-api": "go-envoy-held", "envoy-go-race-docs": "go-envoy-held", "dispatch-memory": "go-envoy-held"}'
  CI_OK_PULL_REQUEST_ONLY: '["worker-image"]'
  # why: .github/ci-notes/ci.md#the-jobs-that-run-on-every-change
  CI_OK_ALWAYS_RUN: '["changes", "lint"]'
  # why: .github/ci-notes/ci.md#the-jobs-outside-ci-oks-accounting
  CI_OK_EXEMPT: '["cancel-started", "ci-ok", "pr-title"]'

jobs:
  # why: .github/ci-notes/ci.md#what-the-changes-job-selects-and-the-two-terms-every-job-carries
  changes:
    name: ${{ 'changes' }}
    if: ${{ !github.event.pull_request.draft && (github.event_name != 'merge_group' || github.run_attempt == '1') }}
    # why: .github/ci-notes/ci.md#why-changes-pr-title-cancel-started-and-ci-ok-run-on-arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    outputs:
      worker-image: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.worker-image == 'true' || steps.unnamed.outputs.found == 'true' }}
      kind: ${{ github.event_name == 'merge_group' && 'true' || github.event_name == 'workflow_dispatch' && inputs.kind-and-agent-harness && 'true' || github.event_name != 'pull_request' && steps.filter.outputs.kind || 'false' }}
      go-daemon: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.go-daemon == 'true' || steps.unnamed.outputs.found == 'true' }}
      plugin-pack: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.plugin-pack == 'true' || steps.unnamed.outputs.found == 'true' }}
      daemon-live: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.daemon-live == 'true' || steps.unnamed.outputs.found == 'true' }}
      agent-harness: ${{ github.event_name == 'merge_group' && 'true' || github.event_name == 'workflow_dispatch' && inputs.kind-and-agent-harness && 'true' || github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci') && (steps.filter.outputs.agent-harness == 'true' || steps.unnamed.outputs.found == 'true') || 'false' }}
      airlock-arm: ${{ github.event_name != 'pull_request' && 'true' || contains(github.event.pull_request.labels.*.name, 'full-ci') && (steps.filter.outputs.airlock-arm == 'true' || steps.unnamed.outputs.found == 'true') || 'false' }}
      go-envoy-held: ${{ github.event_name != 'pull_request' && 'true' || contains(github.event.pull_request.labels.*.name, 'full-ci') && (steps.filter.outputs.go-envoy-held == 'true' || steps.unnamed.outputs.found == 'true') || 'false' }}
      ts: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.ts == 'true' || steps.unnamed.outputs.found == 'true' }}
      pi: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.pi == 'true' || steps.unnamed.outputs.found == 'true' }}
      dispatch-browser: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.dispatch-browser == 'true' || steps.unnamed.outputs.found == 'true' }}
      docs: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.docs == 'true' || steps.unnamed.outputs.found == 'true' }}
      browser-image: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.browser-image == 'true' || steps.unnamed.outputs.found == 'true' }}
      ci-images: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.ci-images == 'true' || steps.unnamed.outputs.found == 'true' }}
      tool-fallback: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.tool-fallback == 'true' || steps.unnamed.outputs.found == 'true' }}
      notices: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.notices == 'true' || steps.unnamed.outputs.found == 'true' }}
      scripts: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.scripts == 'true' || steps.unnamed.outputs.found == 'true' }}
      go-envoy: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.go-envoy == 'true' || steps.unnamed.outputs.found == 'true' }}
      text-checks: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.text-checks == 'true' || steps.unnamed.outputs.found == 'true' }}
      # why: .github/ci-notes/ci.md#the-paths-filters-own-verdict-for-every-filter-before-the-full-ci-term
      filter_verdicts: ${{ github.event_name == 'workflow_dispatch' && '{}' || toJSON(steps.filter.outputs) }}
      unnamed_files: ${{ steps.unnamed.outputs.found }}
      # why: .github/ci-notes/ci.md#why-a-dispatched-run-off-main-reports-under-names-of-its-own
      ref_is_main: ${{ steps.ref.outputs.is_main }}
    steps:
      - if: github.event_name != 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/ci-areas.yaml
            .github/scripts/unnamed-files.sh
            .github/scripts/gh-read.sh
            .github/scripts/workflow_paths.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # why: .github/ci-notes/ci.md#why-the-filter-step-is-skipped-on-a-dispatched-run
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          predicate-quantifier: some-with-excludes
          filters: .github/ci-areas.yaml
      - name: Select every job when a changed file matches no filter
        id: unnamed
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: .github/scripts/unnamed-files.sh .github/ci-areas.yaml
      - name: Read whether this run's ref is exactly refs/heads/main
        id: ref
        run: if [ "$GITHUB_REF" = refs/heads/main ]; then echo is_main=true; else echo is_main=false; fi >> "$GITHUB_OUTPUT"

  # why: .github/ci-notes/ci.md#the-lint-job-and-its-legs
  lint:
    needs: changes
    if: ${{ !cancelled() && !github.event.pull_request.draft && (github.event_name != 'merge_group' || github.run_attempt == '1') }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    # why: .github/ci-notes/ci.md#why-the-lint-job-holds-each-of-its-scopes
    permissions: {contents: read, actions: read, checks: write, pull-requests: read}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {leg: lint, name: lint / lint, runner: ubuntu-24.04-arm, timeout: 30}
          - {leg: private-names, name: lint / private-names, runner: ubuntu-24.04, timeout: 10}
          - {leg: typecheck, name: typecheck / typecheck, runner: ubuntu-24.04-arm, timeout: 10}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: lint
        if: matrix.leg == 'lint'
        uses: ./.github/actions/lint/lint
      - name: private-names
        if: matrix.leg == 'private-names'
        env: {PRIVATE_NAME_TERMS: '${{ secrets.PRIVATE_NAME_TERMS }}'}
        run: '"$GITHUB_WORKSPACE/.github/scripts/check-private-names.sh"'
      - name: typecheck
        if: matrix.leg == 'typecheck'
        uses: ./.github/actions/lint/typecheck
      - {if: always(), uses: ./.github/actions/ci-ok-report, with: {changes: '${{ toJSON(needs.changes) }}', job-status: '${{ job.status }}'}}

  # why: .github/ci-notes/ci.md#the-fail-open-jobs-and-what-they-buy-while-changes-is-broken
  scripts:
    needs: changes
    if: ${{ !cancelled() && !github.event.pull_request.draft && (github.event_name != 'merge_group' || github.run_attempt == '1') && (needs.changes.result != 'success' || needs.changes.outputs.scripts == 'true') }}
    name: ${{ format('{0} / {0}', matrix.leg) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {leg: test, timeout: 30}
          - {leg: private-names-port, timeout: 20}
          - {leg: conflicts-script, timeout: 360}
          - {leg: sessions-script, timeout: 10, pg: true}
    services:
      postgres:
        image: ${{ matrix.pg && 'ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11' || '' }}
        env: {POSTGRES_PASSWORD: ci}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -h 127.0.0.1 -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: test
        if: matrix.leg == 'test'
        uses: ./.github/actions/scripts/test
      - name: private-names-port
        if: matrix.leg == 'private-names-port'
        uses: ./.github/actions/scripts/private-names-port
      - name: conflicts-script
        if: matrix.leg == 'conflicts-script'
        uses: ./.github/actions/scripts/conflicts-script
      - name: sessions-script
        if: matrix.leg == 'sessions-script'
        uses: ./.github/actions/scripts/sessions-script
      - {if: always(), uses: ./.github/actions/ci-ok-report, with: {changes: '${{ toJSON(needs.changes) }}', job-status: '${{ job.status }}'}}

  # why: .github/ci-notes/ci.md#what-the-ci-images-job-copies-and-why-the-order-is-the-point
  ci-images:
    needs: changes
    if: needs.changes.outputs.ci-images == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    # why: .github/ci-notes/ci.md#why-the-ci-images-job-holds-packages-write
    permissions: {contents: read, packages: write, actions: read, checks: write}
    strategy: {fail-fast: false, matrix: {name: [ci-images / ci-images]}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: ci-images
        uses: ./.github/actions/ci-images
      - {if: always(), uses: ./.github/actions/ci-ok-report, with: {changes: '${{ toJSON(needs.changes) }}', job-status: '${{ job.status }}'}}

  # why: .github/ci-notes/ci.md#the-tool-fallback-proof-what-it-drives-what-it-only-reasons-about-and-how-to-read-it-when-it-is-red
  # why: .github/ci-notes/ci.md#the-arm64-half-of-the-tool-fallback-proof
  tool-fallback:
    needs: [changes, ci-images]
    if: ${{ !cancelled() && needs.changes.outputs.tool-fallback == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1') }}
    name: ${{ format('{0} / {0}', matrix.leg) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {leg: tool-fallback, runner: ubuntu-24.04, timeout: 22, x64: true}
          - {leg: tool-fallback-arm, runner: ubuntu-24.04-arm, timeout: 40, arm: true}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - {id: origin, if: matrix.x64, uses: ./.github/actions/tool-fallback/start}
      - {id: jj-primary, if: matrix.x64, continue-on-error: true, timeout-minutes: 11, uses: ./.github/actions/install-jj, env: {CI_TOOLS_GHCR_BASE: '${{ steps.origin.outputs.ghcr }}'}}
      - {if: matrix.x64, uses: ./.github/actions/tool-fallback/x64, with: {after: jj-primary, steps: '${{ toJSON(steps) }}'}}
      - {id: mark-base-crane, if: matrix.x64, run: 'echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"'}
      - {id: base-crane, if: matrix.x64, continue-on-error: true, timeout-minutes: 11, uses: ./base/.github/actions/install-crane, env: {CI_TOOLS_GHCR_BASE: 'http://127.0.0.1:1', CI_TOOLS_NPM_BASE: 'http://127.0.0.1:1'}}
      - {id: mark-base-changie, if: matrix.x64, run: 'echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"'}
      - {id: base-changie, if: matrix.x64, continue-on-error: true, timeout-minutes: 11, uses: ./base/.github/actions/install-changie, env: {CI_TOOLS_GHCR_BASE: 'http://127.0.0.1:1', CI_TOOLS_NPM_BASE: 'http://127.0.0.1:1'}}
      - {id: mark-base-jj, if: matrix.x64, run: 'echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"'}
      - {id: base-jj, if: matrix.x64, continue-on-error: true, timeout-minutes: 11, uses: ./base/.github/actions/install-jj, env: {CI_TOOLS_GHCR_BASE: 'http://127.0.0.1:1', CI_TOOLS_NPM_BASE: 'http://127.0.0.1:1'}}
      - {id: mark-base-bun, if: matrix.x64, run: 'echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"'}
      - {id: base-bun, if: matrix.x64, continue-on-error: true, timeout-minutes: 11, uses: ./base/.github/actions/setup-bun, env: {CI_TOOLS_GHCR_BASE: 'http://127.0.0.1:1', CI_TOOLS_NPM_BASE: 'http://127.0.0.1:1'}}
      - {if: matrix.x64, uses: ./.github/actions/tool-fallback/x64, with: {after: base-bun, steps: '${{ toJSON(steps) }}'}}
      - {id: mark-base-elan, if: matrix.x64, run: 'echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"'}
      - {id: base-elan, if: matrix.x64, continue-on-error: true, timeout-minutes: 11, uses: ./base/.github/actions/install-elan, env: {CI_TOOLS_GHCR_BASE: 'http://127.0.0.1:1', CI_TOOLS_NPM_BASE: 'http://127.0.0.1:1'}}
      - {id: mark-base-uv, if: matrix.x64, run: 'echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"'}
      - {id: base-uv, if: matrix.x64, continue-on-error: true, timeout-minutes: 11, uses: ./base/.github/actions/install-uv, env: {CI_TOOLS_URL_BASE: 'http://127.0.0.1:1'}}
      - {id: mark-nowhere-pulumi-docker, if: matrix.x64, run: 'echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"'}
      - {id: nowhere-pulumi-docker, if: matrix.x64, continue-on-error: true, timeout-minutes: 11, uses: ./.github/actions/install-docker-plugin, env: {CI_TOOLS_URL_BASE: 'http://127.0.0.1:1'}}
      - {id: mark-base-pulumi, if: matrix.x64, run: 'echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"'}
      - {id: base-pulumi, if: matrix.x64, continue-on-error: true, timeout-minutes: 11, uses: ./base/.github/actions/install-pulumi, env: {http_proxy: 'http://127.0.0.1:1', https_proxy: 'http://127.0.0.1:1'}}
      - {if: matrix.x64, uses: ./.github/actions/tool-fallback/x64, with: {after: nowhere, steps: '${{ toJSON(steps) }}'}}
      - {if: matrix.x64, timeout-minutes: 11, uses: ./.github/actions/install-crane, env: {CI_TOOLS_PROOF_FULL_LADDER: crane-head}}
      - {if: matrix.x64, timeout-minutes: 11, uses: ./.github/actions/install-changie}
      - {if: matrix.x64, timeout-minutes: 11, uses: ./.github/actions/install-jj}
      - {if: matrix.x64, timeout-minutes: 11, uses: ./.github/actions/setup-bun}
      - {if: matrix.x64, uses: ./.github/actions/tool-fallback/x64, with: {after: head-bun, steps: '${{ toJSON(steps) }}'}}
      - {if: matrix.x64, timeout-minutes: 11, uses: ./.github/actions/install-elan}
      - {if: matrix.x64, timeout-minutes: 11, uses: ./.github/actions/install-uv}
      - {id: docker-plugin, if: matrix.x64, timeout-minutes: 11, uses: ./.github/actions/install-docker-plugin}
      - {if: matrix.x64, timeout-minutes: 11, uses: ./.github/actions/install-pulumi, env: {CI_TOOLS_URL_BASE: 'http://127.0.0.1:1', CI_TOOLS_GITHUB_BASE: '${{ steps.origin.outputs.github }}'}}
      - {if: matrix.x64, uses: ./.github/actions/tool-fallback/x64, with: {after: head, steps: '${{ toJSON(steps) }}'}}
      - {id: crane-primary, if: matrix.x64, continue-on-error: true, timeout-minutes: 11, uses: ./.github/actions/install-crane, env: {CI_TOOLS_GITHUB_BASE: '${{ steps.origin.outputs.github }}', CI_TOOLS_GHCR_BASE: '${{ steps.origin.outputs.ghcr }}'}}
      - {if: matrix.x64, uses: ./.github/actions/tool-fallback/x64, with: {after: crane-primary, steps: '${{ toJSON(steps) }}'}}
      - {id: crane-second-source, if: matrix.x64, continue-on-error: true, timeout-minutes: 11, uses: ./.github/actions/install-crane, env: {CI_TOOLS_GHCR_BASE: '${{ steps.origin.outputs.ghcr }}'}}
      - {if: matrix.x64, uses: ./.github/actions/tool-fallback/x64, with: {after: crane-second-source, steps: '${{ toJSON(steps) }}'}}
      - {id: changie-primary, if: matrix.x64, continue-on-error: true, timeout-minutes: 11, uses: ./.github/actions/install-changie, env: {CI_TOOLS_GITHUB_BASE: '${{ steps.origin.outputs.github }}', CI_TOOLS_GHCR_BASE: '${{ steps.origin.outputs.ghcr }}'}}
      - {if: matrix.x64, uses: ./.github/actions/tool-fallback/x64, with: {after: changie-primary, steps: '${{ toJSON(steps) }}'}}
      - {id: changie-second-source, if: matrix.x64, continue-on-error: true, timeout-minutes: 11, uses: ./.github/actions/install-changie, env: {CI_TOOLS_GHCR_BASE: '${{ steps.origin.outputs.ghcr }}'}}
      - {if: matrix.x64, uses: ./.github/actions/tool-fallback/x64, with: {after: changie-second-source, steps: '${{ toJSON(steps) }}'}}
      - {id: jj-second-source, if: matrix.x64, continue-on-error: true, timeout-minutes: 11, uses: ./.github/actions/install-jj, env: {CI_TOOLS_GHCR_BASE: '${{ steps.origin.outputs.ghcr }}'}}
      - {if: matrix.x64, uses: ./.github/actions/tool-fallback/x64, with: {after: jj-second-source, steps: '${{ toJSON(steps) }}'}}
      - {id: bun-primary, if: matrix.x64, continue-on-error: true, timeout-minutes: 11, uses: ./.github/actions/setup-bun}
      - {if: matrix.x64, uses: ./.github/actions/tool-fallback/x64, with: {after: bun-primary, steps: '${{ toJSON(steps) }}'}}
      - {id: bun-second-source, if: matrix.x64, continue-on-error: true, timeout-minutes: 11, uses: ./.github/actions/setup-bun, env: {CI_TOOLS_NPM_BASE: '${{ steps.origin.outputs.npm }}'}}
      - {if: matrix.x64, uses: ./.github/actions/tool-fallback/x64, with: {after: bun-second-source, steps: '${{ toJSON(steps) }}'}}
      - {id: elan-primary, if: matrix.x64, continue-on-error: true, timeout-minutes: 11, uses: ./.github/actions/install-elan, env: {CI_TOOLS_GITHUB_BASE: '${{ steps.origin.outputs.github }}', CI_TOOLS_GHCR_BASE: '${{ steps.origin.outputs.ghcr }}'}}
      - {if: matrix.x64, uses: ./.github/actions/tool-fallback/x64, with: {after: elan-primary, steps: '${{ toJSON(steps) }}'}}
      - {id: elan-second-source, if: matrix.x64, continue-on-error: true, timeout-minutes: 11, uses: ./.github/actions/install-elan, env: {CI_TOOLS_GHCR_BASE: '${{ steps.origin.outputs.ghcr }}'}}
      - {if: matrix.x64, uses: ./.github/actions/tool-fallback/x64, with: {after: elan-second-source, steps: '${{ toJSON(steps) }}'}}
      - {id: uv-primary, if: matrix.x64, continue-on-error: true, timeout-minutes: 11, uses: ./.github/actions/install-uv, env: {CI_TOOLS_GITHUB_BASE: '${{ steps.origin.outputs.github }}', CI_TOOLS_URL_BASE: '${{ steps.origin.outputs.url }}'}}
      - {if: matrix.x64, uses: ./.github/actions/tool-fallback/x64, with: {after: uv-primary, steps: '${{ toJSON(steps) }}'}}
      - {id: uv-second-source, if: matrix.x64, continue-on-error: true, timeout-minutes: 11, uses: ./.github/actions/install-uv, env: {CI_TOOLS_URL_BASE: '${{ steps.origin.outputs.url }}'}}
      - {if: matrix.x64, uses: ./.github/actions/tool-fallback/x64, with: {after: uv-second-source, steps: '${{ toJSON(steps) }}'}}
      - {id: pulumi-docker-primary, if: matrix.x64, continue-on-error: true, timeout-minutes: 11, uses: ./.github/actions/install-docker-plugin, env: {CI_TOOLS_GITHUB_BASE: '${{ steps.origin.outputs.github }}', CI_TOOLS_URL_BASE: '${{ steps.origin.outputs.url }}'}}
      - {if: matrix.x64, uses: ./.github/actions/tool-fallback/x64, with: {after: pulumi-docker-primary, steps: '${{ toJSON(steps) }}'}}
      - {id: pulumi-docker-second-source, if: matrix.x64, continue-on-error: true, timeout-minutes: 11, uses: ./.github/actions/install-docker-plugin, env: {CI_TOOLS_URL_BASE: '${{ steps.origin.outputs.url }}'}}
      - {if: matrix.x64, uses: ./.github/actions/tool-fallback/x64, with: {after: pulumi-docker-second-source, steps: '${{ toJSON(steps) }}'}}
      - {id: pulumi-cli-primary, if: matrix.x64, continue-on-error: true, timeout-minutes: 11, uses: ./.github/actions/install-pulumi, env: {CI_TOOLS_URL_BASE: '${{ steps.origin.outputs.url }}', CI_TOOLS_GITHUB_BASE: '${{ steps.origin.outputs.github }}'}}
      - {if: matrix.x64, uses: ./.github/actions/tool-fallback/x64, with: {after: pulumi-cli-primary, steps: '${{ toJSON(steps) }}'}}
      - {id: pulumi-cli-second-source, if: matrix.x64, continue-on-error: true, timeout-minutes: 11, uses: ./.github/actions/install-pulumi, env: {CI_TOOLS_URL_BASE: 'http://127.0.0.1:1', CI_TOOLS_GITHUB_BASE: '${{ steps.origin.outputs.github }}'}}
      - {if: matrix.x64, uses: ./.github/actions/tool-fallback/x64, with: {after: pulumi-cli-second-source, steps: '${{ toJSON(steps) }}'}}
      - {if: matrix.arm, uses: ./.github/actions/tool-fallback/arm, with: {after: start}}
      - {if: matrix.arm, timeout-minutes: 11, uses: ./.github/actions/setup-bun}
      - {if: matrix.arm, uses: ./.github/actions/tool-fallback/arm, with: {after: healthy-bun}}
      - {if: matrix.arm, timeout-minutes: 11, uses: ./.github/actions/install-crane}
      - {if: matrix.arm, timeout-minutes: 11, uses: ./.github/actions/install-changie}
      - {if: matrix.arm, timeout-minutes: 11, uses: ./.github/actions/install-jj}
      - {if: matrix.arm, timeout-minutes: 11, uses: ./.github/actions/install-elan}
      - {if: matrix.arm, uses: ./.github/actions/tool-fallback/arm, with: {after: healthy}}
      - {if: matrix.arm, timeout-minutes: 11, uses: ./.github/actions/setup-bun}
      - {if: matrix.arm, uses: ./.github/actions/tool-fallback/arm, with: {after: faulted-bun}}
      - {if: matrix.arm, timeout-minutes: 11, uses: ./.github/actions/install-crane}
      - {if: matrix.arm, uses: ./.github/actions/tool-fallback/arm, with: {after: faulted-crane}}
      - {if: matrix.arm, timeout-minutes: 11, uses: ./.github/actions/install-changie}
      - {if: matrix.arm, uses: ./.github/actions/tool-fallback/arm, with: {after: faulted-changie}}
      - {if: matrix.arm, timeout-minutes: 11, uses: ./.github/actions/install-jj}
      - {if: matrix.arm, uses: ./.github/actions/tool-fallback/arm, with: {after: faulted-jj}}
      - {if: matrix.arm, timeout-minutes: 11, uses: ./.github/actions/install-elan}
      - {if: matrix.arm, uses: ./.github/actions/tool-fallback/arm, with: {after: faulted-elan}}
      - {if: always(), uses: ./.github/actions/tool-fallback/end}
      - {if: always(), uses: ./.github/actions/ci-ok-report, with: {changes: '${{ toJSON(needs.changes) }}', job-status: '${{ job.status }}'}}

  # why: .github/ci-notes/ci.md#why-the-daemons-go-suite-is-a-job-of-its-own
  go-daemon:
    needs: changes
    if: ${{ !cancelled() && !github.event.pull_request.draft && (github.event_name != 'merge_group' || github.run_attempt == '1') && (needs.changes.result != 'success' || needs.changes.outputs.go-daemon == 'true') }}
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: daemon-go (1/3), leg: 1, timeout: 28, race: 18m}
          - {name: daemon-go (2/3), leg: 2, timeout: 38, race: 28m}
          - {name: daemon-go (3/3), leg: 3, timeout: 30, race: 18m}
    services:
      postgres:
        image: ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env: {POSTGRES_PASSWORD: ci}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -h 127.0.0.1 -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: daemon-go
        uses: ./.github/actions/go-daemon
        with:
          leg: ${{ matrix.leg }}
          legs: 3
          race-timeout: ${{ matrix.race }}
      - {if: always(), uses: ./.github/actions/ci-ok-report, with: {changes: '${{ toJSON(needs.changes) }}', job-status: '${{ job.status }}'}}

  # why: .github/ci-notes/ci.md#the-jobs-that-carry-a-split-jobs-old-check-run-name
  daemon-go:
    name: ${{ 'daemon-go / daemon-go' }}
    needs: [changes, go-daemon]
    if: ${{ !cancelled() && !github.event.pull_request.draft && (github.event_name != 'merge_group' || github.run_attempt == '1') && (needs.changes.result != 'success' || needs.changes.outputs.go-daemon == 'true') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {sparse-checkout: .github, persist-credentials: false}
      - env: {GH_TOKEN: '${{ github.token }}'}
        run: .github/scripts/leg-verdict.sh 'daemon-go (1/3)' 'daemon-go (2/3)' 'daemon-go (3/3)'
      - {if: always(), uses: ./.github/actions/ci-ok-report, with: {changes: '${{ toJSON(needs.changes) }}', job-status: '${{ job.status }}'}}

  # why: .github/ci-notes/ci.md#why-the-three-plugin-pack-tests-are-a-job-of-their-own
  plugin-pack:
    needs: changes
    if: ${{ !cancelled() && !github.event.pull_request.draft && (github.event_name != 'merge_group' || github.run_attempt == '1') && (needs.changes.result != 'success' || needs.changes.outputs.plugin-pack == 'true') }}
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy: {fail-fast: false, matrix: {name: [plugin-pack / plugin-pack]}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: plugin-pack
        uses: ./.github/actions/plugin-pack
      - {if: always(), uses: ./.github/actions/ci-ok-report, with: {changes: '${{ toJSON(needs.changes) }}', job-status: '${{ job.status }}'}}

  # why: .github/ci-notes/ci.md#why-the-daemons-whole-daemon-live-tests-are-a-job-of-their-own
  daemon-live:
    needs: changes
    if: needs.changes.outputs.daemon-live == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy: {fail-fast: false, matrix: {name: [daemon-live / daemon-live]}}
    services:
      postgres:
        image: ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env: {POSTGRES_PASSWORD: ci}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -h 127.0.0.1 -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: daemon-live
        uses: ./.github/actions/daemon-live
      - {if: always(), uses: ./.github/actions/ci-ok-report, with: {changes: '${{ toJSON(needs.changes) }}', job-status: '${{ job.status }}'}}

  # why: .github/ci-notes/ci.md#the-agent-harness-job-and-its-legs
  agent-harness:
    needs: changes
    if: needs.changes.outputs.agent-harness == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    name: ${{ format('agent-harness / {0}', matrix.leg) }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.t }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {leg: pane-drivers, t: 40}
          - {leg: tmux-scripts, t: 45}
          - {leg: session-settings, t: 25}
          - {leg: session-scripts, t: 30}
          - {leg: plugin-smokes, t: 25}
          - {leg: nats-callout-sessions, t: 25}
    services:
      postgres:
        image: ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env: {POSTGRES_PASSWORD: ci}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - {uses: ./.github/actions/agent-harness/install, with: {leg: '${{ matrix.leg }}'}}
      - {uses: ./.github/actions/agent-harness, with: {leg: '${{ matrix.leg }}'}}
      - {if: always(), uses: ./.github/actions/ci-ok-report, with: {changes: '${{ toJSON(needs.changes) }}', job-status: '${{ job.status }}'}}

  # why: .github/ci-notes/ci.md#the-kind-image-job
  kind-image:
    needs: [changes, ci-images]
    if: ${{ !cancelled() && needs.changes.outputs.kind == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1') }}
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy: {fail-fast: false, matrix: {name: [kind / image]}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: ./.github/actions/kind/image
      - {if: always(), uses: ./.github/actions/ci-ok-report, with: {changes: '${{ toJSON(needs.changes) }}', job-status: '${{ job.status }}'}}

  # why: .github/ci-notes/ci.md#the-kind-job-and-its-legs
  kind:
    needs: [changes, kind-image]
    if: ${{ !cancelled() && needs.kind-image.result == 'success' && needs.changes.outputs.kind == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1') }}
    name: ${{ format('kind / {0}', matrix.leg) }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.t || 40 }}
    strategy:
      fail-fast: false
      matrix:
        leg: [rig, shares, burstable-and-sweep, runtime-root, runtime-secrets, runtime-roles, runtime-adopt, runtime-image, runtime-issues, runtime-pod-update, runtime-pod-update-fleet, tree-claude, tree-stage4b, tree-stage4b-restart, tree-stage4b-address, tree-stage4b-move, tree-stage4b-controller]
        include: [{leg: rig, t: 25}, {leg: tree-claude, t: 36}, {leg: tree-stage4b, t: 39}, {leg: tree-stage4b-restart, t: 38}, {leg: tree-stage4b-address, t: 37}, {leg: tree-stage4b-move, t: 36}, {leg: tree-stage4b-controller, t: 37}]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Download the worker image the image job built
        timeout-minutes: 10
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: kind-image-worker-image, path: '${{ runner.temp }}/kind-image'}
      - {uses: ./.github/actions/kind, with: {leg: '${{ matrix.leg }}'}}
      - {if: always(), uses: ./.github/actions/ci-ok-report, with: {changes: '${{ toJSON(needs.changes) }}', job-status: '${{ job.status }}'}}

  # why: .github/ci-notes/ci.md#the-docs-job
  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    name: ${{ 'docs' }}
    # why: .github/ci-notes/ci.md#why-the-docs-job-declares-the-scopes-the-called-workflow-needs
    permissions:
      contents: read
      actions: read
      checks: write
    uses: ./.github/workflows/docs-site.yaml
    with:
      ci-ok-changes: ${{ toJSON(needs.changes) }}
    secrets:
      PRIVATE_NAME_TERMS: ${{ secrets.PRIVATE_NAME_TERMS }}

  # why: .github/ci-notes/ci.md#the-ts-job-and-its-legs
  ts:
    needs: changes
    if: needs.changes.outputs.ts == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    name: ${{ format('{0} / {0}', matrix.leg) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: ${{ matrix.timeout || 10 }}
    strategy:
      fail-fast: false
      matrix:
        leg: [contracts, test-fixtures, broker-client, envoy-client, dispatch-ui, proof-sdk-offline]
        include: [{leg: dispatch-ui, timeout: 15}, {leg: proof-sdk-offline, timeout: 15}]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: ./.github/actions/setup-bun
      - name: contracts
        if: matrix.leg == 'contracts'
        uses: ./.github/actions/ts/contracts
      - name: test-fixtures
        if: matrix.leg == 'test-fixtures'
        uses: ./.github/actions/ts/test-fixtures
      - name: broker-client
        if: matrix.leg == 'broker-client'
        uses: ./.github/actions/ts/broker-client
      - name: envoy-client
        if: matrix.leg == 'envoy-client'
        uses: ./.github/actions/ts/envoy-client
      - name: dispatch-ui
        if: matrix.leg == 'dispatch-ui'
        uses: ./.github/actions/ts/dispatch-ui
      - name: proof-sdk-offline
        if: matrix.leg == 'proof-sdk-offline'
        uses: ./.github/actions/ts/proof-sdk-offline
      - {if: always(), uses: ./.github/actions/ci-ok-report, with: {changes: '${{ toJSON(needs.changes) }}', job-status: '${{ job.status }}'}}

  # why: .github/ci-notes/ci.md#the-pi-job-and-its-legs
  pi:
    needs: changes
    if: needs.changes.outputs.pi == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    name: ${{ format('{0} / {0}', matrix.leg) }}
    runs-on: ${{ matrix.runner || 'ubuntu-24.04-arm' }}
    timeout-minutes: ${{ matrix.timeout || 10 }}
    strategy:
      fail-fast: false
      matrix:
        leg: [pi-shared, pi-envoy, pi-legion, claude-envoy]
        include:
          - {leg: pi-envoy, runner: ubuntu-24.04, timeout: 15, omp: true, nats: '4222'}
          - {leg: pi-legion, runner: ubuntu-24.04, timeout: 28, omp: true, nats: '4222:4222'}
    services:
      nats:
        image: ${{ matrix.nats && 'ghcr.io/cybermonklabs/legion/ci@sha256:5498ba57b9471840be3d15b033a4eec554d1c02fa6c2cc0ca2d888637f6c6e2f' || '' }}
        ports: ["${{ matrix.nats || '4222' }}"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: ./.github/actions/setup-bun
      - {if: matrix.omp, uses: ./.github/actions/install-jj}
      - {if: matrix.omp, uses: ./.github/actions/install-omp}
      - {if: matrix.leg == 'claude-envoy', uses: ./.github/actions/install-claude-code}
      - {if: matrix.leg == 'claude-envoy', uses: ./.github/actions/install-codex}
      - name: pi-shared
        if: matrix.leg == 'pi-shared'
        uses: ./.github/actions/pi/pi-shared
      - name: pi-envoy
        if: matrix.leg == 'pi-envoy'
        uses: ./.github/actions/pi/pi-envoy
        with: {nats-port: '${{ job.services.nats.ports[''4222''] }}'}
      - name: pi-legion
        if: matrix.leg == 'pi-legion'
        uses: ./.github/actions/pi/pi-legion
      - name: claude-envoy
        if: matrix.leg == 'claude-envoy'
        uses: ./.github/actions/pi/claude-envoy
      - {if: always(), uses: ./.github/actions/ci-ok-report, with: {changes: '${{ toJSON(needs.changes) }}', job-status: '${{ job.status }}'}}

  # why: .github/ci-notes/ci.md#the-claude-envoy-names-job
  claude-envoy-names:
    needs: [changes, pi]
    if: needs.changes.outputs.pi == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy: {fail-fast: false, matrix: {name: [claude-envoy / private-names]}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {sparse-checkout: .github, persist-credentials: false}
      - uses: ./.github/actions/private-names-packed-plugin
        with: {artifact: claude-envoy-pr, private-name-terms: '${{ secrets.PRIVATE_NAME_TERMS }}'}
      - {if: always(), uses: ./.github/actions/ci-ok-report, with: {changes: '${{ toJSON(needs.changes) }}', job-status: '${{ job.status }}'}}

  # why: .github/ci-notes/ci.md#the-browser-suite-job
  dispatch-browser:
    needs: changes
    if: needs.changes.outputs.dispatch-browser == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    name: ${{ 'dispatch-browser' }}
    # why: .github/ci-notes/ci.md#the-dispatch-browser-jobs-scopes
    permissions:
      contents: read
      actions: read
      checks: write
    uses: ./.github/workflows/dispatch-browser.yaml
    with:
      # why: .github/ci-notes/ci.md#what-the-lane-input-reads
      lane: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && 'full' || 'pull-request' }}
      ci-ok-changes: ${{ toJSON(needs.changes) }}

  # why: .github/ci-notes/ci.md#envoy-gos-fast-half-the-go-format-check-the-two-generated-code-checks-the
  go-envoy:
    needs: changes
    if: needs.changes.outputs.go-envoy == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    name: ${{ format('{0} / {0}', matrix.leg) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {leg: envoy-go-checks, runner: ubuntu-24.04, timeout: 40}
          - {leg: envoy-infra-go, runner: ubuntu-24.04-arm, timeout: 32}
          - {leg: airlock-lean, runner: ubuntu-24.04-arm, timeout: 45}
          - {leg: envoy-session-stall, runner: ubuntu-24.04, timeout: 30, pg: true}
          - {leg: envoy-e2e-local, runner: ubuntu-24.04-arm, timeout: 30}
          - {leg: broker-multiprocess, runner: ubuntu-24.04-arm, timeout: 30, pg: true}
          - {leg: listener-server-change, runner: ubuntu-24.04-arm, timeout: 30}
    services:
      postgres:
        image: ${{ matrix.pg && 'ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11' || '' }}
        env: {POSTGRES_PASSWORD: ci}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: envoy-go-checks
        if: matrix.leg == 'envoy-go-checks'
        uses: ./.github/actions/go-envoy/envoy-go-checks
        with: {migration-base: '${{ inputs.migration-base }}'}
      - name: envoy-infra-go
        if: matrix.leg == 'envoy-infra-go'
        uses: ./.github/actions/go-envoy/envoy-infra-go
      - name: airlock-lean
        if: matrix.leg == 'airlock-lean'
        uses: ./.github/actions/go-envoy/airlock-lean
      - name: envoy-session-stall
        if: matrix.leg == 'envoy-session-stall'
        uses: ./.github/actions/go-envoy/envoy-session-stall
        with: {postgres: '${{ job.services.postgres.id }}'}
      - name: envoy-e2e-local
        if: matrix.leg == 'envoy-e2e-local'
        uses: ./.github/actions/go-envoy/envoy-e2e-local
      - name: broker-multiprocess
        if: matrix.leg == 'broker-multiprocess'
        uses: ./.github/actions/go-envoy/broker-multiprocess
      - name: listener-server-change
        if: matrix.leg == 'listener-server-change'
        uses: ./.github/actions/go-envoy/listener-server-change
      - {if: always(), uses: ./.github/actions/ci-ok-report, with: {changes: '${{ toJSON(needs.changes) }}', job-status: '${{ job.status }}'}}

  # why: .github/ci-notes/ci.md#the-twelve-slow-suites-whose-runner-time-dwarfs-every-other-jobs-the
  go-envoy-held:
    needs: changes
    if: needs.changes.outputs.go-envoy-held == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    name: ${{ matrix.name || 'dispatch-two-builds / dispatch-two-builds-same' }}
    runs-on: ${{ matrix.runner || 'ubuntu-24.04' }}
    timeout-minutes: ${{ matrix.timeout || 45 }}
    strategy:
      fail-fast: false
      matrix:
        leg: [envoy-go-1, envoy-go-2, envoy-go-3, envoy-go-race, envoy-go-race-api-1, envoy-go-race-api-2, envoy-go-claim-model, envoy-go-race-docs-1, envoy-go-race-docs-2, envoy-go-docs-finalizers, dispatch-memory-1, dispatch-memory-2, dispatch-multiprocess, dispatch-two-builds, dispatch-two-builds-same, envoy-smoke]
        exclude:
          - leg: ${{ github.event_name != 'merge_group' && 'dispatch-two-builds-same' || '' }}
        include:
          - {leg: envoy-go-1, suite: envoy-go, part: 1, name: envoy-go (1/3), runner: ubuntu-24.04-arm, timeout: 39}
          - {leg: envoy-go-2, suite: envoy-go, part: 2, rest: true, name: envoy-go (2/3), runner: ubuntu-24.04-arm, timeout: 40}
          - {leg: envoy-go-3, suite: envoy-go, part: 3, name: envoy-go (3/3), runner: ubuntu-24.04-arm, timeout: 26}
          - {leg: envoy-go-race, name: envoy-go-race / envoy-go-race, runner: ubuntu-24.04-arm, timeout: 45}
          - {leg: envoy-go-race-api-1, suite: envoy-go-race-api, part: 1, name: envoy-go-race-api (1/2), runner: ubuntu-24.04-arm, timeout: 30}
          - {leg: envoy-go-race-api-2, suite: envoy-go-race-api, part: 2, name: envoy-go-race-api (2/2), runner: ubuntu-24.04-arm, timeout: 30}
          - {leg: envoy-go-claim-model, name: envoy-go-claim-model / envoy-go-claim-model, timeout: 50}
          - {leg: envoy-go-race-docs-1, suite: envoy-go-race-docs, part: 1, name: envoy-go-race-docs (1/2), runner: ubuntu-24.04-arm, timeout: 27, go: 24m}
          - {leg: envoy-go-race-docs-2, suite: envoy-go-race-docs, part: 2, name: envoy-go-race-docs (2/2), runner: ubuntu-24.04-arm, timeout: 31, go: 28m}
          - {leg: envoy-go-docs-finalizers, name: envoy-go-docs-finalizers / envoy-go-docs-finalizers, runner: ubuntu-24.04-arm, timeout: 55}
          - {leg: dispatch-memory-1, suite: dispatch-memory, part: 1, name: dispatch-memory (1/2), runner: ubuntu-24.04-arm, timeout: 32, go: 28m}
          - {leg: dispatch-memory-2, suite: dispatch-memory, part: 2, name: dispatch-memory (2/2), runner: ubuntu-24.04-arm, timeout: 38, go: 34m}
          - {leg: dispatch-multiprocess, name: dispatch-multiprocess / dispatch-multiprocess, runner: ubuntu-24.04-arm, timeout: 35}
          - {leg: dispatch-two-builds, name: dispatch-two-builds / dispatch-two-builds}
          - {leg: envoy-smoke, name: envoy-smoke / envoy-smoke, timeout: 20}
    services:
      postgres:
        image: ${{ matrix.leg != 'envoy-smoke' && 'ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11' || '' }}
        env: {POSTGRES_PASSWORD: ci}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DISPATCH_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      BROKER_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      LEGION_TEST_PG_DSN: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - if: ${{ !startsWith(matrix.leg, 'dispatch-two-builds') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      # why: .github/ci-notes/ci.md#the-two-build-legs-checkouts
      - id: checkout
        if: startsWith(matrix.leg, 'dispatch-two-builds')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        continue-on-error: true
        with: {persist-credentials: false, fetch-depth: 0}
      - name: End the git processes and the workspace a first attempt cut at its budget leaves
        if: startsWith(matrix.leg, 'dispatch-two-builds') && steps.checkout.outcome != 'success'
        timeout-minutes: 2
        run: |
          pgrep -a git || true
          pkill -KILL -x git || true
          pkill -KILL -f git-remote-http || true
          while pgrep -x git > /dev/null || pgrep -f git-remote-http > /dev/null; do sleep 1; done
          pgrep -a git || echo "no git process is left"
          find "$GITHUB_WORKSPACE" -mindepth 1 -delete
      - name: Check out again, after a first attempt that did not complete
        if: startsWith(matrix.leg, 'dispatch-two-builds') && steps.checkout.outcome != 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with: {persist-credentials: false, fetch-depth: 0}
      - name: envoy-go
        if: matrix.suite == 'envoy-go'
        uses: ./.github/actions/go-envoy-held/envoy-go
        with:
          part: ${{ matrix.part }}
          legs: 3
          rest: ${{ matrix.rest }}
          postgres: ${{ job.services.postgres.id }}
      # why: .github/ci-notes/ci.md#what-the-envoy-go-job-runs
      - name: Count the database broker suites' skips
        if: matrix.suite == 'envoy-go'
        timeout-minutes: 30
        working-directory: packages/envoy
        env: {LEG: '${{ matrix.part }}'}
        run: scripts/database-skips.sh --timeout 15m --skip '^(TestSettingsNameTheGoogleExchangeAudienceOnEitherStore)$' --run "$(../../.github/scripts/go-test-split.sh "$LEG" 3 ./internal/cipher/... ./cmd/cipherd/)" --jsonfile "go-envoy-held-envoy-go-$LEG-database-skips.json"
      - if: always() && matrix.suite == 'envoy-go'
        uses: ./.github/actions/go-test-upload
        with: {name: 'go-envoy-held-envoy-go-${{ matrix.part }}-database-skips'}
      - name: Time the statements on the seeded measurement database
        if: matrix.rest
        timeout-minutes: 15
        working-directory: packages/envoy
        env: {DISPATCH_BENCH_DATABASE_URL: 'postgres://postgres:ci@localhost:5432/dispatch_bench?sslmode=disable'}
        run: |
          docker exec "${{ job.services.postgres.id }}" createdb -U postgres dispatch_bench
          go run ./cmd/dispatch-seed --database-url "$DISPATCH_BENCH_DATABASE_URL" --scale 0.01
          ../../.github/scripts/go-test.sh --jsonfile go-envoy-held-envoy-go-timings-docs.json --packages ./internal/dispatch/docs/ -- -count=1 -timeout 5m -run '^(TestStatementTimings)$'
          ../../.github/scripts/go-test.sh --jsonfile go-envoy-held-envoy-go-timings-refs.json --packages ./internal/dispatch/refs/ -- -count=1 -timeout 5m -run '^(TestStatementTimings)$'
      - if: always() && matrix.rest
        uses: ./.github/actions/go-test-upload
        with: {name: go-envoy-held-envoy-go-timings}
      - name: envoy-go-race
        if: matrix.leg == 'envoy-go-race'
        uses: ./.github/actions/go-envoy-held/envoy-go-race
        with: {postgres: '${{ job.services.postgres.id }}'}
      - name: envoy-go-race-api
        if: matrix.suite == 'envoy-go-race-api'
        uses: ./.github/actions/go-envoy-held/envoy-go-race-api
        with: {part: '${{ matrix.part }}', legs: 2, postgres: '${{ job.services.postgres.id }}'}
      - name: envoy-go-claim-model
        if: matrix.leg == 'envoy-go-claim-model'
        uses: ./.github/actions/go-envoy-held/envoy-go-claim-model
      - name: envoy-go-race-docs
        if: matrix.suite == 'envoy-go-race-docs'
        uses: ./.github/actions/go-envoy-held/envoy-go-race-docs
        with: {part: '${{ matrix.part }}', legs: 2, go-timeout: '${{ matrix.go }}', postgres: '${{ job.services.postgres.id }}'}
      - name: envoy-go-docs-finalizers
        if: matrix.leg == 'envoy-go-docs-finalizers'
        uses: ./.github/actions/go-envoy-held/envoy-go-docs-finalizers
        with: {postgres: '${{ job.services.postgres.id }}'}
      - name: dispatch-memory
        if: matrix.suite == 'dispatch-memory'
        uses: ./.github/actions/go-envoy-held/dispatch-memory
        with: {part: '${{ matrix.part }}', legs: 2, go-timeout: '${{ matrix.go }}', postgres: '${{ job.services.postgres.id }}'}
      - name: dispatch-multiprocess
        if: matrix.leg == 'dispatch-multiprocess'
        uses: ./.github/actions/go-envoy-held/dispatch-multiprocess
        with: {postgres: '${{ job.services.postgres.id }}'}
      - name: dispatch-two-builds
        if: matrix.leg == 'dispatch-two-builds'
        uses: ./.github/actions/go-envoy-held/dispatch-two-builds
        with: {postgres: '${{ job.services.postgres.id }}'}
      - name: dispatch-two-builds-same
        if: matrix.leg == 'dispatch-two-builds-same'
        uses: ./.github/actions/go-envoy-held/dispatch-two-builds-same
        with: {postgres: '${{ job.services.postgres.id }}'}
      - name: envoy-smoke
        if: matrix.leg == 'envoy-smoke'
        uses: ./.github/actions/go-envoy-held/envoy-smoke
      - {if: always(), uses: ./.github/actions/ci-ok-report, with: {changes: '${{ toJSON(needs.changes) }}', job-status: '${{ job.status }}'}}

  # why: .github/ci-notes/ci.md#the-jobs-that-carry-a-split-jobs-old-check-run-name
  envoy-go:
    name: ${{ 'envoy-go / envoy-go' }}
    needs: [changes, go-envoy-held]
    if: ${{ !cancelled() && needs.changes.outputs.go-envoy-held == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {sparse-checkout: .github, persist-credentials: false}
      - env: {GH_TOKEN: '${{ github.token }}'}
        run: .github/scripts/leg-verdict.sh 'envoy-go (1/3)' 'envoy-go (2/3)' 'envoy-go (3/3)'
      - {if: always(), uses: ./.github/actions/ci-ok-report, with: {changes: '${{ toJSON(needs.changes) }}', job-status: '${{ job.status }}'}}

  envoy-go-race-api:
    name: ${{ 'envoy-go-race-api / envoy-go-race-api' }}
    needs: [changes, go-envoy-held]
    if: ${{ !cancelled() && needs.changes.outputs.go-envoy-held == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {sparse-checkout: .github, persist-credentials: false}
      - env: {GH_TOKEN: '${{ github.token }}'}
        run: .github/scripts/leg-verdict.sh 'envoy-go-race-api (1/2)' 'envoy-go-race-api (2/2)'
      - {if: always(), uses: ./.github/actions/ci-ok-report, with: {changes: '${{ toJSON(needs.changes) }}', job-status: '${{ job.status }}'}}

  envoy-go-race-docs:
    name: ${{ 'envoy-go-race-docs / envoy-go-race-docs' }}
    needs: [changes, go-envoy-held]
    if: ${{ !cancelled() && needs.changes.outputs.go-envoy-held == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {sparse-checkout: .github, persist-credentials: false}
      - env: {GH_TOKEN: '${{ github.token }}'}
        run: .github/scripts/leg-verdict.sh 'envoy-go-race-docs (1/2)' 'envoy-go-race-docs (2/2)'
      - {if: always(), uses: ./.github/actions/ci-ok-report, with: {changes: '${{ toJSON(needs.changes) }}', job-status: '${{ job.status }}'}}

  dispatch-memory:
    name: ${{ 'dispatch-memory / dispatch-memory' }}
    needs: [changes, go-envoy-held]
    if: ${{ !cancelled() && needs.changes.outputs.go-envoy-held == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {sparse-checkout: .github, persist-credentials: false}
      - env: {GH_TOKEN: '${{ github.token }}'}
        run: .github/scripts/leg-verdict.sh 'dispatch-memory (1/2)' 'dispatch-memory (2/2)'
      - {if: always(), uses: ./.github/actions/ci-ok-report, with: {changes: '${{ toJSON(needs.changes) }}', job-status: '${{ job.status }}'}}

  # why: .github/ci-notes/ci.md#the-airlock-arm-job
  airlock-arm:
    needs: changes
    if: needs.changes.outputs.airlock-arm == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 70
    strategy: {fail-fast: false, matrix: {name: [airlock-arm / airlock-arm]}}
    services:
      postgres:
        image: ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env: {POSTGRES_PASSWORD: ci}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: airlock-arm
        uses: ./.github/actions/airlock-arm
      - {if: always(), uses: ./.github/actions/ci-ok-report, with: {changes: '${{ toJSON(needs.changes) }}', job-status: '${{ job.status }}'}}

  # why: .github/ci-notes/ci.md#the-text-checks-job
  text-checks:
    needs: changes
    if: ${{ !cancelled() && !github.event.pull_request.draft && (github.event_name != 'merge_group' || github.run_attempt == '1') && (needs.changes.result != 'success' || needs.changes.outputs.text-checks == 'true') }}
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    strategy: {fail-fast: false, matrix: {name: [text-checks / text-checks]}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: text-checks
        uses: ./.github/actions/text-checks
      - {if: always(), uses: ./.github/actions/ci-ok-report, with: {changes: '${{ toJSON(needs.changes) }}', job-status: '${{ job.status }}'}}

  # why: .github/ci-notes/ci.md#the-notices-job
  notices:
    needs: changes
    if: ${{ !cancelled() && !github.event.pull_request.draft && (github.event_name != 'merge_group' || github.run_attempt == '1') && (needs.changes.result != 'success' || needs.changes.outputs.notices == 'true') }}
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy: {fail-fast: false, matrix: {name: [notices / notices]}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: notices
        uses: ./.github/actions/notices
      - {if: always(), uses: ./.github/actions/ci-ok-report, with: {changes: '${{ toJSON(needs.changes) }}', job-status: '${{ job.status }}'}}

  # why: .github/ci-notes/ci.md#the-worker-images-pull-request-build
  worker-image:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.worker-image == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    name: ${{ 'worker-image' }}
    uses: ./.github/workflows/worker-image.yaml
    # why: .github/ci-notes/ci.md#the-worker-image-jobs-scopes
    permissions:
      contents: read
      packages: write
      actions: read
      checks: write
      id-token: write
      attestations: write
    with:
      ci-ok-changes: ${{ toJSON(needs.changes) }}

  # why: .github/ci-notes/ci.md#why-the-browser-images-build-runs-on-a-merge-group-too
  browser-image:
    needs: changes
    if: needs.changes.outputs.browser-image == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    name: ${{ 'browser-image' }}
    uses: ./.github/workflows/browser-image.yaml
    # why: .github/ci-notes/ci.md#the-browser-image-jobs-scopes
    permissions:
      contents: read
      packages: write
      actions: read
      checks: write
      id-token: write
      attestations: write
    with:
      ci-ok-changes: ${{ toJSON(needs.changes) }}

  # why: .github/ci-notes/ci.md#the-pr-title-job-what-it-checks-and-why-it-posts-nothing
  pr-title:
    name: ${{ github.event_name == 'workflow_dispatch' && 'pr-title (dispatch)' || 'pr-title' }}
    if: ${{ !github.event.pull_request.draft && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    # why: .github/ci-notes/ci.md#what-the-pr-title-jobs-scopes-are-for
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      # why: .github/ci-notes/ci.md#why-pr-title-refuses-a-re-run-attempt-in-a-step-of-its-own
      - name: Refuse a re-run attempt of a merge-group run
        if: ${{ github.event_name == 'merge_group' && github.run_attempt != '1' }}
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          echo "::error::pr-title is failure on attempt $RUN_ATTEMPT of this merge-group run, whatever the pull request's text says: a merge group is tested once, the queue builds a new group rather than re-running one, and this attempt checks a tree the queue is no longer waiting on."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
          persist-credentials: false

      # why: .github/ci-notes/ci.md#what-the-pr-title-check-step-maps-and-how-it-runs-its-scripts
      - name: Check the pull request's title, body, branch name, commits, comments and reviews
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVATE_NAME_TERMS: ${{ secrets.PRIVATE_NAME_TERMS }}
        run: |
          payload=$("$GITHUB_WORKSPACE/.github/scripts/find-pr-payload.sh")
          GITHUB_EVENT_PATH="$payload" "$GITHUB_WORKSPACE/.github/scripts/check-pr-text.sh"

  # why: .github/ci-notes/ci.md#the-merge-queues-cancel-act-mains-queue-builds-each-group-on-top
  cancel-started:
    name: ${{ 'cancel-started' }}
    if: ${{ github.event_name == 'merge_group' && github.run_attempt == '1' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: .github/scripts/cancel-started-act.sh

  # why: .github/ci-notes/ci.md#the-verdict-and-one-of-the-two-checks-mains-ruleset-requires-of
  ci-ok:
    # why: .github/ci-notes/ci.md#why-a-dispatched-run-off-main-reports-under-names-of-its-own
    name: ${{ github.event_name == 'workflow_dispatch' && needs.changes.outputs.ref_is_main != 'true' && 'ci-ok (dispatch)' || 'ci-ok' }}
    needs: [changes, lint, scripts, ci-images, tool-fallback, go-daemon, daemon-go, plugin-pack, daemon-live, agent-harness, kind-image, kind, docs, ts, pi, claude-envoy-names, dispatch-browser, go-envoy, go-envoy-held, envoy-go, envoy-go-race-api, envoy-go-race-docs, dispatch-memory, airlock-arm, text-checks, notices, worker-image, browser-image]
    if: ${{ always() }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      checks: write
    steps:
      # why: .github/ci-notes/ci.md#the-job-reads-nothing-of-the-tree-but-ci-oksh-ci-okjq-ci-ok-reconcilesh-and
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
          persist-credentials: false

      # why: .github/ci-notes/ci.md#why-a-draft-pull-request-is-refused-in-a-step
      - name: Refuse a draft pull request
        if: ${{ github.event.pull_request.draft }}
        run: |
          echo "::error::ci-ok is failure because this pull request is a draft: every other job of this run skipped, so nothing in it has been tested. Mark the pull request ready for review: that starts a run which selects by the same diff and concludes a real verdict over it."
          exit 1

      # why: .github/ci-notes/ci.md#why-a-re-run-attempt-of-a-merge-group-run-is-refused-in-a-step
      - name: Refuse a re-run attempt of a merge-group run
        if: ${{ github.event_name == 'merge_group' && github.run_attempt != '1' }}
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          echo "::error::ci-ok is failure on attempt $RUN_ATTEMPT of this merge-group run, whatever the jobs of it did: a merge group is tested once, the queue builds a new group rather than re-running one, and this attempt judges a tree the queue is no longer waiting on."
          exit 1

      - name: Download the Go steps' gotestsum jsonfiles
        if: ${{ always() }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: go-test-*
          path: ${{ runner.temp }}/go-test-reports
          merge-multiple: true
      - name: Name each Go test that passed only on its retry
        if: ${{ always() }}
        run: |
          mkdir -p "$RUNNER_TEMP/go-test-reports"
          .github/scripts/ci-ok-retries.sh "$RUNNER_TEMP/go-test-reports"

      # why: .github/ci-notes/ci.md#needs-is-tojsonneeds-changes-result-and-outputs-with-every-other-jobs-result
      - name: Judge every job of this run
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
          SELECTED_BY: ${{ env.CI_OK_SELECTED_BY }}
          PULL_REQUEST_ONLY: ${{ env.CI_OK_PULL_REQUEST_ONLY }}
          ALWAYS_RUN: ${{ env.CI_OK_ALWAYS_RUN }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: .github/scripts/ci-ok.sh

      # why: .github/ci-notes/ci.md#why-every-other-ci-ok-on-this-head-is-set-to-this-jobs-conclusion
      - name: Set every other ci-ok on this head to this job's conclusion
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || needs.changes.outputs.ref_is_main == 'true') }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CHECK_RUN_ID: ${{ job.check_run_id }}
          CONCLUSION: ${{ job.status }}
        run: .github/scripts/ci-ok-reconcile.sh
