name: CI job envoy-go-race-api

# The steps of ci.yaml's `envoy-go-race-api` job, in a file of its own.
# ci.yaml's job of the same id calls this file, and that caller keeps `needs: changes` and the
# whole `if:` that decides whether these steps run, so this file carries no `if:` of its own.
#
# The split is for the filters. This job's filter names this file beside ci.yaml, so a change to
# these steps selects this job alone, where a change to ci.yaml selects every job.
#
# The job's last step reports ci-ok for the caller: on a merge-group run this job's own result
# decides, it posts the failing ci-ok at once (.github/actions/ci-ok-report), as every job of
# ci.yaml ends. `ci-ok-changes` carries ci.yaml's `toJSON(needs.changes)` for it.
on:
  workflow_call:
    inputs:
      ci-ok-changes:
        description: >-
          ci.yaml's `toJSON(needs.changes)`: end the job with ci-ok's report
          (.github/actions/ci-ok-report), as every job of ci.yaml ends.
        type: string
        required: true

# A `|` between proxy entries makes a go command fall through to the next source after ANY error,
# where a `,` falls through only after a 404 or a 410 (Go's module reference, "GOPROXY protocol").
# proxy.golang.org reset a download mid-stream and turned a Go lane red on a module whose hash
# go.sum already holds (sjawhar/legion#2512); with `|direct` the command fetches the same bytes
# straight from the source and checks them against go.sum, so this is a second path, not a weaker
# check.
env:
  GOPROXY: https://proxy.golang.org|direct

jobs:
  envoy-go-race-api:
    runs-on: ubuntu-24.04-arm
    # The step's --timeout 70m must fire before the runner cancels the job, so a hung test prints
    # the dump that names it: about 1 minute of setup, up to 5 minutes to compile the race
    # binaries, then the step's own 70 minutes, which is 76, under the job's 90. 70 minutes is
    # twice the longest measured run: the package took 32.6 minutes under the race detector on a
    # dev box, and this job took 32 minutes 48 seconds, past the 30 minutes it had. Each leg keeps
    # that bound for its one shard.
    timeout-minutes: 90
    # One leg per shard of the package's tests. Run whole, the package held one runner for up to
    # 32 minutes 48 seconds, the longest gate of a run, and a runner lost communication 65 minutes
    # into one such step (job 136498402764, 2026-11-20). Each leg runs the shard
    # .github/scripts/go-test-shards.py gives it, a test's shard being crc32(name) mod the leg
    # count, so a test added later lands in exactly one leg and none is kept by hand. The script
    # reads the leg count and this leg's index from the matrix itself (strategy.job-total,
    # strategy.job-index), so this list is the one place the count is written: a leg added here
    # re-splits every shard. Every leg pays the race compile again, about 2.3 minutes, and runs one
    # shard of the package. Measured in run 44364075646 at ceee521b96: legs 1 to 3 ran 741, 760
    # and 763 of the 2,264 tests, and their go test took 489.3 s, 466.2 s and 494.7 s.
    # fail-fast is off so one leg's failure leaves the others to name theirs, as one job did.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        # ghcr.io/cybermonklabs/legion/ci, the copy of pgvector/pgvector (.github/ci-images.yaml)
        image: ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      JOB_TIMEOUT_MINUTES: 90 # this job's timeout-minutes, for gh-read.sh's wait (check-workflow-files.sh holds the two equal)
      DISPATCH_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      # The broker's store, which the package's contract tests open (brokerstoretest.Open in
      # internal/dispatch/api/contract_test.go) and skip without; a skip is a pass, so without this
      # variable they never run under the race detector.
      BROKER_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          go-download-base-url: https://go.dev/dl
          token: ''
          cache: false
      - name: Size the service for this lane's Dispatch processes
        run: .github/scripts/pg-connection-ceiling.sh "${{ job.services.postgres.id }}"
      # The leg's shard of the package. go-test-shards.py builds the race test binary, lists its
      # tests, proves the legs' -run patterns together select each of them exactly once - failing
      # the step, by test name, on one in no shard or in two - and prints this leg's pattern. The
      # assignment is a line of its own: under bash -e it carries the script's exit status, so a
      # refusal fails the step instead of running -run "", which matches every test.
      # go test counts a skipped test as a pass and, without -v, prints nothing for it, so the leg
      # runs its shard through packages/envoy/scripts/database-skips.sh, which runs it with -json
      # and counts that run's skips. --run holds the leg to the EXPECTED_SKIPS lines (measurements
      # and replays that need a database, a corpus or a variable no CI run sets, and a subprocess
      # helper) of the tests its pattern selects, as the race test binary lists them, and it fails
      # on any other skip, on a line whose test the binary does not list, and on a selected
      # expected skip the run does not hold. It prints database_skips=UNKNOWN and runs nothing
      # when either database variable above is unset, and on a failed run prints the failed tests'
      # output, a timed-out binary's goroutine dump among it.
      - name: Race-test the Dispatch API
        run: |
          pattern=$(../../.github/scripts/go-test-shards.py pattern ${{ strategy.job-index }} ${{ strategy.job-total }} -race ./internal/dispatch/api/)
          scripts/database-skips.sh --var DISPATCH_TEST_DATABASE_URL --var BROKER_TEST_DATABASE_URL --race --timeout 70m --run "$pattern" ./internal/dispatch/api/
        working-directory: packages/envoy

      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        uses: ./.github/actions/ci-ok-report
        with:
          job: envoy-go-race-api
          changes: ${{ inputs.ci-ok-changes }}
          job-status: ${{ job.status }}
