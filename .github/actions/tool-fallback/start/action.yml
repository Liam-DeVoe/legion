name: Set up the tool-fallback proof
description: >-
  The opening steps of the tool-fallback leg of ci.yaml's tool-fallback job (x64): the merge base
  the negative control installs from, the package reads, the staged bytes, the origin that stands
  in for all four sources (its four base URLs are this action's outputs), the machine watch, and
  case 5 of 16, which runs before the fault. Every install of the proof is a step of ci.yaml with
  its own 11-minute bound; .github/actions/tool-fallback/x64 holds the steps between them.
# why: .github/ci-notes/tool-fallback.md#the-steps-of-ciyamls-tool-fallback-job-in-a-file-of-their-own
# The job holds the router's own scopes and no packages scope:
# why: .github/ci-notes/ci.md#why-the-tool-fallback-job-needs-no-packages-scope
outputs:
  github:
    description: The origin's stand-in for GitHub's release assets.
    value: ${{ steps.origin.outputs.github }}
  ghcr:
    description: The origin's stand-in for the ghcr copies.
    value: ${{ steps.origin.outputs.ghcr }}
  npm:
    description: The origin's stand-in for npm.
    value: ${{ steps.origin.outputs.npm }}
  url:
    description: The origin's stand-in for the other sources a row names.
    value: ${{ steps.origin.outputs.url }}
runs:
  using: composite
  steps:
    # why: .github/ci-notes/tool-fallback.md#why-the-merge-base-is-checked-out
    - name: Check out the merge base the negative control installs from
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
        path: base
        persist-credentials: false

    # why: .github/ci-notes/tool-fallback.md#why-the-packages-blob-is-read-for-every-mirrored-row
    - name: Check the package holds the blob of every mirrored row
      shell: bash
      run: .github/scripts/tool-fallback-package-blobs.sh

    # why: .github/ci-notes/tool-fallback.md#why-every-row-is-printed-beside-the-two-call-sites-that-read-its-digest
    - name: Print every row beside the two call sites that read its digest
      shell: bash
      run: .github/scripts/tool-fallback-row-call-sites.sh

    - name: Stage the correct bytes of every row a case serves, before the fault
      shell: bash
      run: .github/scripts/ci-tools-proof.sh stage

    - id: origin
      name: Start the origin that stands in for all four sources
      shell: bash
      run: .github/scripts/ci-tools-proof.sh origin-start

    # why: .github/ci-notes/tool-fallback.md#what-the-machine-watch-records-and-what-it-cannot-show
    - name: Start the machine watch over every faulted install
      shell: bash
      run: .github/scripts/disk_watch.py start --path "$RUNNER_TEMP" --state "$RUNNER_TEMP/disk-watch.json"

    # why: .github/ci-notes/tool-fallback.md#case-5-of-18-and-why-it-runs-before-the-fault
    - name: Corrupt nothing at the origin for the jj-primary case
      shell: bash
      run: .github/scripts/ci-tools-proof.sh corrupt

    - name: Seed mise's install of jj with the staged binary, one byte changed
      shell: bash
      run: |
        set -euo pipefail
        proof=.github/scripts/ci-tools-proof.sh
        corrupted="$RUNNER_TEMP/jj-one-byte-changed"
        cp -- "$("$proof" payload-path jj)" "$corrupted"
        "$proof" flip-last-byte "$corrupted"
        "$proof" seed-mise-jj "$corrupted"
        rm -f "$corrupted"
