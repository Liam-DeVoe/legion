name: Build the worker image the kind legs test
description: >-
  The steps of ci.yaml's kind-image job: packages/daemon/docker/worker.Dockerfile built once per
  run as worker-image.yaml's build builds it, from the same context, BuildKit and layer cache
  scope (cache-from: type=gha,scope=worker-image, main's cache, read and never written here),
  publishing nothing: the image goes into a docker archive with uncompressed layers, which zstd
  compresses whole, and each leg of the kind job downloads that as the artifact
  kind-image-worker-image. The kind job runs on a merge group and on a dispatched run with the
  kind-and-agent-harness input, never on a pull request, so no run of it has a worker-image build
  of its own head to take the image from. The leak guard's test
  (scripts/e2e/leak-guard-image-probe.sh) runs in that image on the kind job's leak-guard leg,
  loaded from the archive, so it is off the path every other leg waits on. The kind filter of
  .github/ci-areas.yaml names every file the build and that test read.
# why: .github/ci-notes/ci.md#the-kind-image-job
runs:
  using: composite
  steps:
    # worker-image.yaml's builder: provenance-add-gha=false keeps the run's event out of every
    # predicate, and image= is the driver's own BuildKit, ghcr.io/cybermonklabs/legion/ci's copy
    # of moby/buildkit:buildx-stable-1 (.github/ci-images.yaml), which is why kind-image needs
    # ci-images. cleanup: false leaves the builder and its state on the runner, which is discarded
    # after the job: its removal took 103 s on average and up to 174 s of the image job's time in
    # CI runs 44816526076 to 44868985209, all of it on the kind chain.
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      with:
        cleanup: false
        driver-opts: |
          provenance-add-gha=false
          image=ghcr.io/cybermonklabs/legion/ci@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

    # worker-image.yaml's build of the same Dockerfile and context, reading main's layer cache
    # under the same scope and writing none, with the version label and the plugin versions left
    # to their pull-request defaults. The two env names keep the run's event out of the metadata
    # the action logs, as that build's comment says. Its final probe runs in full, as
    # worker-image.yaml's does. The archive's layers are uncompressed, cached ones included
    # (force-compression), so the zstd step below compresses the image's own bytes rather than gzip
    # streams it cannot shrink.
    - name: Build the worker image into a docker archive
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      env:
        BUILDX_METADATA_PROVENANCE: disabled
        DOCKER_BUILD_SUMMARY: "false"
      with:
        context: .
        file: packages/daemon/docker/worker.Dockerfile
        platforms: linux/amd64
        provenance: false
        push: false
        outputs: type=docker,dest=${{ runner.temp }}/worker-image.tar,compression=uncompressed,force-compression=true
        tags: legion-worker:kind
        cache-from: type=gha,scope=worker-image
        build-args: |
          LEGION_REVISION=${{ github.sha }}

    # The whole archive in one zstd frame, multi-threaded (-T0) with a 1 GiB long-distance window
    # (--long=30), which finds the files one layer repeats of another. On the uncompressed layers
    # of main's worker image (6,173 MB), zstd 1.5.5, the runner image's own, wrote 1,957 MB at
    # level 3 in 69 s of CPU, about 20 s on this runner's four cores, where the gzip layers the
    # archive held before came to 2,344 MB; level 6 saved 80 MB more for twice the time on this
    # job, which every kind leg waits on. --rm drops the uncompressed archive once it is written.
    - name: Compress the worker image archive
      shell: bash
      env:
        ARCHIVE: ${{ runner.temp }}/worker-image.tar
      run: |
        zstd -T0 -3 --long=30 --rm -q "$ARCHIVE" -o "$ARCHIVE.zst"
        ls -l "$ARCHIVE.zst"

    # The archive is zstd's already, so the artifact stores it as it is. A day is long enough for
    # a re-run of the leg that reads it. The name holds no run attempt and the upload overwrites:
    # `gh run rerun --job <leg>` starts the leg's attempt without this job, and a download by name
    # reads the run's artifacts of every attempt, so the leg finds the image the first attempt
    # built; a re-run of this job uploads the same commit's image under the same name.
    - name: Upload the worker image
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: kind-image-worker-image
        path: ${{ runner.temp }}/worker-image.tar.zst
        compression-level: 0
        retention-days: 1
        if-no-files-found: error
        overwrite: true
