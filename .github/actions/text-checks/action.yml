name: The checks whose subject is text
description: >-
  The steps of ci.yaml's text-checks job: the tests whose subject is text - a guide's wording
  against the code it pins, a file copied from one tree to another, the imports a package may have,
  the Dispatch API's nine static source checks (its eight source guards and
  one_expression_guard_test.go), which read the module's own source, and the two pure pins of the
  daemon's supervise table, which read that package's own source and, with it, the source of every
  package it imports, since their type-check resolves imports from source (table_test.go:99). None
  of them starts a server, a container or a database, so none of them belongs in a
  Postgres-backed product suite. Each module keeps its own package of them, internal/textcheck,
  and this job runs those three packages, those checks' seventeen tests and those two pins; the
  product lanes leave exactly those out of their own runs (.github/scripts/ci_job_reads.py's
  TEXT_CHECK_PACKAGE, TEXT_CHECK_TESTS and SUPERVISE_TABLE_TESTS build both sides), so each of
  these tests runs once per run of the router.

  packages/envoy/infra is a module of its own, with a go.work of its own binding it and
  packages/envoy, so its text checks run from inside that directory rather than through the root
  workspace. -count=1 on every call: these tests read files outside their own modules - a guide
  under docs/, a skill under skills/, the committed extract beside the code it pins - and Go's test
  cache keys on neither, so a cached pass would say nothing about the text as it now stands.

  The job restores no Actions cache: each Go cache family is filled for a job that builds a whole
  module's binaries or test binaries, and this job builds five packages, which measured cheaper
  cold than the download and extraction of any family would cost it (the four calls before the
  supervise pins joined took 4 minutes 4 seconds with an empty build cache and 34 seconds with a
  warm one; the supervise pins type-check internal/supervise's whole import closure from source,
  86 s of the fifth call). setup-go caches nothing either (`cache: false`). Each go test runs
  under gotestsum through .github/scripts/go-test.sh, its jsonfile uploaded as
  go-test-text-checks-text-checks-<step>.
runs:
  using: composite
  steps:
    # All three modules pin the same Go in their go.mod, so one install serves the three
    # directories below; packages/envoy's is the one this reads.
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: packages/envoy/go.mod
        cache: false
    - uses: ./.github/actions/install-gotestsum

    - name: Check the text packages/envoy pins
      shell: bash
      working-directory: packages/envoy
      run: ../../.github/scripts/go-test.sh --jsonfile text-checks-text-checks-envoy.json --packages ./internal/textcheck/ -- -count=1
    - if: always()
      uses: ./.github/actions/go-test-upload
      with:
        name: text-checks-text-checks-envoy

    - name: Check the text packages/envoy/infra pins
      shell: bash
      working-directory: packages/envoy/infra
      run: ../../../.github/scripts/go-test.sh --jsonfile text-checks-text-checks-infra.json --packages ./internal/textcheck/ -- -count=1
    - if: always()
      uses: ./.github/actions/go-test-upload
      with:
        name: text-checks-text-checks-infra

    - name: Check the text packages/daemon pins
      shell: bash
      working-directory: packages/daemon
      run: ../../.github/scripts/go-test.sh --jsonfile text-checks-text-checks-daemon.json --packages ./internal/textcheck/ -- -count=1
    - if: always()
      uses: ./.github/actions/go-test-upload
      with:
        name: text-checks-text-checks-daemon

    # The seventeen tests of the API's nine static source checks read the module's source and
    # open no database, so they run here rather than in the job that carries Postgres for that
    # package. They sit in the package they guard, beside its Postgres-backed tests, so this step
    # selects them by name: the list is generated in .github/scripts/ci_job_reads.py from
    # TEXT_CHECK_TESTS, the same declaration that leaves exactly these seventeen out of envoy-go's
    # plain step. The package's other tests skip without DISPATCH_TEST_DATABASE_URL, and -run keeps
    # this step from even building their fixtures' work.
    - name: Test the Dispatch API's source guards (no database)
      shell: bash
      working-directory: packages/envoy
      run: ../../.github/scripts/go-test.sh --jsonfile text-checks-text-checks-api-guards.json --packages ./internal/dispatch/api -- -count=1 -run '^(TestCopyLockComesBeforeEveryPendingRowAndEvent|TestCopyLockOrderGuardFollowsTheLockTakers|TestEveryKeyedWriteCommitsInsideATransactionTheMarkHooks|TestEveryReviewReadOrdersByReviewOrder|TestEveryRouteThatTakesABodyRefusesADecisionBlock|TestNoForUpdateOnOwnerTables|TestOneExpressionDecidesWhoWaitsInOneSpelling|TestOnlyQueueReviewWritesReviews|TestOnlyTheBrokerInsertsEvents|TestOnlyTheIssuePatchWritesTheRoute|TestTheDecisionBlockGuardSeesWhatItGuards|TestTheGuardReadsABodyStringOffARequestType|TestTheKeyedWriteGuardSeesWhatItGuards|TestTheReviewOrderGuardReadsBothOrders|TestTheReviewWriterPatternsReadEveryNameOfTheTable|TestTheReviewWriterScanFindsAnIdentifierNamingTheTable|TestTheRouteWriterGuardSeesAPlantedWriter)$'
    - if: always()
      uses: ./.github/actions/go-test-upload
      with:
        name: text-checks-text-checks-api-guards

    # The two pure pins of packages/daemon's supervise table: they hold the table to the package's
    # own source - a row or a named ignore for every event in every state, and one event type per
    # kind - which sealed() reads by parsing every non-test .go file of the package
    # (internal/supervise/table_test.go:27-58). They open no database and start no process; they
    # sit in a package of machine-driving tests, so this step selects them by name, and the
    # go-daemon plain step skips exactly these two by name. The list is generated in
    # .github/scripts/ci_job_reads.py from SUPERVISE_TABLE_TESTS, which builds both steps' texts.
    - name: Test the supervise table's two pure pins (no database)
      shell: bash
      working-directory: packages/daemon
      run: ../../.github/scripts/go-test.sh --jsonfile text-checks-text-checks-supervise.json --packages ./internal/supervise/ -- -count=1 -run '^(TestNoTwoEventTypesShareAKind|TestTheTableHasARowOrANamedIgnoreForEveryEventInEveryState)$'
    - if: always()
      uses: ./.github/actions/go-test-upload
      with:
        name: text-checks-text-checks-supervise
