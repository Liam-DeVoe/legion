name: The airlock's check k9 or its lease test, on arm64
description: >-
  The steps of one leg of ci.yaml's airlock-arm job: k9, check k9 of the airlock's verification
  document (dispatch://INFRA-1352) under ten minutes of generated load, and its negative control;
  or lease, the airlock stack's pod session outliving its lease
  (packages/envoy/scripts/dev-airlock-lease.test.sh). Both run on ubuntu-24.04-arm as the
  broker-multiprocess job ran them. They ran there behind step gates on `merge_group` and the
  `full-ci` label; here the job's own gate holds them to the merge queue, to a pull request with
  `full-ci` and to a dispatched run, as it holds every held suite, and the steps carry no gate of
  their own but the leg's.

  Each stack (packages/envoy/scripts/dev-airlock.sh) starts as the runner's user in a step of its
  own, which builds its binaries and so fills the module cache, and stays up for the steps after
  it: k9's with github.com's stand-in (--git-stand-in), which k9's shallow clone reads, then the
  control's with --idle-seconds 60, each broker under GOMAXPROCS=1 as k9 measures it; and the
  lease test's with one broker and a 91-second lease. Each makes a database of its own on the
  job's Postgres through psql, and serves each bound host on port 443 of a loopback address of
  its own, which the runner's user may bind only once the kernel lets it. The check and the test
  run against the running stack (--stack-log) in a cgroup of their own, legion-test, through the
  step shell legion-test-shell (.github/scripts/test-fence.sh), as the runner's user, who owns the
  stack: an iptables and an ip6tables rule matched on that cgroup let their outbound connections,
  and those of every process they start, reach loopback and the bridge of the job's Postgres
  container alone, and log and refuse every other one. The last step prints the rule, its match
  and counters in both families and its refusals.
inputs:
  leg:
    description: The leg of ci.yaml's airlock-arm job, k9 or lease, the part of its check-run name after `airlock-arm / `.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: packages/envoy/go.mod
        go-download-base-url: https://go.dev/dl
        token: ''
        cache: false

    - name: Install psql for the airlock stack
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends postgresql-client

    # From here the check's steps run in the cgroup legion-test, as the runner's user; their
    # outbound connections reach loopback and the bridge of each container the job runs, its
    # Postgres service, alone.
    - id: fence
      name: Fence the check's process to loopback and the job's Postgres container
      shell: bash
      run: |
        sudo sysctl -w net.ipv4.ip_unprivileged_port_start=443
        containers=()
        for id in $(docker ps -q); do containers+=(--container "$id"); done
        .github/scripts/test-fence.sh fence "${containers[@]}"

    # Each stack's dev-airlock.sh runs in a session of its own with its output in
    # $RUNNER_TEMP/airlock-<stack>.log and its pid beside it; the step ends once its banner says
    # ready. The leg's own stack first: k9's, with github.com's stand-in and each broker under
    # GOMAXPROCS=1, or the lease test's, with one broker at the shortest lease it starts with.
    - name: Start the leg's stack
      shell: bash
      env:
        STACK: ${{ inputs.leg }}
      run: |
        case "$STACK" in
          k9) export GOMAXPROCS=1; options=(--git-stand-in) ;;
          lease) export BROKER_LEASE_SECONDS=91; options=(--one-broker) ;;
          *) echo "::error::no stack is named $STACK"; exit 1 ;;
        esac
        log=$RUNNER_TEMP/airlock-$STACK.log
        DEV_BROKER_POSTGRES_URL='postgres://postgres:ci@localhost:5432/postgres?sslmode=disable' \
          setsid bash packages/envoy/scripts/dev-airlock.sh "${options[@]}" >"$log" 2>&1 </dev/null &
        echo "$!" >"$log.pid"
        timeout 900 bash -c 'until grep -q "^dev-airlock: ready\.$" "$1"; do kill -0 "$2" || exit 1; sleep 1; done' _ "$log" "$!" ||
          { tail -n 40 "$log"; echo "::error::the $STACK stack did not come up (dev-airlock.sh ${options[*]})"; exit 1; }
        sed -n '/^dev-airlock: ready\.$/,$p' "$log"

    # Under ten minutes of generated load no call fails, the proxy adds at most 100 ms at the
    # median, and each broker process stays within half its wall time in CPU and 1 GiB of memory.
    # k9 with its control took 899 s in run 44808127763. The script prints one CHECK line per
    # property.
    - name: Airlock check k9 under load
      if: inputs.leg == 'k9'
      shell: legion-test-shell {0}
      run: bash packages/envoy/scripts/airlock-check.sh k9 --stack-log "$RUNNER_TEMP/airlock-k9.log"

    # A 30-minute grant used before and after three leases pass. It prints one PASS: or FAIL:
    # line per property and takes about five minutes (285 s with its stack in run 44808127763).
    - name: Airlock session outlives its lease
      if: inputs.leg == 'lease'
      shell: legion-test-shell {0}
      run: bash packages/envoy/scripts/dev-airlock-lease.test.sh --stack-log "$RUNNER_TEMP/airlock-lease.log"

    # SIGTERM, whose EXIT trap in dev-airlock.sh stops the stack's processes and drops its
    # databases, and the end of that.
    - name: Stop the leg's stack
      if: always()
      shell: bash
      env:
        STACK: ${{ inputs.leg }}
      run: |
        pid=$(cat "$RUNNER_TEMP/airlock-$STACK.log.pid" 2>/dev/null) || exit 0
        kill "$pid" 2>/dev/null || exit 0
        timeout 120 tail --pid="$pid" -f /dev/null

    # k9's negative control on a stack of its own, which binds the same loopback addresses and so
    # starts once k9's stack is gone: its proxy cuts an idle connection at 60 seconds.
    - name: Start the stack of k9's negative control
      if: inputs.leg == 'k9'
      shell: bash
      run: |
        log=$RUNNER_TEMP/airlock-k9-control.log
        GOMAXPROCS=1 DEV_BROKER_POSTGRES_URL='postgres://postgres:ci@localhost:5432/postgres?sslmode=disable' \
          setsid bash packages/envoy/scripts/dev-airlock.sh --idle-seconds 60 >"$log" 2>&1 </dev/null &
        echo "$!" >"$log.pid"
        timeout 900 bash -c 'until grep -q "^dev-airlock: ready\.$" "$1"; do kill -0 "$2" || exit 1; sleep 1; done' _ "$log" "$!" ||
          { tail -n 40 "$log"; echo "::error::the control's stack did not come up (dev-airlock.sh --idle-seconds 60)"; exit 1; }
        sed -n '/^dev-airlock: ready\.$/,$p' "$log"

    - name: Airlock check k9's negative control
      if: inputs.leg == 'k9'
      shell: legion-test-shell {0}
      run: bash packages/envoy/scripts/airlock-check.sh k9 --control --stack-log "$RUNNER_TEMP/airlock-k9-control.log"

    - name: Stop the control's stack
      if: always() && inputs.leg == 'k9'
      shell: bash
      run: |
        pid=$(cat "$RUNNER_TEMP/airlock-k9-control.log.pid" 2>/dev/null) || exit 0
        kill "$pid" 2>/dev/null || exit 0
        timeout 120 tail --pid="$pid" -f /dev/null

    # The rule, its match on the cgroup and its counters in both families, and its refusals, none
    # expected.
    - name: Print the rule and what it refused
      if: always() && steps.fence.outcome == 'success'
      shell: bash
      run: .github/scripts/test-fence.sh report
