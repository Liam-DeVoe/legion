name: Check every Go release archive's third-party notices
description: >-
  The steps of ci.yaml's notices job, the third-party-notices step that ran in the lint job, now a
  job of its own on its own filter: the modules the release builds load, the target lists and its
  script (.github/ci-areas.yaml's notices). Every Go archive a release ships carries
  THIRD_PARTY_NOTICES, written at build time with the build's own GOOS, GOARCH and CGO_ENABLED
  (release.yaml's legion_build job and release-envoy-listener.yaml, whose targets
  .github/go-release-targets.json lists for all of them, and release-envoy-infra.yaml, whose
  targets .github/envoy-infra-targets.json lists). Writing them here for each of those builds fails
  the pull request that brings in a module whose license cannot be determined, before a release
  does. Writing notices loads packages without type-checking them, so the darwin agent-secrets
  client and every command of the envoy-infra module, which no other pull-request job builds for
  each of its targets, are also compiled here, with their release builds' CGO_ENABLED and
  -buildvcs: a compile error on one platform only fails the pull request rather than the release
  after the merge.
runs:
  using: composite
  steps:
    # The daemon's Go, as the lint job installed it for this step: the go-notices key below names
    # its version.
    - id: setup-go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: packages/daemon/go.mod
        go-download-base-url: https://go.dev/dl
        token: ''
        cache: false

    # The notices step below builds go-licenses and loads every release binary's modules. It keeps
    # them in a cache family of its own, go-notices: one entry, read on every run, so never
    # evicted, and refreshed only when Go is bumped. Keyed on the go.sum files it would leave a
    # 2.2 GB entry per key change; keyed on the Go version, a go.sum change only downloads the
    # changed modules and rebuilds the changed packages, since Go's build cache is
    # content-addressed. ci-caches.yaml's notices job fills it, on ubuntu-24.04-arm, the runner
    # this job runs on.
    #
    # The runner's architecture comes before the OS in this family's key, where the other Go
    # families put it after: the entry holds go-licenses, a program of the runner that built it,
    # which the notices step runs. A run of a workflow file older than the architecture in the key
    # restores on ubuntu-24.04 by the prefix go-notices-Linux-, and an entry keyed
    # go-notices-Linux-ARM64-go<version> starts with that prefix: such a run restored main's arm64
    # go-licenses on x86_64 and failed on it with "Exec format error" (run 44437023306). No key of
    # this shape starts with go-notices-Linux-, so no older prefix matches an entry of this shape,
    # and a run of this shape names its own runner's architecture first, so it matches only an
    # entry of that architecture.
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
          ~/.cache/legion
        key: go-notices-${{ runner.arch }}-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}
        restore-keys: ${{ format('go-notices-{0}-{1}-', runner.arch, runner.os) }}

    # The loops are in .github/scripts/go-release-notices.sh, which
    # .github/workflows/ci-caches.yaml's notices job runs too, to fill the go-notices entry this
    # job restores: one script, so the fill cannot warm anything but what this step builds.
    - name: Check every Go release archive's third-party notices can be written and the cross-built commands compile
      shell: bash
      run: .github/scripts/go-release-notices.sh "$RUNNER_TEMP/notices"
