name: ci-images
description: >-
  The steps of ci.yaml's ci-images job, which carries the old check-run name
  `ci-images / ci-images`: copy every image .github/ci-images.yaml names into this repository's
  package, check the package holds every row, and fill the copy of every tool asset of
  .github/ci-tools.yaml the package does not hold. The job holds `packages: write` for the
  pushes; this action logs in with the job's token. It runs on ubuntu-24.04-arm, after the job's
  checkout.
# why: .github/ci-notes/ci.md#what-the-ci-images-job-copies-and-why-the-order-is-the-point
runs:
  using: composite
  steps:
    - uses: ./.github/actions/install-crane

    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Copy every image the package does not hold
      shell: bash
      run: .github/scripts/mirror-ci-images.sh

    - name: Check the package holds every row of .github/ci-images.yaml
      shell: bash
      run: .github/scripts/check-ci-images.sh package

    - name: Fill the copy of every tool asset the package does not hold
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: .github/scripts/mirror-ci-tools.sh
