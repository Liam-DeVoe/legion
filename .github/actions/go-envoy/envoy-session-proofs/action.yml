name: envoy-session-proofs
description: >-
  The envoy-session-proofs leg of ci.yaml's envoy-held job: three proofs this change brought into
  CI against envoy and Dispatch stacks built from this tree, on the job's Postgres - claimant
  delivery of Dispatch's outbox (scripts/e2e/dispatch-claimant-delivery.sh), the verification
  results of Dispatch (scripts/e2e/verification-results.sh) and the session title of claude-envoy
  (packages/claude-envoy/scripts/smoke-session-title.sh) - which the merge queue runs, and a pull
  request with full-ci or a lane label of the job. They ran in envoy-session-stall's leg, which
  passed the 10 minutes a pull request's job is held to with them (14.7 to 16.5 minutes in the
  head's dispatch runs). The leg runs on ubuntu-24.04, with the setup that leg gives them.
  LEGION_E2E_ENVOY_STACK and LEGION_E2E_DISPATCH_STACK select the suites that start the envoy and
  Dispatch stacks, and DISPATCH_TEST_DATABASE_URL names the job's Postgres; each step carries them.
inputs:
  postgres:
    description: The id of the job's Postgres service container (ci.yaml's `job.services.postgres.id`).
    required: true
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-bun
    - shell: bash
      run: bun install --frozen-lockfile
    - id: setup-go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: packages/envoy/go.mod
        go-download-base-url: https://go.dev/dl
        token: ''
        cache: false
    # go-envoy: the listener, natsd and envoy-dispatch the three proofs build.
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: go-envoy-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}
        restore-keys: ${{ format('go-envoy-{0}-{1}-', runner.os, runner.arch) }}
    - name: Size the service for this lane's Dispatch processes
      shell: bash
      env:
        POSTGRES_CONTAINER: ${{ inputs.postgres }}
      run: .github/scripts/pg-connection-ceiling.sh "$POSTGRES_CONTAINER"
    - name: Build contracts for the proofs
      shell: bash
      working-directory: packages/contracts
      run: bun run build
    # The two Dispatch proofs below each reset a database of their own on the job's Postgres,
    # through psql, which this runner may not carry.
    - name: Install psql and create the Dispatch proofs' databases
      shell: bash
      env:
        DISPATCH_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends postgresql-client
        for database in claimant_delivery verification_results; do
          psql "$DISPATCH_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c "create database $database"
        done
    # Dispatch's outbox publishes a person's answer, comment or untargeted message on a claimed
    # issue to the claiming session's own topic, and a mention skips the mentioned session's own
    # copy only once the mention's send landed: envoy-dispatch built from this tree, natsd and the
    # e2e harness's fake Envoy listener, one CHECK line per case.
    - name: Claimant delivery of Dispatch's outbox
      shell: bash
      env:
        LEGION_E2E_ENVOY_STACK: "1"
        LEGION_E2E_DISPATCH_STACK: "1"
        DISPATCH_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      run: DATABASE_URL="${DISPATCH_TEST_DATABASE_URL%/*}/claimant_delivery?sslmode=disable" bash scripts/e2e/dispatch-claimant-delivery.sh
    # A recorded check result says where its commit stands against the commits its check compares
    # with, and the head moves with the pull-request events Dispatch takes off the bus:
    # envoy-dispatch built from this tree against the e2e harness's fake GitHub, one CHECK line per
    # step and case.
    - name: Verification results of Dispatch
      shell: bash
      env:
        LEGION_E2E_ENVOY_STACK: "1"
        LEGION_E2E_DISPATCH_STACK: "1"
        DISPATCH_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      run: DATABASE_URL="${DISPATCH_TEST_DATABASE_URL%/*}/verification_results?sslmode=disable" bash scripts/e2e/verification-results.sh
    # The name a person gave a Claude Code session is what claude-envoy registers, a rename
    # replaces it, and a session nobody named keeps the folder-and-short-id fallback: the plugin's
    # bundles built from this tree, natsd and a listener, one CHECK line per case.
    - name: Session title of claude-envoy
      shell: bash
      env:
        LEGION_E2E_ENVOY_STACK: "1"
        LEGION_E2E_DISPATCH_STACK: "1"
        DISPATCH_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      run: bash packages/claude-envoy/scripts/smoke-session-title.sh
