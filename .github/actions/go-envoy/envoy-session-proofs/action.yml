name: envoy-session-proofs
description: >-
  The envoy-session-proofs leg of ci.yaml's envoy-held job: four proofs against envoy and
  Dispatch stacks built from this tree, on the job's Postgres - claimant delivery of Dispatch's
  outbox (scripts/e2e/dispatch-claimant-delivery.sh), the verification results of Dispatch
  (scripts/e2e/verification-results.sh), the session title of claude-envoy
  (packages/claude-envoy/scripts/smoke-session-title.sh) and a private project's secrets at the
  broker (packages/envoy/scripts/project-secrets-check.sh, its local-stack mode and its negative
  control) - which the merge queue runs, and a pull request with full-ci or a lane label of the
  job. The first three ran in envoy-session-stall's leg, which passed the 10 minutes a pull
  request's job is held to with them (16.2 minutes in CI run 45292147224). The leg runs on
  ubuntu-24.04, with the setup that leg gives them. DISPATCH_TEST_DATABASE_URL names the job's
  Postgres, and each proof's step carries it.
inputs:
  postgres:
    description: The id of the job's Postgres service container (ci.yaml's `job.services.postgres.id`).
    required: true
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-bun
    - shell: bash
      run: bun install --frozen-lockfile
    - id: setup-go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: packages/envoy/go.mod
        go-download-base-url: https://go.dev/dl
        token: ''
        cache: false
    # go-envoy: the listener, natsd, envoy-dispatch and the secrets stack's binaries the proofs build.
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: go-envoy-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}
        restore-keys: ${{ format('go-envoy-{0}-{1}-', runner.os, runner.arch) }}
    - name: Size the service for this lane's Dispatch processes
      shell: bash
      env:
        POSTGRES_CONTAINER: ${{ inputs.postgres }}
      run: .github/scripts/pg-connection-ceiling.sh "$POSTGRES_CONTAINER"
    - name: Build contracts for the proofs
      shell: bash
      working-directory: packages/contracts
      run: bun run build
    # The two Dispatch proofs below each reset a database of their own on the job's Postgres,
    # through psql, which this runner may not carry.
    - name: Install psql and create the Dispatch proofs' databases
      shell: bash
      env:
        DISPATCH_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends postgresql-client
        for database in claimant_delivery verification_results; do
          psql "$DISPATCH_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c "create database $database"
        done
    # Dispatch's outbox publishes a person's answer, comment or untargeted message on a claimed
    # issue to the claiming session's own topic, and a mention skips the mentioned session's own
    # copy only once the mention's send landed: envoy-dispatch built from this tree, natsd and the
    # e2e harness's fake Envoy listener, one CHECK line per case.
    - name: Claimant delivery of Dispatch's outbox
      shell: bash
      env:
        DISPATCH_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      run: DATABASE_URL="${DISPATCH_TEST_DATABASE_URL%/*}/claimant_delivery?sslmode=disable" bash scripts/e2e/dispatch-claimant-delivery.sh
    # A recorded check result says where its commit stands against the commits its check compares
    # with, and the head moves with the pull-request events Dispatch takes off the bus:
    # envoy-dispatch built from this tree against the e2e harness's fake GitHub, one CHECK line per
    # step and case.
    - name: Verification results of Dispatch
      shell: bash
      env:
        DISPATCH_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      run: DATABASE_URL="${DISPATCH_TEST_DATABASE_URL%/*}/verification_results?sslmode=disable" bash scripts/e2e/verification-results.sh
    # The name a person gave a Claude Code session is what claude-envoy registers, a rename
    # replaces it, and a session nobody named keeps the folder-and-short-id fallback: the plugin's
    # bundles built from this tree, natsd and a listener, one CHECK line per case.
    - name: Session title of claude-envoy
      shell: bash
      env:
        DISPATCH_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      run: bash packages/claude-envoy/scripts/smoke-session-title.sh
    # A private Dispatch project's secret goes only to a credential that names the project
    # (dispatch://INFRA-3862's R11): dev-stack.sh --project-access built from this tree, with the
    # broker's airlock stands in a container of the Debian image .github/ci-images.yaml copies, and
    # six callers' trades and requests, one PASS or FAIL line per row; it exits 0 only when all 16
    # rows ran and passed. Its live mode reads a deployment, a tool that no job runs.
    - name: Private project secrets on the local stack (project-secrets-check.sh)
      shell: bash
      working-directory: packages/envoy
      env:
        DISPATCH_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      run: |
        export DEV_STACK_AIRLOCK_IMAGE=ghcr.io/cybermonklabs/legion/ci@sha256:f6b08b09a05725f9431502d3b5714f5c4576e82c1a84fa1debe0c24a7e0c3ec4
        LEGION_TEST_PG_DSN="$DISPATCH_TEST_DATABASE_URL" bash scripts/project-secrets-check.sh
    # The same check's negative control on a stack of its own: PRIV_KEY written with no project
    # tag, so every caller gets it, and the run exits 1 naming the first caller that should have
    # been refused. The step passes only on that line, since a control that names no caller shows
    # a check blind to the rule.
    - name: Negative control of the private project secrets check (project-secrets-check.sh --control untagged)
      shell: bash
      working-directory: packages/envoy
      env:
        DISPATCH_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      run: |
        export DEV_STACK_AIRLOCK_IMAGE=ghcr.io/cybermonklabs/legion/ci@sha256:f6b08b09a05725f9431502d3b5714f5c4576e82c1a84fa1debe0c24a7e0c3ec4
        out=$RUNNER_TEMP/project-secrets-control.out
        status=0
        LEGION_TEST_PG_DSN="$DISPATCH_TEST_DATABASE_URL" bash scripts/project-secrets-check.sh --control untagged 2>&1 |
          tee "$out" || status=${PIPESTATUS[0]}
        if [ "$status" -ne 1 ] || ! grep -q '^control: the first caller that got PRIV_KEY although it should have been refused: ' "$out"; then
          echo "::error::the control exited $status and named no caller that got PRIV_KEY although it should have been refused"
          exit 1
        fi
