name: envoy-session-stall
description: >-
  The envoy-session-stall leg of ci.yaml's go-envoy job, which carries that old check-run name: the
  session-stall suites of envoy-client, pi-envoy and claude-envoy against a real natsd and listener,
  the session state rig, the role takeover smoke, and the real `dispatch` CLI and Dispatch server
  proofs, on the job's Postgres. The leg runs on ubuntu-24.04 (x86_64): the pinned Oh My Pi the
  session rig's third part runs ships linux-x64 alone. LEGION_E2E_ENVOY_STACK and
  LEGION_E2E_DISPATCH_STACK select the suites that start the envoy and Dispatch stacks, and
  DISPATCH_TEST_DATABASE_URL names the job's Postgres; each step that runs a suite carries them.
inputs:
  postgres:
    description: The id of the job's Postgres service container (ci.yaml's `job.services.postgres.id`).
    required: true
# why: .github/ci-notes/ci.md#the-session-stall-suites-the-session-state-rig-and-the-live-dispatch-stack
runs:
  using: composite
  steps:
    # The session rig's third part runs the pinned Oh My Pi and Claude Code: jj leaves the mise
    # install-omp installs the pin through, and install-claude-code needs Bun.
    - uses: ./.github/actions/install-jj
    - uses: ./.github/actions/install-omp
    - uses: ./.github/actions/setup-bun
    - shell: bash
      run: bun install --frozen-lockfile
    - uses: ./.github/actions/install-claude-code
    - id: setup-go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: packages/envoy/go.mod
        cache: false
    # go-envoy: the listener and natsd test/envoy-stack.ts builds, as envoy-e2e-local's e2e-local.sh
    # does.
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: go-envoy-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}
        restore-keys: ${{ format('go-envoy-{0}-{1}-', runner.os, runner.arch) }}
    - name: Size the service for this lane's Dispatch processes
      shell: bash
      env:
        POSTGRES_CONTAINER: ${{ inputs.postgres }}
      run: .github/scripts/pg-connection-ceiling.sh "$POSTGRES_CONTAINER"
    - name: Build contracts for the stall suites
      shell: bash
      working-directory: packages/contracts
      run: bun run build
    - name: Stall test of envoy-client's NATS connection options
      shell: bash
      working-directory: packages/envoy-client
      env:
        LEGION_E2E_ENVOY_STACK: "1"
        LEGION_E2E_DISPATCH_STACK: "1"
        DISPATCH_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      run: bun test src/__tests__/nats-stall.test.ts
    # A session's broker-token credential on a real natsd behind the real NATS auth service
    # (packages/envoy/internal/testnats/cmd/calloutd, built beside natsd): a token that lapses
    # while the stub broker is away, every reconnect refused and the connection admitted again once
    # a token is live (slice E2, t-e-9); and a session switch that subscribes the new session's
    # subject only once the connection is admitted with its token (t-e-10).
    - name: Broker credential tests on a hub behind the auth service
      shell: bash
      working-directory: packages/envoy-client
      env:
        LEGION_E2E_ENVOY_STACK: "1"
        LEGION_E2E_DISPATCH_STACK: "1"
        DISPATCH_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      run: bun test src/__tests__/nats-credential.test.ts -t "a session's connection to a hub behind the auth service"
    # A path, not a filter: bun test discovers only names holding ".test" or ".spec", and takes
    # this one as a file because of the leading "./". Its three parts: the session states on a
    # stalled child; what a stalled session keeps across a second listener, a bus outage and
    # Dispatch; and the real hosts' new session and /clear and resume.
    - name: Session state rig of a stalled session
      shell: bash
      working-directory: packages/envoy-client
      env:
        LEGION_E2E_ENVOY_STACK: "1"
        LEGION_E2E_DISPATCH_STACK: "1"
        DISPATCH_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      run: bun test ./test/session-stall.ts
    # Through the package's own test script, so the file's hooks get the one --timeout that
    # packages/pi-envoy/package.json sets, as the pi-envoy job's run gives them.
    - name: Stall test of pi-envoy
      shell: bash
      working-directory: packages/pi-envoy
      env:
        LEGION_E2E_ENVOY_STACK: "1"
        LEGION_E2E_DISPATCH_STACK: "1"
        DISPATCH_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      run: bun run test extensions/envoy.test.ts -t "NATS path freezes"
    - name: Stall test of claude-envoy
      shell: bash
      working-directory: packages/claude-envoy
      env:
        LEGION_E2E_ENVOY_STACK: "1"
        LEGION_E2E_DISPATCH_STACK: "1"
        DISPATCH_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      run: bun test tests/envoy-channel-stall.test.ts
    # The role takeover smoke (INFRA-404, A5): one line per row of its spec's R8 table, driven with
    # real client processes against a listener and natsd this leg already sets Go up for. It needs
    # no model provider and no deployment, so unlike the other smokes in packages/pi-envoy/scripts
    # it runs here.
    - name: Role takeover smoke
      shell: bash
      env:
        LEGION_E2E_ENVOY_STACK: "1"
        LEGION_E2E_DISPATCH_STACK: "1"
        DISPATCH_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      run: bash packages/pi-envoy/scripts/smoke-role-takeover.sh
    # The design-gate advice over the real CLI and a real Dispatch server (dispatch://INFRA-1727):
    # the server this suite starts is built from this tree, so what it asserts is the sentence a
    # person reads in a terminal rather than one rendered from a stub.
    - name: Design-gate advice of the real CLI against a real Dispatch
      shell: bash
      working-directory: packages/envoy-client
      env:
        LEGION_E2E_ENVOY_STACK: "1"
        LEGION_E2E_DISPATCH_STACK: "1"
        DISPATCH_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      run: bun test src/__tests__/design-gate-advice.live.test.ts
    # The moved-approval-request advice over the same real CLI and real Dispatch
    # (dispatch://INFRA-3096): it proves the field the server fills on a write that takes an open
    # approval request back from the person is the field the CLI reads and prints.
    - name: Moved-approval advice of the real CLI against a real Dispatch
      shell: bash
      working-directory: packages/envoy-client
      env:
        LEGION_E2E_ENVOY_STACK: "1"
        LEGION_E2E_DISPATCH_STACK: "1"
        DISPATCH_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      run: bun test src/__tests__/moved-approval-advice.live.test.ts
    # A comment's role: mention over the same real CLI and real Dispatch (#4426): the comment the
    # CLI posts with --mention carries one delivery attempt for that target, which is what lets an
    # agent write to the owner of a subject and leave the retry to Dispatch.
    - name: Comment mention of the real CLI against a real Dispatch
      shell: bash
      working-directory: packages/envoy-client
      env:
        LEGION_E2E_ENVOY_STACK: "1"
        LEGION_E2E_DISPATCH_STACK: "1"
        DISPATCH_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      run: bun test src/__tests__/comment-mention.live.test.ts
    # A person's approval pins the bytes of the version they approved, and the real `dispatch` CLI
    # against a real Dispatch server of this tree prints the hash of that version's UTF-8 bytes,
    # after a later version too.
    - name: Approved-version bytes of the real CLI against a real Dispatch
      shell: bash
      working-directory: packages/envoy-client
      env:
        LEGION_E2E_ENVOY_STACK: "1"
        LEGION_E2E_DISPATCH_STACK: "1"
        DISPATCH_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      run: bun test src/__tests__/approved-version-bytes.live.test.ts
    # The two Dispatch proofs below each reset a database of their own on the job's Postgres,
    # through psql, which this runner may not carry.
    - name: Install psql and create the Dispatch proofs' databases
      shell: bash
      env:
        DISPATCH_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends postgresql-client
        for database in claimant_delivery verification_results; do
          psql "$DISPATCH_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c "create database $database"
        done
    # Dispatch's outbox publishes a person's answer, comment or untargeted message on a claimed
    # issue to the claiming session's own topic, and a mention skips the mentioned session's own
    # copy only once the mention's send landed: envoy-dispatch built from this tree, natsd and the
    # e2e harness's fake Envoy listener, one CHECK line per case.
    - name: Claimant delivery of Dispatch's outbox
      shell: bash
      env:
        LEGION_E2E_ENVOY_STACK: "1"
        LEGION_E2E_DISPATCH_STACK: "1"
        DISPATCH_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      run: DATABASE_URL="${DISPATCH_TEST_DATABASE_URL%/*}/claimant_delivery?sslmode=disable" bash scripts/e2e/dispatch-claimant-delivery.sh
    # A recorded check result says where its commit stands against the commits its check compares
    # with, and the head moves with the pull-request events Dispatch takes off the bus:
    # envoy-dispatch built from this tree against the e2e harness's fake GitHub, one CHECK line per
    # step and case.
    - name: Verification results of Dispatch
      shell: bash
      env:
        LEGION_E2E_ENVOY_STACK: "1"
        LEGION_E2E_DISPATCH_STACK: "1"
        DISPATCH_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      run: DATABASE_URL="${DISPATCH_TEST_DATABASE_URL%/*}/verification_results?sslmode=disable" bash scripts/e2e/verification-results.sh
    # The name a person gave a Claude Code session is what claude-envoy registers, a rename
    # replaces it, and a session nobody named keeps the folder-and-short-id fallback: the plugin's
    # bundles built from this tree, natsd and a listener, one CHECK line per case.
    - name: Session title of claude-envoy
      shell: bash
      env:
        LEGION_E2E_ENVOY_STACK: "1"
        LEGION_E2E_DISPATCH_STACK: "1"
        DISPATCH_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      run: bash packages/claude-envoy/scripts/smoke-session-title.sh
    # A keyed write a real Dispatch refused because it could not resolve the caller. The client of
    # this tree sends it again under its own key against a server of this tree, started with an
    # OIDC issuer nothing serves, and the issue holds the comment once. It needs the same Postgres
    # and Go this leg already has.
    - name: A refused keyed write resent under its key against a real Dispatch
      shell: bash
      working-directory: packages/envoy-client
      env:
        LEGION_E2E_ENVOY_STACK: "1"
        LEGION_E2E_DISPATCH_STACK: "1"
        DISPATCH_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      run: bun test src/__tests__/dispatch-keyed-resend-live.test.ts
