name: envoy-e2e-refill
description: >-
  The envoy-e2e-refill leg of ci.yaml's envoy-held job: the bucket refill on a real listener and
  NATS (scripts/e2e-refill.sh), which the merge queue runs, and a pull request with full-ci or a
  lane label of the job. It ran in envoy-e2e-local's leg, which passed the 10 minutes a pull
  request's job is held to with it (10.8 minutes in CI run 45292147224). The leg runs on
  ubuntu-24.04-arm, as that leg does, with Go alone: the script needs curl, flock, go, jq and
  setsid, and builds the listener, natsd and its rig with `go build`. A failed run leaves its
  evidence as the artifact envoy-held-envoy-e2e-refill-evidence.
runs:
  using: composite
  steps:
    - id: setup-go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: packages/envoy/go.mod
        go-download-base-url: https://go.dev/dl
        token: ''
        cache: false
    # go-envoy: the listener and natsd e2e-refill.sh builds.
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: go-envoy-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}
        restore-keys: ${{ format('go-envoy-{0}-{1}-', runner.os, runner.arch) }}
    # The listener keeps its copy of a bucket while it reads the bucket again, and refuses its two
    # list routes, with no active-sessions sample, while it cannot stand behind that copy: five
    # scenarios against a real listener and a NATS server of the script's own,
    # each one `CHECK <scenario>` line, and a run that missed the window it was there to observe is
    # a FAIL. Its ports (E2E_REFILL_NATS_PORT, E2E_REFILL_PORT) are its own.
    - name: Bucket refill on a real listener and NATS
      shell: bash
      working-directory: packages/envoy
      run: bash scripts/e2e-refill.sh --out out/e2e-refill
    # The name carries no run attempt, and the upload overwrites, so a re-run's evidence replaces
    # the failed attempt's.
    - if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: envoy-held-envoy-e2e-refill-evidence
        path: |
          packages/envoy/out/e2e-refill
          !packages/envoy/out/e2e-refill/bin
        overwrite: true
