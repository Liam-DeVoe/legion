name: envoy-infra-go
description: >-
  The envoy-infra-go leg of ci.yaml's envoy-held job, which carries that old check-run name: the
  envoy-infra module's live tests against nats-server, which the merge queue runs, and a pull
  request with full-ci or lane:envoy_infra_go. Its formatting, its two vets and its unit tests are
  the envoy-infra-build leg's of the go-envoy job (.github/actions/go-envoy/envoy-infra-build),
  which a pull request runs. The leg runs on ubuntu-24.04-arm.
# why: .github/ci-notes/ci.md#the-envoy-infra-module-its-own-workspace-and-its-live-tests
runs:
  using: composite
  steps:
    - id: setup-go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: packages/envoy/infra/go.mod
        go-download-base-url: https://go.dev/dl
        token: ''
        cache: false
    # go-envoy-infra, under the key .github/workflows/ci-caches.yaml's envoy-infra job fills: the
    # runner's architecture, the Go version and the hash of the files that choose the module
    # versions, so a run whose module files main has already filled restores an entry built from
    # the same versions.
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: go-envoy-infra-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('packages/envoy/infra/go.work', 'packages/envoy/infra/go.work.sum', 'packages/envoy/infra/go.mod', 'packages/envoy/infra/go.sum', 'packages/envoy/go.mod', 'packages/envoy/go.sum') }}
        restore-keys: ${{ format('go-envoy-infra-{0}-{1}-', runner.os, runner.arch) }}
    # gotestsum, which the live tests' step below runs its tests under, through
    # .github/scripts/go-test.sh, on PATH for every later step.
    - uses: ./.github/actions/install-gotestsum
    - name: Pull the NATS and Postgres test container images
      uses: ./.github/actions/pull-test-images
      with:
        consts: |
          packages/envoy/internal/testnats/nats.go Image
          packages/envoy/internal/testnats/nats.go HubImage
          packages/envoy/internal/testpg/testpg.go Image
    # gcp's live tests build helm, nats-server, the config reloader and the exporter with go
    # install first, minutes on a cold cache, so the package gets more than go test's 10 m. One
    # call per package, never one union -run over the three: a name an untagged test of one
    # package shares with a natslive test of another would then run a second time with nothing to
    # say so. Each assignment is a line of its own, so under bash -e an empty or refused list fails
    # the step instead of running -run "", which matches every test.
    - name: Live tests of envoy-infra against nats-server (natslive)
      shell: bash
      working-directory: packages/envoy/infra
      env:
        TESTCONTAINERS_RYUK_DISABLED: "true"
      run: |
        for pkg in ./core ./seed ./gcp; do
          pattern=$(../../../.github/scripts/go-tagged-tests.sh natslive "$pkg")
          ../../../.github/scripts/go-test.sh --jsonfile "envoy-held-envoy-infra-go-natslive-${pkg#./}.json" --packages "$pkg" -- -count=1 -timeout 30m -tags natslive -run "$pattern"
        done
    - if: always()
      uses: ./.github/actions/go-test-upload
      with:
        name: envoy-held-envoy-infra-go-natslive
