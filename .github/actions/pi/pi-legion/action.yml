name: pi-legion
description: >-
  The pi-legion leg of ci.yaml's pi job, which carries that old check-run name: the typecheck, the
  tests and the release's pack of packages/pi-legion. The leg runs on ubuntu-24.04, after the
  job's checkout, its Bun (.github/actions/setup-bun), and the Oh My Pi the pin .omp-pin names
  (.github/actions/install-jj for its mise, then .github/actions/install-omp, steps of ci.yaml
  because install-omp writes LEGION_TEST_OMP into $GITHUB_ENV), which
  extensions/legion-phase-stall-omp.test.ts and controller-start-omp.test.ts run against
  stand-ins (packages/pi-shared/test/omp-harness.ts) and refuse on GitHub Actions without. Its leg
  of the job starts the NATS service, on host port 4222, that the Envoy role claim of
  extensions/controller-start-omp.test.ts's controller needs.

  The leg's 28 minutes are added up part by part from the slowest run it can have: the set-up
  with the NATS service started and the checkout (15 s), setup-bun (2), install-jj (3),
  install-omp (6), setup-go and the go-daemon cache restore (26), the workspace install and
  contracts' build (14), the typecheck (16), the test step (708, its rows at their slowest over
  the four most recent runs of the whole suite: legion-stall-watchdog 232 s, controller-start
  123 s, legion-model-fallback 106 s, legion-phase-stall 99 s, legion-commit-trailers 62 s,
  legion-session-activity 28 s, daemon-pane 21 s and legion-role-tools 11 s are 682 of the 708),
  the pack, the upload and the ci-ok report (4), the post steps (5), and the job clock's own
  seconds (5): 804 s. A limit that cuts the leg off reports `cancelled`, which ci-ok fails, and 10
  minutes did that to two merge groups of 2026-11-08 with every step `success`; 28 also holds
  above install-jj's 1057-second retry ladder. Every figure is a cold-Bun one.
runs:
  using: composite
  steps:
    # scripts/skill-scenarios/rig.test.ts runs rig.sh judge-omp's container with the runner's own
    # Docker. Every image a CI job fetches is a copy in ghcr.io/cybermonklabs/legion/ci, named by
    # digest, which ci.yaml's ci-images job publishes from .github/ci-images.yaml.
    # scripts/skill-scenarios/daemon-pane.test.ts runs daemon-pane.go with `go run` inside
    # packages/daemon.
    - id: setup-go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: packages/daemon/go.mod
        cache: false

    # go-daemon, shared with go-daemon and the lint job's typecheck leg.
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: go-daemon-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}
        restore-keys: ${{ format('go-daemon-{0}-{1}-', runner.os, runner.arch) }}

    - shell: bash
      run: bun install --frozen-lockfile

    - name: Build contracts for pi-legion
      shell: bash
      working-directory: packages/contracts
      run: bun run build

    - name: Typecheck pi-legion
      shell: bash
      working-directory: packages/pi-legion
      run: bun run typecheck

    - name: Test pi-legion
      shell: bash
      working-directory: packages/pi-legion
      env:
        LEGION_TEST_NATS_URL: nats://127.0.0.1:4222
      run: bun run test

    # The release's pack (release.yaml's pi_legion_build job), which is also this leg's build: the
    # manifest pointed at the one bundle, then scripts/pi-plugin-prepack.sh, which bundles
    # legion.ts, writes dist/THIRD_PARTY_NOTICES (failing the pack on a bundled package whose
    # license cannot be determined) and stages this plugin's six skills. The listing shows the
    # tarball ships those, its agents/, and nothing of the Envoy plugin's: no envoy.js, none of
    # its skills.
    - name: Pack pi-legion
      shell: bash
      working-directory: packages/pi-legion
      run: |
        jq '.omp.extensions = ["dist/legion.js"]' package.json > "$RUNNER_TEMP/package.json"
        mv "$RUNNER_TEMP/package.json" package.json
        bun pm pack --destination ../../out/pr-artifacts
        listing=$RUNNER_TEMP/pi-legion-listing
        tar tzf ../../out/pr-artifacts/*.tgz > "$listing"
        for shipped in package/dist/legion.js package/dist/THIRD_PARTY_NOTICES package/dist/skills/legion-worker/SKILL.md package/agents/deep-worker.md; do
          grep -qxF "$shipped" "$listing" || { echo "::error::the pi-legion tarball does not ship $shipped"; exit 1; }
        done
        for envoy in package/dist/envoy.js package/dist/skills/dispatch/; do
          if grep -qF "$envoy" "$listing"; then
            echo "::error::the pi-legion tarball ships $envoy, which is the Envoy plugin's"
            exit 1
          fi
        done

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: pi-legion-pr
        path: out/pr-artifacts/*.tgz
        overwrite: true
