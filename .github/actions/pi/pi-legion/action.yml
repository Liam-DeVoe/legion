name: pi-legion
description: >-
  The leg of ci.yaml's pi-held job, which carries the old check-run name `pi-legion / pi-legion`:
  the tests of packages/pi-legion, which the merge queue runs, and a pull request with full-ci or
  lane:pi_legion. Its typecheck and the release's pack are the pi-legion-build leg's of the pi job
  (.github/actions/pi/pi-legion-build), which a pull request runs. The leg runs on ubuntu-24.04,
  after the job's checkout, its Bun (.github/actions/setup-bun), and the Oh My Pi the pin .omp-pin
  names (.github/actions/install-jj, then .github/actions/install-omp, steps of ci.yaml because
  install-omp writes LEGION_TEST_OMP into $GITHUB_ENV), which extensions/legion-phase-stall-omp.test.ts
  and controller-start-omp.test.ts run against stand-ins (packages/pi-shared/test/omp-harness.ts)
  and refuse on GitHub Actions without. The job starts the NATS service, on host port 4222, that
  the Envoy role claim of extensions/controller-start-omp.test.ts's controller needs.

  The leg's 28 minutes are added up part by part from the slowest run it can have: the set-up
  with the NATS service started and the checkout (15 s), setup-bun (2), install-jj (3),
  install-omp (6), setup-go and the go-daemon cache restore (26), the workspace install and
  contracts' build (14), the test step (300), the ci-ok report (4), the post steps with the
  containers stopped (5) and the job clock's own seconds (5): 396 s, 6 m 36 s. The test step runs
  the package's files in one worker per CPU (`bun test --parallel`, package.json), so it lasts as
  long as its slowest worker, which runs legion-stall-watchdog-omp.test.ts alone: its eight cases
  took 241.3 s, 281.5 s and 296.4 s of the step's 241.4 s, 281.8 s and 296.7 s in jobs
  137348443705, 137353258170 and 137361573250 (2026-11-22), the 300 above being the slowest rounded
  up. Three runs are no worst case; run one after another, the files took a median 774 s that day.
  A limit that cuts the leg off reports `cancelled`, which ci-ok fails, and 10 minutes did that to
  two merge groups of 2026-11-08 with every step `success`, when the files still ran one after
  another; 28 also holds above install-jj's 1057-second retry ladder. Every figure is a cold-Bun one.
runs:
  using: composite
  steps:
    # scripts/skill-scenarios/rig.test.ts runs rig.sh judge-omp's container with the runner's own
    # Docker. Every image a CI job fetches is a copy in ghcr.io/cybermonklabs/legion/ci, named by
    # digest, which ci.yaml's ci-images job publishes from .github/ci-images.yaml.
    # scripts/skill-scenarios/daemon-pane.test.ts runs daemon-pane.go with `go run` inside
    # packages/daemon.
    - id: setup-go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: packages/daemon/go.mod
        go-download-base-url: https://go.dev/dl
        token: ''
        cache: false

    # go-daemon, shared with go-daemon and the lint job's typecheck leg.
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: go-daemon-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}
        restore-keys: ${{ format('go-daemon-{0}-{1}-', runner.os, runner.arch) }}

    - shell: bash
      run: bun install --frozen-lockfile

    - name: Build contracts for pi-legion
      shell: bash
      working-directory: packages/contracts
      run: bun run build

    - name: Test pi-legion
      shell: bash
      working-directory: packages/pi-legion
      env:
        LEGION_TEST_NATS_URL: nats://127.0.0.1:4222
      run: bun run test
