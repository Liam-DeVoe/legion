name: broker-client
description: >-
  The broker-client leg of ci.yaml's ts job, which carries that old check-run name: the typecheck
  and the tests of the secrets broker's TypeScript client (packages/cipher-client), which
  packages/envoy-client's broker credential imports. It has no build: its consumers read its
  sources through the workspace. The leg runs on ubuntu-24.04-arm, after the job's checkout and
  its Bun (.github/actions/setup-bun).
runs:
  using: composite
  steps:
    - shell: bash
      run: bun install --frozen-lockfile

    - name: Typecheck the broker client
      shell: bash
      working-directory: packages/cipher-client
      run: bun run typecheck

    - name: Test the broker client
      shell: bash
      working-directory: packages/cipher-client
      run: bun run test
