name: contracts
description: >-
  The contracts leg of ci.yaml's ts job, which carries that old check-run name: the typecheck,
  the tests, the check that the Dispatch API types are generated from the OpenAPI document, and
  the build of packages/contracts. The leg runs on ubuntu-24.04-arm, after the job's checkout and
  its Bun (.github/actions/setup-bun).
runs:
  using: composite
  steps:
    - shell: bash
      run: bun install --frozen-lockfile

    - name: Typecheck contracts
      shell: bash
      working-directory: packages/contracts
      run: bun run typecheck

    - name: Test contracts
      shell: bash
      working-directory: packages/contracts
      run: bun run test

    - name: Check the Dispatch API types are generated from the OpenAPI document
      shell: bash
      working-directory: packages/contracts
      run: bun run check:api

    - name: Build contracts
      shell: bash
      working-directory: packages/contracts
      run: bun run build
