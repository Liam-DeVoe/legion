name: Take the binaries the Dispatch browser suite runs
description: >-
  Downloads what the binaries job of .github/workflows/dispatch-browser.yaml built - the Dispatch
  server and the real broker's three commands, its `dispatch-e2e-binaries` artifact - into
  packages/envoy/out/dispatch-e2e-broker, and makes all four executable. The shard, alone and
  visual jobs of that file call it after their checkout, and the browser step of each names the
  server by its path in that directory (DISPATCH_E2E_SERVER_BIN) and the broker's three by the
  directory (DISPATCH_E2E_BROKER_BIN_DIR), which packages/dispatch/e2e/run-server.sh and
  run-broker.sh then execute instead of building. The directory is the one run-broker.sh serves -
  it refuses any other - and the one packages/dispatch/e2e/real-broker.ts runs requestseed from;
  the server binary rides along in it.

  That file's head puts a body its jobs share in a script; this one is an action because one of
  its two steps is actions/download-artifact, which only a step can call. Neither step carries a
  budget of its own, so the timeout-minutes a composite action's steps cannot carry costs nothing
  here.

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: dispatch-e2e-binaries
        path: packages/envoy/out/dispatch-e2e-broker
    # actions/upload-artifact keeps no executable bit, so all four arrive at mode 0644.
    # run-server.sh and run-broker.sh refuse a path that is not executable, and that refusal would
    # otherwise surface in a stack's own log, far from this cause. `sh`, which is what the shard
    # and alone jobs run each of their own steps under in their container (that file says why),
    # and all this one line needs.
    - name: Make the downloaded binaries executable
      shell: sh
      run: chmod +x packages/envoy/out/dispatch-e2e-broker/*
