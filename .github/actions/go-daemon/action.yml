name: The Go daemon's tests, one leg's share
description: >-
  The steps of ci.yaml's go-daemon job, which runs the old daemon-go job's tests in legs. The
  three daemon-go legs run the plain step over every package of packages/daemon but the five
  concurrent ones and the text checks, less the two pure table pins of internal/supervise, which
  the text-check job runs by name and this step skips by name, split between them at run time by
  .github/scripts/go-test-split.sh, so each test, one added later included, runs in exactly one
  leg; and, in the last of them alone, the intake's drain bound, what the race build cannot run,
  the daemon's forced-order tests and the Stage 1 live proof, which builds ./cmd/legion and boots
  it against the job's Postgres. ci.yaml's daemon-go job carries the old check-run name
  `daemon-go / daemon-go` and passes only when those three passed (.github/scripts/leg-verdict.sh).
  The two daemon-go-race legs run the race step over those five packages, split between them the
  same way, as main's daemon-go-race job runs it beside daemon-go
  (.github/ci-notes/ci-job-daemon-go.md says why), and ci.yaml's daemon-go-race job carries that
  job's check-run name, `daemon-go / daemon-go-race`.

  Three plain legs, where the measured times would hold two: go-test-split.sh hands go test one
  -run of the leg's share, and the plain step's share of two legs is about 136 KB of test names,
  past the 131,072 bytes Linux takes in one argument (MAX_ARG_STRLEN), where three legs hand it
  about 91 KB. The race step's share of three legs took 7, 13.5 and 9 minutes in run 45292147224
  (each leg's time less its set-up and its plain share), about 30 in all, past the 22 minutes a
  leg is held to, so it takes two legs of its own. Each leg's timeout-minutes (ci.yaml) is its
  measured time plus its largest -timeout plus 6 minutes, rounded up: the plain step's 15 minutes a
  package, the forced-order step's 10 in the last plain leg, and the race step's, the race-timeout
  input, in the race legs.

  Everything here is what those steps need and nothing else: the job's Postgres service, through
  LEGION_TEST_PG_DSN, BROKER_TEST_DATABASE_URL and LEGION_E2E_PG_DSN - the daemon's unit tests'
  store, the broker rig its cipher contract tests drive, and Stage 1's;
  TESTCONTAINERS_RYUK_DISABLED, LEGION_RUN_FUZZ_ITERS and LEGION_KEPT_PROPERTY_RUNS, read by the
  testcontainers-backed NATS tests, classify's fuzz tests and the daemon's keptPropertyEnv; tmux,
  jj, Oh My Pi and uv, each refused-without by a test of this module (the comment on each step
  says which), and the NATS images those tests start; the CodeGraph CLI internal/workspace's
  real-CLI warm-up test runs, installed with Bun from packages/daemon/docker/codegraph's own
  lockfile, the worker image's pin of it; the user-namespace sysctl internal/launcher's
  role-namespace tests need, which the race step runs; setup-go and the go-daemon cache restore,
  this module's build cache; and gotestsum, which .github/scripts/go-test.sh runs each go test
  under. Bun, but no workspace install: the tests of this module that need the workspace built, or
  the repository's skills, are the plugin-pack job's, the daemon-live job's and the agent-harness
  job's, and the race step skips them by name. The one Bun install here is the CodeGraph CLI's, in
  its own directory, which is no workspace of the root manifest and reads neither bun.lock nor any
  workspace's package.json, so the go-daemon filter names no root lockfile, no workspace manifest
  and no skill, and a change to bun.lock or to one skill runs the plugin-pack and agent-harness
  tests and no test of this job (dispatch://INFRA-1413, A4).

  Each Go step runs through .github/scripts/go-test.sh, which names each test's result in the log
  and, in a merge group, runs a test that failed once more; its jsonfile and rerun report are
  uploaded as go-test-go-daemon-<leg>-<step>.
inputs:
  leg:
    description: This leg's number, 1 to `legs`, among the plain legs or among the race legs.
    required: true
  legs:
    description: >-
      How many legs of its kind the job's matrix holds, plain or race; the last plain one also runs
      the steps no leg splits.
    required: true
  race-timeout:
    description: >-
      Empty for a plain leg. For a race leg, the race step's -timeout, below the leg's
      timeout-minutes less its set-up, so that a hung test prints the goroutine dump that names it
      before the runner cancels the job (ci.yaml's go-daemon job gives each leg's).
    required: false
    default: ''
  postgres:
    description: The id of the job's Postgres service container (ci.yaml's `job.services.postgres.id`).
    required: true
# why: .github/ci-notes/ci.md#the-go-daemon-job
runs:
  using: composite
  steps:
    - id: setup-go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: packages/daemon/go.mod
        go-download-base-url: https://go.dev/dl
        token: ''
        cache: false

    # go-daemon, shared with typecheck, plugin-pack, daemon-live and pi-legion.
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: go-daemon-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}
        restore-keys: ${{ format('go-daemon-{0}-{1}-', runner.os, runner.arch) }}

    # gotestsum, which .github/scripts/go-test.sh runs each go test step below under, on PATH for
    # every later step.
    - uses: ./.github/actions/install-gotestsum

    # The tmux runtime's tests drive a real tmux server and fail without one here
    # (testprereq.Require), and the daemon supervises under tmux and refuses to start without
    # it, which is also what the Stage 1 proof's boot needs (scripts/e2e/stage1-skeleton.sh's
    # `command -v tmux` refusal).
    - name: Install tmux
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tmux

    # The workspace and boundary tests drive a real jj, the one the worker image ships (its
    # working-copy filters are among what they plant), and the daemon resolves jj at boot and
    # refuses to start without it.
    - uses: ./.github/actions/install-jj

    # internal/podsafety's baseline test and the pod agent's argv test run the Oh My Pi the worker
    # image ships, and refuse on GitHub Actions without one. The pin is read from .omp-pin, the
    # repository's one copy of it, installed through the mise above (.github/actions/install-omp).
    - uses: ./.github/actions/install-omp

    # internal/runtime/sandbox's uv link-mode test needs the uv the worker image ships, which
    # install-uv writes into LEGION_TEST_UV for every later step.
    - uses: ./.github/actions/install-uv

    # internal/workspace's TestWarmCodegraphIndexInitializesAnUntrackedCodegraphDirectoryAgainstTheRealCli
    # runs the real CodeGraph CLI it finds on PATH, and refuses on GitHub Actions without one.
    # The CLI is the one the worker image ships: @colbymchenry/codegraph from
    # packages/daemon/docker/codegraph's own package.json and bun.lock, installed as
    # worker.Dockerfile's plugin stage installs it, with no workspace install. The platform
    # package's bin/codegraph is a shell wrapper that resolves its own symbolic link and runs the
    # Node runtime bundled beside it, so a link in /usr/local/bin, which is on the runner's PATH,
    # puts it on PATH without a write to $GITHUB_PATH. The daemon gives every codegraph call it
    # makes DO_NOT_TRACK=1 itself (internal/workspace/codegraph.go, codegraphEnvironment), as the
    # image's environment does, so the test's calls never phone home.
    - uses: ./.github/actions/setup-bun
    - name: Install the CodeGraph CLI
      shell: bash
      working-directory: packages/daemon/docker/codegraph
      run: |
        bun install --frozen-lockfile --ignore-scripts
        sudo ln -s "$PWD/node_modules/@colbymchenry/codegraph-linux-x64/bin/codegraph" /usr/local/bin/codegraph
        command -v codegraph

    # The daemon's NATS tests start testnats.Image (the hub's 2.15.1) and SkippingImage (nats:2.10,
    # for the one test of its refusal), and, for its grant test, Envoy's HubImage
    # (packages/envoy/testnatsimages), pulled first for the reason the action gives.
    - name: Pull the NATS test container images
      uses: ./.github/actions/pull-test-images
      with:
        consts: |
          packages/daemon/internal/testnats/nats.go Image
          packages/daemon/internal/testnats/nats.go SkippingImage
          packages/envoy/internal/testnats/nats.go HubImage

    # internal/launcher's role-namespace tests start each role generation in unprivileged user,
    # mount, PID and IPC namespaces, as an issue pod's launcher does, and t.Fatal rather than
    # skip under GITHUB_ACTIONS. Ubuntu 24.04 restricts unprivileged user namespaces with an
    # AppArmor sysctl, so the job turns it off on its throwaway runner (`|| true`: a runner
    # image without the key restricts nothing), and the unshare after it is the verdict that
    # the restriction is gone.
    - name: Allow unprivileged user namespaces (the launcher's role-namespace tests)
      shell: bash
      run: |
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
        unshare --user --map-root-user true

    # Every package of the module except the five the race step below tests and
    # internal/textcheck, whose tests are the text-check job's: so each of the five runs once per
    # run, under the detector, and the text checks run once per run of the router, in a job with
    # no database. The assignment of the package list is a line of its own, so under bash -e and
    # pipefail a failed go list, or a pattern that matches every package, fails the step rather
    # than passing it with nothing tested. The pattern names the race step's own package list and
    # that one package name, so the two steps cannot
    # name different sets. go-test-split.sh lists those packages' tests and keeps this leg's share
    # by each name's hash; the legs between them run every test of the packages once.
    #
    # The -skip is the text-check job's two tests of internal/supervise, the pure table pins
    # the text-checks job's supervise step names: they read that package's own source and no
    # database, so they run in the text-checks job beside the other tests whose subject is text.
    # The three other tests of internal/supervise/table_test.go drive a machine and run here.
    # Beside them it is the kind job's tests, which the race step below skips
    # too: they run on a kind cluster in the kind job. Each of those jobs' -run lists and this -skip
    # name the same tests, which .github/scripts/check-ci-layout.sh's rule 22 holds, so the skip and
    # the runs cannot come to name different tests. -timeout 15m bounds each package's test binary.
    - name: Test the Go daemon
      if: inputs.race-timeout == ''
      shell: bash
      working-directory: packages/daemon
      env:
        LEGION_TEST_PG_DSN: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
        BROKER_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
        LEGION_E2E_PG_DSN: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
        TESTCONTAINERS_RYUK_DISABLED: "true"
        LEGION_RUN_FUZZ_ITERS: ${{ github.event_name == 'pull_request' && '2000' || '' }}
        LEGION_KEPT_PROPERTY_RUNS: ${{ github.event_name == 'pull_request' && '8' || '' }}
      run: |
        pkgs=$(go list ./... | grep -Ev '/(internal/daemon|internal/sessionproxy|internal/launcher|internal/intake|internal/shimwire|internal/textcheck)$')
        run=$(../../.github/scripts/go-test-split.sh "${{ inputs.leg }}" "${{ inputs.legs }}" $pkgs)
        ../../.github/scripts/go-test.sh --jsonfile "go-daemon-${{ inputs.leg }}-plain.json" --packages "$pkgs" -- -count=1 -timeout 15m -run "$run" -skip '^(TestABurstableGVisorPodOnTheKindRigClonesFromTheFakeGitHub|TestABurstableIssuePodRendersLive|TestNoTwoEventTypesShareAKind|TestShareVolumesMountInAnIssuePodLive|TestStage4aSandboxRuntimeLive|TestStage4bControllerRestartOnTheKindRigLive|TestStage4bDaemonRestartsOnTheKindRigLive|TestStage4bListenerAddressMoveOnTheKindRigLive|TestStage4bSandboxTreeOnTheKindRigLive|TestStage4bStreamMoveOnTheKindRigLive|TestTheClaudeCodeImplementerInAnIssuePodRegistersRunsThePinnedBridgeAndResumesLive|TestTheControllerOrphanSweepLive|TestTheTableHasARowOrANamedIgnoreForEveryEventInEveryState)$'
    - if: always() && inputs.race-timeout == ''
      uses: ./.github/actions/go-test-upload
      with:
        name: go-daemon-${{ inputs.leg }}-plain

    # LEGION_TEST_DRAIN_MEASURE=1 turns on the bound of internal/intake's
    # TestABacklogOfOtherPullRequestsDrainsAndAppliesEveryLegionEvent: a backlog of 5,000 events
    # that are not Legion's, 50 of Legion's among them, drains in under a minute (drainBound)
    # with Postgres 3 ms away. The test runs either way; without the variable it logs the time
    # and holds no bound. internal/intake runs in the race step below, whose detector would
    # change the time, so this step runs that one test again without the detector, with the
    # bound, in the last plain leg alone.
    - name: Hold the intake's drain to its bound
      if: inputs.race-timeout == '' && inputs.leg == inputs.legs
      shell: bash
      working-directory: packages/daemon
      env:
        LEGION_TEST_DRAIN_MEASURE: "1"
        LEGION_TEST_PG_DSN: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
        BROKER_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
        LEGION_E2E_PG_DSN: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
        TESTCONTAINERS_RYUK_DISABLED: "true"
        LEGION_RUN_FUZZ_ITERS: ${{ github.event_name == 'pull_request' && '2000' || '' }}
        LEGION_KEPT_PROPERTY_RUNS: ${{ github.event_name == 'pull_request' && '8' || '' }}
      run: ../../.github/scripts/go-test.sh --jsonfile "go-daemon-${{ inputs.leg }}-drain.json" --packages ./internal/intake/ -- -count=1 -run '^TestABacklogOfOtherPullRequestsDrainsAndAppliesEveryLegionEvent$'
    - if: always() && inputs.race-timeout == '' && inputs.leg == inputs.legs
      uses: ./.github/actions/go-test-upload
      with:
        name: go-daemon-${{ inputs.leg }}-drain

    # The outbox's lane registry, lease renewal and held clock are the daemon's first goroutines
    # that share state with the intake's commit hooks and the API, so the packages the lanes live
    # in run under the race detector once per run, the plain step above leaving them out; so do
    # the session proxy and the launcher that wires it, whose accept loop, copy pairs, pair
    # tracking and bounded drain share state across goroutines; and so does the intake, whose
    # consumers run on goroutines of their own (Run's, one per durable consumer, and Lag's, one per
    # consumer read) and take Consumers.mu. Those consumers share one handle on the notification
    # stream, and nats.go's Info writes a handle's cached info under no lock while Lag's read of
    # the oldest waiting message reads it, so each read of the stream's info, DispatchTarget's and
    # createConsumer's, goes through a handle of its own; here,
    # TestEachReadOfTheStreamsInfoBesideALagReadGoesThroughAHandleOfItsOwn fails when either read
    # is put back on the shared handle, which a run without the detector passes. The shim's wire,
    # internal/shimwire, runs here too: the shim's two pumps share its dedupe's delivery record
    # under Dedupe.mu, and its Writer writes each frame whole under Writer.mu; here,
    # TestTheDedupeIsSafeForTheShimsTwoPumps fails when the dedupe's lock is taken out, which a run
    # without the detector passes. internal/record is not here: the lanes' store is the package's
    # subject, but its product code starts no goroutine and uses no sync, so it runs in the plain
    # step instead. The detector needs cgo, which the runners have gcc for. The lane tests hold a
    # fake clock, so they are deterministic under it. go-test-split.sh splits the five packages'
    # tests between the two race legs, listed under -race as this step builds them.
    #
    # The -timeout is the leg's (the race-timeout input): internal/daemon took up to 570 s whole on
    # the green runs of 2026-11-02 and 2026-11-03 and ran go test's ten-minute default out on main
    # at job 125691048644, and a leg runs its share of it.
    #
    # The -skip is the tests of internal/daemon that jobs of their own run, in one pattern
    # that names the tests of five -run lists: the plugin-pack job's three
    # (a fourth test of that package loading a plugin on the real Oh My Pi
    # stays here, TestThePromptReferenceProbeOnTheRealOhMyPi); the daemon-live job's whole-daemon
    # live tests; the agent-harness job's five live proofs that drive real Oh My Pi
    # panes, and its Claude Code backend proof on tmux; and the kind job's tests, which the plain
    # step above skips too. A test run twice is a test whose second
    # run tells nobody anything.
    #
    # internal/daemon's scratch-Dispatch tests (startScratchDispatchOn) start the real Dispatch
    # server on a database of the job's service, and one Dispatch process opens up to
    # store.ConnectionsPerProcess connections (116): more than PostgreSQL's default
    # max_connections of 100 allows, before the five packages' own pools. So a race leg raises the
    # service to what a Dispatch test lane needs, as every lane that starts a Dispatch process
    # raises its own, and samples the service's client connections every 2 s while its race step
    # runs; the step after it prints the peak against max_connections, so a change that makes the
    # tests open more at once shows here before it shows as a 53300 refusal. The go run of the
    # sizing script builds envoy's internal/dispatch/store/cmd/connections after the cache restore,
    # so it reads the restored module cache.
    - name: Size the service for this lane's Dispatch processes
      if: inputs.race-timeout != ''
      shell: bash
      env:
        POSTGRES_CONTAINER: ${{ inputs.postgres }}
      run: .github/scripts/pg-connection-ceiling.sh "$POSTGRES_CONTAINER"
    - name: Sample the service's connections while the race tests run
      if: inputs.race-timeout != ''
      shell: bash
      env:
        POSTGRES_CONTAINER: ${{ inputs.postgres }}
      run: |
        # shellcheck disable=SC2016 # $1 and $2 are the inner bash's arguments, expanded there
        nohup bash -c 'while :; do docker exec "$1" psql -U postgres -Atc "select count(*) from pg_stat_activity where backend_type = '"'"'client backend'"'"'" >> "$2" 2>/dev/null; sleep 2; done' _ "$POSTGRES_CONTAINER" "$RUNNER_TEMP/pg-connections.txt" >/dev/null 2>&1 &
    - name: Test the concurrent packages under the race detector
      if: inputs.race-timeout != ''
      shell: bash
      working-directory: packages/daemon
      env:
        LEGION_TEST_PG_DSN: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
        BROKER_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
        LEGION_E2E_PG_DSN: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
        TESTCONTAINERS_RYUK_DISABLED: "true"
        LEGION_RUN_FUZZ_ITERS: ${{ github.event_name == 'pull_request' && '2000' || '' }}
        LEGION_KEPT_PROPERTY_RUNS: ${{ github.event_name == 'pull_request' && '8' || '' }}
      run: |
        run=$(../../.github/scripts/go-test-split.sh "${{ inputs.leg }}" "${{ inputs.legs }}" -race ./internal/daemon/ ./internal/sessionproxy/ ./internal/launcher/ ./internal/intake/ ./internal/shimwire/)
        ../../.github/scripts/go-test.sh --jsonfile "go-daemon-${{ inputs.leg }}-race.json" --packages "./internal/daemon/ ./internal/sessionproxy/ ./internal/launcher/ ./internal/intake/ ./internal/shimwire/" -- -count=1 -race -timeout "${{ inputs.race-timeout }}" -run "$run" -skip '^(TestABehindCompletionIsDecidedByItsHeadAndTheMoveThatRaisedTheEntryLive|TestABurstableGVisorPodOnTheKindRigClonesFromTheFakeGitHub|TestABurstableIssuePodRendersLive|TestABusyAgentIsSentItsTaskOnceAndARelaunchSaysWhatItEndedLive|TestAConflictKeepsThePhaseAndTakesNoTurnOverLive|TestAPhaseEntryConvergesOnARunningDaemonLive|TestAProviderErrorKeepsTheTaskAndTheOperatorRetriesWhatItLeavesLive|TestAQueuedRootUnderALiveTreeJoinsItLive|TestEveryChildThatStartsRunsUnderItsOwnArchitectLive|TestEveryRoleIsLaunchedWithTheRulesItsOwnPromptCarriesLive|TestHandoffRecordsLive|TestLateCompletionsThroughTheRealLegionToolLive|TestPlanRatingsLive|TestReviewRangeLive|TestShareVolumesMountInAnIssuePodLive|TestStage4aSandboxRuntimeLive|TestStage4bControllerRestartOnTheKindRigLive|TestStage4bDaemonRestartsOnTheKindRigLive|TestStage4bListenerAddressMoveOnTheKindRigLive|TestStage4bSandboxTreeOnTheKindRigLive|TestStage4bStreamMoveOnTheKindRigLive|TestStepRecordsLive|TestTheAgentModelCheckOnTheRealOhMyPi|TestTheClaudeCodeImplementerInAnIssuePodRegistersRunsThePinnedBridgeAndResumesLive|TestTheClaudeCodeImplementerRegistersCompletesThroughItsStopHookAndResumesLive|TestTheControllerOrphanSweepLive|TestTheImageProbeResolvesTheAgentsTheDaemonsPromptsName|TestTheMergeWaitSaysWhatAReviewRoundWaitsOnFromGitHubLive|TestTheOperatorAndTheControllerCompactAClaimsSessionAndStartItFreshLive|TestTheRealPluginsOnTheRealOhMyPi)$'
    - if: always() && inputs.race-timeout != ''
      uses: ./.github/actions/go-test-upload
      with:
        name: go-daemon-${{ inputs.leg }}-race
    - name: Report the service's peak connections
      if: always() && inputs.race-timeout != ''
      shell: bash
      env:
        POSTGRES_CONTAINER: ${{ inputs.postgres }}
      run: |
        allowed=$(docker exec "$POSTGRES_CONTAINER" psql -U postgres -Atc "show max_connections")
        if [ -s "$RUNNER_TEMP/pg-connections.txt" ]; then
          echo "pg connections: the peak of $(sort -n "$RUNNER_TEMP/pg-connections.txt" | tail -n 1) over $(wc -l < "$RUNNER_TEMP/pg-connections.txt") samples, max_connections ${allowed}"
        else
          echo "pg connections: UNKNOWN, no sample was taken (max_connections ${allowed})"
        fi

    # What the race step's packages hold that the race build cannot run, run plain by name, in the
    # last plain leg, the race step's packages' tests under `//go:build !race` and those that read
    # raceEnabled, which check-test-reach.sh holds to a run). The first is internal/launcher's call-graph walk,
    # under `//go:build !race`: it loads the launcher's whole program from source and builds its
    # call graph twice, which without the detector took about a minute at a 2.3 GB peak, and the
    # detector multiplies both. It took 21 s at most in the runs of 2026-11-20 and 2026-11-21, so 5
    # minutes leave the leg's bound room for its dump.
    - name: Test what the race build cannot run
      if: inputs.race-timeout == '' && inputs.leg == inputs.legs
      shell: bash
      working-directory: packages/daemon
      env:
        LEGION_TEST_PG_DSN: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
        BROKER_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
        LEGION_E2E_PG_DSN: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
        TESTCONTAINERS_RYUK_DISABLED: "true"
        LEGION_RUN_FUZZ_ITERS: ${{ github.event_name == 'pull_request' && '2000' || '' }}
        LEGION_KEPT_PROPERTY_RUNS: ${{ github.event_name == 'pull_request' && '8' || '' }}
      run: ../../.github/scripts/go-test.sh --jsonfile "go-daemon-${{ inputs.leg }}-norace.json" --packages ./internal/launcher -- -count=1 -timeout 5m -run '^(TestEveryChildTheLaunchersProcessWaitsForStartsWhereNoReapTakesIt)$'
    - if: always() && inputs.race-timeout == '' && inputs.leg == inputs.legs
      uses: ./.github/actions/go-test-upload
      with:
        name: go-daemon-${{ inputs.leg }}-norace

    # The daemon's forced-order tests (packages/envoy/scripts/forced-order.sh -C packages/daemon):
    # every TestForcedOrder test of the packages named, built with -tags odatrace and -race
    # against the nats-server the workspace links, with the hold points
    # packages/envoy/internal/testnats/hooks.go drives, on the server testnats.StartInProcess
    # runs in the test process. The step names no version, so when go.mod moves to a version
    # packages/envoy/internal/testnats/testdata/hooked has no hooks for, the script refuses it
    # and the step fails until the hooks are ported; it also fails a package that declares no
    # such test. The daemon refuses nats:2.10's server (envoy's natsversion.Refusal), so it has
    # no v2.10.29 run here. Its -jsonfile runs the tests through .github/scripts/go-test.sh. It
    # runs in the last plain leg, which ends well before the race legs: its compile of a hooked
    # nats-server under the detector takes up to 5 minutes, beside the script's 10-minute -timeout.
    - name: Forced-order tests of the daemon on the hooked nats-server the module links
      if: inputs.race-timeout == '' && inputs.leg == inputs.legs
      shell: bash
      run: packages/envoy/scripts/forced-order.sh -C packages/daemon -jsonfile go-daemon-forced-order.json ./internal/testnats/
    - if: always() && inputs.race-timeout == '' && inputs.leg == inputs.legs
      uses: ./.github/actions/go-test-upload
      with:
        name: go-daemon-forced-order

    # The proof builds the daemon's ./cmd/legion and boots it against the job's Postgres, so it
    # belongs with the Go steps rather than with the script harnesses: it is the daemon's own code
    # under test. Setting LEGION_E2E_PG_DSN is what tells the script not to start a container of
    # its own, the path a run with no DSN takes.
    - name: Stage 1 live proof
      if: inputs.race-timeout == '' && inputs.leg == inputs.legs
      shell: bash
      env:
        LEGION_TEST_PG_DSN: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
        BROKER_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
        LEGION_E2E_PG_DSN: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
