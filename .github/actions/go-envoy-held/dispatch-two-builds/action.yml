name: dispatch-two-builds
description: >-
  The dispatch-two-builds leg of ci.yaml's go-envoy-held job, which carries that old check-run
  name `dispatch-two-builds / dispatch-two-builds`: the twobuild suite against the newest release's
  build (the previous build) and the first-rollout build, and each build's page in a browser
  against the other build's server. The leg runs on ubuntu-24.04, after ci.yaml's bounded checkout
  of the whole history and its second attempt. The Go half's database is the job's Postgres
  (DISPATCH_TEST_DATABASE_URL, which the job gives every step); the browser half runs on a Postgres
  of its own, which the harness starts per step (e2e/harness-postgres.ts) from the same image
  digest the service runs, so the service's pull is that step's too.

  The Go step runs on every event that selects the leg: the gate of its own the step had at the
  head, the dispatch_two_builds_go output, is gone with the per-file selection.

  The checkout of this leg and of dispatch-two-builds-same is ci.yaml's, since this action is a file
  of that checkout: the whole history and the tags, which build-dispatch-build.sh reads its floor
  release by, with a bound of its own and a second attempt. Of the 755 checkouts of the two jobs
  in ci.yaml runs created from 2026-11-16 12:52Z to 2026-11-18 13:39Z, 753 took 96 s at most
  (median 44 s) and two hung: run 44143226907's for 44 minutes, until the job's budget cancelled
  it, and run 44125069013's for 25 minutes. Each attempt carries 2 minutes, the 96 s plus 15 per
  cent rounded up to the next whole minute (dispatch-browser.yaml's rule). The second attempt runs
  only when the first did not end in success, and a second failure fails the leg there. A step cut
  at its budget can leave its git running: the runner signals the action's own process, not the
  git processes it started (actions/runner, ProcessInvoker.cs). A git killed while it wrote refs
  or config can also leave a lock (.git/config.lock, packed-refs.lock, a ref's .lock) that
  actions/checkout does not delete before it reuses a directory: it deletes index.lock and
  shallow.lock alone (src/git-directory-helper.ts). So the step between the two attempts ends every
  git process on the runner, which runs this one leg, and then empties the workspace, and the
  second attempt is a fresh clone; each of the three keeps its 2-minute bound.
inputs:
  postgres:
    description: The id of the job's Postgres service container (ci.yaml's `job.services.postgres.id`).
    required: true
  first-rollout-commit:
    description: >-
      The first-rollout build's commit, the release tagged legion-envoy-v30.20.2. That tag is
      lightweight and no ruleset protects it, so it can move: the commit is the pin.
      firstRolloutRelease in packages/envoy/cmd/dispatch/twobuild_harness_test.go holds the same
      commit. Each step below reads it as FIRST_ROLLOUT_COMMIT.
    required: false
    default: edb69e0d7588ec037847182e74a04a343a0664c9
# why: .github/ci-notes/ci.md#the-two-build-tests-packagesenvoycmddispatchtwobuild__testgo-each-row-starts
runs:
  using: composite
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: packages/envoy/go.mod
        cache: false
    - uses: ./.github/actions/setup-bun
    # The current build's CLI runs from the tree (`bun packages/envoy-client/bin/dispatch.ts`).
    - shell: bash
      run: bun install --frozen-lockfile
    - uses: ./.github/actions/install-gotestsum
    - name: Resolve the previous build's commit
      id: previous
      shell: bash
      run: |
        commit=$(packages/envoy/scripts/build-dispatch-build.sh --previous-release --resolve)
        echo "commit=$commit" >> "$GITHUB_OUTPUT"
    # The cache saves the build when the job ends in success and found none under this key.
    - name: Cache the previous build
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ runner.temp }}/dispatch-previous
          !${{ runner.temp }}/dispatch-previous/src
        key: dispatch-previous-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/envoy/scripts/build-dispatch-build.sh') }}-${{ steps.previous.outputs.commit }}
    # A restored directory holds the complete build of that commit, which the script leaves as it
    # is. Each step that reads the build's directory names it in its own env.
    - name: Build the previous build
      shell: bash
      env:
        PREVIOUS_COMMIT: ${{ steps.previous.outputs.commit }}
        DISPATCH_PREVIOUS_BUILD: ${{ runner.temp }}/dispatch-previous
      run: packages/envoy/scripts/build-dispatch-build.sh --commit "$PREVIOUS_COMMIT" --out "$DISPATCH_PREVIOUS_BUILD"
    # The first-rollout build: the newest release before the first that registers its schema
    # numbers (FIRST_ROLLOUT_COMMIT, and firstRolloutRelease in
    # packages/envoy/cmd/dispatch/twobuild_harness_test.go, which holds the same commit). The
    # transition row that drives the fleet's first rollout runs it as its earlier build, since every
    # previous release from legion-envoy-v30.21.0 on registers its numbers. This step fails when the
    # release's tag names another commit than the pin. The release is pinned, so its cache entry is
    # written once and restored after that.
    - name: Resolve the first-rollout build's commit
      shell: bash
      env:
        FIRST_ROLLOUT_COMMIT: ${{ inputs.first-rollout-commit }}
      run: |
        resolved=$(packages/envoy/scripts/build-dispatch-build.sh --commit legion-envoy-v30.20.2 --resolve)
        if [[ "$resolved" != "$FIRST_ROLLOUT_COMMIT" ]]; then
          echo "::error::The tag legion-envoy-v30.20.2 names commit $resolved. FIRST_ROLLOUT_COMMIT pins the first-rollout build to commit $FIRST_ROLLOUT_COMMIT, and firstRolloutRelease in packages/envoy/cmd/dispatch/twobuild_harness_test.go holds the same commit. Move the tag back to $FIRST_ROLLOUT_COMMIT, or change the pin in both places."
          exit 1
        fi
    - name: Cache the first-rollout build
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ runner.temp }}/dispatch-first-rollout
          !${{ runner.temp }}/dispatch-first-rollout/src
        key: dispatch-first-rollout-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/envoy/scripts/build-dispatch-build.sh') }}-${{ inputs.first-rollout-commit }}
    - name: Build the first-rollout build
      shell: bash
      env:
        FIRST_ROLLOUT_COMMIT: ${{ inputs.first-rollout-commit }}
        DISPATCH_FIRST_ROLLOUT_BUILD: ${{ runner.temp }}/dispatch-first-rollout
      run: packages/envoy/scripts/build-dispatch-build.sh --commit "$FIRST_ROLLOUT_COMMIT" --out "$DISPATCH_FIRST_ROLLOUT_BUILD"
    - name: Size the service for this lane's Dispatch processes
      shell: bash
      env:
        POSTGRES_CONTAINER: ${{ inputs.postgres }}
      run: .github/scripts/pg-connection-ceiling.sh "$POSTGRES_CONTAINER"
    # Only what the twobuild tag adds: envoy-go's unit step runs ./cmd/dispatch's untagged tests,
    # so the -run comes from .github/scripts/go-tagged-tests.sh, which reads the names off the
    # source at run time. The assignment is a line of its own: under bash -e it carries the
    # script's exit status, so an empty or refused list fails the step instead of running -run "",
    # which matches every test.
    - name: Two-build tests of the Dispatch server
      shell: bash
      working-directory: packages/envoy
      env:
        FIRST_ROLLOUT_COMMIT: ${{ inputs.first-rollout-commit }}
        DISPATCH_PREVIOUS_BUILD: ${{ runner.temp }}/dispatch-previous
        DISPATCH_FIRST_ROLLOUT_BUILD: ${{ runner.temp }}/dispatch-first-rollout
      run: |
        pattern=$(../../.github/scripts/go-tagged-tests.sh twobuild ./cmd/dispatch)
        ../../.github/scripts/go-test.sh --jsonfile go-envoy-held-dispatch-two-builds-go.json --packages ./cmd/dispatch -- -tags twobuild -count=1 -timeout 30m -run "$pattern"
    - if: always()
      uses: ./.github/actions/go-test-upload
      with:
        name: go-envoy-held-dispatch-two-builds-go
    # dispatch-browser.yaml's shard job's step of this name, for the reason
    # .github/ci-notes/dispatch-browser.md#why-every-job-that-runs-the-suite-builds-contracts-first
    # gives: Playwright's Node runner reads `@legion/contracts` out of a build this checkout has to
    # make before the config loads, and the entries Dispatch imports are all it needs.
    # `build:dispatch` bundles those four and so compiles no module outside the set this leg's
    # filter lists - not ./legion-api, which nothing of this leg loads. `bun run e2e:multiprocess`
    # below makes the same build again (packages/dispatch's build:contracts).
    - name: Build contracts for dispatch e2e
      shell: bash
      working-directory: packages/contracts
      run: bun run build:dispatch
    - name: Build the Dispatch server
      # Dispatch A's; run-server.sh builds it too, inside the harness's boot wait for each server
      # (e2e/harness-start.ts, bounded by the listener's bootMs); built here, A finds it current and
      # starts in seconds.
      shell: bash
      working-directory: packages/envoy
      run: go build -o ./dispatch-e2e ./cmd/dispatch
    # No apt in this step: Playwright's `chromium` entry in its ubuntu24.04-x64 table adds no
    # package this image lacks, and this leg's one spec runs headless Chromium and compares no
    # screenshot, so the font packages `--with-deps` brought are not needed either. The
    # dispatch-browser-multiprocess job's step of the same name measured both and says so. It keeps
    # the 4-minute bound it had as a step of its own, that step's budget for the same download,
    # around its one command.
    - name: Install Playwright Chromium
      shell: bash
      working-directory: packages/dispatch
      run: timeout 4m bunx playwright install chromium
    # The stack's connection limit, read outside the browser steps, where e2e/harness-postgres.ts
    # would otherwise compile it (DISPATCH_E2E_PG_CONNECTIONS), as dispatch-browser.yaml's
    # multiprocess job reads it, for the reason that job's head gives: each browser step below runs
    # on the harness's own Postgres, whose commits do not wait for the runner's disk, rather than on
    # the service, which keeps crash safety on. It keeps the 2-minute bound it had as a step of its
    # own around the `go run` that is its body's one slow command.
    - name: Read the connections the two-build stack's Postgres must allow
      id: connections
      shell: bash
      working-directory: packages/envoy
      run: |
        connections=$(timeout 2m go run ./internal/dispatch/store/cmd/connections)
        [[ "$connections" =~ ^[1-9][0-9]*$ ]] || { echo "::error::go run ./internal/dispatch/store/cmd/connections printed '$connections', not a positive whole number"; exit 1; }
        echo "connections=$connections" >> "$GITHUB_OUTPUT"
    - name: Browser-test each build's page against the other build's server
      # B is the previous build, which serves on the socket the harness holds for it, as A does, so
      # this step names no port for it.
      shell: bash
      working-directory: packages/dispatch
      env:
        FIRST_ROLLOUT_COMMIT: ${{ inputs.first-rollout-commit }}
        DISPATCH_PREVIOUS_BUILD: ${{ runner.temp }}/dispatch-previous
        DISPATCH_E2E_PG_CONNECTIONS: ${{ steps.connections.outputs.connections }}
      run: |
        export DISPATCH_E2E_PG_IMAGE=ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        DISPATCH_E2E_BINARY_B="$DISPATCH_PREVIOUS_BUILD/envoy-dispatch" \
          DISPATCH_E2E_WEB_DIST_B="$DISPATCH_PREVIOUS_BUILD/web" \
          bun run e2e:multiprocess -- cross-build.multiprocess
    # The same rows with B the first-rollout build, a release before the fleet columns, which
    # registers no schema numbers: B's page is read-only on A's server while B is live, which the
    # previous release, registering its numbers, no longer shows, and A's page is held to B's own
    # exact version rule on B's server, which admits it writable while the two builds' schema
    # versions are equal. The step tells the spec this is the first-rollout run with
    # DISPATCH_E2E_FIRST_ROLLOUT_COMMIT: the spec fails unless B is that commit and the registry
    # reads version 0 while B is live, and pageWritable then reads each direction's rule from the
    # registry. Its Postgres is a new one the harness starts, so this run starts from what the step
    # above started from.
    - name: Browser-test each build's page against the first-rollout build's server
      shell: bash
      working-directory: packages/dispatch
      env:
        FIRST_ROLLOUT_COMMIT: ${{ inputs.first-rollout-commit }}
        DISPATCH_FIRST_ROLLOUT_BUILD: ${{ runner.temp }}/dispatch-first-rollout
        DISPATCH_E2E_PG_CONNECTIONS: ${{ steps.connections.outputs.connections }}
      run: |
        export DISPATCH_E2E_PG_IMAGE=ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        DISPATCH_E2E_BINARY_B="$DISPATCH_FIRST_ROLLOUT_BUILD/envoy-dispatch" \
          DISPATCH_E2E_WEB_DIST_B="$DISPATCH_FIRST_ROLLOUT_BUILD/web" \
          DISPATCH_E2E_FIRST_ROLLOUT_COMMIT="$FIRST_ROLLOUT_COMMIT" \
          bun run e2e:multiprocess -- cross-build.multiprocess
    # The name carries no run attempt, and the upload overwrites, so a re-run's results replace the
    # failed attempt's.
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: failure()
      with:
        name: go-envoy-held-dispatch-two-builds-browser-test-results
        path: packages/dispatch/e2e/test-results
        overwrite: true
