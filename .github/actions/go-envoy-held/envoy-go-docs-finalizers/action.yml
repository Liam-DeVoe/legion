name: envoy-go-docs-finalizers, one leg's share
description: >-
  The steps of the envoy-go-docs-finalizers legs of ci.yaml's go-envoy-held job: the document
  service under the cleanup detector, GODEBUG=checkfinalizers=1, a Go mode no other step runs the
  package in. Its tests are split between the legs at run time by .github/scripts/go-test-split.sh,
  so each test, one added later included, runs in exactly one leg, but for its two corpus tests,
  which run in every leg, each on the leg's shard of the repository's markdown. ci.yaml's
  envoy-go-docs-finalizers job carries the old check-run name
  `envoy-go-docs-finalizers / envoy-go-docs-finalizers` and passes only when every leg passed
  (.github/scripts/leg-verdict.sh). The legs run on ubuntu-24.04-arm. DISPATCH_TEST_DATABASE_URL,
  which the job gives every step, is load-bearing: this package's TestMain is storetest.Main
  (internal/dispatch/docs/persistence_test.go:19), and storetest.Open skips every test that opens
  the store when it is unset; a skip is a pass.
inputs:
  part:
    description: This leg's number, 1 to `legs`, and its shard of the corpus.
    required: true
  legs:
    description: How many legs run the document service under the cleanup detector, and how many shards the corpus falls in.
    required: true
  postgres:
    description: The id of the job's Postgres service container (ci.yaml's `job.services.postgres.id`).
    required: true
# why: .github/ci-notes/ci.md#the-cleanup-detector-run-of-the-document-service
runs:
  using: composite
  steps:
    - id: setup-go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: packages/envoy/go.mod
        go-download-base-url: https://go.dev/dl
        token: ''
        cache: false
    # go-envoy, restored only: its modules are the envoy module's, but this leg builds the document
    # service's test binary, not the listener and natsd of .github/workflows/ci-caches.yaml's envoy
    # job, which is what fills this family, so it saves none.
    - id: go-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: go-envoy-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}
        restore-keys: ${{ format('go-envoy-{0}-{1}-', runner.os, runner.arch) }}
    - uses: ./.github/actions/install-gotestsum
    - name: Size the service for this lane's Dispatch processes
      shell: bash
      env:
        POSTGRES_CONTAINER: ${{ inputs.postgres }}
      run: .github/scripts/pg-connection-ceiling.sh "$POSTGRES_CONTAINER"
    # The document service's two corpus tests read a directory of markdown documents:
    # TestWriteCorpusReadsOnce counts each write's fork reads on each one (DISPATCH_TOKEN_CORPUS)
    # and skips without it, and TestAMarginWriteMatchesTheWholeDocumentWrite compares the margin
    # write with the whole-document write on each one as well as on its generated documents
    # (DISPATCH_TEST_SPEC_CORPUS). The documents are every tracked *.md file of this commit (git
    # ls-files), written as the envoy-go legs write them for pmdoc's corpus tests: one flat
    # directory, each path's / as __, which makes no two names equal; the step fails if two did.
    # Each test reads it through internal/dispatch/corpustest, which says what a test may leave out
    # and prints what it left out.
    - name: Write the repository's markdown into the corpus directory
      shell: bash
      run: |
        corpus=$RUNNER_TEMP/repository-markdown
        mkdir -p "$corpus"
        git ls-files -z -- '*.md' | while IFS= read -r -d '' document; do
          cp -- "$document" "$corpus/${document//\//__}"
        done
        tracked=$(git ls-files -z -- '*.md' | tr -cd '\0' | wc -c)
        written=$(find "$corpus" -type f -name '*.md' | wc -l)
        echo "$written documents in $corpus, of the $tracked tracked *.md files"
        [ "$written" -eq "$tracked" ] || { echo "::error::two tracked *.md paths flatten to one name"; exit 1; }
    # GODEBUG=checkfinalizers=1 reaches the test binary alone, through -exec, so its reports at
    # each collection are test output and not lines on go test's own standard error, which
    # gotestsum's retry refuses; the compiler run with it would print them too. gotestsum's
    # standard-verbose format prints the package's leak check, which TestMain writes after the
    # tests have run: the count of services the tests left alive is the half of this leg that no
    # detector of Go's reports. The -skip is this package's TestStatementTimings, which times
    # statements on the seeded measurement database alone: the envoy-go legs' statement-timing step
    # runs it there, so a run of it here was its second in one run (TestStatementTimings); and the
    # two corpus tests, which the next step runs in every leg. go-test-split.sh lists the package's
    # tests and keeps this leg's share. -timeout 15m is the smallest whole minute at which this
    # share's predicted time takes at most half of it: the package's tests but the corpus tests
    # took 977 s together in run 45197837366, about 326 s a third, and 442 s for the slowest of
    # three shares that the hash of the test names may give.
    - name: Test the document service under the cleanup detector
      shell: bash
      working-directory: packages/envoy
      run: |
        run=$(../../.github/scripts/go-test-split.sh "${{ inputs.part }}" "${{ inputs.legs }}" ./internal/dispatch/docs/)
        ../../.github/scripts/go-test.sh --jsonfile "go-envoy-held-envoy-go-docs-finalizers-${{ inputs.part }}-docs.json" --packages ./internal/dispatch/docs/ -- -count=1 -timeout 15m -exec 'env GODEBUG=checkfinalizers=1' -run "$run" -skip '^(TestAMarginWriteMatchesTheWholeDocumentWrite|TestStatementTimings|TestWriteCorpusReadsOnce)$'
    - if: always()
      uses: ./.github/actions/go-test-upload
      with:
        name: go-envoy-held-envoy-go-docs-finalizers-${{ inputs.part }}-docs
    # The two corpus tests run in every leg, each on the leg's shard of the corpus
    # (CORPUS_SHARD=<part>/<legs>: corpustest keeps the documents whose hash of the name falls in
    # it, and the margin test's two generated documents fall in shards by their names too), so the
    # legs between them read each document once and no leg holds a corpus test's whole corpus. Each
    # prints its counts taken and left out, and each document it left out with its reason.
    # -timeout 19m is the smallest whole minute at which the shard's predicted time takes at most
    # half of it: on the whole corpus the write test about 1,150 s (958 documents of 11.0 MB it
    # takes, at about 0.8 s a document and 16.5 s a MB, as on the fifteen guides in run
    # 45197837366) and the margin test about 283 s (43 documents of 5.7 MB at about 1.6 s a
    # document and 29 s a MB, and the generated documents' 37 s), about 478 s a third, and 548 s for
    # the slowest of three shards that the hash of the names may give.
    - name: Test the document service's corpus tests on this leg's shard of the corpus
      shell: bash
      working-directory: packages/envoy
      env:
        DISPATCH_TOKEN_CORPUS: ${{ runner.temp }}/repository-markdown
        DISPATCH_TEST_SPEC_CORPUS: ${{ runner.temp }}/repository-markdown
        CORPUS_SHARD: ${{ inputs.part }}/${{ inputs.legs }}
      run: ../../.github/scripts/go-test.sh --jsonfile "go-envoy-held-envoy-go-docs-finalizers-${{ inputs.part }}-corpus.json" --packages ./internal/dispatch/docs/ -- -count=1 -timeout 19m -exec 'env GODEBUG=checkfinalizers=1' -run '^(TestAMarginWriteMatchesTheWholeDocumentWrite|TestWriteCorpusReadsOnce)$'
    - if: always()
      uses: ./.github/actions/go-test-upload
      with:
        name: go-envoy-held-envoy-go-docs-finalizers-${{ inputs.part }}-corpus
