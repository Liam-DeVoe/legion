name: envoy-go-docs-finalizers
description: >-
  The envoy-go-docs-finalizers leg of ci.yaml's go-envoy-held job, which carries that old
  check-run name: the document service under the cleanup detector, GODEBUG=checkfinalizers=1, a
  Go mode no other step runs the package in. The leg runs on ubuntu-24.04-arm.
  DISPATCH_TEST_DATABASE_URL, which the job gives every step, is load-bearing: this package's
  TestMain is storetest.Main (internal/dispatch/docs/persistence_test.go:19), and storetest.Open
  skips every test that opens the store when it is unset; a skip is a pass.
inputs:
  postgres:
    description: The id of the job's Postgres service container (ci.yaml's `job.services.postgres.id`).
    required: true
runs:
  using: composite
  steps:
    - id: setup-go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: packages/envoy/go.mod
        cache: false
    # go-envoy, restored only: its modules are the envoy module's, but this leg builds the document
    # service's test binary, not the listener and natsd of .github/workflows/ci-caches.yaml's envoy
    # job, which is what fills this family, so it saves none.
    - id: go-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: go-envoy-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}
        restore-keys: ${{ format('go-envoy-{0}-{1}-', runner.os, runner.arch) }}
    - uses: ./.github/actions/install-gotestsum
    - name: Size the service for this lane's Dispatch processes
      shell: bash
      env:
        POSTGRES_CONTAINER: ${{ inputs.postgres }}
      run: .github/scripts/pg-connection-ceiling.sh "$POSTGRES_CONTAINER"
    # The document service's two corpus tests read a directory of real specs:
    # TestWriteCorpusReadsOnce counts each write's fork reads on each one (DISPATCH_TOKEN_CORPUS)
    # and skips without it, and TestAMarginWriteMatchesTheWholeDocumentWrite compares the margin
    # write with the whole-document write on each one as well as on its generated documents
    # (DISPATCH_TEST_SPEC_CORPUS). The specs are the repository's own guides that
    # packages/envoy/internal/dispatch/testdata/repository-markdown.txt lists, written as the
    # envoy-go legs write them for pmdoc's corpus tests, and the go-envoy-held filter names the
    # list and each guide on it.
    - name: Write the repository's guides into the corpus directory
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/repository-markdown"
        while IFS= read -r guide; do
          case $guide in '' | '#'*) continue ;; esac
          cp -- "$guide" "$RUNNER_TEMP/repository-markdown/${guide//\//__}"
        done < packages/envoy/internal/dispatch/testdata/repository-markdown.txt
        ls -l "$RUNNER_TEMP/repository-markdown"
    # GODEBUG=checkfinalizers=1 reaches the test binary alone, through -exec, so its reports at
    # each collection are test output and not lines on go test's own standard error, which
    # gotestsum's retry refuses; the compiler run with it would print them too. gotestsum's
    # standard-verbose format prints the package's leak check, which TestMain writes after the
    # tests have run: the count of services the tests left alive is the half of this leg that no
    # detector of Go's reports. The -skip is this package's TestStatementTimings, which times
    # statements on the seeded measurement database alone: the envoy-go legs' statement-timing step
    # runs it there, so a run of it here was its second in one run (ci_job_reads.py's
    # STATEMENT_TIMING_TESTS). The -timeout 49m is the smallest whole minute at which the slowest
    # package time measured, 1744 s with the corpus tests' growth, is at most 60 % of it, and the
    # leg's timeout-minutes is six minutes above that.
    - name: Test the document service under the cleanup detector
      shell: bash
      working-directory: packages/envoy
      env:
        DISPATCH_TOKEN_CORPUS: ${{ runner.temp }}/repository-markdown
        DISPATCH_TEST_SPEC_CORPUS: ${{ runner.temp }}/repository-markdown
      run: ../../.github/scripts/go-test.sh --jsonfile go-envoy-held-envoy-go-docs-finalizers-docs.json --packages ./internal/dispatch/docs/ -- -count=1 -timeout 49m -exec 'env GODEBUG=checkfinalizers=1' -skip '^(TestStatementTimings)$'
    - if: always()
      uses: ./.github/actions/go-test-upload
      with:
        name: go-envoy-held-envoy-go-docs-finalizers-docs
