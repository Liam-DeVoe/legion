name: envoy-go-race-docs, one leg's share
description: >-
  The steps of the envoy-go-race-docs legs of ci.yaml's go-envoy-held job: the document service
  under the race detector, its tests split between the legs at run time by
  .github/scripts/go-test-split.sh, so each test, one added later included, runs in exactly one
  leg; three tests the split gives leg 2 run in leg 1 instead, by name, to even the two legs'
  times. ci.yaml's envoy-go-race-docs job carries the old check-run name
  `envoy-go-race-docs / envoy-go-race-docs` and passes only when every leg passed
  (.github/scripts/leg-verdict.sh). The legs run on ubuntu-24.04-arm. DISPATCH_TEST_DATABASE_URL,
  which the job gives every step, is load-bearing: this package's TestMain is storetest.Main
  (internal/dispatch/docs/persistence_test.go:26), and storetest.Open fails every test that opens
  the store when it is unset on GitHub Actions (internal/dispatch/store/storetest/storetest.go:99,
  testprereq.Require; elsewhere it skips them), so without the service the leg fails rather than
  pass having run almost nothing.
inputs:
  part:
    description: This leg's number, 1 to `legs`.
    required: true
  legs:
    description: How many legs run the document service's race tests.
    required: true
  go-timeout:
    description: >-
      The race step's -timeout: below the leg's timeout-minutes less its set-up and the listing's
      compile, so a hung test prints the dump that names it (ci.yaml gives each leg's).
    required: true
  postgres:
    description: The id of the job's Postgres service container (ci.yaml's `job.services.postgres.id`).
    required: true
# why: .github/ci-notes/ci.md#why-the-document-service-runs-alone-under-the-race-detector
runs:
  using: composite
  steps:
    - id: setup-go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: packages/envoy/go.mod
        go-download-base-url: https://go.dev/dl
        token: ''
        cache: false
    # go-envoy: its modules are the envoy module's, though this leg builds the document service's
    # race test binary rather than the listener and natsd ci-caches.yaml builds.
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: go-envoy-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}
        restore-keys: ${{ format('go-envoy-{0}-{1}-', runner.os, runner.arch) }}
    # gotestsum, which the race step below runs the package under, through
    # .github/scripts/go-test.sh, on PATH for every later step.
    - uses: ./.github/actions/install-gotestsum
    - name: Size the service for this lane's Dispatch processes
      shell: bash
      env:
        POSTGRES_CONTAINER: ${{ inputs.postgres }}
      run: .github/scripts/pg-connection-ceiling.sh "$POSTGRES_CONTAINER"
    # Under the sampler, not bare: the race detector maps about four bytes of shadow memory per
    # byte of heap, and this package's race binary asked for more than the runner's 16 GiB, which
    # has no swap. The kernel killed this step three times with no output at all, which names no
    # test (dispatch://INFRA-1085). go-test.sh's --race-memory runs gotestsum under
    # .github/scripts/race_memory.py, which samples the largest process beside the run, writing a
    # line every 5 s that names that process and the tests running at that moment, read from
    # gotestsum's jsonfile as it grows, so a step the kernel does take still says what it reached.
    # After the run it writes the peak, and fails this step when the peak passed
    # RACE_MEM_LIMIT_KB, 8388608 kB, half the runner, naming the tests that were running at the
    # highest sample. -count=1 because the leg restores the Go build cache above, and a cached pass
    # must not stand in for a run. go-test-split.sh lists the package's tests under -race and keeps
    # this leg's share.
    #
    # The package runs its tests one at a time, and the split gave leg 2 more of their time: 1,169 s
    # and 1,195 s of tests to leg 1's 978 s and 986 s in runs 45396964994 and 45401400508 (each
    # test's time from its log, the wait of a parallel test included). So the -skip below takes
    # three render-reuse tests out of the split, and leg 1 alone runs them, in a go test of their
    # own in the next step: 100 s and 104 s of tests in those runs, which with that go test's start,
    # the store template its first test migrates and its end (18 s) give legs of 20.0 and 19.9
    # minutes and of 20.3 and 20.3 minutes (.github/ci-notes/ci.md says the arithmetic).
    - name: Race-test the document service
      shell: bash
      working-directory: packages/envoy
      run: |
        run=$(../../.github/scripts/go-test-split.sh "${{ inputs.part }}" "${{ inputs.legs }}" -race ./internal/dispatch/docs/)
        RACE_MEM_LIMIT_KB=8388608 ../../.github/scripts/go-test.sh --race-memory --jsonfile "go-envoy-held-envoy-go-race-docs-${{ inputs.part }}-race.json" --packages ./internal/dispatch/docs/ -- -race -count=1 -timeout "${{ inputs.go-timeout }}" -run "$run" -skip '^(TestRenderReuseADocumentOutsideTheSchema|TestRenderReuseANilOriginCommitCreditsNoOne|TestRenderReuseARecoveredReplicaRendersThePublish)$'
    # The three tests the step above skips, in leg 1 alone, under the same sampler and limit. By
    # those runs' times their go test takes at most 134 s (their 104 s, the template's 15 s and an
    # end of up to 16 s), under 50 % of its -timeout of 5 minutes.
    - name: Race-test the three document service tests leg 1 takes from leg 2
      if: inputs.part == '1'
      shell: bash
      working-directory: packages/envoy
      run: RACE_MEM_LIMIT_KB=8388608 ../../.github/scripts/go-test.sh --race-memory --jsonfile go-envoy-held-envoy-go-race-docs-1-race-moved.json --packages ./internal/dispatch/docs/ -- -race -count=1 -timeout 5m -run '^(TestRenderReuseADocumentOutsideTheSchema|TestRenderReuseANilOriginCommitCreditsNoOne|TestRenderReuseARecoveredReplicaRendersThePublish)$'
    - if: always()
      uses: ./.github/actions/go-test-upload
      with:
        name: go-envoy-held-envoy-go-race-docs-${{ inputs.part }}-race
