name: envoy-go-race
description: >-
  The envoy-go-race leg of ci.yaml's go-envoy-held job, which carries that old check-run name:
  delivery, the store, the bus, the listener, the registry store, the session cache, kvwatch, the
  NATS credentials, the NATS auth service and the sign-in code flow under the race detector, on the
  job's Postgres (DISPATCH_TEST_DATABASE_URL, which the job gives every step). The leg runs on
  ubuntu-24.04-arm. The step's -timeout 30m fires before the leg's timeout-minutes cancels it, so
  a hung test prints the dump that names it: about 1 minute of setup, up to 5 minutes to compile
  the race binaries, then the step's own 30 minutes. natscred and the NATS auth service add two
  test binaries to that compile and two packages, natscallout and natsgrant, which measured 28 s
  and 46 s under -race on a dev box, where cmd/listener took 785 s here (run 43875539224); the
  sign-in code flow (internal/oidc) adds one test binary and one package, whose run under -race
  took 11 s on a dev box, all of it in-process against oidctest's issuer.
inputs:
  postgres:
    description: The id of the job's Postgres service container (ci.yaml's `job.services.postgres.id`).
    required: true
# why: .github/ci-notes/ci.md#the-race-lane-what-it-runs-why-it-is-three-jobs-and-what-is-not-in-it
runs:
  using: composite
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: packages/envoy/go.mod
        go-download-base-url: https://go.dev/dl
        token: ''
        cache: false
    - uses: ./.github/actions/install-gotestsum
    - name: Size the service for this lane's Dispatch processes
      shell: bash
      env:
        POSTGRES_CONTAINER: ${{ inputs.postgres }}
      run: .github/scripts/pg-connection-ceiling.sh "$POSTGRES_CONTAINER"
    # The store package's tests run eight at once (storeTestParallelism, store_test.go), each with a
    # database and pools of its own, beside the step's other packages, so this samples the service's
    # client connections every 2 s while the next step runs and the step after its upload prints
    # the peak against max_connections: a change that makes the tests open more at once shows here
    # before it shows as a 53300 refusal. Postgres's own background processes are not counted. The
    # loop runs in the background past its own step, until the runner ends the job.
    - name: Sample the service's connections while the race tests run
      shell: bash
      env:
        POSTGRES_CONTAINER: ${{ inputs.postgres }}
      run: |
        # shellcheck disable=SC2016 # $1 and $2 are the inner bash's arguments, expanded there
        nohup bash -c 'while :; do docker exec "$1" psql -U postgres -Atc "select count(*) from pg_stat_activity where backend_type = '"'"'client backend'"'"'" >> "$2" 2>/dev/null; sleep 2; done' _ "$POSTGRES_CONTAINER" "$RUNNER_TEMP/pg-connections.txt" >/dev/null 2>&1 &
    - name: Race-test delivery, the store, the bus, the listener, the registry store, the session cache, kvwatch, the NATS credentials, the NATS auth service and the sign-in code flow
      shell: bash
      working-directory: packages/envoy
      run: ../../.github/scripts/go-test.sh --jsonfile go-envoy-held-envoy-go-race-race.json --packages "./internal/dispatch/delivery/... ./internal/dispatch/store/... ./internal/bus/ ./cmd/listener/ ./internal/store/ ./internal/session/ ./internal/kvwatch/... ./natscred/ ./internal/cipher/natscallout/ ./internal/oidc/" -- -count=1 -race -timeout 30m
    - if: always()
      uses: ./.github/actions/go-test-upload
      with:
        name: go-envoy-held-envoy-go-race-race
    - name: Report the service's peak connections
      if: always()
      shell: bash
      env:
        POSTGRES_CONTAINER: ${{ inputs.postgres }}
      run: |
        allowed=$(docker exec "$POSTGRES_CONTAINER" psql -U postgres -Atc "show max_connections")
        if [ -s "$RUNNER_TEMP/pg-connections.txt" ]; then
          echo "pg connections: the peak of $(sort -n "$RUNNER_TEMP/pg-connections.txt" | tail -n 1) over $(wc -l < "$RUNNER_TEMP/pg-connections.txt") samples, max_connections ${allowed}"
        else
          echo "pg connections: UNKNOWN, no sample was taken (max_connections ${allowed})"
        fi

    # The forced-order tests (packages/envoy/scripts/forced-order.sh): every TestForcedOrder test
    # of the packages named, built with -tags odatrace and -race against a nats-server whose own
    # code carries the hold points internal/testnats/hooks.go drives. The script's own test runs
    # first: scripts/forced-order.test.sh holds it to refusing a package whose every forced-order
    # test skips, a -drop name that is no hook point, an empty -server, an empty -C, an empty
    # -jsonfile and a module whose go.mod replaces nats-server. The first forced-order step names
    # no version, so it hooks the nats-server the workspace links, which the hub runs; when go.mod
    # moves to a version internal/testnats/testdata/hooked has no hooks for, the script refuses it
    # and the step fails until the hooks are ported. The second step hooks v2.10.29. The script
    # also fails a package that declares no such test. Each compiles a hooked nats-server and the
    # packages above it under the detector, up to 5 minutes, and runs under the script's -timeout
    # of 10 minutes; the script's own test compiles one more hooked build, of a fixture with one
    # test that skips, up to 5 minutes (ci.yaml's leg timeout counts the three).
    - name: Test forced-order.sh's refusals
      shell: bash
      working-directory: packages/envoy
      run: scripts/forced-order.test.sh
    - name: Forced-order tests on the hooked nats-server the module links
      shell: bash
      working-directory: packages/envoy
      run: scripts/forced-order.sh -jsonfile go-envoy-held-envoy-go-race-forced-order.json ./internal/testnats/hooktest/
    - if: always()
      uses: ./.github/actions/go-test-upload
      with:
        name: go-envoy-held-envoy-go-race-forced-order
    - name: Forced-order tests on the hooked nats-server v2.10.29
      shell: bash
      working-directory: packages/envoy
      run: scripts/forced-order.sh -server 2.10.29 -jsonfile go-envoy-held-envoy-go-race-forced-order-v2.json ./internal/testnats/hooktest/
    - if: always()
      uses: ./.github/actions/go-test-upload
      with:
        name: go-envoy-held-envoy-go-race-forced-order-v2
