name: dispatch-two-builds-same
description: >-
  The dispatch-two-builds-same leg of ci.yaml's go-envoy-held job, which carries that old check-run
  name `dispatch-two-builds / dispatch-two-builds-same`: the twobuild suite again, with this tree's
  own build as the previous build. The dispatch-two-builds leg pairs the tree with the newest
  legion-envoy-v* release, so an assertion that holds only across a version boundary passes in the
  merge group of the change that breaks it, and fails later, in an unrelated pull request's group,
  once a release carries that change. On 2026-11-17 the approval-carry row compared a whole
  `model.Actor` after #4281 gave a person's actor `Proven: true`. #4281's own group passed against
  legion-envoy-v30.43.0, and every group with a Dispatch change failed once legion-envoy-v30.44.0,
  the first tag holding #4281, was the previous release. Pairing the tree with itself fails in the
  culprit's own group.

  It runs the whole suite unchanged. Each row that depends on the two builds' numbers decides from
  what the live fleet registers, not from which commit the previous build is, so a same-build
  pairing is a case the suite already states. The one row that needs the first-rollout build reads
  DISPATCH_FIRST_ROLLOUT_BUILD, which this leg leaves unset, so that row skips here and runs in the
  dispatch-two-builds leg. The two owner lock gate rows (twobuild_owner_lock_test.go) skip here
  too, by the owner lock protocol the previous build registers: a build at this tree's protocol
  never takes the gate they test, and TestTwoBuildsSerialiseOneOwnersWritersBothWays covers this
  pairing. A row that fails only in this leg holds a version assumption it never stated: that is a
  finding for the row's owning tree, which fixes the row, and no ground for a skip.

  A merge-group run's matrix alone holds this leg (ci.yaml's go-envoy-held job's `exclude`), so the
  group fails before the merge, its wall time does not grow, and a pull request's run (`full-ci`) or
  a dispatched run costs what it did. The leg runs on ubuntu-24.04, after ci.yaml's bounded
  checkout of the whole history and its second attempt, on the job's Postgres
  (DISPATCH_TEST_DATABASE_URL, which the job gives every step).
inputs:
  postgres:
    description: The id of the job's Postgres service container (ci.yaml's `job.services.postgres.id`).
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: packages/envoy/go.mod
        go-download-base-url: https://go.dev/dl
        token: ''
        cache: false
    - uses: ./.github/actions/setup-bun
    # The current build's CLI runs from the tree (`bun packages/envoy-client/bin/dispatch.ts`).
    - shell: bash
      run: bun install --frozen-lockfile
    - uses: ./.github/actions/install-gotestsum
    # No cache: the head is a new commit in every run.
    - name: Build this tree as the previous build
      shell: bash
      env:
        DISPATCH_PREVIOUS_BUILD: ${{ runner.temp }}/dispatch-same
      run: packages/envoy/scripts/build-dispatch-build.sh --commit HEAD --out "$DISPATCH_PREVIOUS_BUILD"
    - name: Size the service for this lane's Dispatch processes
      shell: bash
      env:
        POSTGRES_CONTAINER: ${{ inputs.postgres }}
      run: .github/scripts/pg-connection-ceiling.sh "$POSTGRES_CONTAINER"
    # The dispatch-two-builds leg's Go step, its -run read the same way, against this tree's own
    # build.
    - name: Two-build tests of the Dispatch server against its own build
      shell: bash
      working-directory: packages/envoy
      env:
        DISPATCH_PREVIOUS_BUILD: ${{ runner.temp }}/dispatch-same
      run: |
        pattern=$(../../.github/scripts/go-tagged-tests.sh twobuild ./cmd/dispatch)
        ../../.github/scripts/go-test.sh --jsonfile go-envoy-held-dispatch-two-builds-same-go.json --packages ./cmd/dispatch -- -tags twobuild -count=1 -timeout 30m -run "$pattern"
    - if: always()
      uses: ./.github/actions/go-test-upload
      with:
        name: go-envoy-held-dispatch-two-builds-same-go
