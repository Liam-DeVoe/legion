name: envoy-go-claim-model
description: >-
  The envoy-go-claim-model leg of ci.yaml's go-envoy-held job, which carries that old check-run
  name: the mention sender's claim model (TestTheMentionSenderClaimModel), every order, within
  three claim-refresh periods, of the real sender's locked sections, statements and timers with two
  comments' attempt rows, the delivery sweep and the outbox, the sender as built and its blind
  control; and the test that holds the four claim rules the model restates to the SQL they restate
  (TestTheClaimModelsRulesAreTheSQLsRules), which opens the store (storetest.Open) and skips
  without DISPATCH_TEST_DATABASE_URL, the job's Postgres, which the job gives every step. The leg
  runs on ubuntu-24.04.
# why: .github/ci-notes/ci.md#the-mention-senders-claim-model-alone-on-a-runner-of-its-own
runs:
  using: composite
  steps:
    - id: setup-go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: packages/envoy/go.mod
        go-download-base-url: https://go.dev/dl
        token: ''
        cache: false
    # go-envoy-test, restored only: this leg builds the test binary of internal/dispatch/api, which
    # the entry .github/workflows/ci-caches.yaml fills with the test binary of every package of the
    # envoy module holds. It saves none.
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: go-envoy-test-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}
        restore-keys: ${{ format('go-envoy-test-{0}-{1}-', runner.os, runner.arch) }}
    - uses: ./.github/actions/install-gotestsum
    # Both tests carry `//go:build !race`, since the detector slows the search about sevenfold, so
    # the race leg of this package does not build them, and envoy-go's plain step leaves exactly
    # these two out by name (check-ci-layout.sh's rule 22 holds the two lists to the same tests).
    # gotestsum's standard-verbose format prints the model's table of states and checks to the log.
    # The -timeout is twice the 19 min 18 s the step took on this runner.
    - name: Search every order of the mention sender's claims
      shell: bash
      working-directory: packages/envoy
      run: ../../.github/scripts/go-test.sh --jsonfile go-envoy-held-envoy-go-claim-model-search.json --packages ./internal/dispatch/api -- -count=1 -timeout 40m -run '^(TestTheClaimModelsRulesAreTheSQLsRules|TestTheMentionSenderClaimModel)$'
    - if: always()
      uses: ./.github/actions/go-test-upload
      with:
        name: go-envoy-held-envoy-go-claim-model-search
