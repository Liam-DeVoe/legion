name: envoy-go-race-api, one leg's share
description: >-
  The steps of the envoy-go-race-api legs of ci.yaml's go-envoy-held job: the Dispatch API under
  the race detector, its tests split between the legs at run time by
  .github/scripts/go-test-split.sh, so each test, one added later included, runs in exactly one
  leg. ci.yaml's envoy-go-race-api job carries the old check-run name
  `envoy-go-race-api / envoy-go-race-api` and passes only when every leg passed
  (.github/scripts/leg-verdict.sh). The legs run on ubuntu-24.04-arm, on the job's Postgres:
  DISPATCH_TEST_DATABASE_URL, and BROKER_TEST_DATABASE_URL, the broker's store, which the
  package's contract tests open (brokerstoretest.Open in internal/dispatch/api/contract_test.go)
  and skip without, so without it they never run under the race detector; the job gives every step
  both.
inputs:
  part:
    description: This leg's number, 1 to `legs`.
    required: true
  legs:
    description: How many legs run the API's race tests.
    required: true
  postgres:
    description: The id of the job's Postgres service container (ci.yaml's `job.services.postgres.id`).
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: packages/envoy/go.mod
        cache: false
    # gotestsum, which the race step below runs the package under, through database-skips.sh and
    # .github/scripts/go-test.sh, on PATH for every later step.
    - uses: ./.github/actions/install-gotestsum
    - name: Size the service for this lane's Dispatch processes
      shell: bash
      env:
        POSTGRES_CONTAINER: ${{ inputs.postgres }}
      run: .github/scripts/pg-connection-ceiling.sh "$POSTGRES_CONTAINER"
    # go test counts a skipped test as a pass and, without -v, prints nothing for it, so the
    # package runs through packages/envoy/scripts/database-skips.sh, which runs it under gotestsum
    # (.github/scripts/go-test.sh), prints each test's result by name as the tests run, and counts
    # that run's skips: it fails on any skip but the one its EXPECTED_SKIPS names for this package
    # (a subprocess helper, which its parent test starts) where this leg's share holds it, prints
    # database_skips=UNKNOWN and runs nothing when either database variable is unset, and on a
    # failed run prints the failed tests' output, a timed-out binary's goroutine dump among it.
    # --run is this leg's share, which go-test-split.sh lists under -race as the step builds the
    # package. The --timeout 26m fires before the leg's timeout-minutes, less its set-up and the
    # listing's compile, cancels it, so a hung test prints the dump that names it: each leg's share
    # took at most 20 minutes in the runs of 2026-11-20 and 2026-11-21.
    - name: Race-test the Dispatch API
      shell: bash
      working-directory: packages/envoy
      env:
        LEG: ${{ inputs.part }}
        LEGS: ${{ inputs.legs }}
      run: scripts/database-skips.sh --var DISPATCH_TEST_DATABASE_URL --var BROKER_TEST_DATABASE_URL --race --timeout 26m --run "$(../../.github/scripts/go-test-split.sh "$LEG" "$LEGS" -race ./internal/dispatch/api/)" --jsonfile "go-envoy-held-envoy-go-race-api-$LEG-race.json" ./internal/dispatch/api/
    - if: always()
      uses: ./.github/actions/go-test-upload
      with:
        name: go-envoy-held-envoy-go-race-api-${{ inputs.part }}-race
